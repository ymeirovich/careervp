[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath =
    src/backend
    infra
addopts =
    --import-mode=importlib
    --strict-markers
    --tb=short
    -ra
markers =
    unit: unit tests
    integration: integration tests
    e2e: end-to-end tests
    slow: slow-running tests
    asyncio: async tests
