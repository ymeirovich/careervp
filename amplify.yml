version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run typecheck
            - npm run build
      artifacts:
        # .next is the SSR build output directory (Web Compute platform)
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
    appRoot: src/frontend
