version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run typecheck
            - npm run build
      artifacts:
        # baseDirectory is relative to appRoot (src/frontend)
        baseDirectory: out
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
    appRoot: src/frontend
