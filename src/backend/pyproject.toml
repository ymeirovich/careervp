[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aws_lambda_handler_cookbook"
version = "3.0.0"
description = "This repository provides a working, deployable, open source based, AWS Lambda handler and CDK Python code. This handler embodies Serverless best practices and has all the bells and whistles for a proper production ready handler"
authors = [{name = "Ran Isenberg"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.13",
]
readme = "README.md"
keywords = ["aws lambda cookbook", "guide to aws lambda", "cdk blueprint", "best practices", "serverless service blueprint"]
license = {text = "MIT-0"}
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12.0",
    "PyJWT>=2.13.0",
    # auth_service.py imports cryptography.hazmat directly for RSA JWT keys; it must be a
    # direct production dependency, not pulled in transitively via the moto dev dependency,
    # or `uv export --no-dev` (which builds lambda_requirements.txt) silently drops it.
    "cryptography>=50.0.0",
    "email-validator",
    "aws-lambda-powertools[tracer]>=3.22.1",
    "mypy-boto3-dynamodb",
    "cachetools",
    "boto3>=1.26.125",
    "aws-lambda-env-modeler",
    # Security fix: CVE-2026-27199
    "werkzeug>=3.1.6",
    # CareerVP specific
    "anthropic>=0.40.0",
    "beautifulsoup4>=4.12.0",
    "langdetect>=1.0.9",
    "python-docx>=1.1.0",
    "pypdf>=6.16.1",
    "soupsieve>=2.9.0",
    "httpx>=0.27.0",
    "urllib3>=2.7.0",
]

[project.urls]
Repository = "https://github.com/ran-isenberg/aws-lambda-handler-cookbook"

[dependency-groups]
dev = [
    # CDK
    "service-cdk",
    "aws-cdk-lib>=2.180.0",
    "constructs>=10.0.0",
    "cdk-nag>2.0.0",
    "aws-cdk-aws-lambda-python-alpha>=2.180.0a0",
    "cdk-monitoring-constructs",
    # DEV
    "pytest",
    "pytest-asyncio>=1.3.0",
    "pytest-mock",
    "freezegun",
    "pytest-randomly",
    "moto[dynamodb,s3]>=5.0.0",
    "pycodestyle",
    "pytest-cov",
    "pytest-html",
    "python-dateutil",
    "python-dotenv",
    "GitPython",
    "ruff",
    "radon",
    "xenon",
    "pre-commit",
    "mkdocs-material",
    "mkdocs-git-revision-date-plugin",
    "mkdocs-glightbox",
    "types-cachetools",
    "mypy",
    "types-requests",
    "toml",
    "mkdocs-render-swagger-plugin",
]

[tool.uv.sources]
service-cdk = { path = "../../infra", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["service"]

[tool.hatch.build]
skip-excluded-dirs = true

[tool.pytest.ini_options]
testpaths = "tests"
addopts = "--strict-markers"
xfail_strict = true
# A coroutine created and never awaited is a real defect: the work silently
# does not happen and the test still passes anyway. Six such warnings hid in
# this suite across three handoffs (handoff 05 measured 6, not the 8 it was
# handed). Measured safe: the suite emits zero RuntimeWarnings of any kind.
#
# BOTH lines are required, and the second is the one that actually bites.
# "coroutine ... was never awaited" is emitted from the coroutine's __del__ at
# garbage-collection time. error::RuntimeWarning does turn it into an exception
# there, but an exception raised inside __del__ is unraisable: Python routes it
# to sys.unraisablehook and the test still passes. Promoting pytest's
# PytestUnraisableExceptionWarning is what converts it into a failure.
# Verified by reintroducing the defect: error::RuntimeWarning alone -> 38
# passed; adding PytestUnraisableExceptionWarning -> 1 failed.
#
# Caveat: the failure is attributed to whichever test happened to be running
# when the GC ran, not the test that leaked the coroutine. It detects the
# class; it does not localise it.
filterwarnings = [
    "error::RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "unit: unit-level tests",
    "integration: integration-level tests",
    "e2e: end-to-end tests",
    "regression: regression tests",
    "slow: slow-running tests",
    "static: static/AST-based analysis tests",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "cdk.out",
    ".vscode",
    ".pytest_cache",
    ".build",
    ".mypy_cache",
    ".github"
]

# Same as Black.
line-length = 150
indent-width = 4

# Assume Python 3.13
target-version = "py313"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [ "E203", "E266", "E501", "W191"]

[tool.ruff.format]
quote-style = "single"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint.isort]
known-third-party = ["pydantic", "aws_lambda_powertools"]
