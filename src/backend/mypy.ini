[mypy]
warn_return_any=False
warn_unused_configs=True
no_implicit_optional=True
warn_redundant_casts=True
warn_unused_ignores=True
show_column_numbers = True
show_error_codes = True
show_error_context = True
# plugins = pydantic.mypy  # Incompatible with mypy 1.19+ (ImportError: ExpandTypeVisitor)
exclude = ^cdk\.out/|^asset\.

[mypy-careervp.handlers.utils.rest_api_resolver]
disable_error_code = annotation-unchecked
# Powertools' exception_handler decorator resolves as typed in CI (ignore would be
# unused) but as untyped locally (ignore is required). Tolerate the unused ignore so
# the inline # type: ignore[untyped-decorator] passes in both environments.
warn_unused_ignores = False

[pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Disable specific error codes in the 'tests' package
[mypy-tests.*]
disable_error_code = annotation-unchecked,no-untyped-def,no-any-return,no-untyped-call,type-arg
allow_untyped_defs = True

# Per-module overrides: allow inline # type: ignore[import-untyped] alongside global boto3 suppress
[mypy-careervp.logic.company_intel_cache]
warn_unused_ignores = False

[mypy-careervp.logic.llm_cache]
warn_unused_ignores = False

[mypy-careervp.logic.utils.llm_client]
warn_unused_ignores = False

[mypy-careervp.logic.utils.tavily_client]
warn_unused_ignores = False

[mypy-careervp.logic.company_research_store]
warn_unused_ignores = False

[mypy-jmespath]
ignore_missing_imports=True

[mypy-jmespath.exceptions]
ignore_missing_imports=True

[mypy-jmespath.functions]
ignore_missing_imports=True

[mypy-boto3]
ignore_missing_imports = True

[mypy-botocore]
ignore_missing_imports = True
[mypy-botocore.client]
ignore_missing_imports = True
