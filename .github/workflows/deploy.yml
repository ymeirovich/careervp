name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev, staging, prod)'
        required: true
        default: dev

# Concurrency control: prevents multiple deployments from running simultaneously
# on the same stack. New pushes will cancel in-progress runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  id-token: write  # Required for OIDC

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'
  AWS_REGION: 'us-east-1'
  UV_VERSION: '0.5.21'
  STACK_NAME: 'CareerVpCrudDev'

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install backend dependencies
        working-directory: src/backend
        run: uv sync --group dev
      - name: Build Lambda artifacts
        working-directory: src/backend
        run: make build
      - name: Run CDK Nag Security Scan
        working-directory: infra
        env:
          ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'dev' || inputs.environment || 'dev' }}
        run: |
          # Synthesize CDK template as a security gate before deploy
          uv sync
          echo "=== Running CDK Nag Security Scan ==="
          npx cdk synth --quiet || { echo "CDK synth failed"; exit 1; }
          echo "=== CDK Nag Security Scan passed ==="
      - name: Pre-deploy parity check (RECOVERY gate)
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p docs/evidence
          echo "=== Pre-deploy infra route parity check ==="
          uv run python scripts/spec_quality/check_deployed_parity.py \
            --env dev-live \
            --infra-source infra/careervp/api_construct.py \
            --out docs/evidence/recovery-gate-parity-report-${TIMESTAMP}.json
          cat docs/evidence/recovery-gate-parity-report-${TIMESTAMP}.json
          echo "=== Parity check passed ==="
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: deploy-dev-${{ github.sha }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Ensure SSM Parameter exists
        env:
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_KEY" ]; then
            aws ssm put-parameter \
              --name "/careervp/dev/anthropic-api-key" \
              --value "$ANTHROPIC_KEY" \
              --type SecureString \
              --overwrite
          else
            echo "::warning::ANTHROPIC_API_KEY secret not set. Checking if SSM parameter exists..."
            aws ssm get-parameter --name "/careervp/dev/anthropic-api-key" --query "Parameter.Name" --output text || \
              echo "::warning::SSM parameter /careervp/dev/anthropic-api-key not found. Set ANTHROPIC_API_KEY secret or create manually."
          fi
          if [ -n "$TAVILY_KEY" ]; then
            aws ssm put-parameter \
              --name "/careervp/dev/tavily-api-key" \
              --value "$TAVILY_KEY" \
              --type SecureString \
              --overwrite
          else
            echo "::warning::TAVILY_API_KEY secret not set. Checking if SSM parameter exists..."
            aws ssm get-parameter --name "/careervp/dev/tavily-api-key" --query "Parameter.Name" --output text || \
              echo "::warning::SSM parameter /careervp/dev/tavily-api-key not found. Set TAVILY_API_KEY secret or create manually."
          fi
      - name: Ensure JWT SSM Parameters exist
        env:
          JWT_PRIVATE_KEY_SECRET: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY_SECRET: ${{ secrets.JWT_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          ensure_string_parameter() {
            local param_name="$1"
            local param_value="$2"
            local existing_type
            existing_type="$(aws ssm get-parameter --name "$param_name" --query 'Parameter.Type' --output text 2>/dev/null || echo 'MISSING')"
            if [ "$existing_type" != "MISSING" ] && [ "$existing_type" != "String" ]; then
              echo "::warning::Recreating $param_name as String for CloudFormation compatibility (was $existing_type)."
              aws ssm delete-parameter --name "$param_name"
            fi
            aws ssm put-parameter \
              --name "$param_name" \
              --value "$param_value" \
              --type String \
              --overwrite
          }
          JWT_PRIVATE_KEY="${JWT_PRIVATE_KEY_SECRET:-}"
          JWT_PUBLIC_KEY="${JWT_PUBLIC_KEY_SECRET:-}"
          if [ -z "$JWT_PRIVATE_KEY" ] || [ -z "$JWT_PUBLIC_KEY" ]; then
            TMP_DIR="$(mktemp -d)"
            openssl genrsa -out "$TMP_DIR/jwt-private.pem" 2048 >/dev/null 2>&1
            openssl rsa -in "$TMP_DIR/jwt-private.pem" -pubout -out "$TMP_DIR/jwt-public.pem" >/dev/null 2>&1
            JWT_PRIVATE_KEY="$(cat "$TMP_DIR/jwt-private.pem")"
            JWT_PUBLIC_KEY="$(cat "$TMP_DIR/jwt-public.pem")"
            echo "::warning::JWT_PRIVATE_KEY/JWT_PUBLIC_KEY secrets not set. Generated ephemeral dev keys for deployment."
          fi
          ensure_string_parameter "/careervp/dev/jwt-private-key" "$JWT_PRIVATE_KEY"
          ensure_string_parameter "/careervp/dev/jwt-public-key" "$JWT_PUBLIC_KEY"
      - name: CFN State Guard
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/cfn-guard.sh" "${{ env.STACK_NAME }}" "${{ env.AWS_REGION }}"
      - name: Build and Deploy
        working-directory: src/backend
        env:
          ENVIRONMENT: dev
        run: |
          set -o pipefail
          make deploy 2>&1 | tee /tmp/deploy.log || {
            if grep -Eq "(_IN_PROGRESS state and can not be updated|UPDATE_COMPLETE_CLEANUP_IN_PROGRESS|is in .*_IN_PROGRESS state|ChangeSetNotFoundException: ChangeSet .* does not exist|InvalidChangeSetStatusException: Cannot delete ChangeSet in status CREATE_IN_PROGRESS)" /tmp/deploy.log; then
              echo "::warning::Transient CloudFormation deploy issue detected. Re-running CFN guard and retrying deploy..."
              "$GITHUB_WORKSPACE/.github/scripts/cfn-guard.sh" "${{ env.STACK_NAME }}" "${{ env.AWS_REGION }}"
              make deploy
            else
              exit 1
            fi
          }
      - name: Wait for Stack Stability
        run: |
          echo "Waiting for CloudFormation stack to stabilize..."
          aws cloudformation wait stack-create-complete \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws cloudformation wait stack-update-complete \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} 2>/dev/null || true
      - name: Wait for API Availability
        run: |
          .github/scripts/wait-for-api.sh "${{ env.AWS_REGION }}" "${{ env.STACK_NAME }}"
      - name: Full smoke test
        working-directory: src/backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTO_SET_LAMBDA_ENV: '1'
          AWS_REGION: us-east-1
        run: |
          # Wait for IAM propagation (AWS credentials can take 5-10s to settle)
          echo "=== IAM PROPAGATION WAIT (15s) ==="
          sleep 15

          # Use uv's Python for inline scripts
          export PATH="${PWD}/.venv/bin:${PATH}"
          bash tests/aws_cli_smoke.sh dev
      - name: Post-deploy targeted smoke (RECOVERY gate, <3 min)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTO_SET_LAMBDA_ENV: '1'
          AWS_REGION: ${{ env.AWS_REGION }}
          STACK_NAME: ${{ env.STACK_NAME }}
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p docs/evidence
          echo "=== Post-deploy targeted smoke (5 critical regression surfaces) ==="
          uv run python scripts/smoke/run_targeted_smoke.py \
            --step RECOVERY_001 \
            --max-seconds 360 \
            --out docs/evidence/targeted-smoke-RECOVERY_001-${TIMESTAMP}.json
          EXIT_CODE=$?
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "WARNING: Targeted smoke reported failures; continuing to two-pass live suite."
          else
            echo "=== Targeted smoke passed ==="
          fi
      - name: CV tailoring delete observability (RECOVERY_005)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTO_SET_LAMBDA_ENV: '1'
          AWS_REGION: ${{ env.AWS_REGION }}
          STACK_NAME: ${{ env.STACK_NAME }}
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p docs/evidence
          echo "=== CV tailoring delete observability check ==="
          uv run --project src/backend pytest -q \
            docs/refactor/live_tests/test_06_cv_tailoring.py::TestCVTailoringEndpoints::test_delete_tailored_cv_roundtrip \
            | tee docs/evidence/cv-tailoring-delete-observability-${TIMESTAMP}.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::warning::CV tailoring delete observability check failed (non-blocking)."
          fi
      - name: Two-pass live suite - Pass 1 (RECOVERY gate)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTO_SET_LAMBDA_ENV: '1'
          AWS_REGION: ${{ env.AWS_REGION }}
          STACK_NAME: ${{ env.STACK_NAME }}
          DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p docs/evidence
          echo "=== Live suite pass 1 ==="
          uv run --project src/backend python docs/refactor/live_tests/run_all_tests.py \
            --mode full \
            --summary-json docs/evidence/recovery-gate-live-pass-1-${TIMESTAMP}.json
          echo "=== Pass 1 complete ==="
      - name: Two-pass live suite - Pass 2 (RECOVERY gate)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTO_SET_LAMBDA_ENV: '1'
          AWS_REGION: ${{ env.AWS_REGION }}
          STACK_NAME: ${{ env.STACK_NAME }}
          DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p docs/evidence
          echo "=== Live suite pass 2 (consecutive stability gate) ==="
          uv run --project src/backend python docs/refactor/live_tests/run_all_tests.py \
            --mode full \
            --summary-json docs/evidence/recovery-gate-live-pass-2-${TIMESTAMP}.json
          echo "=== Pass 2 complete ==="
      - name: Evidence integrity gate (post_deploy)
        continue-on-error: true
        run: |
          echo "=== Evidence integrity check ==="
          uv run python scripts/spec_quality/check_evidence_integrity.py \
            --spec docs/beta/fix-api/yaml3/step_001_recovery_gates_and_baseline_controls.yaml \
            --artifacts-dir docs/evidence \
            --require-deployment-id-for post_deploy
          echo "=== Evidence integrity passed ==="

  deploy-other:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: https://${{ inputs.environment }}.careervp.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install backend dependencies
        working-directory: src/backend
        run: uv sync
      - name: Build Lambda artifacts
        working-directory: src/backend
        run: make build
      - name: Run CDK Nag Security Scan
        working-directory: infra
        env:
          ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'dev' || inputs.environment || 'dev' }}
        run: |
          # Synthesize CDK template as a security gate before deploy
          uv sync
          echo "=== Running CDK Nag Security Scan ==="
          npx cdk synth --quiet || { echo "CDK synth failed"; exit 1; }
          echo "=== CDK Nag Security Scan passed ==="
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: deploy-${{ inputs.environment }}-${{ github.sha }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Ensure SSM Parameter exists
        env:
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_KEY: ${{ secrets.TAVILY_API_KEY }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          if [ -n "$ANTHROPIC_KEY" ]; then
            aws ssm put-parameter \
              --name "/careervp/${TARGET_ENV}/anthropic-api-key" \
              --value "$ANTHROPIC_KEY" \
              --type SecureString \
              --overwrite
          else
            echo "::warning::ANTHROPIC_API_KEY secret not set. Checking if SSM parameter exists..."
            aws ssm get-parameter --name "/careervp/${TARGET_ENV}/anthropic-api-key" --query "Parameter.Name" --output text || \
              echo "::warning::SSM parameter /careervp/${TARGET_ENV}/anthropic-api-key not found. Set ANTHROPIC_API_KEY secret or create manually."
          fi
          if [ -n "$TAVILY_KEY" ]; then
            aws ssm put-parameter \
              --name "/careervp/${TARGET_ENV}/tavily-api-key" \
              --value "$TAVILY_KEY" \
              --type SecureString \
              --overwrite
          else
            echo "::warning::TAVILY_API_KEY secret not set. Checking if SSM parameter exists..."
            aws ssm get-parameter --name "/careervp/${TARGET_ENV}/tavily-api-key" --query "Parameter.Name" --output text || \
              echo "::warning::SSM parameter /careervp/${TARGET_ENV}/tavily-api-key not found. Set TAVILY_API_KEY secret or create manually."
          fi
      - name: Ensure JWT SSM Parameters exist
        env:
          TARGET_ENV: ${{ inputs.environment }}
          JWT_PRIVATE_KEY_SECRET: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY_SECRET: ${{ secrets.JWT_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          ensure_string_parameter() {
            local param_name="$1"
            local param_value="$2"
            local existing_type
            existing_type="$(aws ssm get-parameter --name "$param_name" --query 'Parameter.Type' --output text 2>/dev/null || echo 'MISSING')"
            if [ "$existing_type" != "MISSING" ] && [ "$existing_type" != "String" ]; then
              echo "::warning::Recreating $param_name as String for CloudFormation compatibility (was $existing_type)."
              aws ssm delete-parameter --name "$param_name"
            fi
            aws ssm put-parameter \
              --name "$param_name" \
              --value "$param_value" \
              --type String \
              --overwrite
          }
          JWT_PRIVATE_KEY="${JWT_PRIVATE_KEY_SECRET:-}"
          JWT_PUBLIC_KEY="${JWT_PUBLIC_KEY_SECRET:-}"
          if [ -z "$JWT_PRIVATE_KEY" ] || [ -z "$JWT_PUBLIC_KEY" ]; then
            TMP_DIR="$(mktemp -d)"
            openssl genrsa -out "$TMP_DIR/jwt-private.pem" 2048 >/dev/null 2>&1
            openssl rsa -in "$TMP_DIR/jwt-private.pem" -pubout -out "$TMP_DIR/jwt-public.pem" >/dev/null 2>&1
            JWT_PRIVATE_KEY="$(cat "$TMP_DIR/jwt-private.pem")"
            JWT_PUBLIC_KEY="$(cat "$TMP_DIR/jwt-public.pem")"
            echo "::warning::JWT_PRIVATE_KEY/JWT_PUBLIC_KEY secrets not set. Generated ephemeral keys for ${TARGET_ENV} deployment."
          fi
          ensure_string_parameter "/careervp/${TARGET_ENV}/jwt-private-key" "$JWT_PRIVATE_KEY"
          ensure_string_parameter "/careervp/${TARGET_ENV}/jwt-public-key" "$JWT_PUBLIC_KEY"
      - name: Ensure Payment Provider SSM Parameters exist
        env:
          TARGET_ENV: ${{ inputs.environment }}
          PAYMENT_PRICE_MONTHLY: ${{ secrets.PAYMENT_PROVIDER_PRICE_MONTHLY }}
          PAYMENT_PRICE_QUARTERLY: ${{ secrets.PAYMENT_PROVIDER_PRICE_QUARTERLY }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_PROVIDER_WEBHOOK_SECRET }}
          PAYMENT_WEBHOOK_SECRET_PREVIOUS: ${{ secrets.PAYMENT_PROVIDER_WEBHOOK_SECRET_PREVIOUS }}
        run: |
          set -euo pipefail
          # All parameters must be String type because CDK uses ssm.StringParameter.value_for_string_parameter()
          # which only works with String type, not SecureString
          ensure_string_parameter() {
            local param_name="$1"
            local param_value="$2"
            if [ -z "$param_value" ]; then
              echo "::warning::$param_name not set. Checking if SSM parameter exists..."
              aws ssm get-parameter --name "$param_name" --query "Parameter.Name" --output text || {
                echo "::error::SSM parameter $param_name not found and secret not provided. Cannot deploy."
                exit 1
              }
              return 0
            fi
            # Delete existing parameter if it exists with wrong type
            if aws ssm get-parameter --name "$param_name" --query "Parameter.Type" --output text 2>/dev/null | grep -q "SecureString"; then
              aws ssm delete-parameter --name "$param_name" 2>/dev/null || true
            fi
            aws ssm put-parameter \
              --name "$param_name" \
              --value "$param_value" \
              --type String \
              --overwrite
            echo "Created/updated $param_name as String"
          }
          ensure_string_parameter "/careervp/${TARGET_ENV}/payment-provider-price-monthly" "$PAYMENT_PRICE_MONTHLY"
          ensure_string_parameter "/careervp/${TARGET_ENV}/payment-provider-price-quarterly" "$PAYMENT_PRICE_QUARTERLY"
          ensure_string_parameter "/careervp/${TARGET_ENV}/payment-provider-webhook-secret" "$PAYMENT_WEBHOOK_SECRET"
          ensure_string_parameter "/careervp/${TARGET_ENV}/payment-provider-webhook-secret-previous" "$PAYMENT_WEBHOOK_SECRET_PREVIOUS"
      - name: CFN State Guard
        env:
          # Dynamically compute stack name for other environments
          STACK_NAME: ${{ inputs.environment == 'prod' && 'CareerVpCrudProduction' || inputs.environment == 'staging' && 'CareerVpCrudStaging' || 'CareerVpCrudDev' }}
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/cfn-guard.sh" "$STACK_NAME" "${{ env.AWS_REGION }}"
      - name: Build and Deploy
        working-directory: src/backend
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          STACK_NAME: ${{ inputs.environment == 'prod' && 'CareerVpCrudProduction' || inputs.environment == 'staging' && 'CareerVpCrudStaging' || 'CareerVpCrudDev' }}
        run: |
          set -o pipefail
          make deploy 2>&1 | tee /tmp/deploy.log || {
            if grep -Eq "(_IN_PROGRESS state and can not be updated|UPDATE_COMPLETE_CLEANUP_IN_PROGRESS|is in .*_IN_PROGRESS state|InvalidChangeSetStatusException: Cannot delete ChangeSet in status CREATE_IN_PROGRESS)" /tmp/deploy.log; then
              echo "::warning::Stack update lock detected. Re-running CFN guard and retrying deploy..."
              "$GITHUB_WORKSPACE/.github/scripts/cfn-guard.sh" "$STACK_NAME" "${{ env.AWS_REGION }}"
              make deploy
            else
              exit 1
            fi
          }
      - name: Wait for Stack Stability
        env:
          STACK_NAME: ${{ inputs.environment == 'prod' && 'CareerVpCrudProduction' || inputs.environment == 'staging' && 'CareerVpCrudStaging' || 'CareerVpCrudDev' }}
        run: |
          echo "Waiting for CloudFormation stack to stabilize..."
          aws cloudformation wait stack-create-complete \
            --stack-name "$STACK_NAME" \
            --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws cloudformation wait stack-update-complete \
            --stack-name "$STACK_NAME" \
            --region ${{ env.AWS_REGION }} 2>/dev/null || true
      - name: Wait for API Availability
        env:
          STACK_NAME: ${{ inputs.environment == 'prod' && 'CareerVpCrudProduction' || inputs.environment == 'staging' && 'CareerVpCrudStaging' || 'CareerVpCrudDev' }}
        run: |
          .github/scripts/wait-for-api.sh "${{ env.AWS_REGION }}" "$STACK_NAME"
      - name: Post-deploy smoke test
        working-directory: src/backend
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTO_SET_LAMBDA_ENV: '1'
        run: make smoke-test
