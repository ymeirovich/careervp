name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: devx
        type: choice
        options:
          - devx
          - dev
          - staging
          - prod

# P-28 Sub-clause B: one deploy slot for ALL triggers, and NEVER cancel an in-flight run.
# A 2nd push to main must QUEUE — cancelling a mid-flight CloudFormation update leaves the
# stack in UPDATE_ROLLBACK_IN_PROGRESS and needs human intervention.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  id-token: write  # Required for OIDC

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'
  AWS_REGION: 'us-east-1'
  UV_VERSION: '0.5.21'
  STACK_NAME: 'CareerVpCrudDev'

jobs:
  # ===========================================================================
  # P-28 Sub-clause C — Job 1: automation, CreateChangeSet ONLY (no execute).
  # The IAM role here must NOT carry cloudformation:ExecuteChangeSet (see the
  # runbook: docs/db-redesign/.../runbooks/p28-human-gated-deploy-runbook.md).
  # ===========================================================================
  create-change-set-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changeset_name: ${{ steps.create.outputs.changeset_name }}
    env:
      CHANGESET_NAME: cs-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install backend dependencies
        working-directory: src/backend
        run: uv sync --group dev
      - name: Build Lambda artifacts
        working-directory: src/backend
        run: make build
      - name: Run CDK Nag Security Scan
        working-directory: infra
        env:
          ENVIRONMENT: dev
        run: |
          uv sync
          echo "=== Running CDK Nag Security Scan ==="
          npx cdk synth --quiet || { echo "CDK synth failed"; exit 1; }
          echo "=== CDK Nag Security Scan passed ==="
      - name: Pre-deploy parity check (RECOVERY gate)
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p docs/evidence
          echo "=== Pre-deploy infra route parity check ==="
          uv run python scripts/spec_quality/check_deployed_parity.py \
            --env dev-live \
            --infra-source infra/careervp/api_construct.py \
            --out docs/evidence/recovery-gate-parity-report-${TIMESTAMP}.json
          cat docs/evidence/recovery-gate-parity-report-${TIMESTAMP}.json
          echo "=== Parity check passed ==="
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: create-cs-dev-${{ github.sha }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Ensure SSM Parameter exists
        env:
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_KEY" ]; then
            aws ssm put-parameter \
              --name "/careervp/dev/anthropic-api-key" \
              --value "$ANTHROPIC_KEY" \
              --type SecureString \
              --overwrite
          else
            echo "::warning::ANTHROPIC_API_KEY secret not set. Checking if SSM parameter exists..."
            aws ssm get-parameter --name "/careervp/dev/anthropic-api-key" --query "Parameter.Name" --output text || \
              echo "::warning::SSM parameter /careervp/dev/anthropic-api-key not found. Set ANTHROPIC_API_KEY secret or create manually."
          fi
          if [ -n "$TAVILY_KEY" ]; then
            aws ssm put-parameter \
              --name "/careervp/dev/tavily-api-key" \
              --value "$TAVILY_KEY" \
              --type SecureString \
              --overwrite
          else
            echo "::warning::TAVILY_API_KEY secret not set. Checking if SSM parameter exists..."
            aws ssm get-parameter --name "/careervp/dev/tavily-api-key" --query "Parameter.Name" --output text || \
              echo "::warning::SSM parameter /careervp/dev/tavily-api-key not found. Set TAVILY_API_KEY secret or create manually."
          fi
      - name: Ensure JWT SSM Parameters exist
        env:
          JWT_PRIVATE_KEY_SECRET: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY_SECRET: ${{ secrets.JWT_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          ensure_string_parameter() {
            local param_name="$1"
            local param_value="$2"
            local existing_type
            existing_type="$(aws ssm get-parameter --name "$param_name" --query 'Parameter.Type' --output text 2>/dev/null || echo 'MISSING')"
            if [ "$existing_type" != "MISSING" ] && [ "$existing_type" != "String" ]; then
              echo "::warning::Recreating $param_name as String for CloudFormation compatibility (was $existing_type)."
              aws ssm delete-parameter --name "$param_name"
            fi
            aws ssm put-parameter \
              --name "$param_name" \
              --value "$param_value" \
              --type String \
              --overwrite
          }
          JWT_PRIVATE_KEY="${JWT_PRIVATE_KEY_SECRET:-}"
          JWT_PUBLIC_KEY="${JWT_PUBLIC_KEY_SECRET:-}"
          if [ -z "$JWT_PRIVATE_KEY" ] || [ -z "$JWT_PUBLIC_KEY" ]; then
            TMP_DIR="$(mktemp -d)"
            openssl genrsa -out "$TMP_DIR/jwt-private.pem" 2048 >/dev/null 2>&1
            openssl rsa -in "$TMP_DIR/jwt-private.pem" -pubout -out "$TMP_DIR/jwt-public.pem" >/dev/null 2>&1
            JWT_PRIVATE_KEY="$(cat "$TMP_DIR/jwt-private.pem")"
            JWT_PUBLIC_KEY="$(cat "$TMP_DIR/jwt-public.pem")"
            echo "::warning::JWT_PRIVATE_KEY/JWT_PUBLIC_KEY secrets not set. Generated ephemeral dev keys for deployment."
          fi
          ensure_string_parameter "/careervp/dev/jwt-private-key" "$JWT_PRIVATE_KEY"
          ensure_string_parameter "/careervp/dev/jwt-public-key" "$JWT_PUBLIC_KEY"
      - name: CFN State Guard
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/cfn-guard.sh" "${{ env.STACK_NAME }}" "${{ env.AWS_REGION }}"
      - name: Create change set (NO execute)
        id: create
        working-directory: src/backend
        env:
          ENVIRONMENT: dev
        run: |
          set -o pipefail
          make create-changeset STACK_NAME="${{ env.STACK_NAME }}" CHANGESET_NAME="${{ env.CHANGESET_NAME }}"
          echo "changeset_name=${{ env.CHANGESET_NAME }}" >> "$GITHUB_OUTPUT"
      - name: Generate Replacement report (auto-fail on protected replacement)
        run: |
          echo "=== DescribeChangeSet Replacement report (P-28 approval artifact) ==="
          aws cloudformation describe-change-set \
            --stack-name "${{ env.STACK_NAME }}" \
            --change-set-name "${{ env.CHANGESET_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --output json > /tmp/changeset.json
          # Exits 1 (fails the job) if any RestApi/Table/Bucket/UserPool has Replacement:True,
          # so the human-gated execute-change-set job never runs.
          python3 scripts/ci/changeset_replacement_report.py --changeset /tmp/changeset.json --summary

  # ===========================================================================
  # P-28 Sub-clause C — Job 2: HUMAN-GATED execute.
  # `environment: deploy-dev` must have a REQUIRED REVIEWER in GitHub settings.
  # The reviewer reads the Replacement report (job summary above) before approving.
  # ===========================================================================
  execute-change-set-dev:
    if: github.ref == 'refs/heads/main'
    needs: create-change-set-dev
    runs-on: ubuntu-latest
    environment: deploy-dev
    env:
      CHANGESET_NAME: ${{ needs.create-change-set-dev.outputs.changeset_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install backend dependencies
        working-directory: src/backend
        run: uv sync --group dev
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_EXECUTE_ROLE || secrets.AWS_ROLE }}
          role-session-name: execute-cs-dev-${{ github.sha }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Execute approved change set
        working-directory: src/backend
        run: |
          make execute-changeset \
            STACK_NAME="${{ env.STACK_NAME }}" \
            CHANGESET_NAME="${{ env.CHANGESET_NAME }}" \
            AWS_REGION="${{ env.AWS_REGION }}"
      - name: Wait for Stack Stability
        run: |
          echo "Waiting for CloudFormation stack to stabilize..."
          aws cloudformation wait stack-update-complete \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws cloudformation wait stack-create-complete \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} 2>/dev/null || true
      - name: Wait for API Availability
        run: |
          .github/scripts/wait-for-api.sh "${{ env.AWS_REGION }}" "${{ env.STACK_NAME }}"
      - name: Full smoke test
        working-directory: src/backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTO_SET_LAMBDA_ENV: '1'
          AWS_REGION: us-east-1
        run: |
          echo "=== IAM PROPAGATION WAIT (15s) ==="
          sleep 15
          export PATH="${PWD}/.venv/bin:${PATH}"
          bash tests/aws_cli_smoke.sh dev
      - name: Evidence integrity gate (post_deploy)
        continue-on-error: true
        run: |
          echo "=== Evidence integrity check ==="
          uv run python scripts/spec_quality/check_evidence_integrity.py \
            --spec docs/beta/fix-api/yaml3/step_001_recovery_gates_and_baseline_controls.yaml \
            --artifacts-dir docs/evidence \
            --require-deployment-id-for post_deploy || true

  # ===========================================================================
  # workflow_dispatch path (staging/prod). Also change-set-only in automation;
  # execution is a separate human-gated job. AC-P28-6: no auto-execute off `main`.
  # ===========================================================================
  create-change-set-other:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      changeset_name: ${{ steps.create.outputs.changeset_name }}
      stack_name: ${{ steps.create.outputs.stack_name }}
    env:
      CHANGESET_NAME: cs-${{ github.run_id }}-${{ github.run_attempt }}
      # Any environment not explicitly listed here used to silently fall through
      # to CareerVpCrudDev -- a typo'd `environment` input would target the LIVE
      # dev stack instead of failing. `devx` (the P-26 parallel-cutover stack,
      # runbooks/p26-devx-parallel-cutover-handoff.md blocker #5) hit exactly
      # this. The "Validate resolved stack name" step below is the fail-closed
      # backstop if this ternary and the `type: choice` restriction above ever
      # disagree.
      STACK_NAME: ${{ inputs.environment == 'prod' && 'CareerVpCrudProduction' || inputs.environment == 'staging' && 'CareerVpCrudStaging' || inputs.environment == 'devx' && 'CareerVpCrudDevx' || inputs.environment == 'dev' && 'CareerVpCrudDev' || 'UNKNOWN' }}
    steps:
      - name: Validate resolved stack name
        run: |
          if [ "${{ env.STACK_NAME }}" = "UNKNOWN" ]; then
            echo "::error::inputs.environment='${{ inputs.environment }}' did not map to a known stack name. Refusing to fall through to a default stack."
            exit 1
          fi
          echo "Deploying environment '${{ inputs.environment }}' -> stack '${{ env.STACK_NAME }}'"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install backend dependencies
        working-directory: src/backend
        run: uv sync
      - name: Build Lambda artifacts
        working-directory: src/backend
        run: make build
      - name: Run CDK Nag Security Scan
        working-directory: infra
        env:
          ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        run: |
          uv sync
          npx cdk synth --quiet || { echo "CDK synth failed"; exit 1; }
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: create-cs-${{ inputs.environment }}-${{ github.sha }}
          aws-region: ${{ env.AWS_REGION }}
      # ---------------------------------------------------------------------
      # Ensure this env's SSM parameters exist BEFORE the change set is built,
      # so CloudFormation's parameter lookups resolve. CREATE-IF-MISSING only:
      # this path serves devx / staging / prod, so it must NEVER overwrite an
      # existing value (unlike the dev push path, which --overwrite's its own).
      # devx's first deploy in step 1.4 500'd for exactly this reason -- the
      # anthropic key had never been seeded and a human did it by hand.
      # ---------------------------------------------------------------------
      - name: Ensure env SSM parameters exist (create-if-missing)
        env:
          TARGET_ENV: ${{ inputs.environment }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_KEY: ${{ secrets.TAVILY_API_KEY }}
          JWT_PRIVATE_KEY_SECRET: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY_SECRET: ${{ secrets.JWT_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          exists() { aws ssm get-parameter --name "$1" >/dev/null 2>&1; }
          create_if_missing() {
            local name="$1" value="$2" type="$3"
            if exists "$name"; then
              echo "SSM ok (unchanged): $name"
            elif [ -n "$value" ]; then
              aws ssm put-parameter --name "$name" --value "$value" --type "$type"
              echo "SSM created: $name ($type)"
            else
              echo "::warning::$name is missing and no secret was supplied to create it."
            fi
          }
          create_if_missing "/careervp/${TARGET_ENV}/anthropic-api-key" "${ANTHROPIC_KEY:-}" SecureString
          create_if_missing "/careervp/${TARGET_ENV}/tavily-api-key" "${TAVILY_KEY:-}" SecureString
          JWT_PRIVATE_KEY="${JWT_PRIVATE_KEY_SECRET:-}"
          JWT_PUBLIC_KEY="${JWT_PUBLIC_KEY_SECRET:-}"
          if { ! exists "/careervp/${TARGET_ENV}/jwt-private-key" || ! exists "/careervp/${TARGET_ENV}/jwt-public-key"; } \
             && { [ -z "$JWT_PRIVATE_KEY" ] || [ -z "$JWT_PUBLIC_KEY" ]; }; then
            TMP_DIR="$(mktemp -d)"
            openssl genrsa -out "$TMP_DIR/jwt-private.pem" 2048 >/dev/null 2>&1
            openssl rsa -in "$TMP_DIR/jwt-private.pem" -pubout -out "$TMP_DIR/jwt-public.pem" >/dev/null 2>&1
            JWT_PRIVATE_KEY="$(cat "$TMP_DIR/jwt-private.pem")"
            JWT_PUBLIC_KEY="$(cat "$TMP_DIR/jwt-public.pem")"
            echo "::warning::JWT secrets not set; generated an ephemeral keypair to seed ${TARGET_ENV}."
          fi
          # String (not SecureString) for CloudFormation dynamic-reference compatibility, matching the dev path.
          create_if_missing "/careervp/${TARGET_ENV}/jwt-private-key" "$JWT_PRIVATE_KEY" String
          create_if_missing "/careervp/${TARGET_ENV}/jwt-public-key" "$JWT_PUBLIC_KEY" String
      - name: CFN State Guard
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/cfn-guard.sh" "${{ env.STACK_NAME }}" "${{ env.AWS_REGION }}"
      - name: Create change set (NO execute)
        id: create
        working-directory: src/backend
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -o pipefail
          make create-changeset STACK_NAME="${{ env.STACK_NAME }}" CHANGESET_NAME="${{ env.CHANGESET_NAME }}"
          echo "changeset_name=${{ env.CHANGESET_NAME }}" >> "$GITHUB_OUTPUT"
          echo "stack_name=${{ env.STACK_NAME }}" >> "$GITHUB_OUTPUT"
      - name: Generate Replacement report (auto-fail on protected replacement)
        run: |
          aws cloudformation describe-change-set \
            --stack-name "${{ env.STACK_NAME }}" \
            --change-set-name "${{ env.CHANGESET_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --output json > /tmp/changeset.json
          python3 scripts/ci/changeset_replacement_report.py --changeset /tmp/changeset.json --summary

  execute-change-set-other:
    if: github.event_name == 'workflow_dispatch'
    needs: create-change-set-other
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: https://${{ inputs.environment }}.careervp.example.com
    env:
      STACK_NAME: ${{ needs.create-change-set-other.outputs.stack_name }}
      CHANGESET_NAME: ${{ needs.create-change-set-other.outputs.changeset_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install backend dependencies
        working-directory: src/backend
        run: uv sync --group dev
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_EXECUTE_ROLE || secrets.AWS_ROLE }}
          role-session-name: execute-cs-${{ inputs.environment }}-${{ github.sha }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Execute approved change set
        run: |
          aws cloudformation execute-change-set \
            --stack-name "${{ env.STACK_NAME }}" \
            --change-set-name "${{ env.CHANGESET_NAME }}" \
            --region "${{ env.AWS_REGION }}"
      - name: Wait for Stack Stability
        run: |
          aws cloudformation wait stack-update-complete \
            --stack-name "${{ env.STACK_NAME }}" \
            --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws cloudformation wait stack-create-complete \
            --stack-name "${{ env.STACK_NAME }}" \
            --region ${{ env.AWS_REGION }} 2>/dev/null || true
      # Post-deploy verification, mirroring execute-change-set-dev so devx is
      # protected to the same standard as dev. Ordering is identical: execute ->
      # wait -> smoke, so a smoke failure marks the run red AFTER the stack has
      # already updated -- same semantics as the dev path, no new deploy risk.
      - name: Wait for API Availability
        run: |
          .github/scripts/wait-for-api.sh "${{ env.AWS_REGION }}" "${{ env.STACK_NAME }}"
      - name: Full smoke test
        working-directory: src/backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTO_SET_LAMBDA_ENV: '1'
          AWS_REGION: us-east-1
        run: |
          echo "=== IAM PROPAGATION WAIT (15s) ==="
          sleep 15
          export PATH="${PWD}/.venv/bin:${PATH}"
          bash tests/aws_cli_smoke.sh "${{ inputs.environment }}"
