name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Ruff check
        working-directory: src/backend
        run: uv run ruff check .

  typecheck:
    name: Mypy Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Run mypy
        working-directory: src/backend
        run: uv run mypy careervp --config-file mypy.ini

  tests:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Run pytest
        working-directory: src/backend
        run: uv run pytest

  cv-tailoring-delete-observability:
    name: CV Tailoring Delete Observability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Run delete roundtrip integration tests
        working-directory: src/backend
        env:
          PYTHONPATH: ${{ github.workspace }}/src/backend
        run: uv run pytest tests/integration/test_cv_tailoring_delete_roundtrip.py -q

  deployed-parity:
    name: Deployed Parity Gate (pre_merge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Run deployed parity check
        run: |
          mkdir -p docs/evidence
          uv run python scripts/spec_quality/check_deployed_parity.py \
            --env pr \
            --infra-source infra/careervp/api_construct.py \
            --out docs/evidence/pr-parity-report-${{ github.sha }}.json
          echo "=== Parity report ==="
          cat docs/evidence/pr-parity-report-${{ github.sha }}.json

  evidence-integrity:
    name: Evidence Integrity Gate (pre_merge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Run regression delta check (if baseline present)
        run: |
          BASELINE="careervp/live-test-results27.log"
          if [ ! -f "$BASELINE" ]; then
            echo "::warning::Baseline artifact not found at $BASELINE – regression delta check skipped"
            exit 0
          fi
          # Use most recent evidence artifact as current, or skip if none exist
          CURRENT=$(ls -t docs/evidence/recovery-gate-live-pass-*.json 2>/dev/null | head -1 || true)
          if [ -z "$CURRENT" ]; then
            echo "::warning::No current live-pass evidence artifact found – regression delta skipped (run a deploy to generate one)"
            exit 0
          fi
          uv run python scripts/spec_quality/check_regression_delta.py \
            --baseline "$BASELINE" \
            --current "$CURRENT" \
            --out docs/evidence/pr-regression-delta-${{ github.sha }}.json
      - name: Run evidence integrity check
        run: |
          if [ ! -d "docs/evidence" ] || [ -z "$(ls -A docs/evidence 2>/dev/null)" ]; then
            echo "::warning::docs/evidence is empty – evidence integrity gate deferred until first deploy"
            exit 0
          fi
          uv run python scripts/spec_quality/check_evidence_integrity.py \
            --spec docs/beta/fix-api/yaml3/step_001_recovery_gates_and_baseline_controls.yaml \
            --artifacts-dir docs/evidence

  cdk-synth:
    name: CDK Synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Validate naming guardrail
        working-directory: src/backend
        run: |
          ROOT=$(git rev-parse --show-toplevel)
          uv run python scripts/validate_naming.py --path "$ROOT/infra" --strict
      - name: Build Lambda code
        working-directory: src/backend
        run: make build
      - name: Run cdk synth
        working-directory: infra
        run: npx cdk synth
