name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Ruff check
        working-directory: src/backend
        run: uv run ruff check .

  typecheck:
    name: Mypy Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Run mypy
        working-directory: src/backend
        run: uv run mypy careervp --config-file mypy.ini

  tests:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      # Per-directory, not a single `uv run pytest`: the combined run is
      # 606-red from cross-test contamination (sys.modules/sys.path pollution
      # between files — test_job_handler.py passes 7/7 alone, ModuleNotFoundError
      # combined). Isolating by directory sidesteps it entirely: ~1792 passed,
      # 14 failed when the plan measured this. Root cause is unfixed and is
      # handoff 02's scope (docs/handoff/2026-09-19-HANDOFF-01-ci-wiring.md,
      # docs/handoff/2026-09-19-PRODUCTION-PROGRAM.md W4.00/W4.01). Do not
      # "simplify" this back into one bare pytest call without fixing that
      # first — it will silently drop to 4-of-250 files effectively validated,
      # which is the exact problem this step exists to close.
      #
      # The loop does not stop at the first failing directory — collect all,
      # fail once — so a broken PR shows every failing directory, not just
      # the first one alphabetically.
      - name: Run pytest (per backend test directory)
        working-directory: src/backend
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          PYTHONPATH: ${{ github.workspace }}/src/backend
        run: |
          fail=0
          DIRS=(
            tests/unit
            tests/integration
            tests/infrastructure
            tests/e2e
            tests/models
            tests/regression
            tests/security
            tests/infra
          )
          # A directory can be absent (pytest exits 4) or present but empty
          # (pytest exits 5). Neither is a test failure, but neither is a pass
          # either — both are UNKNOWN (docs/HARNESS.md) and are annotated so
          # coverage can never silently shrink. tests/infra, for example, does
          # not exist on main; without this the whole gate would exit non-zero
          # on every PR for a reason unrelated to the code under review.
          for d in "${DIRS[@]}"; do
            if [ ! -d "$d" ]; then
              echo "::warning title=Test directory absent::$d is not present in this checkout - 0 tests ran from it"
              continue
            fi
            echo "::group::$d"
            # -rs prints the reason for every skip, so an UNKNOWN cannot read
            # as a PASS in the log.
            rc=0
            uv run pytest "$d" -q --tb=short -rs || rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 5 ]; then
              echo "::warning title=No tests collected::$d exists but collected 0 tests"
            elif [ "$rc" -ne 0 ]; then
              fail=1
            fi
          done
          exit $fail

  jest-frontend:
    name: Jest (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install dependencies
        run: cd src/frontend && npm ci
      - name: Run Jest unit
        run: cd src/frontend && npm run test:unit
        env:
          CI: true
      - name: Run Jest integration
        run: cd src/frontend && npm run test:integration
        env:
          CI: true
      # test:e2e (jest --selectProjects e2e) is deliberately not run here: it's
      # 5 billing files that are pure tautologies (mockApi.post.mockResolvedValue
      # -> expect(response.status).toBe(200), no product code runs) plus the two
      # real Playwright specs handoff-01 Step 2 renamed out of this project.
      # Wiring it in would add assertions that prove nothing to the gate — see
      # docs/handoff/2026-09-19-HANDOFF-01-ci-wiring.md and the sweep-00
      # evidence it cites. Left for handoff 02.

  vitest-frontend:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install dependencies
        run: cd src/frontend && npm ci
      - name: Run Vitest
        run: cd src/frontend && npx vitest run --config vitest.config.ts --reporter verbose
        env:
          CI: true

  deployed-parity:
    name: Deployed Parity Gate (pre_merge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Run deployed parity check
        run: |
          mkdir -p docs/evidence
          uv run python scripts/spec_quality/check_deployed_parity.py \
            --env pr \
            --infra-source infra/careervp/api_construct.py \
            --out docs/evidence/pr-parity-report-${{ github.sha }}.json
          echo "=== Parity report ==="
          cat docs/evidence/pr-parity-report-${{ github.sha }}.json

  evidence-integrity:
    name: Evidence Integrity Gate (pre_merge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Run regression delta check (if baseline present)
        run: |
          BASELINE="careervp/live-test-results27.log"
          if [ ! -f "$BASELINE" ]; then
            echo "::warning::Baseline artifact not found at $BASELINE – regression delta check skipped"
            exit 0
          fi
          # Use most recent evidence artifact as current, or skip if none exist
          CURRENT=$(ls -t docs/evidence/recovery-gate-live-pass-*.json 2>/dev/null | head -1 || true)
          if [ -z "$CURRENT" ]; then
            echo "::warning::No current live-pass evidence artifact found – regression delta skipped (run a deploy to generate one)"
            exit 0
          fi
          uv run python scripts/spec_quality/check_regression_delta.py \
            --baseline "$BASELINE" \
            --current "$CURRENT" \
            --out docs/evidence/pr-regression-delta-${{ github.sha }}.json
      - name: Run evidence integrity check
        run: |
          if [ ! -d "docs/evidence" ] || [ -z "$(ls -A docs/evidence 2>/dev/null)" ]; then
            echo "::warning::docs/evidence is empty - evidence integrity gate deferred until first deploy"
            exit 0
          fi
          if ! compgen -G "docs/evidence/recovery-gate-live-pass-*.json" > /dev/null; then
            echo "::warning::No recovery gate artifacts found - evidence integrity gate deferred until deploy artifacts exist"
            exit 0
          fi
          uv run python scripts/spec_quality/check_evidence_integrity.py \
            --spec docs/beta/fix-api/yaml3/step_001_recovery_gates_and_baseline_controls.yaml \
            --artifacts-dir docs/evidence

  cdk-synth:
    name: CDK Synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Validate naming guardrail
        working-directory: src/backend
        run: |
          ROOT=$(git rev-parse --show-toplevel)
          uv run python scripts/validate_naming.py --path "$ROOT/infra" --strict
      - name: Build Lambda code
        working-directory: src/backend
        run: make build
      - name: Run cdk synth
        working-directory: infra
        env:
          # infra/careervp/scratch_deployment.py fails closed on an unset
          # ENVIRONMENT (P-64) rather than silently guessing "dev" — devx is
          # this repo's actual live deploy target, see CLAUDE.md's topology.
          ENVIRONMENT: devx
        run: npx cdk synth
