name: Deploy to Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  id-token: write

# P-28 Sub-clause B: one deploy slot for staging, never cancelled mid-flight.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'
  AWS_REGION: 'us-east-1'
  UV_VERSION: '0.5.21'
  ENVIRONMENT: 'staging'
  STACK_NAME: 'CareerVpCrudStaging'

jobs:
  # ===========================================================================
  # P-28 Sub-clause C — Job 1: automation, CreateChangeSet ONLY (no execute).
  # `make deploy` (used here previously) hardcodes CareerVpCrudDev regardless of
  # STACK_NAME/ENVIRONMENT — this workflow was silently deploying dev on every
  # push to develop, not staging, and doing so with --require-approval=never
  # and no human gate at all. `make create-changeset` takes STACK_NAME as a
  # real parameter (see src/backend/Makefile), so it actually targets staging.
  # ===========================================================================
  create-change-set-staging:
    runs-on: ubuntu-latest
    outputs:
      changeset_name: ${{ steps.create.outputs.changeset_name }}
    env:
      CHANGESET_NAME: cs-staging-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: src/backend
        run: uv sync

      - name: Build Lambda artifacts
        working-directory: src/backend
        run: make build

      - name: Run CDK Nag Security Scan
        working-directory: infra
        run: |
          uv sync
          echo "=== Running CDK Nag Security Scan ==="
          npx cdk synth --quiet || { echo "CDK synth failed"; exit 1; }
          echo "=== CDK Nag Security Scan passed ==="

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: deploy-staging-${{ github.sha }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure SSM Parameter exists
        env:
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_KEY" ]; then
            aws ssm put-parameter \
              --name "/careervp/staging/anthropic-api-key" \
              --value "$ANTHROPIC_KEY" \
              --type SecureString \
              --overwrite
          else
            echo "::warning::ANTHROPIC_API_KEY secret not set."
          fi
          if [ -n "$TAVILY_KEY" ]; then
            aws ssm put-parameter \
              --name "/careervp/staging/tavily-api-key" \
              --value "$TAVILY_KEY" \
              --type SecureString \
              --overwrite
          else
            echo "::warning::TAVILY_API_KEY secret not set."
          fi

      - name: Ensure JWT SSM Parameters exist
        env:
          JWT_PRIVATE_KEY_SECRET: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY_SECRET: ${{ secrets.JWT_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          ensure_string_parameter() {
            local param_name="$1"
            local param_value="$2"
            aws ssm put-parameter \
              --name "$param_name" \
              --value "$param_value" \
              --type String \
              --overwrite
          }
          JWT_PRIVATE_KEY="${JWT_PRIVATE_KEY_SECRET:-}"
          JWT_PUBLIC_KEY="${JWT_PUBLIC_KEY_SECRET:-}"
          if [ -z "$JWT_PRIVATE_KEY" ] || [ -z "$JWT_PUBLIC_KEY" ]; then
            TMP_DIR="$(mktemp -d)"
            openssl genrsa -out "$TMP_DIR/jwt-private.pem" 2048 >/dev/null 2>&1
            openssl rsa -in "$TMP_DIR/jwt-private.pem" -pubout -out "$TMP_DIR/jwt-public.pem" >/dev/null 2>&1
            JWT_PRIVATE_KEY="$(cat "$TMP_DIR/jwt-private.pem")"
            JWT_PUBLIC_KEY="$(cat "$TMP_DIR/jwt-public.pem")"
            echo "::warning::JWT keys not set. Generated ephemeral keys."
          fi
          ensure_string_parameter "/careervp/staging/jwt-private-key" "$JWT_PRIVATE_KEY"
          ensure_string_parameter "/careervp/staging/jwt-public-key" "$JWT_PUBLIC_KEY"

      - name: CFN State Guard
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/cfn-guard.sh" "${{ env.STACK_NAME }}" "${{ env.AWS_REGION }}"

      - name: Create change set (NO execute)
        id: create
        working-directory: src/backend
        run: |
          set -o pipefail
          make create-changeset STACK_NAME="${{ env.STACK_NAME }}" CHANGESET_NAME="${{ env.CHANGESET_NAME }}"
          echo "changeset_name=${{ env.CHANGESET_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Generate Replacement report (auto-fail on protected replacement)
        run: |
          echo "=== DescribeChangeSet Replacement report (P-28 approval artifact) ==="
          aws cloudformation describe-change-set \
            --stack-name "${{ env.STACK_NAME }}" \
            --change-set-name "${{ env.CHANGESET_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --output json > /tmp/changeset.json
          # Exits 1 (fails the job) if any RestApi/Table/Bucket/UserPool has Replacement:True,
          # so the human-gated execute-change-set job never runs.
          python3 scripts/ci/changeset_replacement_report.py --changeset /tmp/changeset.json --summary

  # ===========================================================================
  # P-28 Sub-clause C — Job 2: HUMAN-GATED execute.
  # `environment: staging` must have a REQUIRED REVIEWER in GitHub settings.
  # The reviewer reads the Replacement report (job summary above) before approving.
  # ===========================================================================
  execute-change-set-staging:
    needs: create-change-set-staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      CHANGESET_NAME: ${{ needs.create-change-set-staging.outputs.changeset_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: src/backend
        run: uv sync

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_EXECUTE_ROLE || secrets.AWS_ROLE }}
          role-session-name: execute-cs-staging-${{ github.sha }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute approved change set
        working-directory: src/backend
        run: |
          make execute-changeset \
            STACK_NAME="${{ env.STACK_NAME }}" \
            CHANGESET_NAME="${{ env.CHANGESET_NAME }}" \
            AWS_REGION="${{ env.AWS_REGION }}"

      - name: Wait for Stack Stability
        run: |
          echo "Waiting for CloudFormation stack to stabilize..."
          aws cloudformation wait stack-create-complete \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws cloudformation wait stack-update-complete \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} 2>/dev/null || true

      - name: Wait for API Availability
        run: |
          .github/scripts/wait-for-api.sh "${{ env.AWS_REGION }}" "${{ env.STACK_NAME }}"

      - name: Smoke test
        working-directory: src/backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTO_SET_LAMBDA_ENV: '1'
          AWS_REGION: us-east-1
        run: |
          echo "=== IAM PROPAGATION WAIT (15s) ==="
          sleep 15
          export PATH="${PWD}/.venv/bin:${PATH}"
          bash tests/aws_cli_smoke.sh staging
