name: Security Audit
on: [pull_request, push]

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v4
      - name: Audit Python dependencies
        run: |
          cd src/backend
          uvx --python 3.13 pip-audit -r lambda_requirements.txt

  node-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit Node dependencies
        run: npm audit --omit=dev --audit-level=high

  iac-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Prepare Lambda asset placeholders for synth
        run: |
          mkdir -p src/backend/.build/lambdas
          touch src/backend/.build/lambdas/.placeholder
      - name: Synthesize CDK
        run: cd infra && npx cdk synth > /tmp/cdk-synth.log
      - name: Run Checkov
        run: |
          uvx checkov -d infra/cdk.out --framework cloudformation --quiet \
            --check CKV_AWS_7 \
            --check CKV_AWS_19 \
            --check CKV_AWS_20 \
            --check CKV_AWS_33 \
            --check CKV_AWS_53 \
            --check CKV_AWS_54 \
            --check CKV_AWS_55 \
            --check CKV_AWS_56 \
            --check CKV_AWS_364

  code-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Run Bandit
        run: |
          cd src/backend
          uvx bandit -r careervp/ -ll

  auth-enforcement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for auth bypasses
        run: |
          ! rg -n "AUTHORIZER_DISABLED" src/backend/careervp/handlers --glob '*.py'
          ! rg -n "params\\.get\\('user_id'\\)|queryStringParameters.*user_id|_coerce_str\\(payload\\.get\\('user_id'\\)\\)" src/backend/careervp/handlers --glob '*.py'
          ! rg -n "log_event.*True" src/backend/careervp/handlers --glob '*.py'
          ! rg -n "Access-Control-Allow-Origin.*\*" src/backend/careervp/handlers --glob '*.py'
