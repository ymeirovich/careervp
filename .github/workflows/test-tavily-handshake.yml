name: Tavily Integration Tests

on:
  push:
    branches:
      - main
    paths:
      - 'src/backend/careervp/logic/utils/tavily_client.py'
      - 'src/backend/careervp/logic/utils/web_search.py'
      - 'src/backend/careervp/logic/company_research.py'
      - 'src/backend/tests/unit/test_tavily_client.py'
      - '.github/workflows/test-tavily-handshake.yml'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PYTHON_VERSION: '3.13'
  AWS_REGION: 'us-east-1'

jobs:
  tavily-handshake-test:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install dependencies
        working-directory: src/backend
        run: |
          uv sync
          source .venv/bin/activate
          uv pip install -e .
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: tavily-test-${{ github.sha }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Ensure Tavily SSM Parameter exists
        env:
          TAVILY_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          if [ -n "$TAVILY_KEY" ]; then
            aws ssm put-parameter \
              --name "/careervp/dev/tavily-api-key" \
              --value "$TAVILY_KEY" \
              --type SecureString \
              --overwrite
          else
            echo "::warning::TAVILY_API_KEY secret not set."
          fi
      - name: Run Tavily client unit tests
        working-directory: src/backend
        run: |
          source .venv/bin/activate
          uv run pytest tests/unit/test_tavily_client.py -v --tb=short
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      - name: Report results
        if: always()
        run: |
          echo "## Tavily Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Tavily client tests: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
