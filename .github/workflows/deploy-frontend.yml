name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "src/frontend/**"
      - "amplify.yml"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-amplify-build:
    name: Validate Amplify frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/frontend

    env:
      CI: "true"
      NEXT_PUBLIC_API_URL: ${{ secrets.API_URL || 'https://api.dev.careervp.com' }}
      NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID || 'us-east-1_WiHMRqLpe' }}
      NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID || '7blipbarsisbctqh6hlsj46sqa' }}
      NEXT_PUBLIC_COGNITO_APP_CLIENT_ID: ${{ secrets.COGNITO_APP_CLIENT_ID || secrets.COGNITO_CLIENT_ID || '7blipbarsisbctqh6hlsj46sqa' }}
      NEXT_PUBLIC_COGNITO_DOMAIN: ${{ secrets.COGNITO_DOMAIN || 'https://careervp-dev.auth.us-east-1.amazoncognito.com' }}
      NEXT_PUBLIC_COGNITO_REDIRECT_URI: ${{ secrets.COGNITO_REDIRECT_URI || 'https://dev.careervp.com/callback' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit -- --passWithNoTests

      - name: Integration tests
        run: npm run test:integration -- --passWithNoTests

      - name: Build Next.js SSR bundle for Amplify
        run: npm run build
