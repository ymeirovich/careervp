name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "src/frontend/**"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Deploy to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: cd src/frontend && npm ci

      - name: Type check
        run: cd src/frontend && npm run typecheck

      - name: Unit tests
        run: cd src/frontend && npm test -- --passWithNoTests

      - name: Build Next.js static export
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.API_URL }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
        run: cd src/frontend && npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync static assets to S3 (immutable cache)
        run: |
          aws s3 sync src/frontend/out/ s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.json"

      - name: Sync HTML/JSON to S3 (no-cache)
        run: |
          aws s3 sync src/frontend/out/ s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --cache-control "no-cache" \
            --include "*.html" \
            --include "*.json"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  rollback:
    name: Rollback on failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()

    steps:
      - name: Configure AWS credentials
        id: configure_aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Skip rollback when AWS credentials are unavailable
        if: steps.configure_aws.outcome != 'success'
        run: echo "::warning::Skipping rollback tracking because AWS deploy role is not configured."

      - name: Tag deployment for rollback tracking
        if: steps.configure_aws.outcome == 'success'
        run: |
          echo "Deploy failed at $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            >> /tmp/deploy-failure.log
          echo "Previous S3 versions are retained via bucket versioning."
          echo "To restore: copy the previous version of each object back."
