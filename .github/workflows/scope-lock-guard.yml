name: Scope-Lock Guard

# P-28 Sub-clause E — contract self-protection (§0.3).
# Rejects any diff to project-scope-lock.md / .yaml that lacks twin-sync, a version bump,
# a §12 change-log row, and a human-signed `Scope-Lock-Approved-By:` trailer. A diff that
# touches neither twin is a no-op pass.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  scope-lock-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Determine base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Check scope-lock integrity
        run: |
          python scripts/ci/check_scope_lock_integrity.py --base "${{ steps.base.outputs.ref }}"
