name: Deploy VPR Async Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'src/backend/careervp/handlers/vpr_*'
      - 'src/backend/careervp/logic/vpr_*'
      - 'src/backend/careervp/logic/prompts/vpr_*'
      - 'src/backend/careervp/models/vpr.py'
      - 'src/backend/careervp/dal/jobs_repository.py'
      - 'src/backend/tests/unit/test_vpr_*'
      - 'src/backend/tests/integration/test_*vpr*'
      - 'src/backend/tests/e2e/test_vpr_*'
      - '.github/workflows/deploy-vpr-async.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'src/backend/careervp/handlers/vpr_*'
      - 'src/backend/careervp/logic/vpr_*'
      - 'src/backend/careervp/logic/prompts/vpr_*'
      - 'src/backend/careervp/models/vpr.py'
      - 'src/backend/careervp/dal/jobs_repository.py'
      - 'src/backend/tests/unit/test_vpr_*'
      - 'src/backend/tests/integration/test_*vpr*'
      - 'src/backend/tests/e2e/test_vpr_*'
      - '.github/workflows/deploy-vpr-async.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for OIDC
  pull-requests: write

# P-28 Sub-clause B: one deploy slot, never cancelled mid-flight — a second push
# must queue, not abort a CloudFormation update already in progress.
concurrency:
  group: deploy-vpr-async
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '20'
  AWS_REGION: us-east-1
  ENVIRONMENT: dev

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.0"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install dependencies
        working-directory: src/backend
        run: uv sync --frozen

      - name: Run ruff check
        working-directory: src/backend
        run: |
          uv run ruff check \
            careervp/handlers/vpr_status_handler.py \
            careervp/handlers/vpr_worker_handler.py \
            careervp/logic/vpr_generator.py \
            careervp/models/vpr.py \
            careervp/dal/jobs_repository.py \
            tests/unit/test_vpr_* \
            tests/integration/test_*vpr*

      - name: Run mypy
        working-directory: src/backend
        run: |
          uv run mypy \
            careervp/handlers/vpr_status_handler.py \
            careervp/handlers/vpr_worker_handler.py \
            careervp/logic/vpr_generator.py \
            careervp/models/vpr.py \
            careervp/dal/jobs_repository.py \
            --strict

      - name: Run unit tests
        working-directory: src/backend
        run: uv run pytest tests/unit/test_vpr_* -v

      - name: Run integration tests
        working-directory: src/backend
        run: uv run pytest tests/integration/test_*vpr* -v

  cdk-synth:
    needs: lint-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.0"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Build Lambda code
        working-directory: src/backend
        run: make build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: vpr-async-synth-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Synth
        working-directory: infra
        run: npx cdk synth --all

      - name: Upload CloudFormation templates
        uses: actions/upload-artifact@v4
        with:
          name: cdk-templates
          path: infra/cdk.out/
          retention-days: 7

  # ===========================================================================
  # P-28 Sub-clause C — Job 1: automation, CreateChangeSet ONLY (no execute).
  # Was `npx cdk deploy --all --require-approval never` — a full auto-execute
  # deploy with no human gate, targeting stacks by `--all` (resolved here to
  # the two real stacks for ENVIRONMENT=dev, confirmed via `cdk list`:
  # CareerVpCrudDev and CareerVpFrontend-Dev — "CareerVpVprAsyncDev", referenced
  # by the changeset-cleanup/stability-wait steps below, is not a real stack in
  # the current app and never was matched by anything `cdk list` returns; those
  # steps have been no-ops for a while).
  # ===========================================================================
  create-change-set-vpr-async:
    needs: cdk-synth
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changeset_name: ${{ steps.create.outputs.changeset_name }}
    env:
      CHANGESET_NAME: cs-vpr-async-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Download synth artifacts
        uses: actions/download-artifact@v4
        with:
          name: cdk-templates
          path: infra/cdk.out/

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.0"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Build Lambda code
        working-directory: src/backend
        run: make build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: vpr-async-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure JWT SSM Parameters exist
        env:
          JWT_PRIVATE_KEY_SECRET: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY_SECRET: ${{ secrets.JWT_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          ensure_string_parameter() {
            local param_name="$1"
            local param_value="$2"
            local existing_type
            existing_type="$(aws ssm get-parameter --name "$param_name" --query 'Parameter.Type' --output text 2>/dev/null || echo 'MISSING')"
            if [ "$existing_type" != "MISSING" ] && [ "$existing_type" != "String" ]; then
              echo "::warning::Recreating $param_name as String for CloudFormation compatibility (was $existing_type)."
              aws ssm delete-parameter --name "$param_name"
            fi
            aws ssm put-parameter \
              --name "$param_name" \
              --value "$param_value" \
              --type String \
              --overwrite
          }
          JWT_PRIVATE_KEY="${JWT_PRIVATE_KEY_SECRET:-}"
          JWT_PUBLIC_KEY="${JWT_PUBLIC_KEY_SECRET:-}"
          if [ -z "$JWT_PRIVATE_KEY" ] || [ -z "$JWT_PUBLIC_KEY" ]; then
            TMP_DIR="$(mktemp -d)"
            openssl genrsa -out "$TMP_DIR/jwt-private.pem" 2048 >/dev/null 2>&1
            openssl rsa -in "$TMP_DIR/jwt-private.pem" -pubout -out "$TMP_DIR/jwt-public.pem" >/dev/null 2>&1
            JWT_PRIVATE_KEY="$(cat "$TMP_DIR/jwt-private.pem")"
            JWT_PUBLIC_KEY="$(cat "$TMP_DIR/jwt-public.pem")"
            echo "::warning::JWT_PRIVATE_KEY/JWT_PUBLIC_KEY secrets not set. Generated ephemeral dev keys for VPR async deploy."
          fi
          ensure_string_parameter "/careervp/dev/jwt-private-key" "$JWT_PRIVATE_KEY"
          ensure_string_parameter "/careervp/dev/jwt-public-key" "$JWT_PUBLIC_KEY"

      - name: CFN State Guard (both real stacks)
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/cfn-guard.sh" "CareerVpCrudDev" "${{ env.AWS_REGION }}"
          "$GITHUB_WORKSPACE/.github/scripts/cfn-guard.sh" "CareerVpFrontend-Dev" "${{ env.AWS_REGION }}"

      - name: Create change sets (NO execute)
        id: create
        working-directory: infra
        run: |
          set -o pipefail
          npx cdk deploy CareerVpCrudDev CareerVpFrontend-Dev \
            --require-approval never --method=change-set --no-execute \
            --change-set-name "${{ env.CHANGESET_NAME }}"
          echo "changeset_name=${{ env.CHANGESET_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Generate Replacement reports (auto-fail on protected replacement)
        run: |
          for stack in CareerVpCrudDev CareerVpFrontend-Dev; do
            echo "=== DescribeChangeSet Replacement report: $stack (P-28 approval artifact) ==="
            aws cloudformation describe-change-set \
              --stack-name "$stack" \
              --change-set-name "${{ env.CHANGESET_NAME }}" \
              --region "${{ env.AWS_REGION }}" \
              --output json > "/tmp/changeset-$stack.json"
            # Exits 1 (fails the job) if any RestApi/Table/Bucket/UserPool has Replacement:True,
            # so the human-gated execute-change-set job never runs.
            python3 scripts/ci/changeset_replacement_report.py --changeset "/tmp/changeset-$stack.json" --summary
          done

  # ===========================================================================
  # P-28 Sub-clause C — Job 2: HUMAN-GATED execute.
  # Reuses the same `deploy-dev` GitHub environment as .github/workflows/deploy.yml
  # (both target CareerVpCrudDev; one reviewer/gate configuration covers both).
  # `environment: deploy-dev` must have a REQUIRED REVIEWER in GitHub settings.
  # ===========================================================================
  execute-change-set-vpr-async:
    needs: create-change-set-vpr-async
    runs-on: ubuntu-latest
    environment: deploy-dev
    outputs:
      api_url: ${{ steps.stack-outputs.outputs.api_url }}
      queue_url: ${{ steps.stack-outputs.outputs.queue_url }}
      table_name: ${{ steps.stack-outputs.outputs.table_name }}
    env:
      CHANGESET_NAME: ${{ needs.create-change-set-vpr-async.outputs.changeset_name }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_EXECUTE_ROLE || secrets.AWS_ROLE }}
          role-session-name: execute-vpr-async-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute approved change sets
        run: |
          for stack in CareerVpCrudDev CareerVpFrontend-Dev; do
            echo "=== Executing change set on $stack ==="
            aws cloudformation execute-change-set \
              --stack-name "$stack" \
              --change-set-name "${{ env.CHANGESET_NAME }}" \
              --region "${{ env.AWS_REGION }}"
          done

      - name: Wait for Stack Stability
        run: |
          for stack in CareerVpCrudDev CareerVpFrontend-Dev; do
            echo "Waiting for $stack to stabilize..."
            aws cloudformation wait stack-update-complete --stack-name "$stack" --region "${{ env.AWS_REGION }}" 2>/dev/null || \
            aws cloudformation wait stack-create-complete --stack-name "$stack" --region "${{ env.AWS_REGION }}" 2>/dev/null || true
          done

      - name: Extract stack outputs
        id: stack-outputs
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name CareerVpCrudDev \
            --region "${{ env.AWS_REGION }}" \
            --query "Stacks[0].Outputs" \
            --output json 2>/dev/null || echo "[]")

          API_URL=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="VPRApiUrl" or .OutputKey=="ApiUrl" or .OutputKey=="Apigateway") | .OutputValue' | head -n1)
          QUEUE_URL=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="VPRJobsQueueUrl" or .OutputKey=="JobsQueueUrl") | .OutputValue' | head -n1)
          TABLE_NAME=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="JobsTableOutput" or .OutputKey=="TableName") | .OutputValue' | head -n1)

          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "queue_url=$QUEUE_URL" >> $GITHUB_OUTPUT
          echo "table_name=$TABLE_NAME" >> $GITHUB_OUTPUT

          echo "Stack Outputs:"
          echo "  API URL: $API_URL"
          echo "  Queue URL: $QUEUE_URL"
          echo "  Table Name: $TABLE_NAME"

          cat > cdk-outputs.json <<EOF
          {"CareerVpCrudDev": $OUTPUTS}
          EOF

      - name: Upload stack outputs
        uses: actions/upload-artifact@v4
        with:
          name: stack-outputs
          path: cdk-outputs.json
          retention-days: 7

  e2e-test:
    needs: execute-change-set-vpr-async
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.0"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install test dependencies
        working-directory: src/backend
        run: uv sync --frozen

      - name: Download stack outputs
        uses: actions/download-artifact@v4
        with:
          name: stack-outputs
          path: ./

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: vpr-async-e2e-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run E2E tests
        working-directory: src/backend
        env:
          API_BASE_URL: ${{ needs.execute-change-set-vpr-async.outputs.api_url }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          # Check if stack outputs exist
          if [ ! -f "../../cdk-outputs.json" ]; then
            echo "Warning: Stack outputs not available, skipping E2E tests"
            exit 0
          fi

          # Check if E2E test file exists
          if [ ! -f "tests/e2e/test_vpr_async_polling.py" ]; then
            echo "Warning: tests/e2e/test_vpr_async_polling.py not found, skipping E2E tests"
            exit 0
          fi

          echo "Stack outputs available for E2E tests"
          uv run pytest tests/e2e/test_vpr_async_polling.py -v

  dry-run:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.0"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Build Lambda code
        working-directory: src/backend
        run: make build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: vpr-async-dryrun-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Diff (Dry Run)
        working-directory: infra
        run: npx cdk diff --all

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### VPR Async Stack CDK Diff 📊

            **Push Event:** \`${{ github.event_name }}\`
            **Workflow:** \`${{ github.workflow }}\`
            **Stacks:** \`CareerVpCrudDev\`, \`CareerVpFrontend-Dev\`

            Check the workflow logs for detailed CDK diff output.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
