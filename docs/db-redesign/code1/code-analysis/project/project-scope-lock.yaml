    wave_1_security: [P-04, P-05, P-06, P-07, P-08, P-09, P-10, P-11, P-22]
    wave_2_reliability_money: [P-14, P-15, P-16, P-17, P-18, P-19, P-20, P-23, P-02, P-25]
    wave_3_db_seams: [D-H2, D-H3, D-H4, D-H7, D-M1, D-M2, D-M3, D-M5, D-M6, D-Q, P-01]
    wave_4_quality: [Q-01, Q-02, Q-03, Q-04, Q-05, Q-07, Q-08, Q-09, F-02, F-03, F-04, F-05, F-06]
    wave_5_cost_obs_tier2: [cmk, field_pii, dsar_export_delete, log_retention, alarms, tagging, low_effort_high_value_picks, F-07, T-05]
    wave_6_committed_gated: [D-H8, D-H6, Q-06]
  freeze_line:
    include: [all_track_P_T1, all_T2, low_effort_high_value_picks]
    criteria_for_extra_picks: [cost_down, perf_up, security_up, durability_reliability_up]
    post_launch: [wave_6_full_core_collapse, Q-06_kb_vectors]
  certification:   # DoD to stand up prod
    - all_freeze_line_closed
    - all_NFRs_met
    - test_suite_green_with_real_key_schema_coverage
    - branch_coverage_enabled_autouse_mock_retired
    - executable_oracle_green
    - cdk_diff_zero_stateful_replacement

quality_gates:
  coverage:
    core_generation_orchestration: {line: 85, branch: 80}
    supporting: {line: 78, branch: 70}
    glue: {line: 60, branch: null, note: "or excluded"}
    llm_output: evals_not_coverage
    ci_gate_overall: {line: 80, branch: 70}
    preconditions: [enable_branch_coverage, retire_autouse_mock, mutmut_spotcheck_core]
  ci_gates: [ruff, "mypy --strict", pytest, "cdk synth", "resource_count<400", Checkov, Bandit, pip-audit, CodeQL, executable_oracle, "cdk diff zero-stateful-replacement"]
  test_types: [unit, contract, characterization, integration_real_services, iac_cdk, idempotency_replay, migration_parity, llm_eval, load_perf, security_sast, smoke_canary]
  llm_eval: {tool: promptfoo, dataset: versioned_golden, judge: llm_as_judge_temp0, guardrail: fvs_gate, redteam: owasp_llm_top10}
  spec_completeness: "every endpoint+async behavior has a spec row; every FR maps to >=1 row & vice-versa; frontend contract items are acceptance criteria; spec-complete only when acceptance = executable test"

guardrails:
  on_document: [immutable_amendment_only, single_authority_hierarchy, one_canonical_id_per_clause, tag_immutable_target_open, current_state_ne_target, commit_anchored, live_truth_supersedes]
  on_work: [frontend_contract_cannot_break_or_version_route, expand_dualwrite_backfill_dualread_contract, no_live_pk_sk_change_in_one_deploy, retain_backup_before_risky, one_reversible_flag_gated_change, cdk_diff_zero_stateful_replacement, ci_lt_400_resources, props_not_importvalue, tests_real_key_schemas_moto, never_weaken_test, branch_coverage_on, characterization_before_migration_change, env_scoped_iam_one_role_per_fn_no_wildcard, no_secrets_in_env, server_side_quota, adversarial_review_for_auth_iam_data_diffs, serialize_steps_touching_same_cfn_template_file]
  pr_block_list: [rename_remove_live_table_gsi_bucket_or_pk_sk_change_one_deploy, read_switched_to_core_before_backfill_reconcile, bigbang_cutover_no_canary_flag_rollback, removal_policy_DESTROY_reintroduced, unthrottled_migration_vs_live_capacity, resources_added_to_stack_over_400, iam_scoped_across_environments_no_env_suffix, parallel_edits_to_one_cfn_template_file, spec_edited_to_match_code_without_amendment, contract_amended_retroactively_to_rubberstamp_built_code, test_weakened_to_pass]

amendment_protocol:   # how the contract changes mid-implementation (see MD §0.3)
  principle: "immutable to DRIFT (silent/unversioned), not to LEARNING; unrecorded change is the defect. Contract changes at the speed of DECISIONS, not code."
  semver:
    patch: "clarification / typo / current_state refresh; no scope change"
    minor: "add a clause; refine a TARGET; resolve an OPEN"
    major: "change an IMMUTABLE invariant/locked-decision; drop a feature; break a frontend-contract item"
  deviation_loop:   # a step's subagent cannot satisfy a clause as written, or live truth contradicts current_state
    - stop_at_clause_never_silently_deviate
    - emit_amendment_proposal   # {clause_id, tag, what_changed, why_evidence_cite, semver_level, affected_specs_tests}
    - human_validates_and_confirms   # required; no auto-apply
    - update_both_twins_same_commit_plus_changelog_plus_version_bump
    - propagate_to_dependent_specs_tests_then_scope_diff_recheck
  adversarial_review_required_for: [immutable_invariant, locked_decision, frontend_contract_item]

spec_test_acceptance:   # validating the specs/tests themselves (see test-strategy.md §8)
  - structural_scope_diff_clean   # frontmatter present, clause exists, no orphan spec, no uncovered clause
  - contract_consistency          # AC-### not contradicting clause; contract_impact -> carries FE-contract slice
  - self_sufficiency_fresh_subagent_no_questions
  - adversarial_refuter_for_auth_iam_data
  - test_validity_red_green_plus_mutmut_plus_characterization_at_anchor
  - traceability_roundtrip_fr_to_spec_to_test_to_clause_both_directions

open_questions:   # resolve before dependent spec; never guess
  - {id: O-1, q: "full core collapse (D-H8) go/no-go metric threshold", blocks: [D-H8]}
  - {id: O-2, q: "CR cache-key granularity: company-only vs company+role", blocks: [Q-01, Q-04]}
  - {id: O-3, q: "cutover/downtime tolerance + retention window (fresh recon/product)", blocks: [wave_3, wave_6]}
  - {id: O-4, q: "social-IdP account-linking policy (link-by-verified-email; takeover safeguards)", blocks: [P-24], status: RESOLVED, resolved: "2026-07-09", decision: "auto-link only when email_verified=true AND email matches; else step-up confirmation; conflicts->earliest user_id; audit-log all links"}
  - {id: O-5, q: "jobs/applications fold into core or keep focused tables", blocks: [D-H8]}
  - {id: O-6, q: "KB Phase-2 embedding model + dimension + min-cosine reuse threshold", blocks: [Q-06]}

traceability:
  diff_protocol: "for each backlog[].id map implemented specs/tests -> id -> impl_state; partial shows as partial; a spec/test with no id, or a clause a spec contradicts, is a drift defect"
  verification_sources: [recon.py, "cdk synth/diff", executable_oracle, ci_gate_results]
  never: self_report

