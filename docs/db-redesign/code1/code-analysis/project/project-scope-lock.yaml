  - {version: 1.3.0, date: "2026-07-09", change: "MINOR amendment (human-decided, option B). RETIRED the never-built TEST-###-test-prompts.yaml claim (no working example existed anywhere; contradicted the one real exemplar). New rule, matching the proven Q-gap exemplar: RED-test descriptions (name + exact assertions) live inline in the spec's Markdown body under a 'RED tests to write first' section; the actual pytest files are written during the IMPLEMENT step, under TDD, in the real careervp repo -- never authored as a standalone artifact in this docs project. Updated §8.5 (scope-lock), execution-plan spec/test authoring rules + step-type definitions, test-strategy.md §7, handoff.md. Also recorded: spec-authoring (step 0.4) fan-out runs via the Workflow tool (human opt-in confirmed) so each clause's spec gets its own {model,effort} per the tooling table, not just model-only via a plain Agent-tool fan-out. No IMMUTABLE clause changed; no launch-blocker re-tiered."}
