constraints:   # IMMUTABLE physics
  - {id: C-1, text: "scale ceiling < 10k concurrent"}
  - {id: C-2, text: "> 70% profit margin; LLM tokens are the lever"}
  - {id: C-3, text: "solo maintainer; no big-bang; reversible steps"}
  - {id: C-4, text: "DynamoDB kept (closed)"}
  - {id: C-5, text: "no GDPR gold-plating; lightweight DSAR only"}
  - {id: C-6, text: "backend + API contract only; frontend out except contract changes"}
  - {id: C-7, text: "no prod exists; all work targets dev until certified (see path.certification)"}
  - {id: C-8, text: "shared personal AWS account; {env}-scoped everything"}

locked_decisions:   # IMMUTABLE
  - {id: L-1, text: "tenant key = internal surrogate user_id; resolve Cognito sub(s)->user_id at edge (supersedes 'sub' directly)"}
  - {id: L-2, text: "Cognito-only auth; identity only from validated JWT; social IdP (Google/Facebook) via account-link by verified email"}
  - {id: L-3, text: "single-table core = STAGED-COMMITTED: seams first, full collapse committed later wave w/ go-no-go gate"}
  - {id: L-4, text: "billing live = launch-critical"}
  - {id: L-5, text: "Company Research runs FIRST on submit, then gap; reused by all downstream; chain reordered CR->gap->vpr->{cv,cover,interview}"}
  - {id: L-6, text: "Gap Analysis -> Sonnet (Strategic), gated on real-CV + CR input fixes first"}
  - {id: L-7, text: "priorities T1/T2/T3; effort Lo/Md/Hi"}

frontend_contract:   # IMMUTABLE; oracle = src/frontend/ code, not swagger
  oracle_rule: "authoritative contract = src/frontend/ calls + CDK route_map + handlers; NOT any OpenAPI/swagger"
  items:
    - {n: 1, rule: "application_id == job_id"}
    - {n: 2, rule: "artifact_id round-trips; hub artifact_id resolvable by status endpoint"}
    - {n: 3, rule: "vpr_id = VPR hub artifact_id; CV-tailoring sends vpr_id:null (never omitted); null-vs-absent load-bearing"}
    - {n: 4, rule: "status enum string-compared/unversioned; changes additive only", values: [pending, processing, completed, failed, cancelled, expired, not_generated, edited]}
    - {n: 5, rule: "PATCH echoes result.*+version+updated_at; HTTP 409 on stale base_version"}
    - {n: 6, rule: "request_id primacy (request_id ?? job_id)"}
    - {n: 7, rule: "nested result trees preserved (VPR/CV/IP/CL)"}
    - {n: 8, rule: "presigned download_url + status:'expired'"}
    - {n: 9, rule: "shape polymorphism tolerated, must not worsen"}
    - {n: 10, rule: "error envelope {error|message, classification, error_code, field}; 401 -> one refresh-retry then sign-out"}
  known_live_violations: [F-02, F-03, F-04, F-05]

invariants:   # IMMUTABLE architectural
  - identity_only_from_jwt_to_user_id_surrogate
  - dal_enforces_tenant_partition_key_no_idor
  - single_key_authority_repository_sole_key_builder
  - no_env_var_table_precedence_routing
  - one_typed_home_one_stored_key_per_artifact
  - large_bodies_in_s3_with_pointer_store_rich_project_lean
  - shared_data_never_in_core   # CR cache, llm cache, idempotency = separate tables
  - one_iam_role_per_fn_arn_scoped_env_suffixed_no_wildcard
  - sqs_batchItemFailures_visibility_ge_6x_maxconc_dlq_alarm
  - stateful_RETAIN_deletion_protection_no_live_pk_sk_change_max_400_cfn
  - vectors_derived_rebuildable_tenant_filtered_never_source_of_record

