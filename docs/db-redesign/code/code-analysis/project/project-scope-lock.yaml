e line: all T1 any track + all T2 + picks (dropped stale P-01..P-24). A13 L-6/§6.3: Gap->Sonnet keeps approval + post-Q-10 measured-margin check + TaskMode->Haiku revert lever. A14 D-H4/D-M2/D-M5 verification: migration-parity; harness homed in D-H2. Added O-7 (CR timeout N + latency budget) + O-8 (prod-promotion mechanics, needs human account-structure input). Backlog 74->76 (P-25b, D-H9). Adversarial refutation strengthened A1 (P-27 policy lift for retire; CDK export-lock reality; rebuild/C-6 honesty; cert/Route53 SPOF), A4 (correct revert lever per artifact; resolver-failure metric not aggregate-401; event-coverage soak), A5 (verify-before-remove COGNITO_ADMIN; dual-flow window; MFA optional->enforced), A8 (degraded gap->Haiku; concrete N; named status field), A13 (binding no-Sonnet-before-Q-10-metering). No IMMUTABLE invariant reversed, no locked decision reversed (L-5/L-6 refined not reversed). A8 ruled MAJOR by the human 2026-07-11 (L-5 completion guarantee intentionally relaxed to soft-blocking = the locked-decision change making this v2.0.0). No frontend-contract item broken."}
