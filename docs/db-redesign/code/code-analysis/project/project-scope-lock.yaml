  - {id: O-2, q: "CR cache-key granularity: company-only vs company+role", blocks: [Q-01, Q-04], status: RESOLVED, resolved: "2026-07-11", decision: "company-only -- CR is company-level research so this maximizes cross-user reuse (best for C-2); role-specificity injected downstream at the consumer/digest layer (gap/VPR prompts already carry the JD role/seniority), no relevance lost"}
  - {id: O-3, q: "cutover/downtime tolerance + retention window (fresh recon/product)", blocks: [wave_3, wave_6]}
  - {id: O-4, q: "social-IdP account-linking policy (link-by-verified-email; takeover safeguards)", blocks: [P-24], status: RESOLVED, resolved: "2026-07-09", decision: "auto-link only when email_verified=true AND email matches; else step-up confirmation; conflicts->earliest user_id; audit-log all links"}
  - {id: O-5, q: "jobs/applications fold into core or keep focused tables", blocks: [D-H8]}
  - {id: O-6, q: "KB Phase-2 embedding model + dimension + min-cosine reuse threshold", blocks: [Q-06]}
  - {id: O-7, q: "CR-first degraded-fallback timeout N + submit->gap-questions latency budget", blocks: [Q-01], status: RESOLVED, resolved: "2026-07-11", decision: "N=180s (matches SFN heartbeat); latency budget = async 'come back later' UX -- users are told artifacts take time and to return later (optional completion-email later), so NO tight interactive submit->questions latency NFR; the CR-first added latency is acceptable by design. Retires the council 'interactive-latency budget unstated' blind spot -- the flow is intentionally asynchronous"}
  - {id: O-8, q: "prod-promotion mechanics", blocks: [prod_stand_up], status: RESOLVED, resolved: "2026-07-11", decision: "single account 788159322332, env isolation by suffix -dev -> -stage -> -prod (consistent with C-8, no separate-account boundary). (a) credential isolation = {env}-scoped IAM: P-28 prod deploy role scoped to -prod ARNs ONLY, cannot touch -dev/-stage. (b) prod backups ENABLED (PITR all prod tables + P-29 evidence pack applied to -prod). (c) -stage is a FULL proving ground -- app fully working at -stage running real logical use-case workflows before prod promotion (dev-cert -> promote stage -> verify workflows -> promote prod). (d) prod-cert = §7.4 checklist re-run against the -prod stack (same gate, promoted suffix, no new mechanics). -> a short prod-promotion track is now scopeable, author post-dev-certification"}
  - {id: O-9, q: "frontend-CI deploy pipeline broken (Deploy Frontend workflow failing every run since 2026-05-03) + api.dev.careervp.com has NO DNS record (custom domain dead, LM-1)", blocks: [P-26], status: RESOLVED, resolved: "2026-07-12", resolution: "v2.3.0/A16, step 0.64b. BOTH halves closed. (1) DNS/cert/domain: ACM cert + REGIONAL DomainName + BasePathMapping live in CDK (infra/careervp/api_construct.py:262-286); api.dev.careervp.com resolves (-> d-ufdp03t4f1.execute-api.us-east-1.amazonaws.com) via the manual grey-cloud Cloudflare CNAME; LM-1 is dead. (2) Frontend CI: root cause of every failure since 2026-05-03 was NOT a flaky build -- the old workflow used OIDC (id-token:write + configure-aws-credentials) to sync a static export to S3/CloudFront, but no OIDC role was ever wired up, so it died at 'Credentials could not be loaded'. That deploy path was wrong anyway: the real frontend deploy is Amplify SSR via its own branch webhook. Commit 3d28d7d replaced it with a build-validation gate (typecheck + unit + integration + next build, no AWS creds). PROVEN GREEN IN CI: run 29190660902 (workflow_dispatch, ref db-redesign, 2026-07-12) -- the fix had never actually executed until this run. NEXT_PUBLIC_API_URL repointed to the custom domain and Amplify redeployed green. (3) P-30 4-wire smoke vs the CUSTOM DOMAIN: all four green (health 200; CORS exact-origin echoed, not wildcard; authed 200 + unauth 401; authed upload cv_id=df6ee0e6 uploaded and read back) -- see the wire-4 correction in P-30. P-26's Amplify rebuild+repoint is therefore UNBLOCKED. CAVEAT (ISSUES.md I-03): the workflow is named 'Deploy Frontend' but does not deploy -- it validates the build; Amplify deploys itself. Do not read its green check as 'the frontend shipped'. stage/prod certs still not requested -- identical procedure per env (O-8).", note: "surfaced by 2026-07-11 recon; blocks P-26's Amplify rebuild+repoint (blue/green needs a working NEXT_PUBLIC_API_URL redeploy). Live frontend must be on the raw execute-api URL. Fix the frontend pipeline BEFORE the P-26 domain cutover; wire the custom-domain DNS+base-path-mapping IN CDK not manually. DNS CONFIRMED 2026-07-11: careervp.com registered at NameCheap, DNS managed by Cloudflare (external to AWS) -> CDK CANNOT create DNS records, they are MANUAL Cloudflare steps. CLOSING O-9 (P-26 spec slice, {env}-scoped api.{env}.careervp.com, endpoint type REGIONAL): CDK owns (1) ACM cert api.{env}.careervp.com (us-east-1, DNS-validated); (2) AWS::ApiGateway::DomainName REGIONAL bound to cert; (3) AWS::ApiGateway::BasePathMapping -> RestApi+stage. MANUAL in Cloudflare (human, runbook 0.64b): (a) ACM validation CNAME, (b) CNAME api.{env} -> API-GW regional target domain, BOTH 'DNS only' (grey cloud NOT proxied -- orange-cloud proxy terminates TLS and breaks API-GW SNI/cert). Flow: request+validate ACM cert FIRST (add validation CNAME in Cloudflare, wait ISSUED), then reference cert ARN in CDK so the main deploy doesn't block on manual DNS. Then fix frontend CI + repoint NEXT_PUBLIC_API_URL. Downstream touch points: ONLY NEXT_PUBLIC_API_URL (frontend build-time); API CORS allow-list is about the FE origin (unaffected by the API's own hostname); Cognito OAuth callbacks are FE URLs (unaffected). The stable custom domain is what makes the P-26 blue/green base-path swap possible without re-touching the frontend. DEV CERT ISSUED 2026-07-11: arn:aws:acm:us-east-1:788159322332:certificate/d93bafb3-fe1a-4faa-9335-a9e868646bdb (api.dev.careervp.com), DNS validation confirmed. Remaining for dev: CDK DomainName(regional)+BasePathMapping referencing this ARN -> get regional target domain -> manual Cloudflare alias CNAME api.dev -> target (grey cloud) -> fix frontend CI -> repoint NEXT_PUBLIC_API_URL -> smoke. stage/prod certs not yet requested -- identical procedure per env (O-8)"}

traceability:
