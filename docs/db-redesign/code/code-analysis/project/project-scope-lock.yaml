amendment_protocol:   # how the contract changes mid-implementation (see MD §0.3)
  principle: "immutable to DRIFT (silent/unversioned), not to LEARNING; unrecorded change is the defect. Contract changes at the speed of DECISIONS, not code."
  semver:
    patch: "clarification / typo / current_state refresh; no scope change"
    minor: "add a clause; refine a TARGET; resolve an OPEN"
    major: "change an IMMUTABLE invariant/locked-decision; drop a feature; break a frontend-contract item"
  deviation_loop:   # a step's subagent cannot satisfy a clause as written, or live truth contradicts current_state
    - stop_at_clause_never_silently_deviate
    - emit_amendment_proposal   # {clause_id, tag, what_changed, why_evidence_cite, semver_level, affected_specs_tests}
    - human_validates_and_confirms   # required; no auto-apply
    - update_both_twins_same_commit_plus_changelog_plus_version_bump
    - propagate_to_dependent_specs_tests_then_scope_diff_recheck
  adversarial_review_required_for: [immutable_invariant, locked_decision, frontend_contract_item]
  contract_self_protection:   # v2.0.0/A3: mechanical, not disciplinary
    rule: "project-scope-lock.{md,yaml} are write-protected from agent/orchestrator sessions; an agent may PROPOSE an amendment but may not edit these files; amendments land only via a human-executed commit"
    ci_check: "reject any diff to either contract file lacking: a §12 change-log row + a Version bump + twin-sync (both files) + a human-signed approval trailer"
    rationale: "every downstream net (scope-diff.py, oracle, wave gates) audits code AGAINST this contract; a session silently editing the contract makes scope-diff.py enforce drift instead of preventing it -- silent total-loss of the requirements-cannot-rot guarantee"

spec_test_acceptance:   # validating the specs/tests themselves (see test-strategy.md §8)
  - structural_scope_diff_clean   # frontmatter present (single OR list-valued scope_lock_clause + tooling: map), clause exists, no orphan spec, no uncovered clause
  - contract_consistency          # AC-### not contradicting clause; contract_impact -> carries FE-contract slice
  - self_sufficiency_fresh_subagent_dry_run_returns_empty_questions   # v2.0.0/A7: operationalized -- fresh subagent returns an impl outline + explicit questions:[]; NON-EMPTY questions auto-rejects
  - adversarial_refuter_for_auth_iam_data
  - test_validity_split:   # v2.0.0/A7: pytest files don't exist at acceptance time, so split
      spec_time_lint: "every inline RED-test description names EXACT assertion values -- no 'or'/alternative assertions, no undefined constants (no '<digested CR>', no bare 'under the cap'); reject if ambiguous"
      implement_time_proof: "red-green recorded on the status board per step (fail pre / pass post) + characterization at 4f7c294 + traceability roundtrip; mutmut core spot-check MOVED to the Wave-3 gate (core tier written by then), not Wave 5"
  - traceability_roundtrip_fr_to_spec_to_test_to_clause_both_directions

spec_frontmatter_forms:   # v2.0.0/A7: both permitted; scope-diff.py must handle both
  single_clause: "scope_lock_clause: Q-02 + claude_code:{model,effort} + codex:{model,reasoning}"
