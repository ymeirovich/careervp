  - {version: 2.2.0, date: "2026-07-12", change: "MINOR (human-decided, by §0.3; refine a TARGET + record calibrated current_state). Coverage gates go two-phase after commit 80f60ca found the T-03 gates (core 85/80) were aspirational vs measured ~73%line/~55%branch on a fully-passing 1450-test suite (gap 12-25pt, too large to close in one session). quality_gates.coverage split into enforced_baseline (core 71/53, supporting 70/48, overall 70/51 -- calibrated to measured coverage minus ~2pts, the value check_coverage_gates.py enforces since 80f60ca) and ratchet_target (the unchanged 85/80/78/70/80/70 goal), plus a ratchet_plan naming the holes (cv_dal/cv_repository/cv_tailoring_dal at 0%; cover_letter/interview_prep/cv_tailoring handlers 63-73%). test_t03 updated to assert the enforced_baseline so enforcer==contract==guard again (was RED since 80f60ca lowered the enforcer without amending here). The 85/80 target is NOT weakened -- it is retained as the per-wave ratchet goal; gates never drop below enforced_baseline. This is LEARNING recorded, not drift rubber-stamped: the low coverage predates and is unhidden by this amendment. Also fixed check_scope_lock_integrity.py to count the real `change_log:` key (it only looked for `changelog:`, so it would have falsely rejected this and every amendment). No IMMUTABLE invariant reversed; no locked decision reversed; no frontend-contract item broken; no clause re-tiered (T-03 target refined, not dropped)."}
  - {version: 2.2.1, date: "2026-07-12", change: "PATCH (human-decided, by §0.3; console-only -> IaC ownership move, not a scope/tier change). P-32's Wave 0 budgets+cost-anomaly sub-slice (step 0.56) moves from console-only to CDK by explicit human decision -- specs/P-32-cost-obs-edge-spec.md Fix Plan item 4 names exactly this exception ('unless AWS ownership is moved into IaC by explicit decision'). Landed: budgets.CfnBudget ($100/mo, 80%-actual + 100%-forecasted notifications) + ce.CfnAnomalyMonitor/CfnAnomalySubscription ($10 absolute-impact threshold, IMMEDIATE frequency for SNS delivery) in infra/careervp/monitoring.py MonitoringNestedStack._build_cost_observability, both routed to the existing P-21 careervp-monitoring SNS topic (new budgets.amazonaws.com/costalerts.amazonaws.com publish grants added to that topic's resource policy in CrudMonitoring._build_topic). RED->GREEN via infra/tests/infrastructure/test_p32_budgets_cost_anomaly.py (4 tests); scope-diff.py now reports P-32 as test_written. cdk synth clean (no new cdk-nag findings beyond the pre-existing unrelated COG2 warning); cdk-diff/naming-validator clean. What remains human-only: a passing synth is not proof of a real deploy or that the account has these resources (same rule as P-27/P-28) -- runbooks/p32-budgets-cost-anomaly-runbook.md now documents the P-28 change-set deploy + post-deploy AWS CLI confirmation + evidence-JSON capture (validate_budget_evidence/validate_cost_anomaly_evidence in src/backend/scripts/deploy_evidence.py, unchanged validators, docstrings updated). P-32 remainder (tags/correlation-id/log-retention/validators) untouched, still Wave 5. No IMMUTABLE invariant reversed; no locked decision reversed; no frontend-contract item broken; no clause re-tiered."}
  - {version: 2.3.0, date: "2026-07-12", change: "MINOR (human-decided, by §0.3; resolve an open question + refine a TARGET clause to match reality). (A) O-9 RESOLVED -- both halves. The custom domain is live (ACM cert + REGIONAL DomainName + BasePathMapping in CDK; api.dev.careervp.com resolves via the manual grey-cloud Cloudflare CNAME; LM-1 dead), and the frontend CI pipeline is green FOR REAL: run 29190660902 (workflow_dispatch on db-redesign, 2026-07-12). The 3d28d7d fix had been committed but had NEVER executed in CI -- every failure since 2026-05-03 was the OLD workflow dying at 'Credentials could not be loaded' because it used OIDC creds (for an S3/CloudFront static-export sync) that were never wired up; the real deploy is Amplify SSR via its own webhook, so the S3 path was deleted rather than repaired. P-26's rebuild+repoint is UNBLOCKED. (B) P-30 wire 4 refined: 'presigned upload' -> 'authed upload'. The presigned-upload endpoint DOES NOT EXIST and never did -- all 58 deployed routes were enumerated, and the wire 404'd identically against the custom domain AND the raw execute-api URL (so it was never a domain fault). The real upload path is POST /users/me/cv (inline base64 cv_content; the handler owns the S3 put). Wire 4 now posts the CV and reads it back, proving its own write landed. The clause is NOT weakened -- it still proves the authenticated write path reaches S3, which is the point of a canary. All 4 wires now green against the custom domain. This is LEARNING recorded, not drift rubber-stamped: the wire was asserting against an imagined contract and would have gone on failing for a reason that had nothing to do with what it was gating. (C) Added ISSUES.md (docs/.../project/) as the holding pen for real-but-deferred findings, so they stop being absorbed silently by whatever step trips over them: I-01 no presigned upload => a ~4.5MB inline-base64 ceiling (a real scaling gap, but a FEATURE -- building it inside a canary clause would be the exact scope smuggling the contract exists to prevent); I-02 the upload wire costs an AI parse + a persisted CV row per run; I-03/I-04 'Deploy Frontend' validates but does not deploy, and is main-only; I-05 a PRE-EXISTING red unit test (ai_assist reports 0 tokens) that lands on Q-10 token metering -- confirmed pre-existing by stashing, and left red rather than silenced inside an unrelated step. No IMMUTABLE invariant reversed; no locked decision reversed; no frontend-contract item broken; P-30 refined to match reality, not dropped or re-tiered."}
  - {version: 2.4.0, date: "2026-07-12", change: "MINOR (human-decided, by 0.3; record a measured fact -- no clause re-tiered, no locked decision reversed, no IMMUTABLE invariant touched). Step 0.64/P-64: the from-scratch API/service-stack recreate RTO is now MEASURED = ~5min28s (328s CFN create, 449 resources; 386s deploy command incl. synth+asset publish). Run on an isolated service-only scratch stack (CareerVpCrudRtoEuw120260712A1, env rto-euw1-20260712-a1) in eu-west-1 as a HUMAN-ACCEPTED PROXY REGION -- explicitly NOT a us-east-1 DR proof. The pre-existing incremental redeploy figure (~7min, 2026-07-11) is PRESERVED UNCHANGED: they measure different things (incremental update vs from-scratch create), and P-26 blue/green needs the latter. P-30 passed all 4 wires against the raw invoke URL; teardown reconciled to zero across 15 service inventories, with 5 KMS keys PendingDeletion reported as scheduled residual rather than 'nothing remains'. Caveats recorded honestly: scratch omits the CV-bucket S3 notification, API-GW access logging/ApiGateway::Account, Budgets/Cost-Anomaly, custom domain, and FrontendStack, so the number UNDERSTATES a live recreate. Evidence: docs/evidence/p64-scratch-recreate-rto-20260712T205033Z.json + docs/evidence/smoke-20260712T203116Z-1134fd.json."}
