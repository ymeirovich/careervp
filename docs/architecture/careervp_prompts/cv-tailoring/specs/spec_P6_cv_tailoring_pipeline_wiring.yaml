      JobsRepository().get_job(job_id)                ← reads VPR_JOBS_TABLE_NAME ✓
      LLMClient() → _get_anthropic_client()            ← ssm.get_parameter() ✓
        → run_cv_tailoring_pipeline(cv, job_description, vpr, llm_client)
          Stage 1: keyword mapping (Python)
          Stage 2: llm_client.complete()               ← LLMClient has .complete() ✓
          Stage 3: run_stage3_fact_verification()
            → Stage3Result.ats_keyword_score = stage2.verification.ats_keyword_score * 10  ← NEW
      artifact['ats_score'] = stage3.ats_keyword_score ← reads real score, not cv_sections_dict ← NEW
      dal.put_item(artifact)
      _update_application_artifact(...)

    GET /cv-tailoring/{id}/status → _build_tailored_cv_status_payload():
      status='failed': result['error'] = item.get('error')  ← NEW

################################################################################
# FIX PLAN
################################################################################

fix_plan:
  files_to_modify:

    # ── P6a + P6b: Infrastructure ───────────────────────────────────────────────
    - path: infra/careervp/api_construct.py
      changes:
        - description: "Add VPR_JOBS_TABLE_NAME to CV Tailoring Lambda environment"
          where: "Inside _add_cv_tailoring_lambda_integration() environment dict, after IDEMPOTENCY_TABLE_NAME line"
          before: |
                    "IDEMPOTENCY_TABLE_NAME": idempotency_table.table_name,
                    "AUTHORIZER_DISABLED": "true"
          after: |
                    "IDEMPOTENCY_TABLE_NAME": idempotency_table.table_name,
                    "VPR_JOBS_TABLE_NAME": self.api_db.jobs_table.table_name,
                    "AUTHORIZER_DISABLED": "true"

        - description: "Grant DynamoDB read on jobs_table and SSM GetParameter to CV Tailoring Lambda"
          where: "After lambda_function creation, before return statement in _add_cv_tailoring_lambda_integration()"
          before: |
                    # Legacy /api/* routes removed. Canonical route registration lives in
                    # _add_openapi_contract_routes().
                    return lambda_function
          after: |
                    self.api_db.jobs_table.grant_read_data(lambda_function)
                    lambda_function.add_to_role_policy(
                        iam.PolicyStatement(
                            actions=["ssm:GetParameter"],
                            resources=[
                                (
                                    f"arn:aws:ssm:{self.naming.region}:"
                                    f"{self.naming.account_id}:parameter/"
                                    f"{constants.ANTHROPIC_API_KEY_SSM_PARAM.lstrip('/')}"
                                )
                            ],
                            effect=iam.Effect.ALLOW,
                        )
                    )
                    # Legacy /api/* routes removed. Canonical route registration lives in
                    # _add_openapi_contract_routes().
                    return lambda_function

    # ── P6c: ATS score propagation ───────────────────────────────────────────────
    - path: src/backend/careervp/models/cv_tailoring_models.py
      changes:
        - description: "Add ats_keyword_score to Stage3Result"
          where: "Stage3Result class definition"
          before: |
            class Stage3Result(BaseModel):
                """Stage 3: Fact verification result (Python, no LLM call)."""

                cv_sections: CVSections
                fact_verification_passed: bool
                items_corrected: list[str] = Field(default_factory=list)
                items_removed: list[str] = Field(default_factory=list)
          after: |
            class Stage3Result(BaseModel):
                """Stage 3: Fact verification result (Python, no LLM call)."""

                cv_sections: CVSections
                fact_verification_passed: bool
                items_corrected: list[str] = Field(default_factory=list)
                items_removed: list[str] = Field(default_factory=list)
                ats_keyword_score: int = Field(default=0, ge=0, le=100)

    - path: src/backend/careervp/logic/cv_tailoring_pipeline.py
      changes:
        - description: "Accept ats_keyword_score param in run_stage3_fact_verification and set on result"
          where: "run_stage3_fact_verification() function signature and return statement"
          before: |
            def run_stage3_fact_verification(  # noqa: C901
                stage2_output: Stage2Output,
                parsed_facts: UserCV,
            ) -> Stage3Result:
          after: |
            def run_stage3_fact_verification(  # noqa: C901
                stage2_output: Stage2Output,
                parsed_facts: UserCV,
                ats_keyword_score: int = 0,
            ) -> Stage3Result:

        - description: "Pass ats_keyword_score to Stage3Result constructor"
          where: "Return statement at end of run_stage3_fact_verification()"
          before: |
                return Stage3Result(
                    cv_sections=corrected_sections,
                    fact_verification_passed=fact_verification_passed,
                    items_corrected=items_corrected,
                    items_removed=items_removed,
                )
          after: |
                return Stage3Result(
                    cv_sections=corrected_sections,
                    fact_verification_passed=fact_verification_passed,
                    items_corrected=items_corrected,
                    items_removed=items_removed,
                    ats_keyword_score=ats_keyword_score,
                )

        - description: "Pass scaled ATS score from Stage2 to run_stage3_fact_verification"
          where: "run_cv_tailoring_pipeline() call to run_stage3_fact_verification()"
          before: |
                # Stage 3: Fact verification
                stage3_result = run_stage3_fact_verification(
                    stage2_output=stage2_output,
                    parsed_facts=fact_verification_source,
                )
          after: |
                # Stage 3: Fact verification
                # Convert Stage2 1-10 scale to 0-100 scale for the artifact
                raw_ats = stage2_output.verification.ats_keyword_score
                ats_score_100 = min(100, max(0, raw_ats * 10))
                stage3_result = run_stage3_fact_verification(
                    stage2_output=stage2_output,
                    parsed_facts=fact_verification_source,
                    ats_keyword_score=ats_score_100,
                )

    - path: src/backend/careervp/handlers/cv_tailoring_handler.py
      changes:
        - description: "Read ATS score from stage3.ats_keyword_score instead of cv_sections_dict"
          where: "ATS score extraction block inside _handle_openapi_async_generate() success branch"
          before: |
                # ATS score: use Stage2 verification score (already 0-100) or default to 75
                ats_score = 75
                try:
                    raw_score = cv_sections_dict.get('_ats_keyword_score')
                    if isinstance(raw_score, (int, float)) and 0 <= raw_score <= 100:
                        ats_score = int(raw_score)
                except Exception:  # noqa: BLE001
                    pass
          after: |
                # ATS score: propagated from Stage2 verification through Stage3Result (0-100 scale)
                ats_score = stage3.ats_keyword_score if stage3.ats_keyword_score > 0 else 75

        - description: "Surface error field in _build_tailored_cv_status_payload for failed status"
          where: "_build_tailored_cv_status_payload() inside the status in {'completed', 'failed'} block"
          before: |
                fvs_validation = item.get('fvs_validation')
                if isinstance(fvs_validation, dict):
                    result['fvs_validation'] = fvs_validation

                if result:
                    payload['result'] = result
          after: |
                fvs_validation = item.get('fvs_validation')
                if isinstance(fvs_validation, dict):
                    result['fvs_validation'] = fvs_validation

                error = item.get('error')
                if error is not None:
                    result['error'] = str(error)

                if result:
                    payload['result'] = result

    # ── P6e: RetryingLLMClient.complete() delegate ───────────────────────────────
    - path: src/backend/careervp/logic/cv_tailoring_logic.py
      changes:
        - description: "Add complete() delegate to RetryingLLMClient"
          where: "After RetryingLLMClient.generate() method"
          before: |
            class CVTailoringLogic:
          after: |
                def complete(
                    self,
                    prompt: str,
                    system_prompt: str = '',
                    max_tokens: int = 2500,
                    **kwargs: Any,
                ) -> Any:
                    """Delegate to inner LLMClient.complete() — no retry logic needed (circuit breaker handles it)."""
                    return self._client.complete(
                        prompt=prompt,
                        system_prompt=system_prompt,
                        max_tokens=max_tokens,
                        **kwargs,
                    )

            class CVTailoringLogic:

  non_goals:
    - "Do not change Stage2Verification.ats_keyword_score field constraints (ge=1, le=10)"
    - "Do not change any VPR, gap, cover letter, or interview prep handlers"
    - "Do not add retry logic to RetryingLLMClient.complete() — circuit breaker in LLMClient handles resilience"
    - "Do not change the frontend"
    - "Do not change the LLM prompts or Stage 1/2/3 logic beyond what is specified"

  rollback_plan: >
    Revert infra changes: remove VPR_JOBS_TABLE_NAME from env dict and remove the two
    add_to_role_policy calls. Revert Stage3Result to its 4-field form. Revert the ATS
    extraction to the cv_sections_dict.get('_ats_keyword_score') pattern.
    Revert _build_tailored_cv_status_payload to not include error.
    Remove RetryingLLMClient.complete(). Pipeline reverts to always-75 ATS score
    but continues to work for production requests once SSM and jobs table are fixed
    via other means.

