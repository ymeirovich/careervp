################################################################################
# PROBLEM STATEMENT
################################################################################

problem_statement:
  exact_failing_behavior: >
    After wiring the real 3-stage CV tailoring pipeline (replacing the stub),
    POST /cv-tailoring/generate returns status="failed" in production.
    CloudWatch logs show the pipeline result is a failure.

    Four confirmed root causes (all must be fixed together):

    1. INFRA — JOBS table env var missing:
       _add_cv_tailoring_lambda_integration() in api_construct.py does NOT inject
       VPR_JOBS_TABLE_NAME into the Lambda environment. JobsRepository._get_table_name()
       falls back to the naming-convention table name, which may not be readable because
       the Lambda execution role lacks DynamoDB read permission on that table.

    2. INFRA — SSM IAM grant missing:
       LLMClient._get_anthropic_client() reads ANTHROPIC_API_KEY_SSM_PARAM from the
       environment and calls ssm.get_parameter() to fetch the actual API key.
       The CV Tailoring Lambda role has no ssm:GetParameter policy, causing a
       ClientError:AccessDeniedException at runtime.
       Other lambdas (cover_letter_worker, interview_prep_worker) already have this
       policy at lines 1529-1541 and 1598-1610.

    3. BACKEND — ATS score extraction reads wrong key:
       _handle_openapi_async_generate() tries to extract the ATS score via
       cv_sections_dict.get('_ats_keyword_score'). This key does not exist in the
       CVSections model_dump() output; the score lives in
       stage2_output.verification.ats_keyword_score, which is lost after
       run_stage3_fact_verification() returns a Stage3Result that carries no score field.
       Result: ats_score is always 75 (the hardcoded default).

    4. BACKEND — Failed artifact error not surfaced:
       _build_tailored_cv_status_payload() includes the 'error' field in the artifact
       DynamoDB record but never copies it into the response payload when status='failed'.
       The API consumer receives {"status": "failed"} with no diagnostic detail.

    5. BACKEND — RetryingLLMClient.complete() missing:
       RetryingLLMClient in cv_tailoring_logic.py only wraps LLMClient.generate() with
       retry logic. It has no .complete() method. If code calls
       RetryingLLMClient.tailor_cv() → run_cv_tailoring_pipeline() → Stage 2 LLM call,
       Stage 2 calls llm_client.complete() and receives AttributeError.
       (Currently the handler creates LLMClient() directly so this is latent but must
       be fixed before any code path uses RetryingLLMClient with the new pipeline.)

  expected_behavior: >
    After this fix:
      1. CV Tailoring Lambda can read from the jobs DynamoDB table via the injected
         VPR_JOBS_TABLE_NAME env var and the Lambda role's DynamoDB read grant.
      2. CV Tailoring Lambda can fetch the Anthropic API key from SSM via the
         ssm:GetParameter IAM policy.
      3. ATS score flows from Stage2Verification.ats_keyword_score (1-10 scale) through
         Stage3Result.ats_keyword_score (converted to 0-100 scale) into the artifact.
      4. When status='failed', the status response includes result.error with the
         diagnostic message from the artifact record.
      5. RetryingLLMClient.complete() delegates to its inner LLMClient.complete() with
         the same signature, so any code path using RetryingLLMClient works with Stage 2.

  user_business_impact: >
    Every CV Tailoring generation attempt fails with status="failed" after deployment.
    Users see a failure card with no diagnostic detail and cannot generate tailored CVs.
    ATS scores are always 75 even when the pipeline succeeds.

  reproducibility: >
    1. Deploy current code to AWS dev.
    2. POST /cv-tailoring/generate with valid {cv_id, job_id}.
    3. Observe: response body shows status="failed".
    4. CloudWatch log group /aws/lambda/careervp-cvtailor-lambda-dev shows
       AccessDeniedException on ssm:GetParameter or DynamoDB table not found.

################################################################################
# EVIDENCE
################################################################################

evidence:
  diagnosis_confirmed: true

  root_cause_P6a_jobs_table: >
    _add_cv_tailoring_lambda_integration() at api_construct.py:1613-1667 does not
    include VPR_JOBS_TABLE_NAME in its environment dict. VPR submit (line 1109),
    VPR status (line 1164), VPR SQS worker (line 1219), and VPR DLQ handler (line 1272)
    all inject VPR_JOBS_TABLE_NAME. Cover letter worker uses self.api_db.jobs_table
    at line 1528. CV Tailoring is the only lambda missing the table name AND grant.

  root_cause_P6b_ssm_iam: >
    Cover letter worker adds ssm:GetParameter policy at lines 1529-1541.
    Interview prep worker adds the same policy at lines 1598-1610.
    CV Tailoring lambda has no add_to_role_policy call for SSM in its method body.
    LLMClient._get_anthropic_client() at llm_client.py:50-67 calls
    ssm_client.get_parameter(Name=ssm_param, WithDecryption=True) which requires
    this IAM permission.

  root_cause_P6c_ats_score: >
    cv_tailoring_handler.py line 352: cv_sections_dict.get('_ats_keyword_score').
    CVSections.model_dump(mode='json') never contains '_ats_keyword_score' — that
    field does not exist on the CVSections Pydantic model.
    Stage2Verification.ats_keyword_score (ge=1, le=10) is consumed inside
    run_stage3_fact_verification() but Stage3Result (lines 237-244) has only:
    cv_sections, fact_verification_passed, items_corrected, items_removed.
    The score is never propagated to the handler.

  root_cause_P6d_error_field: >
    _build_tailored_cv_status_payload() at cv_tailoring_handler.py:801-838 enters the
    'failed' branch (status in {'completed', 'failed'}) but only checks tailored_cv,
    cv_sections, ats_score, keyword_matches, suggestions, fvs_validation.
    None of these exist on a failed artifact, so result stays empty and payload['result']
    is never set. The 'error' key written to DynamoDB at line ~395 is never read back.

  root_cause_P6e_retrying: >
    RetryingLLMClient at cv_tailoring_logic.py:27-45 wraps only .generate().
    run_cv_tailoring_pipeline() Stage 2 at cv_tailoring_pipeline.py:246 calls
    llm_client.complete(prompt, system_prompt, max_tokens). If any caller wraps the
    client in RetryingLLMClient before passing it to run_cv_tailoring_pipeline,
    Stage 2 raises AttributeError: 'RetryingLLMClient' object has no attribute 'complete'.

  failing_code_locations:
    infra_jobs_env: "infra/careervp/api_construct.py:1638-1653 (_add_cv_tailoring_lambda_integration env dict)"
    infra_ssm_policy: "infra/careervp/api_construct.py:1663-1666 (return lambda_function — missing add_to_role_policy)"
    backend_ats_score: "src/backend/careervp/handlers/cv_tailoring_handler.py:352 (cv_sections_dict.get('_ats_keyword_score'))"
    backend_error_field: "src/backend/careervp/handlers/cv_tailoring_handler.py:801-838 (_build_tailored_cv_status_payload)"
    backend_retrying: "src/backend/careervp/logic/cv_tailoring_logic.py:27-45 (RetryingLLMClient — no .complete())"

