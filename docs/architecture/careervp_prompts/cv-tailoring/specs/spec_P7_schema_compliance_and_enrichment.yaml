################################################################################
# PROBLEM STATEMENT
################################################################################

problem_statement:
  exact_failing_behavior: >
    The CV tailoring pipeline now generates valid CV content (P6 resolved), but the
    JSON output has four categories of non-compliance vs. careervp_cv_tailoring_schemas.json
    and the JSA ground truth (02_Yitzchak_Meirovich_Learning_Experience_Specialist_SysAid.docx):

    1. SCHEMA — CVExperienceBullet missing:
       CVExperienceSection.bullets is list[str].
       The ground truth schema requires list[CVExperienceBullet] objects with
       text, source, user_edited, and quantified fields.
       The UI cannot show per-bullet source attribution, lock icons, or quantified badges.

    2. DATA QUALITY — Stage 3 does not enrich from parsed_facts:
       a. Experience dates (start_date / end_date) are empty — Stage 2 frequently omits
          them; Stage 3 verifies company names but never backfills dates from parsed_facts.
       b. Contact phone / location / linkedin are empty — Stage 3 corrects name and email
          but ignores the remaining ContactInfo fields.
       c. Certifications list is empty — Stage 2 omits them; Stage 3 never populates from
          parsed_facts.certifications.

    3. SCHEMA — ATS score is a passthrough, not a rules engine:
       The current ats_score is Stage2Verification.ats_keyword_score × 10 (LLM self-report).
       The ground truth schema specifies a deterministic 5-component scoring engine:
       keyword_match (40pt), quantified_bullets (20pt), section_headers (15pt),
       formatting_safety (15pt), summary_keyword_density (10pt).
       Neither the ATSResult / ATSComponents models nor the compute_ats_result()
       function exist.

    4. SCHEMA — Handler response field naming and structure:
       a. fvs_validation → fact_verification_detail (renamed + restructured per schema).
       b. keyword_matches.matched contains full bullet sentences, not keyword strings.
       c. ats_grade, ats_result (full breakdown), keyword_match_score (1-10),
          keywords_matched, keywords_missing are all absent from the response.
       d. version, language, generated_at are absent from the top-level response.
       e. Stage3Result does not carry keywords_to_emphasize — the handler cannot call
          compute_ats_result without primary keywords from Stage 1.

  expected_behavior: >
    After P7:
      1. CVExperienceBullet model exists. CVExperienceSection.bullets is
         list[CVExperienceBullet] with a backward-compat validator that auto-coerces
         str inputs. _parse_cv_sections() converts LLM strings to CVExperienceBullet
         with source='parsed_facts' and quantified=True if bullet contains \d+|%|\$.

      2. Stage 3 backfills:
         - start_date/end_date/is_current from the matching parsed_facts.work_experience
           entry (matched by company, then company+role) for each verified experience.
         - phone/location/linkedin from parsed_facts.contact_info into contact section.
         - certifications from parsed_facts.certifications when Stage 2 produces [].

      3. ATSResult + ATSComponents Pydantic models exist. compute_ats_result() in
         cv_tailoring_ats.py computes all 5 components deterministically.
         Stage3Result.keywords_to_emphasize carries Stage 1 keywords so the handler
         can call compute_ats_result without re-running Stage 1.

      4. Handler response includes ats_result (full breakdown), ats_grade, ats_grade,
         keyword_match_score, keywords_matched, keywords_missing, fact_verification_detail,
         version, language, generated_at. keyword_matches.matched is replaced by
         keywords_matched containing short keyword strings.

  user_business_impact: >
    UI displays empty dates, empty phone/location, empty certifications.
    ATS score widget cannot show component breakdown or grade colour.
    Keyword match chips show full bullet sentences instead of short tags.
    Future DOCX export is blocked until cv_sections is fully populated.

  reproducibility: >
    1. POST /cv-tailoring/generate with valid {cv_id, job_id}.
    2. GET /cv-tailoring/{id}/status.
    3. Observe: experience[].start_date is "", contact.phone/location/linkedin are "",
       certifications is [], ats_result is absent, fact_verification_detail is absent.

