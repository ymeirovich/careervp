  rollback_plan: >
    Revert CVExperienceBullet model addition and CVExperienceSection.bullets back to list[str].
    Revert Stage3Result.keywords_to_emphasize removal.
    Delete cv_tailoring_ats.py.
    Revert handler _handle_openapi_async_generate and _build_tailored_cv_status_payload
    to P6 state. Stage 3 enrichment reverts to company-name-only verification.

################################################################################
# ACCEPTANCE CRITERIA
################################################################################

acceptance_criteria:

  # P7-A: CVExperienceBullet
  - id: AC-P7-01
    description: "CVExperienceBullet Pydantic model exists in cv_tailoring_models.py with fields: text (str, 20-400), source (str, default='parsed_facts'), user_edited (bool, default=False), quantified (bool, default=False)"
    verification: "Unit test: import CVExperienceBullet; construct with text+source; assert all fields present with correct types"
    blocking: true

  - id: AC-P7-02
    description: "CVExperienceSection.bullets is list[CVExperienceBullet] with backward-compat validator: plain strings are auto-coerced to CVExperienceBullet with source='parsed_facts' and quantified computed from regex \\d+|%|\\$"
    verification: "Unit test: CVExperienceSection(bullets=['$1M revenue generated in 18 months.']) → bullets[0] is CVExperienceBullet with quantified=True"
    blocking: true

  - id: AC-P7-03
    description: "_parse_cv_sections() converts string bullets from LLM JSON to CVExperienceBullet objects with source='parsed_facts'"
    verification: "Unit test: _parse_cv_sections(data with bullets=['Built system serving 1M+ users.']) → bullets[0].source == 'parsed_facts' and bullets[0].quantified == True"
    blocking: true

  # P7-B: Stage 3 enrichment
  - id: AC-P7-04
    description: "Stage3Result has keywords_to_emphasize: list[str] = Field(default_factory=list); run_cv_tailoring_pipeline sets it from stage1_output.keywords_to_emphasize"
    verification: "Unit test: mock stage1 returning keywords=['Python','AWS']; assert pipeline_result.data.keywords_to_emphasize == ['Python','AWS']"
    blocking: true

  - id: AC-P7-05
    description: "run_stage3_fact_verification backfills start_date/end_date/is_current from the matching parsed_facts.work_experience entry (matched by company) for each verified experience with empty dates"
    verification: "Unit test: Stage 2 experience has start_date=''; parsed_facts has WorkExperience(company='Acme', start_date='05/2021'); assert result.cv_sections.experience[0].start_date == '05/2021'"
    blocking: true

  - id: AC-P7-06
    description: "run_stage3_fact_verification overwrites contact phone/location/linkedin from parsed_facts.contact_info when those fields are available; preserves existing values when parsed_facts has None"
    verification: "Unit test: Stage 2 contact has phone=''; parsed_facts.contact_info.phone='052-756-3792'; assert result.cv_sections.contact.phone == '052-756-3792'"
    blocking: true

  - id: AC-P7-07
    description: "run_stage3_fact_verification populates cv_sections.certifications from parsed_facts.certifications when Stage 2 produced an empty certifications list"
    verification: "Unit test: Stage 2 certifications=[]; parsed_facts.certifications=[Certification(name='AWS AAI', issuer='Amazon')]; assert len(result.cv_sections.certifications) == 1 and result.cv_sections.certifications[0].name == 'AWS AAI'"
    blocking: true

  # P7-C: ATS engine
  - id: AC-P7-08
    description: "ATSResult and ATSComponents Pydantic models exist in cv_tailoring_models.py with all fields from careervp_cv_tailoring_schemas.json (total_score, grade, components, issues, keywords_matched, keywords_missing, keyword_match_score_1_10)"
    verification: "Unit test: construct ATSResult with all required fields; assert model validates"
    blocking: true

  - id: AC-P7-09
    description: "compute_ats_result(cv_sections, primary_keywords) exists in cv_tailoring_ats.py and returns ATSResult"
    verification: "Unit test: import compute_ats_result; call with valid cv_sections and primary_keywords; assert return type is ATSResult"
    blocking: true

  - id: AC-P7-10
    description: "keyword_match component = round((matched/max(total,1)) * 40, 1); 2 of 4 keywords matched → keyword_match == 20.0"
    verification: "Unit test: primary_keywords=['Python','AWS','Java','Kubernetes']; only Python+AWS in CV text → keyword_match == 20.0"
    blocking: true

  - id: AC-P7-11
    description: "ATS grade: total_score >= 90 → 'green'; 70 <= score < 90 → 'yellow'; score < 70 → 'red'"
    verification: "Unit test: assert compute_ats_result returning total=90 has grade='green'; total=89 → 'yellow'; total=69 → 'red'"
    blocking: true

  # P7-E: Handler response
  - id: AC-P7-12
    description: "_handle_openapi_async_generate calls compute_ats_result and stores ats_result (dict), ats_grade (str), keywords_matched (list[str]), keywords_missing (list[str]), keyword_match_score (int) in the DynamoDB artifact"
    verification: "Unit test: mock compute_ats_result returning ATSResult(total_score=85, grade='yellow', ...); assert artifact['ats_result']['total_score'] == 85 and artifact['ats_grade'] == 'yellow'"
    blocking: true

  - id: AC-P7-13
    description: "_build_tailored_cv_status_payload includes result.ats_result (dict with total_score/grade/components/issues) and result.ats_grade when the stored artifact has these fields"
    verification: "Unit test: item with ats_result={'total_score':85,'grade':'yellow',...}; assert 'ats_result' in payload['result'] and payload['result']['ats_grade'] == 'yellow'"
    blocking: true

  - id: AC-P7-14
    description: "_build_tailored_cv_status_payload includes result.fact_verification_detail (with passed/items_corrected/items_removed/checks) from the stored artifact; fvs_validation is NOT exposed in the response"
    verification: "Unit test: item with fact_verification_detail={'passed':True,'items_corrected':0,'items_removed':0,'hallucination_flags_from_ai':[],'checks':[]}; assert 'fact_verification_detail' in payload['result'] and 'fvs_validation' not in payload['result']"
    blocking: true

  - id: AC-P7-15
    description: "_build_tailored_cv_status_payload includes result.keywords_matched (list of short keyword strings) and result.keywords_missing from the stored artifact; all matched keyword strings are ≤ 50 characters"
    verification: "Unit test: item with keywords_matched=['Python','AWS','LMS Implementation']; assert payload['result']['keywords_matched'] == ['Python','AWS','LMS Implementation'] and all(len(k)<=50 for k in ...)"
    blocking: true

  - id: AC-P7-16
    description: "_build_tailored_cv_status_payload includes top-level version (int), language (str), generated_at (str) from the stored artifact"
    verification: "Unit test: item with version=1, language='en', created_at='2026-04-05T08:31:00Z'; assert payload['version']==1 and payload['language']=='en' and payload['generated_at']=='2026-04-05T08:31:00Z'"
    blocking: true

################################################################################
# BASELINE AND REGRESSION BUDGET
################################################################################

baseline_and_regression_budget:
  baseline_artifact: "P6 passing state — all 7 test_pipeline_wiring.py tests passing"
  blocked_regressions:
    - "P6 tests (test_pipeline_wiring.py) must remain passing"
    - "P5 tests (test_regen_artifact_id.py) must remain passing"
    - "CVExperienceSection must still accept plain str bullets (backward-compat validator)"
    - "cv-tailoring generate endpoint must not regress to 500 or empty response"
    - "ats_score (int, 0-100) must remain in the response for backward compat"
  allowed_deltas:
    - "CVExperienceSection.bullets changes type from list[str] to list[CVExperienceBullet]"
    - "fvs_validation removed from API response; replaced by fact_verification_detail"
    - "keyword_matches.matched replaced by keywords_matched (short strings)"
    - "New top-level payload fields: version, language, generated_at"
    - "New result fields: ats_result, ats_grade, keyword_match_score, keywords_matched, keywords_missing, fact_verification_detail"
    - "Experience dates and certifications now populated (previously empty)"

