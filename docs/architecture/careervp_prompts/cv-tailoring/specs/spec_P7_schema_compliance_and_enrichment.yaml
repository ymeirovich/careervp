fix_plan:
  files_to_modify:

    # ── P7-A: CVExperienceBullet model ─────────────────────────────────────────
    - path: src/backend/careervp/models/cv_tailoring_models.py
      changes:
        - description: "Add CVExperienceBullet Pydantic model"
          where: "After CVCertificationSection class, before CVSections class"
          after: |
            class CVExperienceBullet(BaseModel):
                """A single experience bullet with provenance tracking."""
                text: str = Field(min_length=20, max_length=400)
                source: str = Field(default='parsed_facts')
                # source enum: 'parsed_facts' | 'gap_response' | 'user_edited'
                user_edited: bool = False
                quantified: bool = False  # True when bullet contains a numeric metric

        - description: "Change CVExperienceSection.bullets to list[CVExperienceBullet] with backward-compat validator"
          where: "CVExperienceSection.bullets field"
          before: |
            bullets: list[str] = Field(default_factory=list)  # CAR format: "Action + Context + Result"
          after: |
            bullets: list[CVExperienceBullet] = Field(default_factory=list)

            @field_validator('bullets', mode='before')
            @classmethod
            def _coerce_str_bullets(cls, v: object) -> list[object]:
                """Accept plain strings from LLM responses; convert to CVExperienceBullet."""
                import re as _re
                if not isinstance(v, list):
                    return v  # type: ignore[return-value]
                result: list[object] = []
                for item in v:
                    if isinstance(item, str):
                        result.append({
                            'text': item,
                            'source': 'parsed_facts',
                            'user_edited': False,
                            'quantified': bool(_re.search(r'\d+|%|\$', item)),
                        })
                    else:
                        result.append(item)
                return result

        - description: "Add ATSComponents and ATSResult models"
          where: "After ATSIssue class, before PrimaryKeyword class"
          after: |
            class ATSComponents(BaseModel):
                """Five-component breakdown of ATS score."""
                keyword_match: float = Field(ge=0, le=40)          # 40pt max
                quantified_bullets: float = Field(ge=0, le=20)     # 20pt max
                section_headers: float = Field(ge=0, le=15)        # 15pt max
                formatting_safety: float = Field(ge=0, le=15)      # 15pt max
                summary_keyword_density: float = Field(ge=0, le=10) # 10pt max

            class ATSResult(BaseModel):
                """Output from the deterministic ATS scoring rules engine."""
                total_score: int = Field(ge=0, le=100)
                grade: str  # 'green' | 'yellow' | 'red'
                components: ATSComponents
                issues: list[ATSIssue] = Field(default_factory=list)
                keywords_matched: list[str] = Field(default_factory=list)
                keywords_missing: list[str] = Field(default_factory=list)
                keyword_match_score_1_10: int = Field(default=5, ge=1, le=10)

        - description: "Add keywords_to_emphasize to Stage3Result"
          where: "Stage3Result class — after ats_keyword_score field"
          before: |
            ats_keyword_score: int = Field(default=0, ge=0, le=100)
          after: |
            ats_keyword_score: int = Field(default=0, ge=0, le=100)
            keywords_to_emphasize: list[str] = Field(default_factory=list)

    # ── P7-B: Stage 3 enrichment ───────────────────────────────────────────────
    - path: src/backend/careervp/logic/cv_tailoring_pipeline.py
      changes:
        - description: "Add _find_parsed_experience helper"
          where: "After _find_keyword_evidence(); before run_stage2_cv_generation()"
          after: |
            def _find_parsed_experience(
                company: str,
                title: str,
                parsed_facts: UserCV,
            ) -> Any | None:
                """Return the best-matching WorkExperience from parsed_facts.

                Tries exact company+title match first, then company-only.
                """
                company_lower = company.lower()
                title_lower = title.lower()
                if not parsed_facts.work_experience:
                    return None
                # exact match
                for exp in parsed_facts.work_experience:
                    if exp.company.lower() == company_lower and exp.role.lower() == title_lower:
                        return exp
                # company-only fallback
                for exp in parsed_facts.work_experience:
                    if exp.company.lower() == company_lower:
                        return exp
                return None

        - description: "Backfill dates, contact fields, and certifications in run_stage3_fact_verification"
          where: "run_stage3_fact_verification — after known_companies is built, in the experience verification loop and after"
          notes: |
            Inside the experience verification loop (where we currently just append exp_item):
              pf_exp = _find_parsed_experience(exp_item.company, exp_item.title, parsed_facts)
              if pf_exp:
                  start = exp_item.start_date or (pf_exp.start_date or '')
                  if not start and pf_exp.dates:
                      start, _end = _parse_dates_string(pf_exp.dates)
                  end = exp_item.end_date
                  if end is None and pf_exp.dates:
                      _, end = _parse_dates_string(pf_exp.dates)
                  is_current = getattr(pf_exp, 'current', False) or end is None
                  exp_item = exp_item.model_copy(update={
                      'start_date': start,
                      'end_date': end,
                      'is_current': is_current,
                  })

            After building corrected_sections, before return Stage3Result:
              # Overwrite contact from parsed_facts (phone, location, linkedin)
              ci = parsed_facts.contact_info if hasattr(parsed_facts, 'contact_info') else None
              if ci:
                  corrected_contact = corrected_sections.contact.model_copy(update={
                      'phone': ci.phone or corrected_sections.contact.phone,
                      'location': ci.location or corrected_sections.contact.location,
                      'linkedin': getattr(ci, 'linkedin', None) or corrected_sections.contact.linkedin,
                  })
                  corrected_sections = corrected_sections.model_copy(update={'contact': corrected_contact})

              # Populate certifications from parsed_facts if Stage 2 produced []
              if not corrected_sections.certifications and parsed_facts.certifications:
                  from careervp.models.cv_tailoring_models import CVCertificationSection
                  certs = []
                  for cert in parsed_facts.certifications:
                      name = getattr(cert, 'name', '') or ''
                      issuer = getattr(cert, 'issuer', '') or getattr(cert, 'issuing_organization', '') or ''
                      date = getattr(cert, 'date', '') or getattr(cert, 'issue_date', '') or ''
                      if name:
                          certs.append(CVCertificationSection(name=name, issuer=issuer, date=date or ''))
                  corrected_sections = corrected_sections.model_copy(update={'certifications': certs})

        - description: "Pass keywords_to_emphasize from stage1 through to Stage3Result"
          where: "run_cv_tailoring_pipeline — Stage3Result construction call"
          notes: |
            After run_stage3_fact_verification() returns, the pipeline sets:
              stage3_result.keywords_to_emphasize = stage1_output.keywords_to_emphasize
            Or pass as a param to run_stage3_fact_verification() analogously to ats_keyword_score.

    # ── P7-C: ATS rules engine ─────────────────────────────────────────────────
    - path: src/backend/careervp/logic/cv_tailoring_ats.py
      changes:
        - description: "Create new module with compute_ats_result()"
          where: "New file"
          after: |
            """Deterministic ATS scoring rules engine — 5-component 100-point scale."""
            from __future__ import annotations
            import re
            from typing import TYPE_CHECKING

            from careervp.models.cv_tailoring_models import ATSComponents, ATSIssue, ATSResult

            if TYPE_CHECKING:
                from careervp.models.cv_tailoring_models import CVSections

            _REQUIRED_SECTIONS = ('summary', 'skills', 'experience', 'education')
            _SECTION_PT = 15.0 / len(_REQUIRED_SECTIONS)  # 3.75 per section

            def compute_ats_result(
                cv_sections: CVSections,
                primary_keywords: list[str],
            ) -> ATSResult:
                """Run all 5 scoring components and return a structured ATSResult."""
                # ─ Component 1: keyword_match (0-40) ─────────────────────
                cv_text = _cv_to_text(cv_sections).lower()
                matched = [kw for kw in primary_keywords if kw.lower() in cv_text]
                missing = [kw for kw in primary_keywords if kw.lower() not in cv_text]
                keyword_match = round((len(matched) / max(len(primary_keywords), 1)) * 40, 1)

                # ─ Component 2: quantified_bullets (0-20) ────────────────
                all_bullets = [
                    b.text if hasattr(b, 'text') else str(b)
                    for exp in cv_sections.experience
                    for b in exp.bullets
                ]
                quant_count = sum(1 for b in all_bullets if re.search(r'\d+|%|\$', b))
                quantified_bullets = round((quant_count / max(len(all_bullets), 1)) * 20, 1)

                # ─ Component 3: section_headers (0-15) ───────────────────
                present = sum([
                    bool(cv_sections.summary),
                    bool(cv_sections.skills.technical or cv_sections.skills.soft),
                    bool(cv_sections.experience),
                    bool(cv_sections.education),
                ])
                section_headers = round(present * _SECTION_PT, 1)

                # ─ Component 4: formatting_safety (0-15) ─────────────────
                # No tables (5pt), no columns (5pt), standard date format (5pt)
                # All content is structured JSON — tables/columns impossible by design.
                # Date format check: experience entries should have MM/YYYY or null.
                dates_ok = all(
                    (not exp.start_date) or bool(re.match(r'^\d{2}/\d{4}$', exp.start_date))
                    for exp in cv_sections.experience
                )
                formatting_safety = 10.0 + (5.0 if dates_ok else 0.0)

                # ─ Component 5: summary_keyword_density (0-10) ───────────
                summary_lower = cv_sections.summary.lower()
                kw_in_summary = sum(1 for kw in matched if kw.lower() in summary_lower)
                summary_keyword_density = min(10.0, round(kw_in_summary * 2.5, 1))

                total = int(keyword_match + quantified_bullets + section_headers + formatting_safety + summary_keyword_density)
                grade = 'green' if total >= 90 else ('yellow' if total >= 70 else 'red')

                issues = _build_issues(keyword_match, quantified_bullets, section_headers, missing)
                kw_score_10 = max(1, min(10, round(total / 10)))

                return ATSResult(
                    total_score=total,
                    grade=grade,
                    components=ATSComponents(
                        keyword_match=keyword_match,
                        quantified_bullets=quantified_bullets,
                        section_headers=section_headers,
                        formatting_safety=formatting_safety,
                        summary_keyword_density=summary_keyword_density,
                    ),
                    issues=issues,
                    keywords_matched=matched,
                    keywords_missing=missing,
                    keyword_match_score_1_10=kw_score_10,
                )

            def _cv_to_text(cv_sections: CVSections) -> str:
                parts = [cv_sections.summary]
                parts.extend(cv_sections.skills.technical)
                parts.extend(cv_sections.skills.soft)
                for exp in cv_sections.experience:
                    parts.append(exp.title)
                    for b in exp.bullets:
                        parts.append(b.text if hasattr(b, 'text') else str(b))
                return ' '.join(parts)

            def _build_issues(
                keyword_match: float,
                quantified_bullets: float,
                section_headers: float,
                missing_keywords: list[str],
            ) -> list[ATSIssue]:
                issues: list[ATSIssue] = []
                if keyword_match < 24:  # < 60% of 40
                    issues.append(ATSIssue(
                        code='LOW_KEYWORD_MATCH',
                        severity='critical',
                        message=f'Only {round(keyword_match/40*100)}% of primary keywords matched.',
                        suggestion=f'Add these keywords naturally: {", ".join(missing_keywords[:5])}',
                    ))
                if quantified_bullets < 10:  # < 50% of 20
                    issues.append(ATSIssue(
                        code='FEW_QUANTIFIED_BULLETS',
                        severity='warning',
                        message='Fewer than half of experience bullets contain a numeric metric.',
                        suggestion='Add specific numbers, percentages, or dollar amounts to bullets.',
                    ))
                if section_headers < 11.25:  # < 3 sections
                    issues.append(ATSIssue(
                        code='MISSING_SECTIONS',
                        severity='critical',
                        message='One or more required CV sections are absent.',
                        suggestion='Ensure summary, skills, experience, and education sections are present.',
                    ))
                return issues

    # ── P7-E: Handler response compliance ──────────────────────────────────────
    - path: src/backend/careervp/handlers/cv_tailoring_handler.py
      changes:
        - description: "Import compute_ats_result in handler"
          where: "Top-level imports"
          after: |
            from careervp.logic.cv_tailoring_ats import compute_ats_result

        - description: "Replace keyword_matches logic; add ats_result, fact_verification_detail, version, language"
          where: "_handle_openapi_async_generate — inside the success branch, after stage3 is set"
          notes: |
            # Replace:
            #   cv_text_lower = ...
            #   matched_keywords = [kw for kw in ... bullets ...]
            # With:
            ats_result = compute_ats_result(stage3.cv_sections, stage3.keywords_to_emphasize)

            fact_verification_detail = {
                'passed': stage3.fact_verification_passed,
                'items_corrected': len(stage3.items_corrected),
                'items_removed': len(stage3.items_removed),
                'hallucination_flags_from_ai': [],
                'checks': (
                    [{'check_name': m, 'passed': False, 'action_taken': 'corrected', 'detail': m}
                     for m in stage3.items_corrected]
                    + [{'check_name': m, 'passed': False, 'action_taken': 'removed', 'detail': m}
                       for m in stage3.items_removed]
                ),
            }

            # Artifact additions:
            artifact.update({
                'ats_result': ats_result.model_dump(),
                'ats_grade': ats_result.grade,
                'keywords_matched': ats_result.keywords_matched,
                'keywords_missing': ats_result.keywords_missing,
                'keyword_match_score': ats_result.keyword_match_score_1_10,
                'fact_verification_detail': fact_verification_detail,
                'version': 1,
                'language': 'en',
            })
            # Remove old fields from artifact:
            # keyword_matches (replace with keywords_matched / keywords_missing)
            # fvs_validation (replace with fact_verification_detail)

        - description: "Update _build_tailored_cv_status_payload to include new fields"
          where: "_build_tailored_cv_status_payload — after existing result dict construction"
          notes: |
            Top-level payload additions (not inside result):
              payload['version'] = item.get('version', 1)
              payload['language'] = item.get('language', 'en')
              payload['generated_at'] = item.get('created_at') or item.get('generated_at')

            Inside result dict:
              ats_result = item.get('ats_result')
              if isinstance(ats_result, dict):
                  result['ats_result'] = ats_result
              ats_grade = item.get('ats_grade')
              if ats_grade:
                  result['ats_grade'] = ats_grade
              keyword_match_score = item.get('keyword_match_score')
              if isinstance(keyword_match_score, (int, float, Decimal)):
                  result['keyword_match_score'] = int(keyword_match_score)
              keywords_matched = item.get('keywords_matched')
              if isinstance(keywords_matched, list):
                  result['keywords_matched'] = keywords_matched
              keywords_missing = item.get('keywords_missing')
              if isinstance(keywords_missing, list):
                  result['keywords_missing'] = keywords_missing
              fvd = item.get('fact_verification_detail')
              if isinstance(fvd, dict):
                  result['fact_verification_detail'] = fvd

  non_goals:
