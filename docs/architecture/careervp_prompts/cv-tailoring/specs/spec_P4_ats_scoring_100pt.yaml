        - "line 468: def calculate_ats_score(...) -> float → int"
        - "line 489: return round(max(0.0, min(10.0, score)), 2) → int(round(max(0, min(100, score))))"
        - "line 555: minimum_expected_score = min(10.0, ats_score + 0.5) → min(100, ats_score + 5)"
        - "line 567: 'score_before': round(ats_score, 2) → ats_score (int, no rounding)"
        - "line 613: ats_score=round(ats_score, 2) → ats_score=ats_score"
        - "line 689: preliminary_score = calculate_ats_score(...) → type already int"
        - "line 699: preliminary_ats_score=round(preliminary_score, 2) → preliminary_ats_score=preliminary_score"
        - "line 925: preliminary_ats_score=calculate_ats_score(...) → type already int"
        - "line 958: ats_score: float → int in _log_tailoring_result signature"
        - "line 969: f'ats_score={ats_score:.2f}' → f'ats_score={ats_score}'"

    - file: src/backend/careervp/models/api_models.py
      changes:
        - "line 306: ats_score: float | None = None → int | None = None"

    - file: src/backend/careervp/handlers/cv_tailoring_handler.py
      changes:
        - "line 309: Decimal('9.0') → Decimal('85')  (hardcoded stub value)"
        - "line 681: float(ats_score) → int(ats_score)  (read-path coercion from DynamoDB)"

  backend_do_not_change:
    - "src/backend/careervp/logic/fvs_validator.py — ANTI_AI_MIN_SCORE (line 115) and ATS_MIN_SCORE (line 118) are on 0-10 FVS quality scale"
    - "src/backend/careervp/logic/cover_letter.py — ANTI_AI_MIN_SCORE (line 31) is cover letter anti-AI gate on 0-10 scale"
    - "src/backend/careervp/logic/vpr_generator.py — ANTI_AI_MIN_SCORE (line 79) is VPR anti-AI gate on 0-10 scale"
    - "src/backend/careervp/models/fvs.py — all score fields (lines 58-72) are FVS quality metrics on 0-10 scale"

  frontend:
    - file: frontend/app/dashboard/jobs/[jobId]/cv-tailored/page.tsx
      changes:
        - "line 96: atsScore >= 8 → atsScore >= 80  (green threshold)"
        - "line 98: atsScore >= 6 → atsScore >= 70  (yellow threshold)"
        - "line 103: {Math.round(atsScore * 10)} → {atsScore}  (remove * 10 hack; value now natively 0-100)"
      explanation: >
        The current frontend MULTIPLIES atsScore by 10 to display a fake percentage.
        This was a workaround for the 0-10 backend. After P4 the value is already
        0-100, so the multiplication must be removed or the display shows e.g. 850.

  tests_to_update:
