  affected_code:
    - "src/backend/careervp/logic/cv_tailoring.py: calculate_ats_score(), TARGET_ATS_SCORE, ANTI_AI_MIN_SCORE"
    - "src/backend/careervp/logic/cv_tailoring.py: _section_presence_score(), _star_compliance_score(), _formatting_score() sub-scorers"
    - "src/backend/careervp/models/cv_tailoring_models.py: TailoredCVResponse.ats_score type annotation"
    - "src/backend/tests/unit/test_cv_tailoring.py: score range assertions"
    - "src/backend/tests/unit/test_l0_cv_tailoring_scores.py: all score assertions"

