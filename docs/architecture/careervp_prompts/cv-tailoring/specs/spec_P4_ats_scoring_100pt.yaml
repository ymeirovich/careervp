        changes:
          - "line 111: preliminary_ats_score=3.2 → preliminary_ats_score=32"
          - "line 155: docstring 'must be at least 8.0' → 'must be at least 80'"
          - "line 161: assert final.ats_score >= 8.0 → assert final.ats_score >= 80"
          - "line 172: assert ... >= 9.0  ← DO NOT CHANGE (anti_ai_score stays on 0-10 scale)"
          - "line 205: lambda _cv, _map: 5.5 → lambda _cv, _map: 55"

    integration:
      - file: src/backend/tests/integration/test_workflow_pattern_integration.py
        changes:
          - "line 91: float(tailoring_payload.get('ats_score', 0)) >= 8.0 → >= 80"

      - file: src/backend/tests/integration/test_dal_migration_integration.py
        changes:
          - "line 64: 'ats_score': 8.5 → 'ats_score': 85"

      - file: src/backend/tests/integration/test_full_pipeline_integration.py
        changes:
          - "line 116: float(tailoring_payload.get('ats_score', 0)) >= 8.0 → >= 80"

      - file: src/backend/tests/integration/test_cv_tailoring_async_flow_integration.py
        changes:
          - "line 70: float(payload.get('ats_score', 0)) >= 8.0 → >= 80"

    e2e:
      - file: src/backend/tests/e2e/test_e2e_happy_path_full_job_application.py
        changes:
          - "line 103: float(cvt_result.get('ats_score', 0)) >= 8.0 → >= 80"

      - file: src/backend/tests/e2e/test_e2e_quality_gates.py
        changes:
          - "line 78: float(cvt_result.get('ats_score', 0)) >= 8.0 → >= 80"

  dynamodb_migration_note: >
    Existing DynamoDB records with ats_score stored as Decimal('9.0') or float 8.5
    will still be read by the handler. Line 680-681 in cv_tailoring_handler.py
    reads: float(ats_score). After P4 this becomes int(ats_score).
    Records with old 0-10 values will be displayed as 8 or 9 (not 80 or 90).
    This is ACCEPTABLE for the test data phase — there are no real user records yet.
    When real users onboard, all new tailoring requests will produce 0-100 values.

