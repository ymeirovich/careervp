    - "dashboard color coding: red < 70, yellow 70-89, green >= 90"

################################################################################
# ROOT CAUSE ANALYSIS
################################################################################

root_cause:
  confirmed: >
    The initial implementation chose a 0-10 scale as a simpler range. The spec was
    written after the initial implementation and defined a 0-100 scale with
    component-specific weights that differ from the current formula.

################################################################################
# FIX PLAN
################################################################################

fix_plan:
  files_to_modify:
    - path: src/backend/careervp/logic/cv_tailoring.py
      changes:
        - "Change TARGET_ATS_SCORE from 8.0 to 80"
        - "Change ANTI_AI_MIN_SCORE from 9.0 to 90"
        - "Rewrite calculate_ats_score() to return int 0-100 using spec §6 formula"
        - "Return type annotation: float → int"
        - "New formula components:"
        - "  keyword_match = min((matched_count / total_keywords) * 40, 40)"
        - "  quantified_bullets = min((bullets_with_metric / total_bullets) * 20, 20)"
        - "  section_headers = present_required_sections * 3.75  (required: summary, skills, experience, education)"
        - "  formatting_safety = (no_tables * 5) + (no_columns * 5) + (standard_dates * 5)"
        - "  summary_kw_density = min((kw_in_summary / 6) * 10, 10)"
        - "  score = int(round(keyword_match + quantified_bullets + section_headers + formatting_safety + summary_kw_density))"
        - "Update _section_presence_score() to return 0-15 (not 0-1)"
        - "Update _star_compliance_score() to return quantified_bullets score 0-20"
        - "Update _formatting_score() to return 0-15"

    - path: src/backend/careervp/models/cv_tailoring_models.py
      changes:
        - "ats_score: float → ats_score: int (in TailoredCVResponse)"
        - "estimated_ats_score: int (already int via round — update to 0-100 range comment)"

    - path: src/backend/tests/unit/test_cv_tailoring.py
      changes:
        - "Line 89: assert 0.0 <= score <= 10.0 → assert 0 <= score <= 100"
        - "Line 108: assert final.ats_score >= 8.0 → assert final.ats_score >= 80"

    - path: src/backend/tests/unit/test_l0_cv_tailoring_scores.py
      changes:
        - "Review and update all ats_score threshold assertions from 0-10 to 0-100 scale"

  metric_regex_for_quantified_bullets: "\\d+[%$MKkx]? or \\d+\\s*(percent|hours|users|million|k\\b)"

  non_goals:
    - "Do not change keyword_match_score (remains 1-10 per SKILL.md rubric — different field)"
    - "Do not change anti-AI pattern detection logic — only update the score threshold constant"
    - "Do not change how ats_issues are generated — only the scoring formula"

  rollback_plan: >
    Revert constant and formula changes. ats_score returns to float 0-10.
    Frontend rendering update must be rolled back in the same PR.

