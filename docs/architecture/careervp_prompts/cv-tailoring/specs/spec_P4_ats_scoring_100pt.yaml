################################################################################
# CAREERVP — CV TAILORING IMPROVEMENT PLAN
# Spec: P4 — Fix ATS Scoring from 0-10 Float to 0-100 Integer (Spec §6)
# NOTE: This is a BREAKING CHANGE for all consumers of ats_score.
################################################################################

spec_id: CVT-P4
title: "Change ATS scoring algorithm and scale from 0-10 float to 0-100 integer per spec §6"
priority: high
status: draft
owner: backend
created_at: "2026-04-04"
updated_at: "2026-04-04"

depends_on: [CVT-P1]
blocks: []

################################################################################
# PROBLEM STATEMENT
################################################################################

problem_statement:
  exact_failing_behavior: >
    calculate_ats_score() in cv_tailoring.py:468 returns a float in range 0.0-10.0.
    The current formula weights:
      4.0 * keyword_coverage + 2.0 * required_coverage + 1.5 * section_presence
      + 1.5 * star_score + 1.0 * formatting_score
    The current response shows ats_score: 9.0 (displayed as "9.0/10" implicitly).
    The spec (careervp_cv_tailoring_spec.yaml §6) defines ATS scoring as:
      keyword_match: 40 points (matched_count / total_primary_keywords * 40)
      quantified_bullets: 20 points (quantified_bullets / total_bullets * 20, capped at 20)
      section_headers: 15 points (4 required sections × 3.75 each)
      formatting_safety: 15 points (3 checks × 5 each)
      summary_keyword_density: 10 points (keyword_count_in_summary / 6 * 10, capped at 10)
    Max score: 100. Thresholds: green 90-100, yellow 70-89, red 0-69.

  expected_behavior: >
    calculate_ats_score() returns int in range 0-100, not float 0-10.
    Response ats_score field is an integer (e.g., 85, not 8.5).
    Internal threshold TARGET_ATS_SCORE changes from 8.0 to 80.
    Internal threshold ANTI_AI_MIN_SCORE changes from 9.0 to 90.
    Existing test asserting 0.0 <= score <= 10.0 must be updated to 0 <= score <= 100.

  user_business_impact: >
    - Dashboard displays 9.0 which looks like a percentage (90%) but actually represents
      something different from the spec's 100-point scale.
    - Hiring manager context: LinkedIn and job board ATS systems report 0-100 scores.
      Showing a 0-10 score creates a mismatch in user mental model.
    - Thresholds for green/yellow/red color coding on dashboard are wrong (9.0 vs 90).

  breaking_change_impact:
    - "Frontend ats_score display component must handle int 0-100"
    - "Existing DynamoDB records have ats_score as float 0-10; read path must handle both during migration"
    - "Existing unit tests asserting 0.0 <= score <= 10.0 must be updated"

  reproducibility: >
    Call calculate_ats_score() — observe float return. Check API response ats_score — observe float <= 10.

################################################################################
# EVIDENCE
################################################################################

evidence:
  failing_code_location: "src/backend/careervp/logic/cv_tailoring.py:468-489"
  current_constants:
    - "TARGET_ATS_SCORE = 8.0  (line 35)"
    - "ANTI_AI_MIN_SCORE = 9.0  (line 36)"
  current_formula: "score = 4.0 * coverage + 2.0 * required_coverage + 1.5 * section_presence + 1.5 * star_score + 1.0 * formatting_score"
  spec_formula_ref: "careervp_cv_tailoring_spec.yaml §6.ats_scoring.algorithm"

  # ── CRITICAL SCOPING NOTE ─────────────────────────────────────────────────
  # ANTI_AI_MIN_SCORE and ATS_MIN_SCORE appear in MULTIPLE modules.
  # Only the cv_tailoring.py copies change. All others are on the 0-10 FVS
  # quality scale and must NOT be touched.
  #
  #   CHANGE  → cv_tailoring.py ANTI_AI_MIN_SCORE (line 36): 9.0 → 90
  #   CHANGE  → cv_tailoring.py TARGET_ATS_SCORE (line 35): 8.0 → 80
  #   NO CHANGE → fvs_validator.py ANTI_AI_MIN_SCORE (line 115): stays 9.0
  #   NO CHANGE → fvs_validator.py ATS_MIN_SCORE (line 118): stays 8.0
  #   NO CHANGE → cover_letter.py ANTI_AI_MIN_SCORE (line 31): stays 9.0
  #   NO CHANGE → vpr_generator.py ANTI_AI_MIN_SCORE (line 79): stays 9.0
  #   NO CHANGE → models/fvs.py score fields: all stay Field(ge=0.0, le=10.0)

################################################################################
# COMPLETE CHANGE AUDIT — ALL FILES REQUIRING MODIFICATION
################################################################################

complete_change_audit:

  backend_source:
    - file: src/backend/careervp/logic/cv_tailoring.py
      changes:
        - "line 35: TARGET_ATS_SCORE = 8.0 → 80"
        - "line 36: ANTI_AI_MIN_SCORE = 9.0 → 90"
