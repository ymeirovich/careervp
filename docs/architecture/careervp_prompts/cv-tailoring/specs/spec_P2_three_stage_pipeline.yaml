completion_evidence:
  required:
    - pytest output showing all Stage1/Stage2/Stage3 unit tests pass
    - mypy output showing zero errors in cv_tailoring_pipeline.py
    - sample Stage1Output JSON with >= 12 primary_keywords
    - sample Stage3Result showing fact_verification_passed: true on valid fixture
