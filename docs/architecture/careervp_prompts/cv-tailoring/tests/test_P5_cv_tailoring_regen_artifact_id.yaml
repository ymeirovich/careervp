non_self_closing: true

description: >
  These tests fail before CVT-P5 is implemented:
    - T-P5-01 and T-P5-02 fail with ImportError because _update_application_artifact
      does not yet exist in careervp.handlers.cv_tailoring_handler.
    - T-P5-03 fails because _handle_openapi_async_generate does not call
      _update_application_artifact, so the mock is never invoked.
    - T-P5-04 fails because the ApplicationRepository call is never made.
    - T-P5-05 fails because the env-guard branch is untested (function absent).
    - T-P5-06 is a code-inspection test that fails because the frontend
      handleGenerateCV completed branch does not yet contain the setHub call
      with cv_tailored.artifact_id.

