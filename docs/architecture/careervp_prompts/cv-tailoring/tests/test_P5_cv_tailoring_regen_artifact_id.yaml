# TESTS — FRONTEND: code inspection
################################################################################

  - id: T-P5-06
    name: test_handle_generate_cv_updates_hub_on_completed_status
    maps_to_ac: AC-P5-05
    description: >
      handleGenerateCV's task.status === 'completed' branch must call setHub
      to optimistically update cv_tailored.artifact_id = task.request_id.
      Without this, a stale hub artifact_id from a previous generation overrides
      the new local state between the generate response and refreshHub() resolving.
    non_self_closing_mechanism: >
      Before P5: the completed branch does not call setHub with cv_tailored/artifact_id.
      The assertion finds the pattern absent and fails.
    implementation: |
      @pytest.mark.unit
      def test_handle_generate_cv_updates_hub_on_completed_status() -> None:
          import re
          from pathlib import Path

          page_path = (
              Path(__file__).parents[5]
              / 'frontend' / 'app' / 'dashboard' / 'jobs' / '[jobId]' / 'page.tsx'
          )
          assert page_path.exists(), f"page.tsx not found at {page_path}"

          content = page_path.read_text(encoding='utf-8')

          # Extract the handleGenerateCV function body
          func_match = re.search(
              r'const handleGenerateCV\s*=\s*async.*?^\s{2}\};',
              content,
              re.DOTALL | re.MULTILINE,
          )
          assert func_match, "handleGenerateCV function not found in page.tsx"
          func_body = func_match.group(0)

          # The completed branch (task.status === "completed") must contain a setHub call
          # that sets cv_tailored.artifact_id to task.request_id.
          # Required pattern: setHub + cv_tailored + artifact_id + task.request_id all present
          # within the same function after the "completed" check.
          completed_idx = func_body.find('"completed"')
          assert completed_idx != -1, 'completed branch not found in handleGenerateCV'

          completed_section = func_body[completed_idx:]
          # Find the end of the completed branch (next "} else" or end of try block)
          else_idx = completed_section.find('} else {')
          if else_idx != -1:
              completed_section = completed_section[:else_idx]

          missing: list[str] = []
          if 'setHub' not in completed_section:
              missing.append('setHub()')
          if 'cv_tailored' not in completed_section:
              missing.append('cv_tailored key')
          if 'artifact_id' not in completed_section:
              missing.append('artifact_id key')
          if 'task.request_id' not in completed_section:
              missing.append('task.request_id value')

          assert not missing, (
              "handleGenerateCV completed branch is missing optimistic hub update. "
              f"Not found: {', '.join(missing)}. "
              "Add setHub(prev => ...cv_tailored: {{ status: 'completed', artifact_id: task.request_id }}) "
              "before refreshHub() — CVT-P5 not implemented"
          )

