    name: test_handle_openapi_async_generate_calls_update_application_artifact
    maps_to_ac: AC-P5-01
    description: "_handle_openapi_async_generate must call _update_application_artifact after writing the artifact"
    non_self_closing_mechanism: >
      Before P5: _update_application_artifact does not exist (ImportError).
      After import path is added but before wiring: mock is never called (AssertionError).
    implementation: |
      @pytest.mark.unit
      def test_handle_openapi_async_generate_calls_update_application_artifact(
          monkeypatch: pytest.MonkeyPatch,
      ) -> None:
          from unittest.mock import MagicMock, call, patch
          import careervp.handlers.cv_tailoring_handler as handler_module

          # Ensure the function exists (fails fast with AttributeError if P5 not done)
          assert hasattr(handler_module, '_update_application_artifact'), (
              "_update_application_artifact not found in cv_tailoring_handler — CVT-P5 not implemented"
          )

          monkeypatch.setenv('DYNAMODB_TABLE_NAME', 'test-cv-table')

          mock_table = MagicMock()
          mock_dal = MagicMock()
          mock_dal._get_db_handler.return_value = mock_table
          mock_dal.get_cv.return_value = None

          with patch.object(handler_module, 'DynamoDalHandler', return_value=mock_dal):
              with patch.object(handler_module, '_update_application_artifact') as mock_update:
                  result = handler_module._handle_openapi_async_generate(
                      event={},
                      request_data={'cv_id': 'cv-123', 'job_id': 'job-456', 'vpr_id': None},
                      headers={},
                      user_id='user-789',
                  )

          mock_update.assert_called_once()
          kwargs = mock_update.call_args.kwargs
          assert kwargs.get('application_id') == 'job-456', (
              f"application_id must equal job_id='job-456', got {kwargs.get('application_id')}"
          )
          assert kwargs.get('user_id') == 'user-789', (
              f"user_id must equal 'user-789', got {kwargs.get('user_id')}"
          )
          assert kwargs.get('artifact_type') == 'cv_tailored', (
              f"artifact_type must be 'cv_tailored', got {kwargs.get('artifact_type')}"
          )
          # artifact_id must be a new cv-tail-<uuid> string
          artifact_id = kwargs.get('artifact_id', '')
          assert isinstance(artifact_id, str) and artifact_id.startswith('cv-tail-'), (
              f"artifact_id must start with 'cv-tail-', got {artifact_id!r}"
          )

