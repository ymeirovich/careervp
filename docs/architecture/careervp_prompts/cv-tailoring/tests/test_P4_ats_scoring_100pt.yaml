  @pytest.mark.unit
  def test_target_ats_score_constant_is_80() -> None:
      from careervp.logic.cv_tailoring import TARGET_ATS_SCORE
      assert TARGET_ATS_SCORE == 80, f"TARGET_ATS_SCORE={TARGET_ATS_SCORE}, expected 80 — CVT-P4"


  @pytest.mark.unit
  def test_anti_ai_min_score_constant_is_90() -> None:
      from careervp.logic.cv_tailoring import ANTI_AI_MIN_SCORE
      assert ANTI_AI_MIN_SCORE == 90, f"ANTI_AI_MIN_SCORE={ANTI_AI_MIN_SCORE}, expected 90 — CVT-P4"


