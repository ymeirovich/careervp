################################################################################
# TESTS — CONSTANTS
################################################################################

tests:
  - id: T-P4-01
    name: test_target_ats_score_constant_is_80
    maps_to_ac: AC-P4-07
    description: "TARGET_ATS_SCORE constant must equal 80 (not 8.0)"
    implementation: |
      @pytest.mark.unit
      def test_target_ats_score_constant_is_80() -> None:
          from careervp.logic.cv_tailoring import TARGET_ATS_SCORE
          assert TARGET_ATS_SCORE == 80, (
              f"TARGET_ATS_SCORE is {TARGET_ATS_SCORE}, expected 80 — CVT-P4 not implemented"
          )

  - id: T-P4-02
    name: test_anti_ai_min_score_constant_is_90
    maps_to_ac: AC-P4-08
    description: "ANTI_AI_MIN_SCORE constant must equal 90 (not 9.0)"
    implementation: |
      @pytest.mark.unit
      def test_anti_ai_min_score_constant_is_90() -> None:
          from careervp.logic.cv_tailoring import ANTI_AI_MIN_SCORE
          assert ANTI_AI_MIN_SCORE == 90, (
              f"ANTI_AI_MIN_SCORE is {ANTI_AI_MIN_SCORE}, expected 90 — CVT-P4 not implemented"
          )

################################################################################
# TESTS — RETURN TYPE AND RANGE
################################################################################

  - id: T-P4-03
    name: test_ats_score_returns_int_not_float
    maps_to_ac: AC-P4-01
    description: "calculate_ats_score() must return int, not float"
    implementation: |
      @pytest.mark.unit
      def test_ats_score_returns_int_not_float(
          perfect_cv_sections: CVSections,
          sample_keyword_map: KeywordMap,
      ) -> None:
          from careervp.logic.cv_tailoring import calculate_ats_score
          score = calculate_ats_score(perfect_cv_sections, sample_keyword_map)
          assert isinstance(score, int), (
              f"calculate_ats_score must return int, got {type(score).__name__} "
              f"with value {score} — CVT-P4 not implemented"
          )

  - id: T-P4-04
    name: test_ats_score_range_is_0_to_100
    maps_to_ac: AC-P4-01
    description: "calculate_ats_score() must return a value in 0-100 range"
    implementation: |
      @pytest.mark.unit
      def test_ats_score_range_is_0_to_100(
          perfect_cv_sections: CVSections,
          sample_keyword_map: KeywordMap,
      ) -> None:
          from careervp.logic.cv_tailoring import calculate_ats_score
          score = calculate_ats_score(perfect_cv_sections, sample_keyword_map)
          assert 0 <= score <= 100, (
              f"calculate_ats_score returned {score}, outside 0-100 range — CVT-P4 not implemented"
          )

  - id: T-P4-05
    name: test_empty_cv_scores_0
    maps_to_ac: AC-P4-05
    description: "Empty CVSections with empty keyword_map must score 0"
    implementation: |
      @pytest.mark.unit
      def test_empty_cv_scores_0(empty_cv_sections: CVSections) -> None:
          from careervp.logic.cv_tailoring import KeywordMap, calculate_ats_score

          empty_map = KeywordMap(
              required=[], preferred=[], nice_to_have=[],
              mapped_keywords={}, keyword_categories={},
          )
          score = calculate_ats_score(empty_cv_sections, empty_map)
          assert score == 0, (
              f"Empty CV must score 0, got {score} — CVT-P4 not implemented"
          )

################################################################################
# TESTS — COMPONENT SCORES
################################################################################

  - id: T-P4-06
    name: test_section_headers_component_scores_15_when_all_present
    maps_to_ac: AC-P4-02
    description: "CV with all 4 required sections (summary, skills, experience, education) scores >= 15 on section component"
    implementation: |
      @pytest.mark.unit
      def test_section_headers_component_scores_15_when_all_present(
          perfect_cv_sections: CVSections,
          sample_keyword_map: KeywordMap,
      ) -> None:
          """
          The spec states: section_headers weight=15, 4 required sections × 3.75 each.
          A CV with all 4 sections must achieve the full 15 section points.
          We verify this by checking the total score is at least 15.
          """
          from careervp.logic.cv_tailoring import calculate_ats_score
          score = calculate_ats_score(perfect_cv_sections, sample_keyword_map)
          # Score must be >= 15 just from section headers alone
          assert score >= 15, (
              f"CV with all required sections scored {score}, expected >= 15 — CVT-P4"
          )

  - id: T-P4-07
    name: test_100_percent_keyword_match_contributes_40_points
    maps_to_ac: AC-P4-03
    description: "CV containing all 12 keywords must receive full 40 keyword_match points"
    implementation: |
      @pytest.mark.unit
      def test_100_percent_keyword_match_contributes_40_points(
          perfect_cv_sections: CVSections,
          sample_keyword_map: KeywordMap,
      ) -> None:
          """
          perfect_cv_sections has all 12 SAMPLE_KEYWORDS in its text.
          Score should be >= 40 (keyword contribution alone).
          """
          from careervp.logic.cv_tailoring import calculate_ats_score
          score = calculate_ats_score(perfect_cv_sections, sample_keyword_map)
          assert score >= 40, (
              f"CV with 100% keyword match scored {score}, expected >= 40 — CVT-P4"
          )

  - id: T-P4-08
    name: test_quantified_bullets_contribute_to_score
    maps_to_ac: AC-P4-02
    description: "CVExperienceItem with quantified bullets (35%, 40%, 99.9%) contributes > 0 on quantified_bullets component"
    implementation: |
      @pytest.mark.unit
      def test_quantified_bullets_contribute_to_score(
          perfect_cv_sections: CVSections,
          sample_keyword_map: KeywordMap,
      ) -> None:
          """
          perfect_cv_sections has 3 bullets all with numeric metrics.
          Score must be > the section_headers + keyword baseline, proving quantified
          bullets were counted.
          """
          from careervp.logic.cv_tailoring import CVSections, calculate_ats_score, CVExperienceItem, CVSkills, CVContact

          # Compare score with vs without quantified bullets
          no_metrics_cv = CVSections(
              contact=perfect_cv_sections.contact,
              summary=perfect_cv_sections.summary,
              skills=perfect_cv_sections.skills,
              experience=[
                  CVExperienceItem(
                      company="Nimbus Labs",
                      title="Senior Software Engineer",
                      start_date="01/2021",
                      end_date="Present",
                      bullets=[
                          "Led Kubernetes migration for production services",
                          "Automated AWS observability with Terraform",
                          "Improved platform uptime significantly",
                      ],
                  )
              ],
              education=perfect_cv_sections.education,
              certifications=[],
          )
          score_with_metrics = calculate_ats_score(perfect_cv_sections, sample_keyword_map)
          score_without_metrics = calculate_ats_score(no_metrics_cv, sample_keyword_map)
          assert score_with_metrics > score_without_metrics, (
              f"Quantified bullets must increase ATS score: "
              f"with={score_with_metrics}, without={score_without_metrics} — CVT-P4"
          )

  - id: T-P4-09
    name: test_score_cap_is_100_not_higher
    maps_to_ac: AC-P4-01
    description: "Even a perfect CV must not exceed 100 (no overflow)"
    implementation: |
      @pytest.mark.unit
      def test_score_cap_is_100_not_higher(
          perfect_cv_sections: CVSections,
          sample_keyword_map: KeywordMap,
      ) -> None:
          from careervp.logic.cv_tailoring import calculate_ats_score
          score = calculate_ats_score(perfect_cv_sections, sample_keyword_map)
          assert score <= 100, (
              f"ATS score {score} exceeds maximum 100 — CVT-P4 formula has overflow"
          )

################################################################################
# TESTS — EXISTING TEST UPDATE VERIFICATION
################################################################################

  - id: T-P4-10
    name: test_existing_test_cv_tailoring_uses_new_scale
    maps_to_ac: AC-P4-09
    description: "Regression: test_cv_tailoring.py line 89 assertion must use 0-100 range (not 0-10)"
    implementation: |
      @pytest.mark.unit
      def test_existing_test_cv_tailoring_uses_new_scale() -> None:
          """
          This test reads test_cv_tailoring.py and checks that the old 0-10 assertion
          has been updated to 0-100. It fails until the existing test is updated.
          """
          import pathlib
          test_file = pathlib.Path(__file__).parents[2] / "test_cv_tailoring.py"
          assert test_file.exists(), f"test_cv_tailoring.py not found at {test_file}"
          content = test_file.read_text(encoding="utf-8")
          assert "0.0 <= score <= 10.0" not in content, (
              "test_cv_tailoring.py still uses 0-10 scale assertion — update per CVT-P4 spec"
          )
          assert "0 <= score <= 100" in content, (
              "test_cv_tailoring.py missing updated 0-100 scale assertion — CVT-P4 not applied"
          )

  - id: T-P4-11
    name: test_existing_final_ats_score_threshold_uses_new_scale
    maps_to_ac: AC-P4-09
    description: "test_cv_tailoring.py line 108 must use >= 80 threshold (not >= 8.0)"
    implementation: |
      @pytest.mark.unit
      def test_existing_final_ats_score_threshold_uses_new_scale() -> None:
          import pathlib
          test_file = pathlib.Path(__file__).parents[2] / "test_cv_tailoring.py"
          assert test_file.exists()
          content = test_file.read_text(encoding="utf-8")
          assert "ats_score >= 8.0" not in content, (
              "test_cv_tailoring.py still uses >= 8.0 threshold — update per CVT-P4 spec"
          )
          assert "ats_score >= 80" in content, (
              "test_cv_tailoring.py missing updated >= 80 threshold — CVT-P4 not applied"
          )

