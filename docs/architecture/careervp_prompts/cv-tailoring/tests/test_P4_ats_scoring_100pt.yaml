################################################################################
# TEST SPEC: P4 — ATS Scoring 0-100 Integer Scale
# Spec ref: CVT-P4
# When implemented:
#   CREATE: src/backend/tests/unit/cv_tailoring/test_ats_scoring_100pt.py
#   UPDATE: src/backend/tests/unit/test_cv_tailoring.py (lines 89, 108)
#   UPDATE: src/backend/tests/unit/test_l0_cv_tailoring_scores.py (all score assertions)
################################################################################

test_spec_id: TEST-CVT-P4
spec_ref: CVT-P4
title: "ATS scoring 0-100 integer algorithm tests"
test_files:
  primary: "src/backend/tests/unit/cv_tailoring/test_ats_scoring_100pt.py"
  update_required:
    - file: "src/backend/tests/unit/test_cv_tailoring.py"
      lines: [89, 108]
      change: "assert 0.0 <= score <= 10.0 → assert 0 <= score <= 100; assert final.ats_score >= 8.0 → >= 80"
    - file: "src/backend/tests/unit/test_l0_cv_tailoring_scores.py"
      change: "Review and update all ats_score threshold assertions"
markers:
  - "@pytest.mark.unit"
status: pending_implementation
non_self_closing: true

description: >
  These tests verify the 0-100 integer ATS scoring algorithm defined in spec §6.
  They fail by asserting the WRONG scale (0-10) until CVT-P4 is implemented.
  Additionally, the existing tests in test_cv_tailoring.py must be updated to
  use the new scale; those existing tests will fail after P4 is applied unless updated.

breaking_change_note: >
  CVT-P4 BREAKS the following existing assertions:
    - test_cv_tailoring.py:89: assert 0.0 <= score <= 10.0  → becomes 0 <= score <= 100
    - test_cv_tailoring.py:108: assert final.ats_score >= 8.0 → becomes >= 80
    - test_l0_cv_tailoring_scores.py: all assertions with score <= 10.0 or >= 8.0
  These must be updated IN THE SAME PR as the P4 implementation.

