full_file_template: |
  """
  Unit tests: ATS scoring algorithm on 0-100 integer scale per spec §6.
  Spec: CVT-P4 — ATS Scoring 0-100
  Tests T-P4-01 and T-P4-02 fail immediately until TARGET_ATS_SCORE/ANTI_AI_MIN_SCORE are updated.
  Tests T-P4-03 through T-P4-09 fail until calculate_ats_score() returns int 0-100.
  Tests T-P4-10 and T-P4-11 fail until existing tests are updated to new scale.
