    name: test_retrying_llm_client_has_complete_method
    maps_to: AC-P6-01
    description: "RetryingLLMClient must have a callable .complete() method"
    failure_before_implementation: "AttributeError: type object 'RetryingLLMClient' has no attribute 'complete'"
    implementation: |
      from careervp.logic.cv_tailoring_logic import RetryingLLMClient
      from careervp.logic.llm_client import LLMClient
      from unittest.mock import MagicMock

      mock_client = MagicMock(spec=LLMClient)
      retrying = RetryingLLMClient(client=mock_client)

      assert hasattr(retrying, 'complete'), (
          "RetryingLLMClient must have a .complete() method — CVT-P6 not implemented"
      )
      assert callable(retrying.complete), (
          "RetryingLLMClient.complete must be callable — CVT-P6 not implemented"
      )

  - id: T-P6-02
    name: test_retrying_llm_client_complete_delegates
    maps_to: AC-P6-01
    description: "RetryingLLMClient.complete() must delegate to inner client.complete() with same args"
    failure_before_implementation: "AttributeError: 'RetryingLLMClient' object has no attribute 'complete'"
    implementation: |
      from careervp.logic.cv_tailoring_logic import RetryingLLMClient
      from careervp.logic.llm_client import LLMClient, _LLMTextResponse
      from unittest.mock import MagicMock

      mock_client = MagicMock(spec=LLMClient)
      mock_client.complete.return_value = _LLMTextResponse(text='{"cv_sections": {}}')

      retrying = RetryingLLMClient(client=mock_client)
      result = retrying.complete(
          prompt='test prompt',
          system_prompt='test system',
          max_tokens=100,
      )

      mock_client.complete.assert_called_once_with(
          prompt='test prompt',
          system_prompt='test system',
          max_tokens=100,
      )
      assert result.text == '{"cv_sections": {}}', (
          f'RetryingLLMClient.complete() must return inner client result, got {result!r}'
      )

