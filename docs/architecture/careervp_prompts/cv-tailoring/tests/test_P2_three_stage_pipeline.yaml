    description: "Stage2Output must have a verification block with ats_keyword_score, hallucination_flags"
    implementation: |
      @pytest.mark.unit
      def test_stage2_output_has_verification_block(
          sample_parsed_facts: ParsedFacts,
          mock_llm_stage1: MagicMock,
      ) -> None:
          import json
          from unittest.mock import MagicMock
          from careervp.logic.cv_tailoring_pipeline import Stage2Output, run_stage2_cv_generation
          from careervp.models.cv_tailoring_models import CompanyContext

          stage2_json = {
              "verification": {
                  "ats_keyword_score": 8,
                  "keywords_added_in_review": ["Terraform"],
                  "summary_rewritten": True,
                  "fact_verification_passed": True,
                  "hallucination_flags": [],
              },
              "cv_sections": {
                  "contact": {"name": "Alex Candidate", "email": "alex@example.com",
                               "phone": "+1-555-0100", "linkedin": None, "location": "New York, NY"},
                  "summary": "Platform engineer with Kubernetes and AWS expertise driving reliability.",
                  "skills": {"technical": ["Python", "AWS", "Kubernetes"], "soft": ["Leadership"]},
                  "experience": [
                      {
                          "company": "Nimbus Labs",
                          "title": "Senior Software Engineer",
                          "start_date": "01/2021",
                          "end_date": "Present",
                          "bullets": [
                              "Drove | Kubernetes migration for 12 services | Increased reliability by 35%"
                          ],
                      }
                  ],
                  "education": [],
                  "certifications": [],
              },
          }
          mock_stage2_llm = MagicMock()
          mock_stage2_llm.generate = MagicMock(return_value={"content": json.dumps(stage2_json)})

          # Build a minimal Stage1Output via mock_llm_stage1
          from careervp.logic.cv_tailoring_pipeline import run_stage1_keyword_mapping
          from careervp.models.cv_tailoring_models import GapAnalysisResponses
          stage1 = run_stage1_keyword_mapping(
              vpr=None,
              job_description="Lead cloud reliability.",
              parsed_facts=sample_parsed_facts,
              gap_responses=GapAnalysisResponses(responses=[]),
              llm_client=mock_llm_stage1,
          )

          result = run_stage2_cv_generation(
              stage1_output=stage1,
              parsed_facts=sample_parsed_facts,
              job_description="Lead cloud reliability.",
              company_context=CompanyContext(company_name="Acme Cloud", company_culture="", products_services=[]),
              user_feedback=None,
              llm_client=mock_stage2_llm,
          )
          assert isinstance(result, Stage2Output), (
              f"Expected Stage2Output, got {type(result).__name__} — CVT-P2 not implemented"
          )
          assert hasattr(result, "verification"), "Stage2Output missing verification block"
          assert hasattr(result.verification, "ats_keyword_score"), "Missing ats_keyword_score"
          assert hasattr(result.verification, "hallucination_flags"), "Missing hallucination_flags"

