  - id: T-P2-06
    name: test_stage3_strips_hallucination_flags
    maps_to_ac: AC-P2-05
    description: "Stage3 must set items_removed > 0 when hallucination_flags is non-empty"
    implementation: |
      @pytest.mark.unit
      def test_stage3_strips_hallucination_flags(sample_parsed_facts: ParsedFacts) -> None:
          from careervp.logic.cv_tailoring_pipeline import Stage2Output, run_stage3_fact_verification
          from careervp.models.cv_tailoring_models import (
              CVContact, CVExperienceItem, CVSections, CVSkills, Stage2Verification,
          )

          sections_with_flagged_bullet = CVSections(
              contact=CVContact(name="Alex Candidate", email="alex@example.com",
                                phone=None, linkedin=None, location="New York, NY"),
              summary="Platform engineer.",
              skills=CVSkills(technical=["Python", "AWS"], soft=[]),
              experience=[
                  CVExperienceItem(
                      company="Nimbus Labs",
                      title="Senior Software Engineer",
                      start_date="01/2021",
                      end_date="Present",
                      bullets=["HALLUCINATED_FACT: Closed 3 acquisitions worth $500M"],
                  )
              ],
              education=[],
              certifications=[],
          )
          stage2 = Stage2Output(
              verification=Stage2Verification(
                  ats_keyword_score=7,
                  keywords_added_in_review=[],
                  summary_rewritten=False,
                  fact_verification_passed=False,
                  hallucination_flags=["Closed 3 acquisitions worth $500M"],
              ),
              cv_sections=sections_with_flagged_bullet,
          )

          result = run_stage3_fact_verification(stage2_output=stage2, parsed_facts=sample_parsed_facts)
          assert result.items_removed >= 1, (
              f"Stage3 must remove hallucinated items, items_removed={result.items_removed} — CVT-P2"
          )

  - id: T-P2-07
    name: test_stage3_rejects_hallucinated_company
    maps_to_ac: AC-P2-06
    description: "Stage3 returns fact_verification_passed=False when experience company not in parsed_facts"
    implementation: |
      @pytest.mark.unit
      def test_stage3_rejects_hallucinated_company(sample_parsed_facts: ParsedFacts) -> None:
          from careervp.logic.cv_tailoring_pipeline import Stage2Output, run_stage3_fact_verification
          from careervp.models.cv_tailoring_models import (
              CVContact, CVExperienceItem, CVSections, CVSkills, Stage2Verification,
          )

          sections_with_fake_company = CVSections(
              contact=CVContact(name="Alex Candidate", email="alex@example.com",
                                phone=None, linkedin=None, location=None),
              summary="Engineer.",
              skills=CVSkills(technical=["Python"], soft=[]),
              experience=[
                  CVExperienceItem(
                      company="FAKE CORP INC",  # not in parsed_facts
                      title="Senior Engineer",
                      start_date="01/2021",
                      end_date="Present",
                      bullets=["Built platform."],
                  )
              ],
              education=[],
              certifications=[],
          )
          stage2 = Stage2Output(
              verification=Stage2Verification(
                  ats_keyword_score=8,
                  keywords_added_in_review=[],
                  summary_rewritten=False,
                  fact_verification_passed=True,  # LLM claimed OK — Stage3 must catch it
                  hallucination_flags=[],
              ),
              cv_sections=sections_with_fake_company,
          )

          result = run_stage3_fact_verification(stage2_output=stage2, parsed_facts=sample_parsed_facts)
          assert result.fact_verification_passed is False, (
              "Stage3 must return fact_verification_passed=False for unrecognized company — CVT-P2"
          )

