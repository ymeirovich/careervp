  - id: T-P3-10
    name: test_stage3_uses_parsed_facts_not_user_cv_for_company_match
    maps_to_ac: AC-P3-04
    description: "Company in Stage2 output that IS in UserCV but NOT in parsed_facts must be rejected"
    implementation: |
      @pytest.mark.unit
      def test_stage3_uses_parsed_facts_not_user_cv_for_company_match() -> None:
          """
          Scenario:
          - parsed_facts only has 'Nimbus Labs'
          - Stage2 output includes 'Legacy Corp' (present in UserCV but absent from parsed_facts)
          Stage3 must reject 'Legacy Corp' — not accept it just because UserCV has it.
          """
          from careervp.logic.cv_tailoring_pipeline import Stage2Output, run_stage3_fact_verification
          from careervp.models.cv_tailoring_models import (
              CVContact, CVExperienceItem, CVSections, CVSkills,
              ParsedFacts, Stage2Verification,
          )

          parsed_facts_nimbus_only = ParsedFacts(
              name="Alex Candidate",
              email="alex@example.com",
              phone=None,
              location=None,
              work_experience=[
                  {
                      "company": "Nimbus Labs",
                      "title": "Senior Software Engineer",
                      "start_date": "01/2021",
                      "end_date": "Present",
                      "is_current": True,
                      "responsibilities": [],
                      "achievements": [],
                  }
              ],
              education=[],
              skills={"technical": [], "soft": []},
              certifications=[],
              languages=[],
              summary_original="",
          )

          stage2_with_legacy_corp = Stage2Output(
              verification=Stage2Verification(
                  ats_keyword_score=8,
                  keywords_added_in_review=[],
                  summary_rewritten=False,
                  fact_verification_passed=True,
                  hallucination_flags=[],
              ),
              cv_sections=CVSections(
                  contact=CVContact(name="Alex Candidate", email="alex@example.com",
                                    phone=None, linkedin=None, location=None),
                  summary="Engineer.",
                  skills=CVSkills(technical=[], soft=[]),
                  experience=[
                      CVExperienceItem(
                          company="Legacy Corp",  # in UserCV but NOT in parsed_facts
                          title="Engineer",
                          start_date="01/2018",
                          end_date="12/2020",
                          bullets=["Managed servers."],
                      )
                  ],
                  education=[],
                  certifications=[],
              ),
          )

          result = run_stage3_fact_verification(
              stage2_output=stage2_with_legacy_corp,
              parsed_facts=parsed_facts_nimbus_only,
          )
          assert result.fact_verification_passed is False, (
              "Stage3 must reject company not in parsed_facts even if in UserCV — CVT-P3"
          )

