full_file_template: |
  """
  Unit tests: parsed_facts, GapAnalysisResponses, CompanyContext wiring in CVTailoringLogic.
  Spec: CVT-P3 — Ground Truth Inputs
  Tests fail with ImportError until CVT-P3 is implemented.
  tailor_cv() is async — uses @pytest.mark.asyncio.
  run_stage3_fact_verification() is sync — those tests remain sync.
  """

  from __future__ import annotations

  from unittest.mock import AsyncMock, MagicMock, patch

  import pytest
  from pydantic import ValidationError

  from careervp.models.cv_tailoring_models import (
      CompanyContext,
      GapAnalysisResponses,
      ParsedFacts,
  )


  # Fixtures are defined in conftest.py for this test module.
  # See test_P3_ground_truth_inputs.yaml fixtures section.


  @pytest.mark.unit
  def test_parsed_facts_model_is_importable() -> None:
      from careervp.models.cv_tailoring_models import ParsedFacts  # noqa: F401


  @pytest.mark.unit
  def test_parsed_facts_rejects_missing_required_fields() -> None:
      with pytest.raises((ValidationError, TypeError)):
          ParsedFacts(  # type: ignore[call-arg]
              email="alex@example.com",
              work_experience=[],
              education=[],
              skills={"technical": [], "soft": []},
              certifications=[],
              languages=[],
              summary_original="",
          )


  @pytest.mark.unit
  def test_gap_analysis_responses_accepts_empty_list() -> None:
      gar = GapAnalysisResponses(responses=[])
      assert gar.responses == []


  @pytest.mark.unit
  @pytest.mark.asyncio
  async def test_parsed_facts_passed_to_stage1(mock_cv_dal_with_parsed_facts: MagicMock) -> None:
      from careervp.logic.cv_tailoring_logic import CVTailoringLogic

      with patch("careervp.logic.cv_tailoring_logic.run_cv_tailoring_pipeline") as mock_pipeline:
          mock_pipeline.return_value = MagicMock(
              cv_sections=MagicMock(), fact_verification_passed=True,
              items_corrected=0, items_removed=0,
          )
          logic = CVTailoringLogic(cv_dal=mock_cv_dal_with_parsed_facts, llm_client=MagicMock())
          await logic.tailor_cv(
              user_id="user-001", cv_id="cv-001",
              job_description="Lead cloud platform.", vpr=None,
          )

      call_kwargs = mock_pipeline.call_args.kwargs
      assert isinstance(call_kwargs.get("parsed_facts"), ParsedFacts), (
          "parsed_facts not passed to pipeline — CVT-P3 not implemented"
      )


  @pytest.mark.unit
  @pytest.mark.asyncio
  async def test_parsed_facts_constructed_from_user_cv_when_absent() -> None:
      """Covers test-data state: cv_record.parsed_facts is None."""
      from careervp.logic.cv_tailoring_logic import CVTailoringLogic

      dal_no_parsed_facts = MagicMock()
      dal_no_parsed_facts.get_cv = AsyncMock(return_value=MagicMock(
          user_id="user-001", cv_id="cv-001",
          full_name="Alex Candidate", parsed_facts=None,
      ))

      with patch("careervp.logic.cv_tailoring_logic.run_cv_tailoring_pipeline") as mock_pipeline:
          mock_pipeline.return_value = MagicMock(
              cv_sections=MagicMock(), fact_verification_passed=True,
              items_corrected=0, items_removed=0,
          )
          logic = CVTailoringLogic(cv_dal=dal_no_parsed_facts, llm_client=MagicMock())
          await logic.tailor_cv(
              user_id="user-001", cv_id="cv-001",
              job_description="Lead cloud platform.", vpr=None,
          )

      call_kwargs = mock_pipeline.call_args.kwargs
      pf = call_kwargs.get("parsed_facts")
      assert isinstance(pf, ParsedFacts), "Must construct ParsedFacts from UserCV — CVT-P3"
      assert pf.name == "Alex Candidate"
