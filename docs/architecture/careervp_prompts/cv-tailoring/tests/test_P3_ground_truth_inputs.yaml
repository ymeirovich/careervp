################################################################################
# TESTS — LOGIC WIRING
################################################################################

  - id: T-P3-07
    name: test_parsed_facts_passed_to_stage1
    maps_to_ac: AC-P3-01
    description: "CVTailoringLogic.tailor_cv() must pass parsed_facts to run_stage1_keyword_mapping"
    markers: ["@pytest.mark.unit", "@pytest.mark.asyncio"]
    implementation: |
      @pytest.mark.unit
      @pytest.mark.asyncio
      async def test_parsed_facts_passed_to_stage1(
          mock_cv_dal_with_parsed_facts: MagicMock,
      ) -> None:
          from unittest.mock import patch, MagicMock
          from careervp.logic.cv_tailoring_logic import CVTailoringLogic

          with patch(
              "careervp.logic.cv_tailoring_logic.run_cv_tailoring_pipeline"
          ) as mock_pipeline:
              mock_pipeline.return_value = MagicMock(
                  cv_sections=MagicMock(),
                  fact_verification_passed=True,
                  items_corrected=0,
                  items_removed=0,
              )
              logic = CVTailoringLogic(
                  cv_dal=mock_cv_dal_with_parsed_facts,
                  llm_client=MagicMock(),
              )
              await logic.tailor_cv(
                  user_id="user-001",
                  cv_id="cv-001",
                  job_description="Lead cloud platform reliability.",
                  vpr=None,
              )

          assert mock_pipeline.called, "run_cv_tailoring_pipeline was never called — CVT-P3"
          call_kwargs = mock_pipeline.call_args.kwargs
          parsed_facts_arg = call_kwargs.get("parsed_facts")
          assert parsed_facts_arg is not None, (
              "parsed_facts not passed to pipeline — CVT-P3 not implemented"
          )
          from careervp.models.cv_tailoring_models import ParsedFacts
          assert isinstance(parsed_facts_arg, ParsedFacts), (
              f"Expected ParsedFacts, got {type(parsed_facts_arg).__name__}"
          )

  - id: T-P3-07b
    name: test_parsed_facts_constructed_from_user_cv_when_absent
    maps_to_ac: AC-P3-01
    description: "When cv_record.parsed_facts is None, logic must construct ParsedFacts from UserCV fields (test data path)"
    markers: ["@pytest.mark.unit", "@pytest.mark.asyncio"]
    implementation: |
      @pytest.mark.unit
      @pytest.mark.asyncio
      async def test_parsed_facts_constructed_from_user_cv_when_absent(
      ) -> None:
          """
          Covers the current test-data state: cv_record.parsed_facts is None.
          Logic must NOT fail — it must construct a ParsedFacts from UserCV fields.
          """
          from unittest.mock import patch, MagicMock, AsyncMock
          from careervp.logic.cv_tailoring_logic import CVTailoringLogic
          from careervp.models.cv_tailoring_models import ParsedFacts

          # DAL returns a CV record with NO parsed_facts
          dal_no_parsed_facts = MagicMock()
          dal_no_parsed_facts.get_cv = AsyncMock(return_value=MagicMock(
              user_id="user-001",
              cv_id="cv-001",
              full_name="Alex Candidate",
              parsed_facts=None,  # ← test data state
          ))

          with patch(
              "careervp.logic.cv_tailoring_logic.run_cv_tailoring_pipeline"
          ) as mock_pipeline:
              mock_pipeline.return_value = MagicMock(
                  cv_sections=MagicMock(), fact_verification_passed=True,
                  items_corrected=0, items_removed=0,
              )
              logic = CVTailoringLogic(cv_dal=dal_no_parsed_facts, llm_client=MagicMock())
              await logic.tailor_cv(
                  user_id="user-001", cv_id="cv-001",
                  job_description="Lead cloud platform.", vpr=None,
              )

          # Must still have called pipeline with a ParsedFacts instance (constructed from UserCV)
          call_kwargs = mock_pipeline.call_args.kwargs
          parsed_facts_arg = call_kwargs.get("parsed_facts")
          assert isinstance(parsed_facts_arg, ParsedFacts), (
              "When parsed_facts is None, logic must construct ParsedFacts from UserCV — CVT-P3"
          )
          assert parsed_facts_arg.name == "Alex Candidate", (
              "Constructed ParsedFacts must use UserCV.full_name"
          )

  - id: T-P3-08
    name: test_gap_responses_fetch_failure_does_not_abort_pipeline
    maps_to_ac: AC-P3-02
    description: "KeyError on gap_responses fetch must not raise — pipeline continues with empty GapAnalysisResponses"
    markers: ["@pytest.mark.unit", "@pytest.mark.asyncio"]
    implementation: |
      @pytest.mark.unit
      @pytest.mark.asyncio
      async def test_gap_responses_fetch_failure_does_not_abort_pipeline(
          mock_cv_dal_with_parsed_facts: MagicMock,
          mock_artifact_dal_missing_gap: MagicMock,
      ) -> None:
          from unittest.mock import patch, MagicMock
          from careervp.logic.cv_tailoring_logic import CVTailoringLogic

          with patch(
              "careervp.logic.cv_tailoring_logic.run_cv_tailoring_pipeline"
          ) as mock_pipeline:
              mock_pipeline.return_value = MagicMock(
                  cv_sections=MagicMock(), fact_verification_passed=True,
                  items_corrected=0, items_removed=0,
              )
              logic = CVTailoringLogic(
                  cv_dal=mock_cv_dal_with_parsed_facts,
                  artifact_dal=mock_artifact_dal_missing_gap,
                  llm_client=MagicMock(),
              )
              # Must NOT raise — graceful degradation required
              await logic.tailor_cv(
                  user_id="user-001", cv_id="cv-001",
                  job_description="Lead cloud platform.", vpr=None,
              )

          from careervp.models.cv_tailoring_models import GapAnalysisResponses
          call_kwargs = mock_pipeline.call_args.kwargs
          gap_arg = call_kwargs.get("gap_responses")
          assert isinstance(gap_arg, GapAnalysisResponses), "gap_responses must be GapAnalysisResponses"
          assert gap_arg.responses == [], "gap_responses must be empty when fetch fails"

  - id: T-P3-09
