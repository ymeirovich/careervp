test_spec_id: TEST-CVT-P3
spec_ref: CVT-P3
title: "parsed_facts, GapAnalysisResponses, CompanyContext wiring and graceful degradation tests"
test_file: "src/backend/tests/unit/cv_tailoring/test_ground_truth_inputs.py"
markers:
  - "@pytest.mark.unit"
status: pending_implementation
non_self_closing: true

async_requirement: true
pytest_asyncio: true
conftest_requirement: "asyncio_mode = 'auto' in pytest.ini OR @pytest.mark.asyncio on async test functions"

description: >
  These tests verify that CVTailoringLogic.tailor_cv() correctly fetches and passes
  parsed_facts to the pipeline, and degrades gracefully when gap_responses or
  company_research are unavailable.
  CVTailoringLogic.tailor_cv() is async def — tests use @pytest.mark.asyncio.
  run_stage3_fact_verification() is synchronous — those tests remain sync.
  Tests also cover BOTH parsed_facts paths: populated (real user) and absent (test data).
  All tests fail with ImportError until CVT-P3 is implemented.

