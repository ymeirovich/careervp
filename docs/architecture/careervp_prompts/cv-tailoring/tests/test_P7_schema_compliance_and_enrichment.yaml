  # ── P7-C: ATS rules engine ─────────────────────────────────────────────────

  - id: T-P7-08
    name: test_ats_result_model_exists
    maps_to: AC-P7-08
    description: "ATSResult and ATSComponents must exist in cv_tailoring_models.py with all required fields"
    failure_before_implementation: "ImportError: cannot import name 'ATSResult' from 'careervp.models.cv_tailoring_models'"
    implementation: |
      from careervp.models.cv_tailoring_models import ATSComponents, ATSResult

      components = ATSComponents(
          keyword_match=32.0,
          quantified_bullets=16.0,
          section_headers=15.0,
          formatting_safety=15.0,
          summary_keyword_density=8.0,
      )
      result = ATSResult(
          total_score=86,
          grade='yellow',
          components=components,
          issues=[],
          keywords_matched=['Python', 'AWS'],
          keywords_missing=['Kubernetes'],
          keyword_match_score_1_10=9,
      )
      assert result.total_score == 86
      assert result.grade == 'yellow'
      assert result.components.keyword_match == 32.0
      assert result.keywords_matched == ['Python', 'AWS']
      assert result.keyword_match_score_1_10 == 9

