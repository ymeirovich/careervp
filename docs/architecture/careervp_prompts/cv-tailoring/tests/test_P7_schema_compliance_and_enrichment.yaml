################################################################################
# CAREERVP — CV TAILORING TEST SPECIFICATION
# Test Spec: P7 — Schema compliance, Stage 3 enrichment, ATS engine, handler
#             response alignment
################################################################################

spec_id: TEST-CVT-P7
title: "Unit tests: CVExperienceBullet model, Stage 3 enrichment, ATSResult engine, handler response schema compliance"
priority: high
status: draft
owner: backend
created_at: "2026-04-05"
updated_at: "2026-04-05"

source_spec: CVT-P7
test_file: "src/backend/tests/unit/cv_tailoring/test_schema_compliance.py"

################################################################################
# DESIGN PRINCIPLES
################################################################################

design_principles:
  fail_before_implementation: true
  failure_modes:
    - "ImportError — class/function/module absent (CVExperienceBullet, ATSResult, compute_ats_result)"
    - "AttributeError — field absent from model (keywords_to_emphasize, quantified)"
    - "pydantic.ValidationError — field type mismatch after model change"
    - "AssertionError — wrong value (empty dates, empty certs, wrong keyword strings, missing payload keys)"
  self_closing_tests: false
  markers:
    - "@pytest.mark.unit"
  isolation: "All LLM, DAL, AWS calls must be mocked. No real network or disk I/O."

################################################################################
# FIXTURES
################################################################################

fixtures:
  VALID_BULLET_TEXT_QUANTIFIED: "Generated $1M+ in training revenue within 18 months through paid program architecture."
  VALID_BULLET_TEXT_PLAIN: "Led cross-functional team to deliver learning ecosystem across multiple departments."

  VALID_CV_SECTIONS_EMPTY_DATES: |
    CVSections with experience[0].start_date='' and experience[0].end_date=None
    to simulate Stage 2 omitting dates (common LLM behavior).

  PARSED_FACTS_WITH_DATES: |
    UserCV with work_experience=[WorkExperience(company='AllCloud', role='Director',
    start_date='05/2021', end_date='07/2025', current=False)]

  PARSED_FACTS_WITH_CONTACT: |
    UserCV with contact_info=ContactInfo(name='Yitzchak Meirovich',
    email='y@example.com', phone='052-756-3792', location='Modiin, Israel',
    linkedin='linkedin.com/in/ymeirovich')

  PARSED_FACTS_WITH_CERTIFICATIONS: |
    UserCV with certifications=[Certification(name='AWS AAI', issuer='Amazon Web Services')]

################################################################################
# TEST CASES
################################################################################

tests:

  # ── P7-A: CVExperienceBullet model ─────────────────────────────────────────

  - id: T-P7-01
    name: test_cv_experience_bullet_model_exists
    maps_to: AC-P7-01
    description: "CVExperienceBullet must exist with text, source, user_edited, quantified fields"
    failure_before_implementation: "ImportError: cannot import name 'CVExperienceBullet' from 'careervp.models.cv_tailoring_models'"
    implementation: |
      from careervp.models.cv_tailoring_models import CVExperienceBullet

      bullet = CVExperienceBullet(
          text='Generated $1M+ in training revenue within 18 months.',
          source='parsed_facts',
      )
      assert hasattr(bullet, 'text'), 'CVExperienceBullet must have text field'
      assert hasattr(bullet, 'source'), 'CVExperienceBullet must have source field'
      assert hasattr(bullet, 'user_edited'), 'CVExperienceBullet must have user_edited field'
      assert hasattr(bullet, 'quantified'), 'CVExperienceBullet must have quantified field'
      assert bullet.source == 'parsed_facts'
      assert bullet.user_edited is False
      # quantified default can be False; the backward-compat validator sets it
      assert isinstance(bullet.quantified, bool)

  - id: T-P7-02
    name: test_cv_experience_section_bullets_accepts_strings
    maps_to: AC-P7-02
    description: "CVExperienceSection.bullets must auto-coerce plain strings to CVExperienceBullet; quantified=True when string contains \\d+|%|\\$"
    failure_before_implementation: "ImportError (CVExperienceBullet absent) or AssertionError (bullets remain str)"
    implementation: |
      from careervp.models.cv_tailoring_models import CVExperienceBullet, CVExperienceSection

      exp = CVExperienceSection(
          company='AllCloud',
          title='Director of AWS Training',
          start_date='05/2021',
          bullets=[
              'Generated $1M+ in training revenue within 18 months.',
              'Led cross-functional team across six departments.',
          ],
      )
      assert len(exp.bullets) == 2, f'Expected 2 bullets, got {len(exp.bullets)}'
      assert isinstance(exp.bullets[0], CVExperienceBullet), (
          f'Expected CVExperienceBullet, got {type(exp.bullets[0]).__name__} — P7-A not implemented'
      )
      assert exp.bullets[0].source == 'parsed_facts', (
          f"bullet.source must be 'parsed_facts', got {exp.bullets[0].source!r}"
      )
      assert exp.bullets[0].quantified is True, (
          "Bullet with '$1M+' must have quantified=True — check \\d+|%|\\$ regex"
      )
      assert exp.bullets[1].quantified is False, (
          "Bullet with no numeric metric must have quantified=False"
      )

  - id: T-P7-03
    name: test_parse_cv_sections_converts_bullets
    maps_to: AC-P7-03
    description: "_parse_cv_sections must convert LLM string bullets to CVExperienceBullet with source='parsed_facts'"
    failure_before_implementation: "ImportError (CVExperienceBullet absent) or AssertionError (bullets remain str)"
    implementation: |
      from careervp.logic.cv_tailoring_pipeline import _parse_cv_sections
      from careervp.models.cv_tailoring_models import CVExperienceBullet

      data = {
          'contact': {'name': 'Test User', 'email': 'test@example.com'},
          'summary': (
              'Strategic professional with 10 years of experience driving revenue growth '
              'and building scalable learning ecosystems across global organizations.'
          ),
          'skills': {'technical': ['Python', 'AWS'], 'soft': ['Leadership']},
          'experience': [
              {
                  'company': 'Acme',
                  'title': 'Engineer',
                  'start_date': '01/2020',
                  'bullets': [
                      'Reduced infrastructure costs by 40% through AWS optimisation.',
                      'Mentored junior engineers on best practices.',
                  ],
              }
          ],
          'education': [],
          'certifications': [],
      }
      cv_sections = _parse_cv_sections(data)

      assert len(cv_sections.experience) == 1
      exp = cv_sections.experience[0]
      assert len(exp.bullets) == 2, f'Expected 2 bullets, got {len(exp.bullets)}'
      assert isinstance(exp.bullets[0], CVExperienceBullet), (
          f'Expected CVExperienceBullet, got {type(exp.bullets[0]).__name__} — P7-A not implemented'
      )
      assert exp.bullets[0].source == 'parsed_facts'
      assert exp.bullets[0].quantified is True, (
          "Bullet with '40%' must be quantified — check \\d+|%|\\$ regex in _parse_cv_sections"
      )
      assert exp.bullets[1].quantified is False

  # ── P7-B: Stage3Result + Stage 3 enrichment ────────────────────────────────

  - id: T-P7-04
    name: test_stage3_result_has_keywords_to_emphasize
    maps_to: AC-P7-04
    description: "Stage3Result must have keywords_to_emphasize: list[str] field; pipeline must set it from stage1_output"
    failure_before_implementation: "AttributeError: 'Stage3Result' object has no attribute 'keywords_to_emphasize'"
    implementation: |
      from unittest.mock import patch
      from careervp.logic.cv_tailoring_pipeline import run_cv_tailoring_pipeline
      from careervp.models.cv import ContactInfo, UserCV, WorkExperience
      from careervp.models.cv_tailoring_models import (
          CVContactSection,
          CVExperienceSection,
          CVSections,
          CVSkillsSection,
          Stage2Output,
          Stage2Verification,
      )
      from careervp.models.result import Result, ResultCode

      cv_sections = CVSections(
          contact=CVContactSection(name='Test User', email='test@example.com'),
          summary=(
              'Strategic professional with 10 years of experience driving revenue growth '
              'and building scalable learning ecosystems across global teams.'
          ),
          skills=CVSkillsSection(technical=['Python', 'AWS'], soft=[]),
          experience=[
              CVExperienceSection(
                  company='Acme',
                  title='Engineer',
                  start_date='01/2020',
                  bullets=['Built distributed system handling 1M+ events per day.'],
              )
          ],
          education=[],
          certifications=[],
      )
      stage2_response = Stage2Output(
          verification=Stage2Verification(
              ats_keyword_score=7,
              keywords_added_in_review=[],
              summary_rewritten=False,
              fact_verification_passed=True,
              hallucination_flags=[],
          ),
          cv_sections=cv_sections,
      )
      user_cv = UserCV(
          user_id='u',
          cv_id='c',
          full_name='Test User',
          language='en',
          contact_info=ContactInfo(email='test@example.com'),
          professional_summary='Senior engineer with 10 years of experience.',
          experience=[
              WorkExperience(
                  company='Acme',
                  role='Engineer',
                  dates='2020 - Present',
                  achievements=['Built X'],
                  technologies=['Python'],
              )
          ],
          education=[],
          certifications=[],
          skills=['Python', 'AWS'],
          top_achievements=[],
          languages=['English'],
          is_parsed=True,
      )

      with patch(
          'careervp.logic.cv_tailoring_pipeline.run_stage2_cv_generation',
          return_value=Result(success=True, data=stage2_response, code=ResultCode.SUCCESS),
      ):
          result = run_cv_tailoring_pipeline(
              cv=user_cv,
              job_description='Senior Python engineer with AWS experience required.',
              vpr=None,
              llm_client=None,
          )

      assert result.success is True, f'Pipeline failed: {result.error!r}'
      assert result.data is not None
      assert hasattr(result.data, 'keywords_to_emphasize'), (
          "Stage3Result must have keywords_to_emphasize field — P7-B not implemented"
      )
      assert isinstance(result.data.keywords_to_emphasize, list), (
          f"keywords_to_emphasize must be list, got {type(result.data.keywords_to_emphasize)}"
      )

