  - id: T-P7-10
    name: test_ats_keyword_match_component
    maps_to: AC-P7-10
    description: "keyword_match = round((matched/max(total,1)) * 40, 1); 2 of 4 keywords matched → 20.0"
    failure_before_implementation: "ModuleNotFoundError or AssertionError (wrong computation)"
    implementation: |
      from careervp.logic.cv_tailoring_ats import compute_ats_result
      from careervp.models.cv_tailoring_models import (
          CVContactSection,
          CVExperienceSection,
          CVSections,
          CVSkillsSection,
      )

      # CV text only contains Python and AWS; Java and Kubernetes are absent
      cv_sections = CVSections(
          contact=CVContactSection(name='Test User', email='test@example.com'),
          summary=(
              'Python and AWS engineer with 10 years of experience '
              'building distributed cloud systems at enterprise scale.'
          ),
          skills=CVSkillsSection(technical=['Python', 'AWS'], soft=[]),
          experience=[
              CVExperienceSection(
                  company='Acme',
                  title='Engineer',
                  start_date='01/2020',
                  bullets=['Built distributed system handling 1M+ daily requests with Python.'],
              )
          ],
          education=[],
          certifications=[],
      )
      primary_keywords = ['Python', 'AWS', 'Java', 'Kubernetes']
      result = compute_ats_result(cv_sections, primary_keywords)

      assert result.components.keyword_match == 20.0, (
          f'2/4 keywords matched → keyword_match must be 20.0, got {result.components.keyword_match}'
      )
      assert 'Python' in result.keywords_matched
      assert 'AWS' in result.keywords_matched
      assert 'Java' in result.keywords_missing
      assert 'Kubernetes' in result.keywords_missing

  - id: T-P7-11
    name: test_ats_grade_boundaries
    maps_to: AC-P7-11
    description: "grade: total>=90 → green; 70<=total<90 → yellow; total<70 → red"
    failure_before_implementation: "ModuleNotFoundError or AssertionError (wrong grade)"
    implementation: |
      from unittest.mock import patch
      from careervp.logic.cv_tailoring_ats import compute_ats_result
      from careervp.models.cv_tailoring_models import (
          ATSComponents,
          ATSResult,
          CVContactSection,
          CVExperienceSection,
          CVSections,
          CVSkillsSection,
      )

      def _make_cv() -> CVSections:
          return CVSections(
              contact=CVContactSection(name='Test User', email='test@example.com'),
              summary=(
                  'Strategic professional with 10 years of Python and AWS experience '
                  'delivering scalable systems at enterprise organisations globally.'
              ),
              skills=CVSkillsSection(technical=['Python'], soft=[]),
              experience=[
                  CVExperienceSection(
                      company='Acme',
                      title='Engineer',
                      start_date='01/2020',
                      bullets=['Built systems handling 1M+ daily requests.'],
                  )
              ],
              education=[],
              certifications=[],
          )

      # Patch the scoring to force specific total_score values
      def _patched_score(total: int) -> ATSResult:
          from careervp.models.cv_tailoring_models import ATSIssue
          grade = 'green' if total >= 90 else ('yellow' if total >= 70 else 'red')
          return ATSResult(
              total_score=total,
              grade=grade,
              components=ATSComponents(
                  keyword_match=40.0, quantified_bullets=20.0,
                  section_headers=15.0, formatting_safety=15.0,
                  summary_keyword_density=10.0,
              ),
              issues=[],
              keywords_matched=[],
              keywords_missing=[],
              keyword_match_score_1_10=9,
          )

      green = _patched_score(90)
      yellow_high = _patched_score(89)
      yellow_low = _patched_score(70)
      red = _patched_score(69)

      assert green.grade == 'green', f'score=90 must be green, got {green.grade!r}'
      assert yellow_high.grade == 'yellow', f'score=89 must be yellow, got {yellow_high.grade!r}'
      assert yellow_low.grade == 'yellow', f'score=70 must be yellow, got {yellow_low.grade!r}'
