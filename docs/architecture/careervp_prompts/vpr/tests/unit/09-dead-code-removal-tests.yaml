id: "09-dead-code-removal-tests"
title: "Unit Tests — Dead Code Removal Verification (Spec 09)"
spec_id: "09-dead-code-removal"
target_path: "src/backend/tests/unit/test_vpr_dead_code_removed.py"
pytest_markers: ["unit"]
depends_on_spec: "09-dead-code-removal"
test_count: 8

description: |
  Tests confirming the dead symbols are gone from vpr_prompt.py and __init__.py.
  These tests assert ImportError on the deleted symbols so regressions are caught
  immediately if anyone adds the symbols back.

  Additionally, the test spec documents the CHANGES to make in existing test files
  (which cannot themselves be tested — they are edits, not additions).

  For the existing test file edits, see the `existing_file_edits` section below.

implementation_steps: |
  1. Read docs/architecture/careervp_prompts/vpr/specs/09-dead-code-removal.yaml
  2. Make the four changes described in that spec (vpr_prompt.py, __init__.py,
     test_vpr_prompt.py, test_vpr_prompts_phase2.py)
  3. Copy the code block below to src/backend/tests/unit/test_vpr_dead_code_removed.py
  4. Run all unit tests:
       cd src/backend && uv run pytest tests/unit/ -v --tb=short
  5. All 8 new tests should pass; existing test count should be lower by:
       - 2 from TestBuildVPRPrompt (test_vpr_prompt.py)
       - 1 from TestExistingPromptsPreserved.test_build_vpr_prompt_still_callable
       - 2 from TestPhase2SystemPrompts (validation tests)
       - 5 from TestBuildPhase2ValidationPrompt
     Total removed: 10 old tests, replaced by 8 cleaner guard tests

