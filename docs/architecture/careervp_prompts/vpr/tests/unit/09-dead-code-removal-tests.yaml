code: |
  """Guard tests confirming dead VPR prompt symbols are removed (spec 09).

  These tests assert that importing the deleted symbols raises ImportError,
  preventing silent regressions if the symbols are accidentally re-added.
  """
  from __future__ import annotations

  import importlib
  import pytest


  @pytest.mark.unit
  class TestDeadSymbolsRemovedFromVprPrompt:
      """Dead symbols must not exist in careervp.logic.prompts.vpr_prompt."""

      def test_vpr_generation_prompt_not_importable(self) -> None:
          """VPR_GENERATION_PROMPT must be removed from vpr_prompt.py."""
          import careervp.logic.prompts.vpr_prompt as m
          assert not hasattr(m, 'VPR_GENERATION_PROMPT'), (
              'VPR_GENERATION_PROMPT is dead code — it should not exist in vpr_prompt.py'
          )

      def test_build_vpr_prompt_not_importable(self) -> None:
          """build_vpr_prompt() must be removed from vpr_prompt.py."""
          import careervp.logic.prompts.vpr_prompt as m
          assert not hasattr(m, 'build_vpr_prompt'), (
              'build_vpr_prompt is dead code — it should not exist in vpr_prompt.py'
          )

      def test_phase2_validation_system_prompt_not_importable(self) -> None:
          """PHASE2_VALIDATION_SYSTEM_PROMPT must be removed from vpr_prompt.py."""
          import careervp.logic.prompts.vpr_prompt as m
          assert not hasattr(m, 'PHASE2_VALIDATION_SYSTEM_PROMPT'), (
              'PHASE2_VALIDATION_SYSTEM_PROMPT is dead code — Stage 4 LLM call was removed in spec 07'
          )

      def test_build_phase2_validation_prompt_not_importable(self) -> None:
          """build_phase2_validation_prompt() must be removed from vpr_prompt.py."""
          import careervp.logic.prompts.vpr_prompt as m
          assert not hasattr(m, 'build_phase2_validation_prompt'), (
              'build_phase2_validation_prompt is dead code — Stage 4 LLM call was removed in spec 07'
          )


  @pytest.mark.unit
  class TestDeadSymbolsRemovedFromInit:
      """Dead symbols must not be exported from careervp.logic.prompts."""

      def test_vpr_generation_prompt_not_in_init(self) -> None:
          """VPR_GENERATION_PROMPT must not be in prompts/__init__.py exports."""
          import careervp.logic.prompts as m
          assert not hasattr(m, 'VPR_GENERATION_PROMPT'), (
              'VPR_GENERATION_PROMPT must be removed from prompts/__init__.py __all__'
          )

      def test_build_vpr_prompt_not_in_init(self) -> None:
          """build_vpr_prompt must not be in prompts/__init__.py exports."""
          import careervp.logic.prompts as m
          assert not hasattr(m, 'build_vpr_prompt'), (
              'build_vpr_prompt must be removed from prompts/__init__.py __all__'
          )


  @pytest.mark.unit
  class TestLiveSymbolsStillPresent:
      """Live symbols must still be importable after the removal."""

      def test_phase2_system_prompt_still_present(self) -> None:
          """PHASE2_SYSTEM_PROMPT must still exist — imported by vpr_generator.py."""
          from careervp.logic.prompts.vpr_prompt import PHASE2_SYSTEM_PROMPT
          assert isinstance(PHASE2_SYSTEM_PROMPT, str)
          assert len(PHASE2_SYSTEM_PROMPT) > 50

      def test_build_phase2_prompt_still_present(self) -> None:
          """build_phase2_prompt() must still exist — imported by vpr_generator.py."""
          from careervp.logic.prompts.vpr_prompt import build_phase2_prompt
          assert callable(build_phase2_prompt)
