description: |
  Tests for the optional VPR integration in CV tailoring (spec 10). Covers:
    1. TailorCVRequest accepts vpr_id (model field test)
    2. build_user_prompt() injects VPR JSON when vpr is present
    3. build_user_prompt() output is unchanged when vpr is None (no regression)
    4. CVTailoringLogic.tailor_cv() fetches VPR via DAL when vpr_id is present
    5. CVTailoringLogic.tailor_cv() proceeds without VPR when fetch fails
    6. CVTailoringLogic.tailor_cv() proceeds without VPR when vpr_id is absent

  Uses fixtures from the existing conftest.py where available.
  Mocks DAL and LLM client — no network calls.

