description: |
  Tests for the DAL changes introduced in spec 05:
    1. save_vpr() uses snake_case keys (model_dump(mode='json'), NOT by_alias=True)
    2. get_next_vpr_version() returns 1 for new applications, N+1 for existing
    3. Legacy flat DynamoDB items deserialize without crashing (extra='ignore')
    4. VPR sort key format is ARTIFACT#VPR#v{N}

  Tests use a mock DynamoDB table (MagicMock) — no boto3/moto needed.

