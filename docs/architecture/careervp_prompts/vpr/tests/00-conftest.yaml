id: "00-conftest"
title: "Shared VPR Test Fixtures"
target_path: "src/backend/tests/vpr/conftest.py"
description: |
  Shared pytest fixtures used across all VPR test tiers (unit, integration, e2e, regression).
  Place this file at tests/vpr/conftest.py — pytest discovers it automatically for all
  files under tests/vpr/.

  Fixtures built against the NEW 10-section VPR schema (post spec 01).

implementation_steps: |
  1. Create directory structure:
       mkdir -p src/backend/tests/vpr/unit
       mkdir -p src/backend/tests/vpr/integration
       mkdir -p src/backend/tests/vpr/e2e
       mkdir -p src/backend/tests/vpr/regression
       touch src/backend/tests/vpr/__init__.py
       touch src/backend/tests/vpr/unit/__init__.py
       touch src/backend/tests/vpr/integration/__init__.py
       touch src/backend/tests/vpr/e2e/__init__.py
       touch src/backend/tests/vpr/regression/__init__.py

  2. Copy the `code` block below to src/backend/tests/vpr/conftest.py

  3. Verify conftest is importable (no import errors) once spec 01 is implemented:
       cd src/backend && uv run python -c "import tests.vpr.conftest"

  4. Run all fixtures sanity-check:
       uv run pytest tests/vpr/unit/ --collect-only

notes: |
  - UserCV, Experience, Education, Skill field names mirror the existing cv model.
    If field names differ, update the minimal_user_cv fixture accordingly.
  - mock_llm_result() is a plain function, not a fixture — call it directly in tests
    to build different payloads per test.
  - Result import path: adjust if careervp uses a different module path.
  - fake_dynamo_table is a plain dict (not a DynamoDB mock) — the DAL tests use an
    in-memory DynamoDalHandler or patch the table at the boto3 resource level.

code: |
  """Shared pytest fixtures for VPR test suite (all tiers)."""
  from __future__ import annotations

  import json
  from datetime import date
  from typing import Any
  from unittest.mock import MagicMock

  import pytest

  from careervp.models.vpr import (
      VPR,
      VPRApplicationStrategy,
      VPRCompetitiveAdvantage,
      VPRConcernsAndMitigations,
      VPRDifferentiators,
      VPREvidenceGaps,
      VPRExperienceGap,
      VPRExperienceMapping,
      VPRIdentifiedGap,
      VPRKeyAchievement,
      VPRKeywordGroup,
      VPRMetadata,
      VPRMitigation,
      VPRMustHave,
      VPRNiceToHave,
      VPRObjection,
      VPRPreemptiveResponse,
      VPRPrerequisite,
      VPRPrimaryValue,
      VPRPriorityGap,
      VPRQuantifiedImpact,
      VPRRelevantExperience,
      VPRRequirementBreakdown,
      VPRRequest,
      VPRResponsibility,
      VPRRoleAlignment,
      VPRSecondaryValue,
      VPRSkillsAnalysis,
      VPRSoftSkill,
      VPRStrength,
      VPRConcern,
      VPRTechnicalSkill,
      VPRToolProficiency,
      VPRUniqueStrength,
      VPRValueProposition,
      VPRExecutiveSummary,
  )


  # ── Helpers (plain functions, not fixtures) ───────────────────────────────────

  def mock_llm_result(payload: dict[str, Any]) -> Any:
      """Wrap a dict payload as a successful LLM Result (matches LLMClient response shape)."""
      from careervp.utils.result import Result  # import lazily to avoid circular imports

      return Result(
          success=True,
          data={
              "text": json.dumps(payload),
              "input_tokens": 100,
              "output_tokens": 200,
              "cost": 0.003,
              "model": "claude-sonnet-4-5",
          },
      )


  def mock_llm_failure(error: str = "LLM timeout") -> Any:
      """Return a failed LLM Result."""
      from careervp.utils.result import Result, ResultCode

      return Result(success=False, data=None, code=ResultCode.LLM_TIMEOUT, error=error)


  # ── CV / Request fixtures ─────────────────────────────────────────────────────

