id: "01-anti-ai-gate-regression"
title: "Regression Tests — Anti-AI Gate Thresholds (Never Weaken)"
target_path: "src/backend/tests/vpr/regression/test_anti_ai_gate.py"
pytest_markers: ["regression"]
test_count: 6

description: |
  Regression guard: quality gate thresholds must never be reduced.
  These tests import production constants directly and assert exact values.

  If any threshold is accidentally lowered (e.g. ANTI_AI_MIN_SCORE = 8.5),
  these tests catch it immediately.

  Covers:
    - ANTI_AI_MIN_SCORE = 9.0 (fvs_validator.py)
    - STRUCTURAL_MIN_SCORE = 8.0 (fvs_validator.py, new from spec 04)
    - GRAMMAR_MIN_SCORE = 9.0 (fvs_validator.py)
    - TONE_MIN_SCORE = 8.0 (fvs_validator.py)
    - MAX_STAGE6_RETRIES = 3 (vpr_generator.py)
    - BANNED_WORDS list not reduced (count must be >= baseline)

  These tests require NO mocking — they only import and assert constants.
  They should always pass on main branch, regardless of spec implementation state.

implementation_steps: |
  1. Copy code block to src/backend/tests/vpr/regression/test_anti_ai_gate.py
  2. Run immediately — these should pass even before spec implementation:
       cd src/backend && uv run pytest tests/vpr/regression/test_anti_ai_gate.py -v --tb=short
  3. Add to CI gate: run regression suite on every PR to main

code: |
  """Regression tests — anti-AI and quality gate thresholds must never weaken."""
  from __future__ import annotations

  import pytest


  @pytest.mark.regression
  class TestAntiAIGateThresholds:
      def test_anti_ai_min_score_is_9_0(self) -> None:
          """ANTI_AI_MIN_SCORE must remain exactly 9.0."""
          from careervp.logic.fvs_validator import ANTI_AI_MIN_SCORE

          assert ANTI_AI_MIN_SCORE == 9.0, (
              f"ANTI_AI_MIN_SCORE was changed to {ANTI_AI_MIN_SCORE}. "
              "This threshold must not be reduced — it guards output quality."
          )

      def test_grammar_min_score_is_9_0(self) -> None:
          """GRAMMAR_MIN_SCORE must remain exactly 9.0."""
          from careervp.logic.fvs_validator import GRAMMAR_MIN_SCORE

          assert GRAMMAR_MIN_SCORE == 9.0, (
              f"GRAMMAR_MIN_SCORE was changed to {GRAMMAR_MIN_SCORE}. "
              "Threshold must not be reduced."
          )

      def test_tone_min_score_is_8_0(self) -> None:
          """TONE_MIN_SCORE must remain at least 8.0."""
          from careervp.logic.fvs_validator import TONE_MIN_SCORE

          assert TONE_MIN_SCORE == 8.0, (
              f"TONE_MIN_SCORE was changed to {TONE_MIN_SCORE}."
          )

      def test_structural_min_score_is_8_0(self) -> None:
          """STRUCTURAL_MIN_SCORE (new from spec 04) must be exactly 8.0."""
          from careervp.logic.fvs_validator import STRUCTURAL_MIN_SCORE

          assert STRUCTURAL_MIN_SCORE == 8.0, (
              f"STRUCTURAL_MIN_SCORE was changed to {STRUCTURAL_MIN_SCORE}."
          )

      def test_max_stage6_retries_is_3(self) -> None:
          """MAX_STAGE6_RETRIES must remain 3 — changing it affects cost and quality."""
          from careervp.logic.vpr_generator import MAX_STAGE6_RETRIES

          assert MAX_STAGE6_RETRIES == 3, (
              f"MAX_STAGE6_RETRIES was changed to {MAX_STAGE6_RETRIES}. "
              "This controls maximum LLM retry cost per VPR generation."
          )

      def test_banned_words_count_not_reduced(self) -> None:
          """BANNED_WORDS list must not shrink below the baseline of 14 terms."""
          from careervp.logic.prompts.vpr_prompt import BANNED_WORDS

          # Baseline: 14 terms as of spec 02 (leverage, delve into, landscape, robust,
          # streamline, utilize, facilitate, implement, cutting-edge, best practices,
          # industry-leading, game-changer, paradigm shift, synergy)
          BASELINE_BANNED_WORD_COUNT = 14
          actual_count = len(BANNED_WORDS)

          assert actual_count >= BASELINE_BANNED_WORD_COUNT, (
              f"BANNED_WORDS shrank from {BASELINE_BANNED_WORD_COUNT} to {actual_count}. "
              "Do not remove banned terms — only add new ones."
          )
