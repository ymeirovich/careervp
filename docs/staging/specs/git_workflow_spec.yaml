# Git Workflow Specification

**Version:** 1.0
**Date:** 2026-02-24
**Purpose:** Define Git branch and deployment workflow for CareerVP staging environment

---

## Overview

This specification defines the Git workflow for deploying the CareerVP staging environment. The workflow uses a branch-based strategy where the `develop` branch triggers automatic deployments to staging.

---

## Specification

## Branch Strategy

### Branch Structure

| Branch | Purpose | Deployment Target | Protection |
|--------|---------|-------------------|------------|
| `main` | Production code | Dev (auto) | Required |
| `develop` | Staging code | Staging (auto) | Required |
| `feature/*` | New features | None | None |

### Branch Flow

```
feature/* → develop → main
                ↓
           staging (auto-deploy)
```

### Branch Naming Conventions

| Branch Type | Pattern | Example |
|-------------|---------|---------|
| Feature | `feature/<ticket>-<description>` | feature/123-add-vpr |
| Bugfix | `bugfix/<ticket>-<description>` | bugfix/456-fix-auth |
| Hotfix | `hotfix/<ticket>-<description>` | hotfix/789-security-patch |

---

## GitHub Workflows

### Workflow 1: deploy.yml (Existing)

**Trigger:** Push to `main` branch
**Purpose:** Auto-deploy to Dev environment
**Environment:** Dev

```yaml
name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev, staging, prod)'
        required: true
        default: dev
```

### Workflow 2: deploy-staging.yml (New)

**Trigger:**
- Push to `develop` branch
- Manual dispatch (`workflow_dispatch`)

**Purpose:** Deploy to Staging environment
**Environment:** Staging

```yaml
name: Deploy to Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:
```

### Environment Configuration

| Environment | Branch | GitHub Environment | Auto-Deploy |
|-------------|--------|-------------------|-------------|
| Dev | main | dev | Yes |
| Staging | develop | staging | Yes |
| Prod | release tags | prod | Manual |

---

## GitHub Environments

### Dev Environment

| Setting | Value |
|---------|-------|
| **Name** | dev |
| **Wait Timer** | 0 minutes |
| **Required Reviewers** | None |
| **Deployment Branch** | main |

### Staging Environment

| Setting | Value |
|---------|-------|
| **Name** | staging |
| **Wait Timer** | 0 minutes |
| **Required Reviewers** | None (for auto-deploy) |
| **Deployment Branch** | develop |

### Production Environment

| Setting | Value |
|---------|-------|
| **Name** | prod |
| **Wait Timer** | 5 minutes |
| **Required Reviewers** | 1 |
| **Deployment Branch** | release/* |

