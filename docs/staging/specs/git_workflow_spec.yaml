## Deployment Flow

### Automatic Deployment to Staging

1. Developer pushes to `develop` branch
2. GitHub Actions triggers `deploy-staging.yml`
3. Workflow runs quality gates:
   - Lint check (ruff)
   - Type check (mypy)
   - Unit tests (pytest)
4. CDK synth validates infrastructure
5. CDK Nag security scan
6. AWS credentials configured
7. SSM parameters synced
8. Stack deployed via CDK
9. Smoke tests run
10. Deployment complete

### Manual Deployment to Staging

1. Navigate to Actions → Deploy to Staging
2. Click "Run workflow"
3. Select staging environment (if prompted)
4. Click "Run workflow"
5. Follow deployment progress

---

## Quality Gates

All deployments must pass the following quality gates:

| Gate | Tool | Command | Timeout |
|------|------|---------|---------|
| Lint | ruff | `ruff check .` | 60s |
| Format | ruff | `ruff format --check .` | 60s |
| Type Check | mypy | `mypy careervp --strict` | 120s |
| Unit Tests | pytest | `pytest tests/unit -v` | 300s |
| CDK Synth | CDK | `cdk synth` | 180s |
| Security Scan | CDK Nag | `cdk synth \| cfn-guard` | 120s |

---

## Rollback Procedures

### Via Git (Recommended)

```bash
# Revert the develop branch to previous commit
git checkout develop
git log --oneline -5  # Find the previous good commit
git revert <commit-sha>
git push origin develop
```

### Via CloudFormation

```bash
# Rollback to previous stack state
aws cloudformation rollback-stack \
  --stack-name CareerVpCrudStaging \
  --region us-east-1
```

### Via GitHub

1. Navigate to Actions → Deploy to Staging
2. Find the previous successful workflow run
3. Click "Re-run all jobs"

---

## Security Considerations

1. **Branch Protection**: All main branches protected from direct push
2. **Required Reviews**: Production requires 1 reviewer
3. **Secret Management**: AWS credentials via OIDC (no long-lived keys)
4. **SSM Security**: API keys stored as SecureString
5. **Audit Trail**: All deployments logged in GitHub Actions

