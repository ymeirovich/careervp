# Staging Infrastructure Specification

**Version:** 1.0
**Date:** 2026-02-24
**Purpose:** Define infrastructure requirements for the CareerVP staging environment

---

## Overview

This specification defines the AWS infrastructure components required for the CareerVP staging environment. The staging environment is a near-production clone used for pre-production testing.

---

## Specification

### Stack Configuration

| Property | Value |
|----------|-------|
| **Stack Name** | CareerVpCrudStaging |
| **AWS Region** | us-east-1 |
| **Environment** | staging |
| **CDK App** | infra/app.py |

### SSM Parameters

| Parameter Name | Type | Description | Required |
|---------------|------|-------------|----------|
| `/careervp/staging/anthropic-api-key` | SecureString | Anthropic API key for AI features | Yes |
| `/careervp/staging/jwt-private-key` | String | JWT private key for auth | Yes |
| `/careervp/staging/jwt-public-key` | String | JWT public key for auth | Yes |

### DynamoDB Tables

All tables follow the naming pattern: `careervp-{feature}-staging`

| Table Name | Purpose | Billing Mode |
|------------|---------|--------------|
| `careervp-users-staging` | User profiles and auth | PAY_PER_REQUEST |
| `careervp-jobs-staging` | Job listings | PAY_PER_REQUEST |
| `careervp-cv-staging` | CV/resume storage | PAY_PER_REQUEST |
| `careervp-vpr-staging` | VPR results | PAY_PER_REQUEST |
| `careervp-gapanalysis-staging` | Gap analysis results | PAY_PER_REQUEST |
| `careervp-interviewprep-staging` | Interview prep results | PAY_PER_REQUEST |
| `careervp-coverletter-staging` | Cover letter results | PAY_PER_REQUEST |
| `careervp-llm-cache-staging` | LLM response cache | PAY_PER_REQUEST |
| `careervp-idempotency-staging` | Idempotency keys | PAY_PER_REQUEST |

**Note:** All tables use PAY_PER_REQUEST billing and have TTL enabled where appropriate.

### S3 Buckets

All buckets follow the naming pattern: `careervp-{environment}-{purpose}-{region}-{hash}`

| Bucket Name | Purpose |
|-------------|---------|
| `careervp-staging-cvs-{hash}` | CV file storage |
| `careervp-staging-results-{hash}` | Async operation results |

### Lambda Functions

All Lambda functions follow the naming pattern: `careervp-{feature}-lambda-{environment}`

| Function Name | Purpose | Runtime |
|---------------|---------|---------|
| `careervp-crud-lambda-staging` | Main API handler | Python 3.13 |
| `careervp-vpr-lambda-staging` | VPR async worker | Python 3.13 |
| `careervp-cv-tailoring-lambda-staging` | CV tailoring worker | Python 3.13 |
| `careervp-cover-letter-lambda-staging` | Cover letter worker | Python 3.13 |
| `careervp-gap-analysis-lambda-staging` | Gap analysis worker | Python 3.13 |
| `careervp-interview-prep-lambda-staging` | Interview prep worker | Python 3.13 |
| `careervp-company-research-lambda-staging` | Company research worker | Python 3.13 |

### API Gateway

| Property | Value |
|----------|-------|
| **API Name** | careervp-api-staging |
| **Stage** | prod |
| **Endpoint Type** | Regional |
| **Throttling** | 1000 requests/second |
| **Burst Limit** | 2000 requests |

### CloudWatch

| Component | Configuration |
|-----------|---------------|
| **Log Groups** | `/aws/lambda/careervp-*-staging` |
| **Retention** | 7 days |
| **Alarms** | Same as production (see monitoring spec) |

