## Configuration Files

### staging_configuration.json

Location: `infra/careervp/configuration/json/staging_configuration.json`

```json
{
    "features": {
        "premium_features": {
            "default": false,
            "rules": {
                "enable premium features for this specific customer name": {
                    "when_match": true,
                    "conditions": [
                        {
                            "action": "EQUALS",
                            "key": "customer_name",
                            "value": "RanTheBuilder"
                        }
                    ]
                }
            }
        },
        "ten_percent_off_campaign": {
            "default": true
        }
    },
    "countries": [
        "ISRAEL",
        "USA"
    ]
}
```

---

## Deployment Validation

### Pre-Deployment Checks

1. **SSM Parameters**: Verify all required SSM parameters exist
2. **Configuration**: Verify staging_configuration.json is valid JSON
3. **CDK Synth**: Verify CDK can synthesize staging stack
4. **Code Quality**: Verify code passes lint and type checks

### Post-Deployment Checks

1. **Stack Status**: Verify stack is in CREATE_COMPLETE or UPDATE_COMPLETE state
2. **API Health**: Verify `/health` endpoint returns 200 OK
3. **Resources**: Verify all DynamoDB tables and S3 buckets exist
4. **Logs**: Verify CloudWatch log groups are created

---

## Rollback Procedure

If staging deployment fails:

```bash
# CloudFormation rollback
aws cloudformation rollback-stack \
  --stack-name CareerVpCrudStaging \
  --region us-east-1

# Or delete stack entirely
aws cloudformation delete-stack \
  --stack-name CareerVpCrudStaging \
  --region us-east-1
```

---

## Security Considerations

1. **Secrets Management**: All secrets stored in SSM with appropriate IAM policies
2. **VPC**: Staging runs in same VPC as production (if applicable)
3. **IAM**: Least-privilege IAM roles for Lambda functions
4. **Encryption**: All DynamoDB tables and S3 buckets have encryption at rest enabled
5. **Access**: Staging accessible only via API Gateway (no direct Lambda access)

---

## Cost Optimization

1. **PAY_PER_REQUEST**: All DynamoDB tables use on-demand billing
2. **TTL**: Appropriate TTL on cache tables to reduce storage costs
3. **Log Retention**: 7-day log retention (vs 30 days for production)
4. **CloudWatch**: Basic metrics only (no detailed monitoring)

