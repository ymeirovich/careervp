## Data Seeding Strategy

### Option A: API-Based Seeding (Recommended)

1. Deploy staging environment
2. Run synthetic data generator
3. Use API calls to create users, jobs, and upload CVs

```bash
# Example API calls for seeding
API_URL="https://api-id.execute-api.us-east-1.amazonaws.com/prod"

# Register test users
for user in $(cat staging_test_users.json | jq -r '.[].email'); do
  curl -X POST "${API_URL}/api/auth/register" \
    -H "Content-Type: application/json" \
    -d "{\"email\": \"$user\", \"password\": \"TestPass123!\", ...}"
done
```

### Option B: Direct Database Seeding

Use AWS CLI or scripts to directly insert data into DynamoDB tables.

```bash
# Example: Insert test user
aws dynamodb put-item \
  --table-name careervp-users-staging \
  --item '{"user_id": {"S": "..."}, ...}'
```

