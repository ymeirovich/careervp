## Validation

### Data Quality Checks

| Check | Description |
|-------|-------------|
| Valid JSON | All output files are valid JSON |
| Required Fields | All required fields present |
| UUID Format | IDs follow UUID v4 format |
| Email Format | Emails use `@staging.careervp.com` domain |
| ISO8601 | Timestamps in ISO8601 format |
| No Duplicates | No duplicate IDs or emails |

### Test Execution

```bash
# Validate JSON files
python3 -c "import json; json.load(open('staging_test_users.json'))"
python3 -c "import json; json.load(open('staging_test_jobs.json'))"
python3 -c "import json; json.load(open('staging_test_cvs.json'))"

# Count records
jq 'length' staging_test_users.json  # Should be 10
jq 'length' staging_test_jobs.json  # Should be 20
jq 'length' staging_test_cvs.json   # Should be 5
```

