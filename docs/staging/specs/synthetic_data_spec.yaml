| `description` | string | Job description | `Looking for a talented...` |
| `requirements` | array[string] | Job requirements | `["3+ years experience", ...]` |
| `is_active` | boolean | Job status | `true` |
| `created_at` | ISO8601 | Creation timestamp | `2026-01-20T08:00:00Z` |
