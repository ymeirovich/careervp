## Maintenance

### Regular Updates

- Regenerate synthetic data quarterly
- Update job listings with current market data
- Refresh CVs with new skills/technologies

### Version Control

- Commit generated data files to repository
- Track changes in CHANGELOG.md
- Tag releases with data version

---

## Security Considerations

1. **No Real PII**: All data is synthetic
2. **Staging Domain**: Use `@staging.careervp.com` emails
3. **Isolated Data**: Staging data separate from dev/prod
4. **Auto-Cleanup**: Consider TTL for test data

