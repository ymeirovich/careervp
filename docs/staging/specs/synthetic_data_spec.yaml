## Data Generation Script

### Script Location

`docs/staging/scripts/generate_synthetic_data.py`

### Script Requirements

1. **Python 3.13+**: Compatible with project Python version
2. **No External Dependencies**: Uses only standard library
3. **JSON Output**: Generates JSON files for easy consumption
4. **Idempotent**: Can be run multiple times without side effects
5. **Documented**: Clear docstrings and usage instructions

### Usage

```bash
# Generate all synthetic data
python3 docs/staging/scripts/generate_synthetic_data.py

# Output:
# Generated 10 test users -> docs/staging/payloads/staging_test_users.json
# Generated 20 test jobs -> docs/staging/payloads/staging_test_jobs.json
# Generated 5 test CVs -> docs/staging/payloads/staging_test_cvs.json
```

