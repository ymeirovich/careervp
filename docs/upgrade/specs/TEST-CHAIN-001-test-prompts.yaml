# =============================================================================
# CATEGORY J: REGRESSION TESTS — VPR OUTPUT SCHEMA
# =============================================================================
regression_vpr_output_schema:
  prompt: |
    Context: FE-UI-033 moves the VPR output schema from the user prompt to the system prompt.
    The UI reads specific field names from the VPR JSON response. These must not change.

    Files: src/backend/tests/regression/test_vpr_output_schema_regression.py

    CRITICAL: These tests protect against field name regressions that would silently break the UI.

    Write regression tests covering:

    1. test_all_ui_consumed_fields_in_system_prompt
       Action: text = build_phase2_system_prompt()
       Assert each of these field names appears in text:
         - 'overall_fit_score'
         - 'top_three_strengths'
         - 'top_three_concerns'
         - 'recommended_approach'
         - 'positioning_statement'
         - 'ats_keywords'
         - 'primary'  (ats_keywords.primary subfield)
         - 'elevator_pitch'
         - 'metadata'

    2. test_vpr_model_fields_match_prompt_schema
       Description: Cross-check that VPR Pydantic model field names align with prompt schema
       Action: Import VPR model; get field names via model.model_fields.keys()
       Assert: The model has fields matching the critical schema names above
       Note: Catches drift between model and prompt if fields get renamed

    3. test_banned_words_list_not_empty
       Action: from vpr_prompt import BANNED_WORDS
       Assert: len(BANNED_WORDS) > 10  (anti-AI list must not be accidentally emptied)

    4. test_user_prompt_references_system_schema
       Action: output = build_phase2_prompt(...)
       Assert: Any of these appear: 'system prompt', 'schema in the system', 'Return JSON matching'
       (verifies the reference line replaced the inline schema)

    Run: cd src/backend && uv run pytest tests/regression/test_vpr_output_schema_regression.py -v --tb=short
    All 4 tests must pass.

# =============================================================================
# CATEGORY K: REGRESSION TESTS — CROSS-MODULE NON-REGRESSION
# =============================================================================
regression_cross_module:
  prompt: |
    Context: All prompt and handler changes in FE-UI-029 through FE-UI-034 must not
    break existing endpoints or cross-module behavior. Run the full existing test suite
    and verify no regressions.

    Steps:
    1. Run backend unit tests:
       cd src/backend && uv run pytest tests/unit/ -v --tb=short
       MUST: All tests pass. Zero failures.

    2. Run backend type check:
       cd src/backend && uv run mypy careervp --strict
       MUST: No new errors introduced by chain changes.

    3. Run frontend unit tests:
       cd src/frontend && npm run test:unit
       MUST: All tests pass.

    4. Run frontend integration tests:
       cd src/frontend && npm run test:integration
       MUST: All tests pass.

    5. Run frontend type check:
       cd src/frontend && npm run typecheck
       MUST: No new type errors.

