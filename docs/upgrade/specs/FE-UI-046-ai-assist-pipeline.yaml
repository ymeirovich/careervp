# =============================================================================
# ARCHITECTURE / OWNERSHIP MAP
# =============================================================================
architecture_ownership_map:
  owns_backend:
    - "POST /ai/assist handler: request validation, subscription/trial gate, server-side context resolution, prompt assembly, LLMClient call, error mapping, response shaping."
    - "Per-artifact prompt builders that COMPOSE existing digest helpers (no re-implementation of digests)."
    - "InterviewQuestion model extension (answer:str markdown, version:int, updated_at) + PATCH /interview-prep/{interviewPrepId} handler."
  does_not_own:
    - "Lambda function, IAM role/policy, log group, APIGW invoke permission, and route-method registration for BOTH POST /ai/assist and PATCH /interview-prep -> FE-UI-047 (infra)."
    - "Frontend edit surfaces, AI button onClick, autosave/draft mirror, Undo UX -> FE-UI-045 (frontend)."
    - "LLMClient / LLMResponseCache / digest-helper internals (consumed as-is)."
  context_resolution_contract:
    trust_boundary: "Server resolves all cross-artifact context from DynamoDB by (user_id from JWT, application_id). The client request supplies ONLY artifact_type, artifact_id, application_id, field_key, current_text, locale."
    do_not_refetch: "The artifact under edit is NOT re-fetched; current_text is authoritative for it (avoids clobbering the user's in-progress, possibly-unsaved edit)."
    ownership_check: "application_id must belong to the JWT user_id; otherwise 403/404 (do not leak other users' artifacts)."
  cache_strategy:
    cached_system_prompt: "Invariant preamble (artifact role + anti-AI 8-pattern + STAR template + output-format contract) -> use_system_cache=True (cache_control ephemeral). Stable per (artifact_type, locale)."
    user_message: "current_text + resolved digests -> user message (varies per request; not cached at the prompt-prefix level)."
    response_cache: "LLMResponseCache key includes prompt|cv|model|temp; field-scoped assist is naturally deterministic-cacheable but MUST include field_key + current_text in the cache key so distinct fields/edits don't collide."
  primary_files:
    - "src/backend/careervp/handlers/ai_assist_handler.py (NEW)"
    - "src/backend/careervp/logic/prompts/ai_assist_prompt.py (NEW)"
    - "src/backend/careervp/models/interview_prep.py (extend)"
    - "src/backend/careervp/handlers/interview_prep_handler.py (add PATCH branch)"
  cascade_risk: "medium — new public endpoint touching subscription gating + multi-artifact reads; Interview Prep model change is additive (new optional fields)."

# =============================================================================
# FIX PLAN
# =============================================================================
fix_plan:
  files_to_modify:
    - file: src/backend/careervp/models/interview_prep.py
      change: >
        Extend InterviewQuestion with user-edited answer fields: answer: str | None (Markdown),
        answer_version: int (optimistic-concurrency token), answer_updated_at: datetime | None.
        Keep suggested_answer untouched. New fields are optional/back-compatible with existing items.
    - file: src/backend/careervp/handlers/interview_prep_handler.py
      change: >
        Add a PATCH /interview-prep/{interviewPrepId} branch mirroring cover_letter PATCH
        (cover_letter_handler.py:1411): req { question_id, answer:'<string>' } (or a list of
        {question_id, answer}); resolve user_id from JWT; write answer onto the matching question,
        bump answer_version + answer_updated_at; enforce base_version optimistic-concurrency
        (FE-UI-045 sends it) -> 409 on mismatch; resp { status:'completed', interview_prep_id,
        question_id, answer, answer_version }.
  files_to_create:
    - file: src/backend/careervp/handlers/ai_assist_handler.py
      purpose: >
        POST /ai/assist Lambda handler. Steps: (1) parse + validate body; (2) resolve user_id from
        JWT and verify application_id ownership; (3) subscription/trial gate -> 401|402 if inactive;
        (4) resolve cross-artifact context per artifact_type via ai_assist_prompt builders using
        existing digest helpers + dal resolvers (NOT re-fetching the artifact under edit);
        (5) call LLMClient.complete(use_system_cache=True) with the cached preamble + user message;
        (6) map errors to 504/503/409/400/500; (7) return { generated_markdown, model, tokens }.
        Hard-cap work to the 25 s Lambda timeout.
    - file: src/backend/careervp/logic/prompts/ai_assist_prompt.py
      purpose: >
        Per-artifact prompt assembly. build_system_preamble(artifact_type, locale) -> cached static
        string (role + anti-AI 8-pattern from CLAUDE.md + STAR template for interview_prep +
        output-format contract). build_user_message(artifact_type, field_key, current_text, context)
        -> composes existing digests: gap=CV digest+sub-question; cv_tailored=CV digest+gap+VPR;
        cover_letter=gap+VPR+cv_tailored+company_research; interview_prep=gap+VPR+cv_tailored.
        Reuses cover_letter_prompt.build_cv_digest/_build_vpr_summary/_format_company_research and
        vpr_prompt.build_vpr_digest — does NOT reimplement them.
  dependencies:
    upstream:
      - "LLMClient.complete(use_system_cache=True) (llm_client.py:177); LLMResponseCache (llm_cache.py)."
      - "Digest helpers (cover_letter_prompt, vpr_prompt) + dal.get_vpr / dal.get_gap_responses / _resolve_cover_letter_context."
      - "Subscription/trial gate utility (existing billing/entitlement check used by other gated routes)."
    downstream:
      - "FE-UI-047 provisions the Lambda + role + registers POST /ai/assist and PATCH /interview-prep route methods. This handler code is dead until that infra lands."
      - "FE-UI-045 supplies current_text and applies generated_markdown (200-only) through autosave."

# =============================================================================
# ACCEPTANCE CRITERIA
# =============================================================================
acceptance_criteria:
  - id: AC-001
    given: An authenticated user with an active subscription owns application_id, editing a cover_letter field
    when: POST /ai/assist { artifact_type:'cover_letter', artifact_id, application_id, field_key, current_text, locale } is called
    then: >
      Response is 200 { generated_markdown, model, tokens }. The server resolved Gap + VPR +
      Tailored CV + Company Research from DynamoDB; it did NOT re-fetch the cover_letter under edit;
      no application credit was consumed.

  - id: AC-002
    given: An authenticated user editing a gap_analysis field
    when: POST /ai/assist with artifact_type='gap_analysis' is called
    then: The prompt context contains the base/uploaded CV digest + the focused sub-question only; response is 200 with generated_markdown.

  - id: AC-003
    given: An authenticated user editing a cv_tailored field
    when: POST /ai/assist with artifact_type='cv_tailored' is called
    then: The prompt context contains CV digest + Gap responses + VPR digest; the system preamble instructs impact/factual/ATS-keyword-aware rewriting; response is 200.

  - id: AC-004
    given: An authenticated user editing an interview_prep STAR answer
    when: POST /ai/assist with artifact_type='interview_prep' is called
    then: The prompt context contains Gap + VPR + Tailored CV and the cached preamble includes the STAR template; response is 200.

  - id: AC-005
    given: Any /ai/assist request
    when: The system prompt is assembled
    then: >
      The invariant preamble (artifact role + anti-AI 8-pattern rules + STAR template where applicable
      + output-format contract) is sent via use_system_cache=True (cache_control ephemeral); current_text
      and digests are in the user message, not the cached prefix.

  - id: AC-006
    given: A request whose application_id does not belong to the JWT user_id
    when: POST /ai/assist is called
    then: Response is 403 (or 404) and no other user's artifacts are read or returned.

  - id: AC-007
    given: A user whose subscription and trial are both inactive
    when: POST /ai/assist is called
    then: Response is 401 or 402 (inactive subscription-or-trial); no LLM call is made; no credit logic runs.

  - id: AC-008
    given: The LLM call exceeds the 25 s Lambda budget
    when: POST /ai/assist times out internally
    then: Response is 504 timeout; the field is left unchanged on the client (FE-UI-045 contract).

  - id: AC-009
    given: The LLM provider circuit-breaker is open / provider unavailable
    when: POST /ai/assist is called
    then: Response is 503 with retry_after; field unchanged.

  - id: AC-010
    given: artifact_type requires an upstream artifact (e.g. cover_letter needs VPR/Company Research) that is missing
    when: POST /ai/assist is called
    then: Response is 409 indicating the missing upstream artifact (deep-link payload), enabling the client to route the user to generate it; field unchanged.

  - id: AC-011
    given: A malformed request (missing required field, unknown artifact_type) or an unexpected server error
    when: POST /ai/assist is called
    then: Response is 400 (validation) or 500 (generic, safe message); field unchanged in every case.

  - id: AC-012
    given: Two distinct fields (different field_key/current_text) on the same artifact
    when: Both call /ai/assist
    then: LLMResponseCache keys differ (key includes field_key + current_text + model + temp), so one field's result is never served for another.

  - id: AC-013
    given: An interview_prep artifact and an authenticated owner
    when: PATCH /interview-prep/{interviewPrepId} { question_id, answer:'<markdown>' } is called
    then: >
      The answer is stored on the matching question; answer_version increments; answer_updated_at is set;
      resp is { status:'completed', interview_prep_id, question_id, answer, answer_version }; suggested_answer
      is untouched.

  - id: AC-014
    given: A PATCH /interview-prep with a stale base_version
    when: The handler compares versions
    then: Response is 409 (optimistic-concurrency conflict); the stored answer is unchanged.

  - id: AC-015
    given: Existing interview_prep items created before this change (no answer field)
    when: They are read or PATCHed
    then: They deserialize without error (new fields optional/back-compatible); first PATCH initializes answer_version.

# =============================================================================
# STATES TO HANDLE
# =============================================================================
states_to_handle:
  - { state: assist_success, trigger: "Context resolved, LLM returned within budget", response: "200 { generated_markdown, model, tokens }" }
  - { state: not_owner, trigger: "application_id not owned by JWT user", response: "403/404; no cross-user read" }
  - { state: inactive_entitlement, trigger: "No active subscription or trial", response: "401|402; no LLM call" }
  - { state: timeout, trigger: "LLM call exceeds 25 s budget", response: "504; field unchanged" }
  - { state: circuit_open, trigger: "Provider unavailable / breaker open", response: "503 { retry_after }; field unchanged" }
  - { state: upstream_missing, trigger: "Required upstream artifact absent", response: "409 deep-link payload; field unchanged" }
  - { state: bad_request, trigger: "Missing/invalid field or unknown artifact_type", response: "400; field unchanged" }
  - { state: server_error, trigger: "Unexpected exception", response: "500 safe message; field unchanged" }
  - { state: ip_answer_saved, trigger: "PATCH /interview-prep success", response: "200 { status, interview_prep_id, question_id, answer, answer_version }" }
  - { state: ip_conflict, trigger: "PATCH /interview-prep stale base_version", response: "409; stored answer unchanged" }

