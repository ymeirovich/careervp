spec_id: FE-UI-046
title: "Synchronous field-scoped AI-assist pipeline (POST /ai/assist) + Interview Prep STAR persistence (PATCH /interview-prep)"
priority: high
status: draft
owner: backend
created_at: 2026-06-20
updated_at: 2026-06-20
tier: feature

recommended_model: opus
reason_for_model: >
  A new synchronous public AI endpoint must compose cross-artifact prompt context server-side
  (never trusting the client), reuse the existing cached-system-prompt + DynamoDB response-cache
  path correctly, enforce subscription/trial gating, and map seven distinct error classes to
  precise HTTP codes within a 25 s budget under a 29 s APIGW hard ceiling. It also extends the
  Interview Prep persistence model and adds a new PATCH. Prompt-context correctness, cache-key
  determinism, and error-path completeness are architecture-sensitive.

depends_on:
  - FE-UI-045   # frontend field-scoped edit surfaces + autosave that consume this endpoint
blocks:
  - FE-UI-047   # nested-stack infra that provisions the AI-assist Lambda/role + registers both routes
prior_art:
  - FE-UI-020   # RichTextEditor — the field surfaces whose plain-string values are sent as current_text
  - FE-UI-032   # prompt externalization
  - FE-UI-033   # token optimization (system-prompt caching)

# =============================================================================
# PROBLEM STATEMENT
# =============================================================================
problem_statement:
  current_behavior: >
    There is no AI-assist endpoint. Users can edit artifact fields (after FE-UI-045) but cannot
    ask the model to rewrite/improve a single field with full awareness of the user's other
    artifacts. Separately, Interview Prep has no persisted user answer: models/interview_prep.py
    InterviewQuestion carries suggested_answer but no user-editable, versioned field, and there is
    no PATCH /interview-prep route — the page is read-only. The pieces needed to build a good
    field-scoped assist already exist but are unused for this purpose:
      - LLMClient.complete(use_system_cache=True) sends the system prompt with cache_control
        ephemeral (logic/llm_client.py:177).
      - cv_tailoring_prompt.py:202 already structures a static, cacheable system prompt.
      - LLMResponseCache (logic/llm_cache.py) is a DynamoDB 7-day deterministic cache keyed
        SHA-256(prompt | cv | model | temp). Default model Haiku (claude-haiku-4-5-20251001).
      - Cross-artifact digest helpers already exist: cover_letter_prompt.py
        build_cv_digest / _build_vpr_summary / _format_company_research; vpr_prompt.build_vpr_digest;
        server resolvers _resolve_cover_letter_context / dal.get_vpr / dal.get_gap_responses.
  required_behavior: >
    A SYNCHRONOUS, strictly FIELD-SCOPED endpoint POST /ai/assist that rewrites ONE field with
    server-resolved cross-artifact context, plus a new Interview Prep persistence path:

    1. POST /ai/assist. Request:
       { artifact_type, artifact_id, application_id, field_key, current_text, locale }.
       The server RESOLVES all other artifacts from DynamoDB (never trusts the client for context)
       and does NOT re-fetch the artifact currently under edit (current_text is authoritative for it).
       Response: { generated_markdown, model, tokens }. The call is free with an active
       subscription/trial and does NOT consume an application credit.
    2. Per-artifact prompt context (compose from EXISTING digest helpers):
       - Gap Analysis -> base/uploaded CV digest + the focused sub-question.
       - Tailored CV  -> base/uploaded CV digest + Gap responses + VPR digest
                         (rewrite the focused field for impact, factual, ATS-keyword-aware).
       - Cover Letter -> Gap + VPR + Tailored CV + Company Research.
       - Interview Prep -> Gap + VPR + Tailored CV.
       Invariant preamble (per-artifact system role + anti-AI 8-pattern rules from careervp/CLAUDE.md
       + STAR template + output-format contract) goes in the CACHED system prompt
       (use_system_cache=True). current_text + the resolved digests go in the USER message.
    3. Lambda timeout 25 s (one safety margin below the APIGW 29 s hard limit).
    4. Interview Prep persistence: extend InterviewQuestion with a user-edited answer field
       (Markdown string) + version + updated_at; add PATCH /interview-prep/{interviewPrepId}
       mirroring the cover-letter PATCH shape: req { answer:'<string>' } per question_id -> stored
       on that question; resp echoes status + stored answer + version.
  user_impact: >
    Users get one-click, context-aware rewrites of a single field that respect their actual CV/VPR/
    gap answers and the anti-AI style rules, without spending a credit, and Interview Prep STAR
    answers become first-class editable, persisted content.

