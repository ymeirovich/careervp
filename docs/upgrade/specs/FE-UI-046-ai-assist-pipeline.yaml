# =============================================================================
# DESIGN NOTES
# =============================================================================
design_notes:
  - >
    The single most important invariant: the server NEVER trusts the client for cross-artifact
    context. Only artifact_type/artifact_id/application_id/field_key/current_text/locale come from
    the client. Everything else (CV digest, VPR, gap responses, company research, tailored CV) is
    resolved server-side by (JWT user_id, application_id). current_text is the one exception — it is
    the in-progress field value and is authoritative, so the artifact under edit is NOT re-fetched.
  - >
    Caching split: put the STABLE preamble (artifact role + anti-AI 8-pattern + STAR template +
    output-format contract) in the cached system prompt (use_system_cache=True) so the cacheable
    prefix is large and stable per (artifact_type, locale). The volatile current_text + digests go in
    the user message. This maximizes prompt-cache hit rate while keeping per-request content correct.
  - >
    LLMResponseCache key MUST include field_key + current_text in addition to model + temp, or two
    different fields (or two edits of the same field) could collide and serve stale/wrong text. This
    is the one cache-key change required by field-scoping (AC-012).
  - >
    Error-path completeness is a hard requirement: EVERY non-200 path (504/503/409/401|402/400/500)
    must leave both the server artifact and the client field unchanged. The client (FE-UI-045) applies
    generated_markdown only on 200, then routes it through autosave + the localStorage draft mirror so
    even a post-apply crash is recoverable, and offers single-level Undo to the pre-AI snapshot.
  - >
    Anti-AI 8-pattern rules (careervp/CLAUDE.md Decision 1.6) belong in the cached preamble so every
    rewrite is style-compliant by construction (avoid AI cliches, vary sentence structure, natural
    transitions, avoid perfect parallelism). For interview_prep also embed the STAR template
