# =============================================================================
# DESIGN NOTES
# =============================================================================
design_notes:
  - >
    The parent/nested split is dictated by two hard facts: (1) the parent is at 486/500 so compute
    must move off-budget, and (2) APIGW methods bind to the shared RestApi which lives in the parent,
    so the route methods CANNOT be created inside the nested stack. Net: nested stack holds Lambda +
    role + log group + permission (~5 resources, off-parent); parent holds the nested-stack node + the
    2 methods (~3 resources). Projected parent ~489, conservative ceiling ~495, hard limit 500.
  - >
    Mirror MonitoringNestedStack (monitoring.py:227, wired at service_stack.py:62) for the
    instantiation + cross-stack reference style. Pass the shared RestApi, the four table refs, the
    SSM parameter, and the existing interview-prep Lambda IN; pass the assist Lambda OUT so the parent
    route map can integrate POST /ai/assist. Do not let the nested stack reach back and mutate the
    parent's RestApi directly — that invites circular dependencies.
  - >
    IAM is least-privilege by design: read-only across exactly the four named tables (artifact, gap,
    VPR, company-research), scoped ssm:GetParameter on ANTHROPIC_API_KEY (+ KMS decrypt if
    SecureString), and Logs write to its own group. No DynamoDB writes from the assist role — the
    assist endpoint is read+generate only; the PATCH /interview-prep persistence uses the EXISTING
    interview-prep Lambda's own role, not this one.
  - >
    The human approval gate is mandatory and blocks deploy to ALL environments including dev, because
    this introduces a new cross-table read role, a secret grant, and a new public route at once. Record
    approval before any synth-to-deploy. Verify staging/prod parent resource counts independently before
    promoting beyond dev (dev was the only environment whose 486 baseline is verified).
  - >
    PATCH /interview-prep/{interviewPrepId} targets the EXISTING interview-prep Lambda (which gains its
    handler branch in FE-UI-046); this spec only registers the route method. POST /ai/assist targets the
    NEW assist Lambda in the nested stack. Keep the camelCase path-param convention ({interviewPrepId})
    consistent with existing routes.
