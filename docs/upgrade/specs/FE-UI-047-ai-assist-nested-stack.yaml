spec_id: FE-UI-047
title: "AiAssistNestedStack — provision AI-assist Lambda/role off the parent budget + register POST /ai/assist and PATCH /interview-prep on the shared RestApi"
priority: high
status: draft
owner: backend
created_at: 2026-06-20
updated_at: 2026-06-20
tier: feature

human_approval_gate:
  required: true
  gate_number: 1
  reason: >
    This spec creates a NEW IAM execution role that reads across the artifact, gap, VPR, and
    company-research DynamoDB tables and accesses the SSM-stored ANTHROPIC_API_KEY, and exposes a
    NEW PUBLIC route (POST /ai/assist) plus PATCH /interview-prep. A new cross-table read role,
    secret access, and a new nested stack are security-sensitive and must be reviewed before synth/deploy.
  approval_before: "Any IAM role/policy creation, SSM ANTHROPIC_API_KEY grant, nested-stack instantiation, or route registration being deployed to any environment (incl. dev)."

recommended_model: opus
reason_for_model: >
  The parent stack CareerVpCrudDev synthesizes at 486/500 resources against a HARD 500 ceiling. The
  AI-assist compute must be isolated into a new NestedStack so the parent gains ~1 resource, while the
  route METHODS must still be added on the SHARED RestApi in the parent (methods bind to the shared
  API, not the nested stack). Getting that parent/nested split right, sizing IAM least-privilege across
  four tables + SSM, and keeping parent synth <=500 is architecture- and security-sensitive.

depends_on:
  - FE-UI-046   # the AI-assist handler + interview-prep PATCH handler this stack deploys
prior_art:
  - FE-UI-036   # nested-stack split pattern
  - FE-UI-037   # nested-stack reconciliation
  - FE-UI-020   # RichTextEditor (the edit surfaces these routes ultimately serve)

# =============================================================================
# PROBLEM STATEMENT
# =============================================================================
problem_statement:
  current_behavior: >
    There is no compute or routing for AI-assist. The parent CDK stack CareerVpCrudDev already
    synthesizes at 486/500 resources against a HARD CloudFormation limit of 500, so adding a Lambda
    function + log group + execution role + role policy + APIGW invoke permission (~5 resources)
    directly to the parent risks blowing the ceiling and is fragile. One nested stack already exists
    and is wired (MonitoringNestedStack, infra/careervp/monitoring.py:227, attached in
    infra/careervp/service_stack.py:62), establishing the pattern. API routes are registered as an
    explicit list via _add_route_method in infra/careervp/api_construct.py:2695-2748; the new
    POST /ai/assist and PATCH /interview-prep methods are not registered anywhere.
  required_behavior: >
    Split AI-assist compute into a NEW nested stack and register only the route methods in the parent:

    1. AiAssistNestedStack(NestedStack): contains the AI-assist Lambda function, its CloudWatch log
       group, its IAM execution role + role policy, and the APIGW invoke permission. In the parent,
       this nested stack instantiation is ~1 resource (the AWS::CloudFormation::Stack), keeping parent
       growth minimal.
    2. The two new route METHODS (POST /ai/assist, PATCH /interview-prep/{interviewPrepId}) are added
       on the SHARED RestApi construct in the PARENT via the api_construct.py route map
       (_add_route_method, api_construct.py:2695-2748), because API Gateway methods bind to the shared
       API — they cannot live in the nested stack. This is the deliberate parent/nested split.
    3. The Lambda IAM role is least-privilege: DynamoDB read on the artifact, gap, VPR, and
       company-research tables; SSM read of ANTHROPIC_API_KEY; CloudWatch Logs write. No write grants
       to artifact tables from the assist role (assist is read+generate only; persistence is via the
       existing PATCH handlers' own roles).
    4. A regression budget: cdk synth of the parent must remain <= 500 resources after this change.
  user_impact: >
    AI-assist (FE-UI-046) and Interview Prep persistence (FE-UI-045/046) become reachable in the
    deployed environment without breaching the 500-resource parent-stack ceiling.

# =============================================================================
# EVIDENCE (file:line)
# =============================================================================
evidence:
  parent_at_ceiling:
    - { note: "Parent stack CareerVpCrudDev synthesizes at 486/500 resources; HARD CloudFormation limit is 500." }
  nested_stack_pattern_exists:
    - { file: infra/careervp/monitoring.py, line: 227, note: "MonitoringNestedStack — existing NestedStack precedent" }
    - { file: infra/careervp/service_stack.py, line: 62, note: "MonitoringNestedStack wired into the service stack — instantiation pattern to mirror" }
  route_registration:
    - { file: infra/careervp/api_construct.py, line: "2695-2748", note: "_add_route_method — explicit route list; new POST /ai/assist + PATCH /interview-prep methods are added here on the shared RestApi" }
  shared_api_binding:
    - { note: "APIGW methods bind to the shared RestApi construct owned by the parent; they cannot be created inside a NestedStack, hence the split." }

# =============================================================================
# ARCHITECTURE / OWNERSHIP MAP
# =============================================================================
architecture_ownership_map:
  parent_stack_owns:
    - "Instantiation of AiAssistNestedStack (1 AWS::CloudFormation::Stack resource in parent)."
    - "Route method POST /ai/assist on the shared RestApi (+ its integration + invoke wiring)."
    - "Route method PATCH /interview-prep/{interviewPrepId} on the shared RestApi (targets the EXISTING interview-prep Lambda, which gains the PATCH branch from FE-UI-046)."
    - "Any new path-part Resource nodes required (/ai, /ai/assist, /interview-prep, {interviewPrepId}) if they do not already exist."
  nested_stack_owns:
    - "AI-assist Lambda function (the FE-UI-046 ai_assist_handler)."
    - "AI-assist Lambda CloudWatch log group."
    - "AI-assist Lambda IAM execution role + role policy (least-privilege)."
    - "APIGW invoke permission (Lambda permission) for the assist Lambda."
  iam_least_privilege:
    dynamodb_read:
      - "artifacts-table (ARTIFACTS_TABLE_NAME) — read cover_letter / interview_prep / company_research artifacts"
      - "gap responses table — read gap_responses (dal.get_gap_responses)"
      - "VPR store — read VPR (dal.get_vpr / VPR_RESULTS_BUCKET_NAME if S3-backed)"
      - "company-research source table(s) — read company research digest"
    ssm: "ssm:GetParameter on ANTHROPIC_API_KEY (decrypt via the existing KMS key if SecureString)"
    logs: "CloudWatch Logs write to the assist Lambda log group only"
    explicitly_denied: "No DynamoDB write/PutItem/UpdateItem from the assist role — assist is read+generate only."
  route_method_split_rationale: >
    Lambda + role + log group + permission are environment compute -> nested stack (off parent budget).
    APIGW methods bind to the shared RestApi which lives in the parent -> must be registered in the
    parent route map. This is why the two route methods are NOT in the nested stack.
  primary_files:
    - "infra/careervp/ai_assist_nested_stack.py (NEW — AiAssistNestedStack)"
    - "infra/careervp/service_stack.py (instantiate AiAssistNestedStack, mirror monitoring.py:227 wiring at service_stack.py:62)"
    - "infra/careervp/api_construct.py (register POST /ai/assist + PATCH /interview-prep via _add_route_method, ~2695-2748)"
  cascade_risk: "high — touches the shared RestApi route map + new IAM across four tables + SSM secret; gated by human approval."

# =============================================================================
# FIX PLAN
# =============================================================================
fix_plan:
  files_to_modify:
    - file: infra/careervp/service_stack.py
      change: >
        Instantiate AiAssistNestedStack (mirror the MonitoringNestedStack wiring at service_stack.py:62),
        passing references to the artifact/gap/VPR/company-research tables (+ VPR bucket if S3),
        the ANTHROPIC_API_KEY SSM parameter, the shared RestApi, and the existing interview-prep Lambda.
        Pass back the assist Lambda so the parent route map can wire POST /ai/assist to it.
    - file: infra/careervp/api_construct.py
      change: >
        Register two new route methods via _add_route_method (2695-2748) on the shared RestApi:
        POST /ai/assist -> assist Lambda (from the nested stack);
        PATCH /interview-prep/{interviewPrepId} -> existing interview-prep Lambda (FE-UI-046 PATCH branch).
        Use the same Cognito authorizer + camelCase path params as existing routes. Add path-part
        Resources only if /ai, /ai/assist, /interview-prep, {interviewPrepId} do not already exist.
  files_to_create:
    - file: infra/careervp/ai_assist_nested_stack.py
      purpose: >
        AiAssistNestedStack(NestedStack): defines the AI-assist Lambda (handler =
        ai_assist_handler from FE-UI-046, timeout 25 s, env: ARTIFACTS_TABLE_NAME, gap/VPR/CR table
        envs, ANTHROPIC_API_KEY ref, ALLOWED_ORIGINS, default model claude-haiku-4-5-20251001),
        its log group, its least-privilege IAM role + policy (DynamoDB read x4 tables, SSM
        GetParameter on ANTHROPIC_API_KEY, Logs write), and the APIGW invoke permission for the
        assist Lambda. Exposes the Lambda for the parent route map to wire POST /ai/assist.
  dependencies:
    upstream:
      - "FE-UI-046 handler code (ai_assist_handler, interview_prep PATCH branch) must exist before this stack can reference them."
      - "Existing shared RestApi construct + Cognito authorizer (api_construct.py)."
      - "Existing interview-prep Lambda (gains the PATCH branch from FE-UI-046)."
      - "ANTHROPIC_API_KEY SSM parameter + (if SecureString) its KMS key."
    downstream:
      - "FE-UI-045 frontend + FE-UI-046 endpoints are only reachable in a deployed env once this stack is applied."

# =============================================================================
# RESOURCE-COUNT MATH (parent budget)
# =============================================================================
resource_count_math:
  parent_baseline: 486          # CareerVpCrudDev current synth (of 500 HARD limit)
  parent_additions:
    - { item: "AiAssistNestedStack instantiation (AWS::CloudFormation::Stack)", delta: 1 }
    - { item: "POST /ai/assist METHOD on shared RestApi", delta: 1 }
    - { item: "PATCH /interview-prep/{interviewPrepId} METHOD on shared RestApi", delta: 1 }
  projected_parent_min: 489     # 486 + 1 + 1 + 1 (methods only; assumes path-part Resources already exist)
  parent_additions_conditional:
    - { item: "New APIGW Resource nodes if any of /ai, /ai/assist, /interview-prep, {interviewPrepId} do not already exist", delta_each: 1, max_extra: 4 }
    - { item: "OPTIONS (CORS preflight) methods if not covered by default_cors_preflight_options", delta_each: 1, max_extra: 2 }
  projected_parent_max: 495     # 489 + up to ~6 conditional path/CORS resources (conservative)
  hard_limit: 500
  headroom_at_max: 5            # 500 - 495
  note: >
    The Lambda function, its log group, IAM role, IAM policy, and invoke permission (~5 resources)
    live INSIDE AiAssistNestedStack and do NOT count against the parent 486. Net parent growth is
    ~3 (nested stack + 2 methods), ~489; conservative ceiling ~495 if new path-part Resources and
    CORS OPTIONS methods are needed. Stays under the 500 hard limit either way.

