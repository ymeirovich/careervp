spec_id: FE-UI-044
title: "Company Research canonical store + unified resolution — fix VPR/cover-letter 409 'upstream_required'"
priority: critical
status: draft
owner: backend
created_at: 2026-06-17
updated_at: 2026-06-17
tier: feature

human_approval_gate:
  required: true
  gate_number: 4
  reason: >
    Slice 3 grants states:StartExecution to submit-handler roles and wires
    STEP_FUNCTIONS_CHAIN_ARN + flips ARTIFACT_CHAIN_ENABLED=true (IAM + behavior change:
    409 -> 202 auto-generation). Slice 2 runs a one-time data migration that READS 239
    legacy CR items (PII: company research tied to a user) from users-table and WRITES them
    to artifacts-table. IAM and cross-table data movement are security-sensitive.
  approval_before: "Any states:StartExecution grant, the ARTIFACT_CHAIN_ENABLED flip, or running the migration against any non-dev environment"

recommended_model: opus
reason_for_model: >
  Three divergent table-resolution code paths must converge onto one contract without
  breaking the four downstream artifacts that already gate on the resolver, plus an
  idempotent ownership-preserving migration and a Step Functions enablement. Correctness
  under existing data and the resolver's running-chain lock is architecture-sensitive.

depends_on:
  - FE-UI-030   # CR async worker / CR persistence shape
  - FE-UI-038   # artifact dependency resolver (the gate that returns the 409)
  - FE-UI-040   # VPR<->CR binding — left CR storage "implementer's call" (the root ambiguity)
  - FE-UI-041   # CR confidence gate — resolution MUST preserve confidence + ownership checks
  - FE-UI-029   # artifact-chain state machine (Slice 3 enablement target)
blocks: []

# =============================================================================
# PROBLEM STATEMENT
# =============================================================================
problem_statement:
  current_behavior: >
    POST /vpr/generate (regenerate) returns 409 {status: upstream_required,
    missing: [company_research], chain_execution_arn: null} even for applications where the
    user expects CR to exist. Validated against live dev DynamoDB (2026-06-17):

    1. THREE divergent table-resolution paths that never agree:
       - CR loader (logic/company_research.py:128 _company_research_table_names) resolves
         KNOWLEDGE_TABLE_NAME -> TABLE_NAME -> DYNAMODB_TABLE_NAME.
       - Sync CR writer (handlers/company_research_handler.py:533 _persist_company_research_item)
         resolves the INVERTED order TABLE_NAME -> DYNAMODB_TABLE_NAME -> KNOWLEDGE_TABLE_NAME.
       - Async CR worker writer (handlers/company_research_worker_handler.py:66 _persist_cr_result)
         resolves KNOWLEDGE_TABLE_NAME first (loader order).
       On every deployed artifact lambda KNOWLEDGE_TABLE_NAME=careervp-knowledge-table-dev,
       so the LOADER reads the knowledge-table while the SYNC WRITER (DYNAMODB_TABLE_NAME=
       careervp-users-table-dev) writes to the users-table. Reader and writer point at
       different tables even within a single lambda.
    2. SCHEMA mismatch: loader + both writers assume pk/sk keys. Only users-table is pk/sk.
       knowledge-table is userEmail/knowledgeType (and EMPTY, 0 items); company-research-cache
       is cacheKey (EMPTY). get_item/put_item/query with pk/sk against those throws
       ValidationException, which is caught and swallowed -> silent "not found".
    3. KEY mismatch: CR is stored sk=ARTIFACT#COMPANY_RESEARCH#{cr_job_id} (job_id from the
       CR submit payload, company_research_handler.py:188 = payload.job_id or uuid4()).
       The loader looks up by application_id (direct keys + FilterExpression sk contains
       application_id). When cr_job_id != application_id the lookup misses even in the right
       table. The 239 live CR items in users-table use cr_job_ids that are not the app id.
    4. ARTIFACT_CHAIN_ENABLED is unset (falsy) on all submit lambdas AND
       STEP_FUNCTIONS_CHAIN_ARN is unset on vpr-submit, so the resolver cannot auto-generate
       the missing CR; it returns 409 instead of 202 (resolver.py:103-111).
    Net effect: load_confident_company_research_artifact returns None on EVERY lambda, so the
    resolver treats company_research as permanently missing. This blocks VPR regeneration and
    (because cover_letter -> (vpr, company_research)) cover-letter generation. cv_tailored and
    interview_prep depend only on (vpr) and are NOT affected.

    Why tests never caught it: tests/integration/test_company_research_vpr.py:54-76 creates a
    moto table with a pk/sk schema shaped to fit the code and sets DYNAMODB_TABLE_NAME (never
    KNOWLEDGE_TABLE_NAME). The fixture mirrors the code's assumptions, not the real CDK table
    schemas or the real lambda env precedence -> false green.
  required_behavior: >
    ONE canonical Company Research artifact store with ONE resolution contract used by every
    reader and writer, so a CR written by any path is found by every downstream gate:
      1. Canonical store = artifacts-table (applicationId/artifactId) queried via its
         type-index (applicationId + artifactType='company_research'), matching how
         cover_letter and interview_prep already persist (the designed home, api_db_construct.py:375).
      2. CR is keyed by the REAL applicationId (not an arbitrary cr_job_id) so lookup-by-
         application_id is exact, not a scan/contains filter.
      3. A single resolution helper is the only place that names the CR table + builds keys;
         loader and both writers call it. Confidence gate (FE-UI-041) + ownership (user_id)
         checks are preserved.
      4. Transitional dual-read: if the artifacts-table lookup misses, fall back to the legacy
         users-table pk/sk lookup, so the 239 existing items keep resolving until migrated.
      5. Migration (Slice 2) backfills the 239 legacy items into artifacts-table, idempotently,
         ownership-verified; then dual-read is retired.
      6. Chain enablement (Slice 3): set ARTIFACT_CHAIN_ENABLED=true + wire
         STEP_FUNCTIONS_CHAIN_ARN on submit lambdas + grant states:StartExecution, so a
         genuinely-absent CR auto-generates (202) instead of 409.
  user_impact: >
    Regenerate VPR and generate cover letters succeed when CR exists; when CR is truly absent
    the chain generates it automatically instead of dead-ending on a 409.

