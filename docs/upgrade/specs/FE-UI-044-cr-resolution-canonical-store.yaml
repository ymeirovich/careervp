# =============================================================================
# ARCHITECTURE
# =============================================================================
architecture:
  canonical_store:
    table: artifacts-table
    env_var: ARTIFACTS_TABLE_NAME    # single source of truth for CR read+write
    key: { partition: applicationId, sort: "ARTIFACT#COMPANY_RESEARCH#{applicationId}" }
    index: type-index (applicationId + artifactType='company_research')
    attributes_required: [user_id, applicationId, artifactType, company_research_id, company_name, confidence_score, created_at, research_data]
  unified_resolution_helper:
    location: src/backend/careervp/logic/company_research_store.py   # NEW — single owner of table + key
    api:
      - "cr_artifact_key(application_id) -> dict   # the one place keys are built"
      - "write_cr_artifact(application_id, user_id, result) -> None"
      - "read_cr_artifact(application_id, user_id) -> dict | None   # artifacts-table first, legacy users-table fallback (dual-read)"
    rules:
      - "Reads ARTIFACTS_TABLE_NAME only — no KNOWLEDGE/TABLE_NAME precedence games."
      - "load_confident_company_research_artifact delegates its raw load to read_cr_artifact, keeps the FE-UI-041 confidence gate + ownership check unchanged."
      - "Both sync handler and async worker writers delegate to write_cr_artifact (delete the two ad-hoc _persist_* table-resolution blocks)."
      - "Dual-read fallback is feature-flagged (COMPANY_RESEARCH_LEGACY_READ_ENABLED, default true) so Slice 2 can retire it by flipping the flag."
  slices:
    slice_1_unify_resolution:
      summary: "New company_research_store helper; loader + both writers delegate to it; dual-read legacy fallback. No infra resource change beyond confirming ARTIFACTS_TABLE_NAME is present on the CR + VPR + cover-letter lambdas."
      shippable: true
    slice_2_migration:
      summary: "Idempotent, ownership-verified backfill of legacy users-table CR items into artifacts-table keyed by real applicationId; dry-run + report; then flip COMPANY_RESEARCH_LEGACY_READ_ENABLED=false."
      shippable: true
      risk: "Legacy items keyed by cr_job_id may lack a stored applicationId; migration must resolve application linkage or quarantine unmappable items (do NOT guess)."
    slice_3_enable_chain:
      summary: "Wire STEP_FUNCTIONS_CHAIN_ARN + ARTIFACT_CHAIN_ENABLED=true on submit lambdas; grant states:StartExecution; verify SM starts at company_research node and honors claim_chain_execution lock."
      shippable: true
      gate: "human approval (IAM + behavior change)"

# =============================================================================
# CROSS-DEPENDENCY IMPACT
# =============================================================================
cross_dependencies:
  affected_positively:
    - "vpr regenerate: gate finds CR -> 200/202 instead of 409"
    - "cover_letter generate: gate finds CR (cover_letter -> vpr, company_research)"
  unaffected:
    - "cv_tailored, interview_prep: depend on (vpr) only; no CR gate"
  regression_risk:
    - id: VPR_STRICTER_GATE
      note: >
        Today CR is unreachable so the gate is effectively bypassed by pre-gating data;
        many existing applications have VPR/CV/interview_prep generated WITHOUT CR
        (e.g. app 96aefdb9 artifact_statuses has no company_research key). Once resolution
        works AND VPR keeps CR required, regenerating those VPRs will 409 until CR exists.
        MITIGATED by Slice 3 (auto-generate) per the product decision (2026-06-17).
    - id: COVER_LETTER_KEY_QUIRK
      note: "cover_letter DAL writes applicationId=user_id (dynamo_dal_handler.py:536). Do NOT copy this; CR must key by the real applicationId. Flag for separate cleanup."
    - id: DAL_EMPTY_TABLE_NAME
      note: "vpr_submit_handler.py:354 builds DynamoDalHandler(DYNAMODB_TABLE_NAME or TABLE_NAME or '') -> '' on vpr-submit lambda. Latent; out of scope but noted."

# =============================================================================
# TEST PLAN (write FIRST — red — then implement)
# =============================================================================
test_plan:
  principles:
    - "Fixtures MUST mirror real CDK schemas (artifacts-table=applicationId/artifactId+type-index; users-table=pk/sk; knowledge-table=userEmail/knowledgeType) AND real lambda env (KNOWLEDGE_TABLE_NAME set). This is the test-reality-drift fix; without it we recreate the blind spot."
  tooling: "moto[dynamodb] (already a dep, pyproject.toml:58); pytest markers @pytest.mark.unit / @pytest.mark.integration per repo convention."
  tests:
    - id: T1_round_trip
      type: integration
      file: src/backend/tests/integration/test_cr_canonical_store_roundtrip.py
      asserts: "CR written via write_cr_artifact is found by read_cr_artifact AND by load_confident_company_research_artifact, against a moto artifacts-table with the REAL applicationId/artifactId + type-index schema, with KNOWLEDGE_TABLE_NAME set to an empty wrong-schema table (proves precedence no longer breaks it)."
      why: "The single test that would have caught the whole bug; pure mocks hide schema/key/table mismatch."
    - id: T2_unified_resolution
      type: unit
      file: src/backend/tests/unit/test_cr_store_resolution.py
      asserts: "cr_artifact_key + the table chosen by reader and both writers are identical under multiple env-var combinations (incl. KNOWLEDGE_TABLE_NAME set)."
      why: "Pins the precedence-inversion bug deterministically; fails today."
    - id: T3_gate_matrix
      type: unit
      file: src/backend/tests/unit/test_resolver_cr_gate_matrix.py
      asserts: "resolve_dependencies for vpr & cover_letter: CR present->ready; missing+chain off->409; missing+chain on->202 (start_chain invoked)."
      why: "Locks gate semantics + the chain decision without AWS."
    - id: T4_dual_read
      type: integration
      file: src/backend/tests/integration/test_cr_dual_read_legacy.py
      asserts: "A CR item present only in legacy users-table (pk/sk, ARTIFACT#COMPANY_RESEARCH#{job_id}) still resolves while COMPANY_RESEARCH_LEGACY_READ_ENABLED=true; does NOT resolve when false."
      why: "Guards the migration grace window so the 239 items are not stranded."
    - id: T5_migration_idempotent
      type: integration
      file: src/backend/tests/integration/test_cr_migration_backfill.py
      asserts: "Backfill copies legacy items to artifacts-table keyed by real applicationId, preserves user_id ownership, is idempotent on re-run, and quarantines (does not guess) items with no resolvable applicationId."
      why: "Slice 2 safety."
    - id: T6_env_consistency
      type: infrastructure
      file: src/backend/tests/infrastructure/test_cr_table_env_consistency.py
      asserts: "cdk synth: every CR/VPR/cover-letter lambda exposes ARTIFACTS_TABLE_NAME; Slice 3 adds STEP_FUNCTIONS_CHAIN_ARN + ARTIFACT_CHAIN_ENABLED + states:StartExecution to submit roles."
      why: "Prevents regression of the per-lambda env drift that caused this."
  explicitly_not:
    - "No live-AWS end-to-end test as the primary guard — slow/flaky and worse at catching this structural class than T1/T4."

# =============================================================================
# RISKS
# =============================================================================
risks:
  - "Only dev env was inspected (per 2026-06-17 decision). staging/prod env vars + schemas are UNVERIFIED — must be checked before any non-dev change. (Slice 3 / migration gate.)"
  - "Swallowed ValidationExceptions mean misconfiguration degrades silently to 'CR not found'; add an explicit log/metric when the canonical read errors (not just misses)."
  - "Migration touches user-owned research (PII); must be ownership-verified and dry-run first."
  - "Enabling the chain changes 409->202 platform-wide; verify the state machine + claim_chain_execution lock under concurrent submits before flipping in non-dev."

# =============================================================================
# OUT OF SCOPE
# =============================================================================
out_of_scope:
  - "cover_letter applicationId=user_id key quirk (separate cleanup)."
  - "DynamoDalHandler('') empty-table-name latent bug on vpr-submit."
  - "staging/prod rollout (dev only for now)."
