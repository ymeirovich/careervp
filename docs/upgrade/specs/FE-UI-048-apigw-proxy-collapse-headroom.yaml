# =============================================================================
# ACCEPTANCE CRITERIA
# =============================================================================
acceptance_criteria:
  - id: AC-001
    given: A feature is converted to {proxy+} ANY
    when: cdk synth runs
    then: The feature's prior explicit per-path methods are gone and replaced by ANY methods on the feature root and a {proxy+} child resource, integrated (proxy=True) to the SAME Lambda.

  - id: AC-002
    given: A PROTECTED feature is proxy-collapsed
    when: The synthesized ANY method is inspected
    then: It carries the Cognito authorizer (AuthorizationType COGNITO_USER_POOLS) exactly as the explicit routes did; a PUBLIC feature's ANY method carries no authorizer.

  - id: AC-003
    given: The full proxy-collapse is synthesized (Phase 2)
    when: The parent CareerVpCrudDev template resource count is measured
    then: The parent has <= 400 resources (target <= 350), and at least ~150 fewer resources than the 498 baseline.

  - id: AC-004
    given: Phase 1 only is synthesized
    when: The parent template resource count is measured
    then: The parent dropped by at least 30 resources versus its pre-Phase-1 synth.

  - id: AC-005
    given: The route surface is collapsed
    when: The synthesized RestApi is inspected
    then: The RestApi logical id and rest_api_name=careervp-core-api-dev are UNCHANGED (no API id / invoke URL change).

  - id: AC-006
    given: The canonical route contract docs/architecture/api_spec.openapi.yml
    when: Each path+method in the contract is exercised against the proxy-collapsed API (resolver-level or deployed smoke)
    then: Every documented path+method still resolves to the same handler behavior (no route lost, no 404/405 regression), because Powertools matches the full forwarded path.

  - id: AC-007
    given: A proxy-collapsed feature
    when: The Lambda invoke permissions are counted
    then: There are ~2 apigateway-principal permissions for that feature (one per ANY method), not one-per-old-method; total apigw permissions drop from 99 toward ~30-40.

  - id: AC-008
    given: CORS preflight
    when: An OPTIONS request to a collapsed path is simulated
    then: It returns the same Access-Control-Allow-Origin/-Methods/-Headers contract as before (allowed origins from ALLOWED_ORIGINS unchanged).

  - id: AC-009
    given: cfn-guard / cfn-lint / checkov + validate_naming
    when: They run against the synthesized templates
    then: No new findings are introduced and all names still pass --strict.

  - id: AC-010
    given: Mixed-auth and special-config exception routes (e.g. /billing/webhook, swagger AwsIntegration, any method-level validator/usage-plan)
    when: cdk synth runs
    then: Those exception methods remain explicit (not collapsed) and retain their original auth/integration/validation.

  - id: AC-011
    given: cdk diff against the live stack before deploy
    when: The diff is reviewed
    then: It shows NO replacement of any DynamoDB table, S3 bucket, KMS key, Cognito resource, SQS queue, or Lambda function — only add/remove of ApiGateway Method/Resource and Lambda Permission resources, plus an ApiGateway Deployment update.

  - id: AC-012
    given: The human_approval_gate
    when: Any deploy/refactor against a live stack is attempted
    then: It is blocked until approval is recorded for that environment.

# =============================================================================
# STATES TO HANDLE
# =============================================================================
states_to_handle:
  - { state: synth_under_budget, trigger: "parent synth <= target after a phase", behavior: "proceed (gated by approval)" }
  - { state: synth_over_budget, trigger: "parent synth still > 400 after Phase 2", behavior: "convert remaining explicit methods / pull more features into proxy; do not stop until <= 400" }
  - { state: handler_not_self_routing, trigger: "a feature handler does NOT use Powertools full-path routing", behavior: "KEEP explicit methods for that feature; do not proxy-collapse it" }
  - { state: method_level_config_present, trigger: "a method has a request validator / API key / usage plan / non-Lambda integration", behavior: "keep that method explicit (AC-010)" }
  - { state: mixed_auth_feature, trigger: "feature mixes public + protected paths", behavior: "proxy the uniform remainder, keep explicit exception methods with correct auth" }
  - { state: path_prefix_collision, trigger: "two feature Lambdas share a path prefix", behavior: "do NOT place a greedy {proxy+} at the shared parent; scope proxies to non-overlapping prefixes" }
  - { state: drift_present, trigger: "Phase 0 finds unaccepted drift", behavior: "reconcile/accept and record before any deploy or refactor" }
  - { state: approval_pending, trigger: "human_approval_gate unmet for the target env", behavior: "block deploy to that env (incl. dev)" }

