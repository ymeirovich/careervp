# =============================================================================
# ARCHITECTURE / OWNERSHIP MAP
# =============================================================================
architecture_ownership_map:
  chosen_pattern: "Per-feature greedy {proxy+} ANY LambdaIntegration on the existing shared RestApi (in-parent; NO stack move)."
  why_in_parent_not_a_move: >
    Doing this entirely inside the parent stack means NO resource crosses a stack boundary, so the
    fixed-physical-name collision that caused prior 'ownership' failures categorically cannot occur.
    The RestApi keeps its logical id and fixed name (careervp-core-api-dev), so the API id / invoke
    URL never changes. CloudFormation simply deletes the surplus stateless methods/permissions and
    creates the few new ones during one in-place UPDATE.
  per_feature_transformation:
    before: "feature Lambda fronted by ~3-12 explicit methods (GET/POST/PUT/PATCH/DELETE per sub-path) + ~3-7 CORS OPTIONS mocks + ~3-12 per-method Lambda permissions + N path Resources."
    after: >
      feature root Resource (e.g. /users — usually already present) + one greedy child Resource
      ({proxy+}) + ANY method on the root + ANY method on {proxy+} (LambdaIntegration proxy=True) +
      CORS preflight OPTIONS on those 2 resources + ~2 invoke permissions (CDK emits one per ANY
      method). Net ~6 resources/feature vs ~10-25 today.
  correctness_invariants:
    authorizer_parity: >
      The {proxy+} ANY method(s) for a feature MUST carry the SAME authorization as the explicit
      routes they replace. Protected features (users, jobs, applications, vpr, cv, gap, cover-letter,
      interview-prep, company-research, billing-app, export) => Cognito authorizer on ANY. Public
      features (auth, health, swagger) => NO authorizer on ANY (preserve AwsSolutions-COG4 intent).
    mixed_auth_features: >
      Where a single feature mixes public and protected paths under one prefix (e.g. POST
      /billing/webhook is public/signature-verified while other /billing/* are protected), KEEP the
      explicit method(s) for the exception path and proxy only the uniform remainder. Do not weaken
      auth to fit the pattern.
    path_matching: >
      Powertools matches the FULL path; API Gateway {proxy+} forwards the full greedy path in
      event.path, so @app.get('/users/me/cv/<cv_id>') resolves unchanged. No handler change required.
    restapi_identity: "RestApi logical id and rest_api_name=careervp-core-api-dev MUST NOT change."
    cors: "Keep default_cors_preflight_options; allowed origins/methods/headers unchanged. Fewer resources => fewer OPTIONS, same behavior."
    integration_type: "Already LAMBDA_PROXY (handlers consume the proxy event); integration type is unchanged."
  parent_keeps_unchanged:
    - "All DynamoDB GlobalTables, S3 buckets, KMS keys, Cognito user pool/client/domain, SQS queues + DLQs (NEVER moved/replaced)."
    - "All feature + worker Lambda functions, their roles, log groups (function identity unchanged)."
    - "AiAssistNestedStack, MonitoringNestedStack (already extracted)."
    - "AppConfig, WAF, AppConfig deployment (refactor-unsupported anyway)."
  exceptions_keep_explicit_methods:
    - "Routes with method-level request validators, API keys/usage plans, per-method throttling, or non-Lambda integrations (e.g. swagger AwsIntegration at api_construct.py:289)."
    - "Mixed-auth feature exception paths (e.g. /billing/webhook)."
  cascade_risk: "high — live API request path; mitigated by being in-parent, behavior-preserving, phased, and route-parity tested."
  primary_files:
    - "infra/careervp/api_construct.py (introduce a _register_feature_proxy(feature_root, handler, authorized: bool) helper; convert features feature-by-feature)"
    - "infra/tests/infrastructure/test_api_construct.py (route-shape + parity + budget assertions)"
    - "infra/tests/infrastructure/test_nested_split.py (parent budget ceiling assertions)"
    - "infra/tests/infrastructure/conftest.py (fixtures if new synth slices are needed)"
    - "docs/architecture/api_spec.openapi.yml (keep the canonical route contract as the parity oracle)"

# =============================================================================
# FIX PLAN (phased; each phase independently deployable + reversible)
# =============================================================================
fix_plan:
  phase_0_reconcile_baseline:
    name: "Pin a clean deployed==code baseline (the step prior attempts skipped)"
    actions:
      - "Run aws cloudformation detect-stack-drift on parent + the 2 nested stacks; resolve or explicitly accept the known Cognito UserPoolClient callback-URL drift and record the decision."
      - "Decide ErrorReportNestedStack: land+deploy it OR shelve it, so synth matches deployed. Reach parent UPDATE_COMPLETE with `cdk diff CareerVpCrudDev` clean."
      - "Snapshot current parent + nested templates into docs/upgrade/ for rollback comparison (mirror the monitoring runbook)."
    gate: "parent UPDATE_COMPLETE, drift reconciled/accepted, cdk diff clean."
  phase_1_immediate_relief:
    name: "Proxy-collapse the 3 highest-fan-out features"
    targets: ["CVTailor (12 perms)", "User API (10 perms)", "CV Parser (8 perms)"]
    change: >
      Convert these features to {proxy+} ANY via the new _register_feature_proxy helper, preserving
      the Cognito authorizer. Remove their explicit per-path methods, surplus CORS OPTIONS, and
      per-method permissions. Pure in-parent cdk deploy.
    expected_drop: ">= 30 parent resources"
    gate: "parent synth drops >= 30; route-parity tests green; smoke test each converted feature."
  phase_2_durable:
    name: "Proxy-collapse the remaining API-fronted features"
    change: "Apply the same pattern to all remaining feature Lambdas, keeping explicit methods only for documented exceptions."
    expected_result: "parent synth <= ~350 (aim ~310)"
    gate: "parent <= 400 hard, target <= 350; full infra suite + checkov + naming green; per-feature smoke."
  phase_3_optional_leaf_refactor:
    name: "OPTIONAL — Stack-Refactor clean leaf slices for isolation"
    change: >
      If additional isolation is desired AFTER the count is solved, extract refactor-eligible leaf
      slices (monitoring already done) via the proven create-stack-refactor runbook. Exclude all
      unsupported types (Method, EventInvokeConfig, IAM::Policy, GlobalTable, custom resources).
    note: "Not required to solve the limit; do not block Phases 1-2 on it."
  phase_4_optional_multi_restapi:
    name: "OPTIONAL (deferred) — split into multiple RestApis behind dev.careervp.com base-path mappings"
    note: "Long-term per-domain 500 budgets; only if the app outgrows a single proxy-collapsed API."

