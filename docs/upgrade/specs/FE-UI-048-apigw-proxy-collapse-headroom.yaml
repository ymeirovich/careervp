# =============================================================================
# VALIDATION COMMANDS
# =============================================================================
validation:
  commands:
    - "mkdir -p src/backend/.build/lambdas && touch src/backend/.build/lambdas/.placeholder"
    - "cd infra && uv sync && npx cdk synth >/tmp/synth.log 2>&1   # must exit 0"
    - "python3 -c \"import json; print('parent resources:', len(json.load(open('infra/cdk.out/CareerVpCrudDev.template.json'))['Resources']))\""
    - "cd infra && uv run pytest tests/infrastructure -v --tb=short"
    - "python src/backend/scripts/validate_naming.py --path infra --strict"
    - "cd src/backend && uv run pytest tests/unit/ -k 'resolver or route or handler' -q   # resolver-level route parity"
    - "cd infra && npx cdk diff CareerVpCrudDev   # AC-011: no stateful replacement; review before deploy"
    - "uvx checkov -d infra/cdk.out --framework cloudformation --quiet"
  acceptance_criteria:
    - "Parent CareerVpCrudDev synth <= 400 resources after Phase 2 (target <= 350)"
    - "RestApi id / rest_api_name unchanged; no API URL change"
    - "Every route in docs/architecture/api_spec.openapi.yml still resolves to its handler"
    - "cdk diff shows no replacement of DynamoDB/S3/KMS/Cognito/SQS/Lambda; only API method/permission/resource churn + a Deployment update"
    - "infra pytest, checkov, naming --strict all green"

# =============================================================================
# CONSTRAINTS
# =============================================================================
constraints:
  - "ENTIRELY in-parent: no resource crosses a stack boundary in this spec (that is what makes it ownership-safe)."
  - "NEVER touch stateful resources (DynamoDB/S3/KMS/Cognito/SQS) — cdk diff must prove no replacement."
  - "RestApi logical id + rest_api_name=careervp-core-api-dev MUST stay constant."
  - "Authorizer parity is mandatory: no protected route may become public, no public route may gain an authorizer."
  - "Keep explicit methods for any route with method-level validator/API-key/usage-plan/non-Lambda integration or mixed-auth exception."
  - "Each phase is independently deployable, smoke-tested, and reversible (git revert + redeploy; no data resource ever in the change set)."
  - "Single `make deploy` still deploys the whole app."

# =============================================================================
# BASELINE / REGRESSION BUDGET
# =============================================================================
baseline_regression_budget:
  blocked_regressions:
    - "No documented route in api_spec.openapi.yml may be lost or change handler/auth."
    - "Parent must end <= 400 (the whole point) AND the RestApi id/URL must not change."
    - "AiAssistNestedStack + MonitoringNestedStack wiring must remain intact."
    - "Cognito-protected routes stay protected; public routes (auth/health/swagger) stay public."
    - "No stateful resource replacement; no new IAM grants; no secret access added."
  allowed_deltas:
    - "Removal of redundant explicit ApiGateway Methods/Resources and per-method Lambda Permissions."
    - "Addition of per-feature {proxy+} Resource + ANY methods + ~2 invoke permissions + reduced CORS OPTIONS."
    - "One new AWS::ApiGateway::Deployment revision per deploy."

