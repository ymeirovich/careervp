# =============================================================================
# ROLLBACK TRIGGER MATRIX
# =============================================================================
rollback_trigger_matrix:
  - { trigger_id: RT-001, condition: "A documented route 404/405s after a phase (parity break)", action: "Revert that feature's proxy conversion (git revert), redeploy; re-add the explicit methods for that feature; investigate Powertools path mismatch before retrying" }
  - { trigger_id: RT-002, condition: "cdk diff shows replacement of any stateful resource or the RestApi", action: "STOP; do not deploy. The RestApi logical id or a fixed name was changed — restore it and re-synth" }
  - { trigger_id: RT-003, condition: "A protected route became public (authorizer dropped) in the diff/tests", action: "Block deploy; restore Cognito authorizer on the ANY method; add a parity test for that feature" }
  - { trigger_id: RT-004, condition: "Parent still > 400 after Phase 2", action: "Continue converting remaining explicit methods; if any feature can't be proxied, account for its cost and consider Phase 4 multi-RestApi" }
  - { trigger_id: RT-005, condition: "CORS preflight regression (browser blocked)", action: "Restore default_cors_preflight_options coverage on the new resources; verify ALLOWED_ORIGINS; redeploy" }
  - { trigger_id: RT-006, condition: "Post-deploy API errors on a converted feature", action: "Roll the single feature back (independent, in-parent); the RestApi id/URL is unchanged so rollback is a normal cdk deploy" }
  - { trigger_id: RT-007, condition: "Human approval withheld for an environment", action: "Hold deploy for that env; keep the change merged-but-undeployed" }

# =============================================================================
# DESIGN NOTES
# =============================================================================
design_notes:
  - >
    Root cause reframed: the parent is bottlenecked by API-Gateway resource BLOAT, not by stack
    topology. 290 of 498 parent resources are API methods/permissions/resources, and they are mostly
    redundant because each feature Lambda already self-routes via Powertools. Removing the redundancy
    is both the biggest and the safest lever — it is in-parent, behavior-preserving, and touches no
    stateful resource, so the fixed-physical-name collision that caused prior 'ownership' failures
    cannot occur.
  - >
    Why not Stack Refactoring for the API: AWS::ApiGateway::Method is on the official refactor-unsupported
    list, so the 122 methods cannot be MOVED to a nested stack without REPLACE. Refactor stays an
    OPTIONAL secondary tool (Phase 3) for clean leaf slices only. This rebuttal is documented so the
    team does not re-attempt the reverted FE-UI-036 path expecting it to reach durable headroom.
  - >
    The {proxy+} ANY pattern also auto-collapses the Lambda::Permission fan-out: CDK emits one
    permission per method, so going from ~10 methods/feature to ~2 ANY methods/feature drops the 99
    apigw permissions toward ~30-40 for free — no awkward suppression of LambdaIntegration auto-grants.
  - >
    Keep explicit methods where API Gateway is actually doing work the Lambda is not: swagger uses a
    non-Lambda AwsIntegration (api_construct.py:289); /billing/webhook is public while the rest of
    /billing is protected; any route with a method-level validator or usage plan. These are a small
    minority and are explicitly excluded from collapse (AC-010, states_to_handle).
  - >
    Phase 0 is mandatory and is the step prior attempts skipped: reconcile drift and get deployed==code
    before mutating the live stack. The Cognito UserPoolClient callback drift is pre-existing and out of
    scope to fix here, but must be explicitly accepted/recorded so cdk diff is interpretable.
  - >
    Verify staging/prod parent counts independently before promoting beyond dev; only dev's 494/498
    baseline is verified here. CareerVpCrudStaging exists and must be measured before any prod work.
