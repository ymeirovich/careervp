spec_id: FE-UI-048
title: "Infra — Reclaim CareerVpCrudDev resource-budget headroom by collapsing the API Gateway route surface to {proxy+} integrations (escape the 500-resource wall durably)"
priority: critical
status: draft
owner: backend
created_at: 2026-06-24
updated_at: 2026-06-24
tier: infra

human_approval_gate:
  required: true
  gate_number: 1
  reason: >
    This changes the LIVE API Gateway integration model for CareerVpCrudDev (careervp-core-api-dev):
    explicit per-path methods are replaced by per-feature {proxy+} ANY integrations. It mutates the
    deployed RestApi route graph and triggers a new AWS::ApiGateway::Deployment. No stateful resource
    and no IAM secret is touched, but the production request path changes, so it must be reviewed and
    deployed in a controlled window per environment.
  approval_before: "Any cdk deploy to dev/stage/prod; and before any cdk refactor or create-stack-refactor on a live stack."

recommended_model: opus
reason_for_model: >
  Live CloudFormation route-surface restructuring with a hard 500-resource ceiling, authorizer parity
  across public/protected routes, CORS preflight correctness, and a documented rebuttal of the
  Stack-Refactoring path (because AWS::ApiGateway::Method is refactor-ineligible). Architecture- and
  blast-radius-sensitive.

depends_on:
  - FE-UI-047   # AiAssist nested stack + /ai/assist route must be reconciled before route-surface refactor
prior_art:
  - FE-UI-036   # original nested-stack split (synthesized to ~434, then reverted — see ee7ec48)
  - FE-UI-037   # nested-stack reconciliation
  - FE-UI-047   # AiAssistNestedStack (route methods stay in parent because methods bind to shared RestApi)
  - "docs/upgrade/stack-refactor-inventory-careervpcruddev-dev-us-east-1.md"
  - "docs/upgrade/topology-decision-record-careervpcruddev-nested-stack-refactor.md"
  - "docs/upgrade/stack-refactor-runbook-monitoring-phase1-dev-us-east-1.md"
blocks: []

# =============================================================================
# PROBLEM STATEMENT
# =============================================================================
problem_statement:
  current_behavior: >
    CareerVpCrudDev is at the wall. VERIFIED against live AWS (account 788159322332, us-east-1,
    2026-06-24): deployed parent = 494 resources; deployed nested children = AiAssistNestedStack (7)
    + MonitoringNestedStack (23). Current synth parent = 498 (it also carries an undeployed
    ErrorReportNestedStack). The next cdk deploy lands the parent at 498 — TWO resources below the
    HARD 500 ceiling (a non-adjustable CloudFormation limit). The parent is dominated by the API
    Gateway: 122 AWS::ApiGateway::Method (70 of them CORS OPTIONS mocks), 99 apigateway-principal
    AWS::Lambda::Permission spread over only 20 distinct Lambdas (CDK emits one permission PER
    method-route; CVTailor alone has 12), and 69 AWS::ApiGateway::Resource — ~290 of 498 resources.
  required_behavior: >
    Collapse the redundant per-path API surface into per-feature {proxy+} ANY integrations. Every
    feature handler already routes internally with AWS Lambda Powertools APIGatewayRestResolver
    (@app.get('/users/me/cv/<cv_id>') ... app.resolve(event, context)), so API-Gateway-level
    per-path methods are redundant granularity. Replacing N explicit methods + N CORS OPTIONS + N
    per-method permissions per feature with ~1 {proxy+} ANY method (+ base ANY) + 2 CORS OPTIONS +
    ~2 invoke permissions is behavior-preserving and frees ~170-190 parent resources. Target parent
    <= ~350 (aim ~310), durably, with the RestApi physical id / invoke URL unchanged.
  user_impact: >
    Infra can keep adding routes, workers, and alarms for many releases without hitting the wall.
    No API URL change, no data-store risk, deploys stay atomic. The deployed API behaves identically
    because the Powertools resolver inside each Lambda performs the same path matching it does today.

# =============================================================================
# WHY NOT "JUST SPLIT INTO MORE NESTED STACKS" (documented rebuttal)
# =============================================================================
alternatives_considered:
  pure_nested_stack_split:
    verdict: "INSUFFICIENT and unsafe as the primary lever — this is the path that previously caused ownership failures."
    evidence:
      - "Every resource has a deterministic fixed physical name (infra/careervp/naming_utils.py). Moving a fixed-name resource to a nested stack via plain `cdk deploy` changes its logical id and forces CREATE of a same-named resource while the old one still exists => 'already exists' collision (the prior ownership failure) or REPLACE/data-loss for stateful resources."
      - "The only SAFE move mechanism is CloudFormation Stack Refactoring (proven here for Monitoring). But the dominant consumers are refactor-INELIGIBLE per the official unsupported list: AWS::ApiGateway::Method (122, unsupported), AWS::Lambda::EventInvokeConfig (28, unsupported), AWS::Lambda::Permission (99, IMMUTABLE), AWS::IAM::Policy (13, NON_PROVISIONABLE), AWS::DynamoDB::GlobalTable (10, unsupported + stateful)."
      - "The historical 3-slice split (FE-UI-036, commit 8926a90) only reached parent ~428 and was reverted (ee7ec48); the worker/artifact slices are now blocked by EventInvokeConfig + IAM::Policy. Refactor alone cannot reach durable headroom."
    conclusion: "Nested-stack refactoring is retained ONLY as an OPTIONAL secondary lever (Phase 3) for clean leaf slices; it is NOT the solution to the count."
  raise_the_limit:
    verdict: "IMPOSSIBLE."
    evidence: "500 resources/stack is a hard CloudFormation limit, not increasable via Service Quotas (docs/cloudformation-limits)."
  multi_restapi_behind_custom_domain:
    verdict: "VALID long-term, deferred."
    evidence: "Splitting into several RestApis (each its own 500 budget) behind the existing dev.careervp.com custom domain via base-path mappings is the durable scaling story, but it is a larger change and is unnecessary once the proxy-collapse frees ~190 resources. Captured as Phase 4 (optional)."

