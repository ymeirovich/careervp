# =============================================================================
# DESIGN NOTES
# =============================================================================
design_notes:
  - >
    normalizeMarkdown is the ONLY dirty-comparison function. Comparing raw editor HTML or
    un-normalized Markdown produces false-dirty blurs (e.g. trailing whitespace, list marker
    normalization) and causes spurious PATCHes. Always compare normalizeMarkdown(current) to
    normalizeMarkdown(baseline).
  - >
    Blur-vs-unmount race: a field can blur because the user clicked away OR because the component
    unmounted (navigation). The autosave hook must flush the in-flight value on unmount if dirty,
    and must not double-fire if blur already triggered the save. Use a single saving-guard ref.
  - >
    The Markdown stays a plain string on the wire. The serializer is a CLIENT-SIDE rendering and
    dirty-check convenience only — the backend PATCH contracts (cover_letter, cv_sections, answer)
    are format-agnostic strings. Do NOT introduce a Markdown content-type negotiation.
  - >
    base_version source: use the artifact's server updated_at (or an explicit version field if the
    backend exposes one) as the optimistic-concurrency token. FE-UI-046 should enforce it server-side;
    until then the frontend sends it and treats any 409 as the conflict path. If the backend ignores
    it (pre-FE-UI-046), conflicts degrade to last-write-wins — acceptable for the interim.
  - >
    Tailored CV Education/Certifications are STRUCTURED-BUT-EDITABLE plain inputs, never rich-text.
    This preserves the cv_sections object shape that FE-UI-028 export depends on. Only Summary and
    Experience bullets are rich-text, because those are free-form prose where formatting matters.
  - >
    The AI-assist button placeholder is rendered here but its onClick is supplied by FE-UI-046.
    When AI text is applied (FE-UI-046, on 200 only), it flows through this same autosave + draft
    mirror, so AI output is crash-safe exactly like manual edits.
