# =============================================================================
# ARCHITECTURE / OWNERSHIP MAP
# =============================================================================
architecture_ownership_map:
  owns_frontend:
    - "All inline rich-text edit + read rendering for Cover Letter, Tailored CV, Interview Prep."
    - "Autosave-on-blur orchestration, localStorage draft mirror, restore banner, base_version 409 UX, beforeunload-while-in-flight guard."
    - "Tailored CV conversion to the gap-analysis single-Edit whole-document model."
    - "Interview Prep card edit UI + wiring to PATCH /interview-prep (the AI button placeholder is owned here; AI behavior is FE-UI-046)."
  does_not_own:
    - "Backend PATCH /interview-prep handler + InterviewQuestion model extension -> FE-UI-046 (backend)."
    - "POST /ai/assist endpoint + prompt-context composition -> FE-UI-046 (backend)."
    - "API Gateway route-method registration for PATCH /interview-prep + POST /ai/assist -> FE-UI-047 (infra)."
    - "Existing PATCH /cover-letter, PATCH /cv-tailoring, POST /gap-responses backends (already exist; consumed as-is, no contract change)."
  shared_contracts:
    serializer: "markdownToHtml / htmlToMarkdown / normalizeMarkdown (markdownSerializer.ts) is the single source of truth for read rendering AND dirty comparison."
    localstorage_key: "careervp:draft:{artifactType}:{artifactId}:{fieldKey} -> { markdown, updatedAt, baseVersion }"
    dirty_check: "normalizeMarkdown(current) !== normalizeMarkdown(baseline)"
    field_string_invariant: "PATCH bodies send a plain string per existing shapes; NO Markdown contract change is introduced on the wire."
  primary_files:
    - "src/frontend/app/applications/[id]/cover-letter/page.tsx"
    - "src/frontend/app/applications/[id]/cv-tailored/page.tsx"
    - "src/frontend/app/applications/[id]/interview-prep/page.tsx"
  cascade_risk: "medium — touches three artifact pages; Gap Analysis + RichTextEditor core are intentionally NOT modified."

# =============================================================================
# FIX PLAN
# =============================================================================
fix_plan:
  files_to_modify:
    - file: "src/frontend/app/applications/[id]/cover-letter/page.tsx"
      change: >
        Replace the read-mode <p whitespace-pre-wrap> with <RichTextEditor readOnly value={stored} />.
        In edit mode, wire onBlur -> autosave-if-dirty using PATCH /cover-letter/{id} req {cover_letter}.
        Subscribe field to the useArtifactAutosave hook (draft mirror + base_version).
    - file: "src/frontend/app/applications/[id]/cv-tailored/page.tsx"
      change: >
        Convert to the gap-analysis model: ONE Edit button flips the whole document to edit mode.
        Summary + each Experience bullet become <RichTextEditor> (rich-text); Education + Certifications
        become structured-but-editable plain inputs (preserve cv_sections shape). Read mode renders
        summary/bullets via <RichTextEditor readOnly>. Autosave-on-blur per field via
        PATCH /cv-tailoring/{id} req {cv_sections} (structured) — never the dead tailored_cv fallback.
        Remove the hardcoded read-only lock on Education/Certifications.
    - file: "src/frontend/app/applications/[id]/interview-prep/page.tsx"
      change: >
        Make each question card editable with <RichTextEditor> for the STAR answer + a read view via
        <RichTextEditor readOnly>. Add a per-card Edit toggle. On blur, autosave-if-dirty via
        PATCH /interview-prep/{interviewPrepId} req {answer:'<string>'} keyed by question_id.
        Render an AI-assist button per field (handler injected by FE-UI-046; placeholder no-op until then).
  files_to_create:
    - file: "src/frontend/hooks/useArtifactAutosave.ts"
      purpose: >
        Reusable autosave-on-blur orchestrator. API: { value, setValue, onBlur, isDirty, isSaving,
        saveNow, conflict, draftBanner }. Responsibilities: dirty check via normalizeMarkdown;
        localStorage draft mirror read/write under careervp:draft:{artifactType}:{artifactId}:{fieldKey};
        base_version optimistic-concurrency (send baseVersion, surface 409 as conflict state);
        clear draft on 2xx; beforeunload listener active ONLY while a PATCH is in flight.
    - file: "src/frontend/components/RestoreDraftBanner.tsx"
      purpose: "Non-blocking banner: 'Restore unsaved changes?' with Restore / Discard. Rendered when a local draft is newer than server updated_at on mount."
    - file: "src/frontend/components/ConflictModal.tsx"
      purpose: "409 optimistic-concurrency modal: Reload (discard local, refetch) / Overwrite (re-PATCH with refreshed base_version)."
  dependencies:
    upstream:
      - "RichTextEditor + markdownSerializer (FE-UI-020) — already shipped."
      - "Existing PATCH /cover-letter, PATCH /cv-tailoring, POST /gap-responses — already shipped."
    downstream:
      - "PATCH /interview-prep/{interviewPrepId} handler + InterviewQuestion model field -> FE-UI-046 (interview-prep autosave is non-functional until that lands; ship behind a feature flag or wire AI button as no-op)."
      - "Route-method registration for PATCH /interview-prep -> FE-UI-047 (infra)."

# =============================================================================
# ACCEPTANCE CRITERIA
# =============================================================================
acceptance_criteria:
  - id: AC-001
    artifact: cover_letter
    given: A cover letter with Markdown formatting (**bold**, bullet list) is stored and viewed in read mode
    when: The page renders the read view
    then: The content renders as formatted HTML via markdownToHtml (bold is bold, bullets are a list); no literal Markdown characters are shown.

  - id: AC-002
    artifact: all
    given: The user is in edit mode and focuses a rich-text field
    when: The field gains focus
    then: The Tiptap toolbar appears for that field; on blur the toolbar disappears.

  - id: AC-003
    artifact: all
    given: A rich-text field is in edit mode and its content has changed (normalizeMarkdown differs from baseline)
    when: The field loses focus (blur)
    then: A single PATCH fires using that artifact's existing request shape; isSaving is true during the call; baseline + base_version update to the saved value on 2xx; no debounce timer is used.

  - id: AC-004
    artifact: all
    given: A rich-text field is in edit mode and its content is unchanged (normalizeMarkdown equals baseline)
    when: The field loses focus (blur)
    then: No PATCH is fired (blur on a clean field is a no-op).

  - id: AC-005
    artifact: cv_tailored
    given: A tailored CV is viewed in read mode
    when: The user clicks the single Edit button
    then: The whole document enters edit mode; Summary and every Experience bullet become rich-text editors; Education and Certifications become editable structured plain inputs (not rich-text); cv_sections structure is preserved on save.

  - id: AC-006
    artifact: cv_tailored
    given: The tailored CV is in edit mode
    when: The user edits Education or Certifications fields and blurs
    then: The change persists via PATCH /cv-tailoring/{id} {cv_sections} with cv_sections shape intact, so the DOCX/PDF export path (FE-UI-028) still reads the structured sections; the dead tailored_cv fallback is never written.

  - id: AC-007
    artifact: interview_prep
    given: An interview prep artifact is rendered
    when: The user opens a question card and clicks Edit
    then: The STAR answer becomes a RichTextEditor; on blur with a dirty value it PATCHes /interview-prep/{interviewPrepId} {answer} keyed by question_id; read mode renders the stored answer via <RichTextEditor readOnly>.

  - id: AC-008
    artifact: all
    given: A field is edited and a local draft is written under careervp:draft:{artifactType}:{artifactId}:{fieldKey}
    when: The user reloads or reopens the page and local.updatedAt is NEWER than server updated_at
    then: A non-blocking "Restore unsaved changes?" banner appears with Restore and Discard; Restore loads the draft into the editor, Discard clears the draft; the banner never blocks viewing.

  - id: AC-009
    artifact: all
    given: A local draft exists but server updated_at is NEWER (or equal) than local.updatedAt
    when: The page mounts
    then: The stale draft is cleared and no restore banner is shown.

  - id: AC-010
    artifact: all
    given: Tab A loaded base_version V1 and Tab B already saved V2 to the server
    when: Tab A blurs a dirty field and PATCHes with base_version V1
    then: The server returns 409; a Conflict modal offers Reload (discard local, refetch V2) or Overwrite (refetch base_version, re-PATCH); the field is NOT silently overwritten either way.

  - id: AC-011
    artifact: all
    given: An explicit Save button is clicked
    when: The PATCH returns 2xx
    then: The committed value becomes the new baseline and the localStorage draft for that field is cleared.

  - id: AC-012
    artifact: all
    given: A PATCH request is in flight
    when: The user attempts to close the tab or navigate away
    then: A beforeunload warning fires; once no PATCH is in flight the warning is removed (no warning for a clean, fully-saved page).

  - id: AC-013
    artifact: gap_analysis
    given: Gap Analysis already uses RichTextEditor for edit + read (FE-UI-019)
    when: This spec is implemented
    then: GapQuestionCard.tsx behavior is unchanged (regression guard); it remains the reference pattern.

# =============================================================================
# STATES TO HANDLE
# =============================================================================
states_to_handle:
  - state: read_rendered
    trigger: Field is in read mode
    behavior: "<RichTextEditor readOnly value={storedMarkdown} /> — formatting rendered via markdownToHtml"
  - state: edit_focused
    trigger: Edit mode + field focused
    behavior: "Toolbar visible; editing enabled"
  - state: edit_blurred_dirty
    trigger: Blur with normalizeMarkdown(current) != baseline
    behavior: "Hide toolbar; fire one PATCH (existing shape); write draft mirror; update baseline + base_version on 2xx"
  - state: edit_blurred_clean
    trigger: Blur with no change
    behavior: "Hide toolbar; no PATCH"
  - state: saving_in_flight
    trigger: PATCH pending
    behavior: "isSaving true; beforeunload guard armed"
  - state: draft_restorable
    trigger: Mount with local.updatedAt > server.updated_at
    behavior: "Show non-blocking Restore/Discard banner"
  - state: draft_stale
    trigger: Mount with local.updatedAt <= server.updated_at
    behavior: "Clear draft; no banner"
  - state: conflict_409
    trigger: PATCH rejected on base_version mismatch
    behavior: "Show Conflict modal (Reload / Overwrite); field unchanged"
  - state: save_error
    trigger: PATCH non-2xx (non-409)
    behavior: "Surface inline error; keep draft mirror so the edit is not lost; allow retry via saveNow"

