spec_id: FE-UI-045
title: "Inline rich-text editing + autosave-on-blur across all four artifacts (Cover Letter, Tailored CV, Interview Prep, Gap parity)"
priority: high
status: draft
owner: frontend
created_at: 2026-06-20
updated_at: 2026-06-20
tier: feature

recommended_model: opus
reason_for_model: >
  Four artifact edit surfaces must converge on ONE mode-based rich-text + autosave-on-blur
  contract without breaking the existing structured cv_sections DOCX/PDF export path or the
  already-working Gap Analysis editor. Crash-safe localStorage draft mirroring, optimistic
  concurrency (base_version / 409), and a non-blocking restore banner are stateful UX with
  several race conditions (blur vs unmount, restore vs server-newer, AI-apply vs autosave)
  that are correctness-sensitive across components.

depends_on: []
blocks:
  - FE-UI-046   # AI-assist pipeline consumes the same field-scoped edit surfaces + autosave flow
prior_art:
  - FE-UI-020   # RichTextEditor — onFocus/onBlur/readOnly, markdownSerializer (markdownToHtml/htmlToMarkdown/normalizeMarkdown)
related_decisions:
  - "Anti-AI 8-pattern framework (careervp/CLAUDE.md Decision 1.6) — relevant when AI text (FE-UI-046) flows through these editors"

# =============================================================================
# PROBLEM STATEMENT
# =============================================================================
problem_statement:
  current_behavior: >
    Rich-text editing is implemented inconsistently across the four editable artifacts, and
    three of the four leak formatting or block editing entirely:

    1. RichTextEditor (components/RichTextEditor/RichTextEditor.tsx, FE-UI-020) already supports
       onFocus/onBlur/readOnly and serializes HTML<->Markdown via markdownSerializer.ts
       (markdownToHtml / htmlToMarkdown / normalizeMarkdown). It is MODE-BASED, not focus-mounted.
    2. Gap Analysis (GapQuestionCard.tsx) ALREADY uses RichTextEditor in both edit and read-only
       states and works correctly — this is the reference pattern.
    3. Cover Letter (app/applications/[id]/cover-letter/page.tsx) uses RichTextEditor in
       ?mode=edit (works), but READ mode renders plain <p className="whitespace-pre-wrap">, so
       stored Markdown leaks as literal characters (e.g. **bold**, - bullets) instead of rendered
       formatting.
    4. Tailored CV (app/applications/[id]/cv-tailored/page.tsx): the structured cv_sections path
       uses a PLAIN <textarea> (CVDocumentEdit), NOT RichTextEditor. Education and Certifications
       are hardcoded read-only even in edit mode. RichTextEditor is only wired to the dead raw
       `tailored_cv` fallback, which the structured path never reaches.
    5. There is no autosave anywhere: edits are lost on accidental navigation, tab close, or
       crash. There is no draft mirror, no restore affordance, and no optimistic-concurrency
       guard, so a stale tab silently overwrites a newer server copy on Save.
  required_behavior: >
    ONE mode-based inline rich-text + autosave-on-blur contract, applied uniformly:

    1. TRIGGER stays MODE-BASED. An Edit button flips the surface to edit mode. Within edit mode,
       focusing a rich-text field shows the Tiptap toolbar; blur hides the toolbar AND triggers
       autosave IF the field is dirty (normalizeMarkdown(current) !== normalizeMarkdown(baseline)).
    2. READ mode renders the stored string through the SAME serializer the editor uses
       (markdownToHtml) by reusing <RichTextEditor readOnly>. Applies to Cover Letter read view,
       Tailored CV summary + experience bullets read view, and Interview Prep STAR answers.
       Gap already does this and is left unchanged.
    3. Tailored CV edit mode adopts the GAP-ANALYSIS model: ONE Edit button flips the WHOLE
       document to edit mode, making ALL fields editable at once. Summary + each Experience bullet
       are rich-text (RichTextEditor). Education + Certifications remain STRUCTURED-BUT-EDITABLE
       plain inputs (so cv_sections stays intact for DOCX/PDF export) — NOT free rich-text.
    4. Interview Prep gains editable, persisted STAR answers: each question card is editable with
       RichTextEditor (+ an AI button, wired in FE-UI-046) and saves via the new
       PATCH /interview-prep/{interviewPrepId} endpoint (delivered by FE-UI-046 backend + FE-UI-047
       route registration).
    5. SAVE model: autosave on BLUR ONLY (no debounce timer) using the EXISTING PATCH request
       shapes per artifact (no Markdown contract change — the field stays a plain string), plus a
       localStorage draft mirror. On mount, compare the local draft against server updated_at and
       offer a non-blocking "Restore unsaved changes?" banner. Explicit Save still commits and
       clears the draft on 2xx. A base_version optimistic-concurrency guard surfaces a 409 conflict
       modal (Reload / Overwrite). A beforeunload warning fires only while a PATCH is in flight.
  user_impact: >
    Formatting renders correctly in every read view, all four artifacts are editable with the same
    interaction, edits survive accidental navigation / crashes via the draft mirror, and concurrent
    edits in two tabs no longer silently clobber each other.

