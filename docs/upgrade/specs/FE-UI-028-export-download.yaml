rollback_trigger_matrix:
  - trigger_id: RT-001
    condition: Any pre_merge AC flips pass→fail post-deploy
    action: Revert export_handler.py to 501 stub; remove CDK Lambda and route; redeploy
  - trigger_id: RT-002
    condition: Lambda timeout exceeded in prod (> 29 s for large artifacts)
    action: >
      Increase Lambda timeout in api_construct.py up to 30 s (API Gateway hard limit).
      If still insufficient, defer large-artifact modules to async pattern in V2.
  - trigger_id: RT-003
    condition: IAM permission error (AccessDenied) on S3 or DynamoDB in prod
    action: Verify grant calls in api_construct.py; add missing grants and redeploy CDK

design_notes:
  - >
    The export Lambda is purely synchronous. Lambda timeout should be set to 29 s
    (one second below API Gateway's 30 s hard limit). Artifacts are expected to be
    small enough (< a few hundred KB of text) that DOCX generation completes well
    within this window.
  - >
    The generated DOCX is always written to the artifacts bucket before presigning.
    There is no in-memory streaming to the client. This allows future cache reuse
    (re-presign instead of regenerate) but caching is explicitly out of scope for V1.
  - >
    user_id for DynamoDB lookups comes exclusively from the Cognito JWT
    (event['requestContext']['authorizer']['claims']['sub']).
    The Lambda must never trust a user_id from the query string or request body.
  - >
    For cv_tailored, the jobId in the route maps to cvTailoringId in the sk
    (ARTIFACT#CV_TAILORED#{cvTailoringId}). The handler must use jobId as cvTailoringId
    for the DynamoDB key — confirm this mapping is correct against existing cv_tailoring_handler.py
    before implementing.
  - >
    DOCX content structure per module:
    vpr → Title + one section per VPR section key (heading + paragraph).
    cover_letter → Title + full_text as a single paragraph (or text fallback).
    interview_prep → Title + numbered list of Question / Answer pairs.
    cv_tailored → Title + cv_sections formatted + tailored_cv summary paragraph.
  - >
    CORS for the Lambda endpoint is handled by cors_utils.py via the ALLOWED_ORIGINS
    env var (same pattern as billing_lambda). API Gateway default_cors_preflight_options
    uses Cors.ALL_ORIGINS (api_construct.py:294), so no additional CORS configuration
    is needed at the Gateway level.
  - >
    presigned_url_ttl_seconds is 3600 (1 hour). This is intentionally shorter than
    VPR result presigned URLs because exports are considered ephemeral user-triggered
    downloads, not persistent references.
