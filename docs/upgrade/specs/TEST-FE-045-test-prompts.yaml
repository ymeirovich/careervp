    badges, CV ATS/keyword panels, export rendering, or Hebrew read-mode rendering.

    Files to author or extend:
    - src/frontend/tests/regression/artifact-rich-text-regression.test.tsx
    - src/frontend/tests/regression/cross-module-invalidation.test.tsx

    Setup / mocks:
    - Use the existing regression test harness.
    - Reuse page/component fixtures already present in the frontend regression suite.
    - Mock DOCX/PDF export helpers so formatting can be asserted without a real download.

    Write tests with these exact names and assertions:

    1. test_cover_letter_and_gap_explicit_save_flows_still_submit_successfully
       Assert that the existing explicit Save flows still work and that autosave does not
       interfere with the current manual-save UX.
       AC-011

    2. test_hub_status_badges_remain_unchanged
       Assert that the hub status badges and labels remain unchanged after the rich-text
       autosave change.
       AC-013

    3. test_tailored_cv_ats_and_keyword_panel_remains_visible
       Assert that the tailored CV ATS score and keyword panel still render in read and
       edit modes.
       AC-006

    4. test_docx_and_pdf_exports_render_formatted_text_without_literal_markdown_tokens
       Assert that DOCX/PDF export output shows formatted text only, with no literal
       markdown tokens leaked into the rendered content.
       AC-006

    5. test_hebrew_locale_read_render_keeps_formatted_content_visible
       Assert that the Hebrew locale read render still shows the content in Hebrew and
       keeps formatted Markdown visually intact.
       AC-001

    Coverage note:
    - Explicitly out of scope: real Anthropic latency/quality (mock it), multi-tab
