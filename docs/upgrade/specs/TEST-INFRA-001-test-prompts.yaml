# =============================================================================
# CATEGORY A: CYCLE FIX — ASSERTIONS (FE-UI-035)
# =============================================================================
cycle_fix_assertions:
  prompt: |
    Context: FE-UI-035 gives the CR/artifact failure-handler Lambdas dedicated IAM roles so the
    CloudFormation dependency cycle is broken. Currently `Template.from_stack` RAISES
    "Template is undeployable ... dependency cycle". After the fix, from_stack must succeed.

    File to write tests in: infra/tests/infrastructure/test_artifact_chain_cycle_fix.py

    Setup: synthesize the service stack the same way the existing infra tests do
    (reuse the synthesized_template fixture in tests/infrastructure/test_api_construct.py
    if present; otherwise build the App + ServiceStack and call Template.from_stack(stack)).

    Write tests covering:

    1. test_template_synthesizes_without_dependency_cycle
       Action: Template.from_stack(service_stack)
       Assert: no exception raised (this is the regression guard for the cycle itself)

    2. test_failure_handlers_use_dedicated_role_not_shared_service_role
       Action: find the two Lambda resources whose Handler ends with
               'cr_failure_handler.lambda_handler' and 'artifact_failure_handler.lambda_handler'
       Assert: each function's Role Fn::GetAtt target is NOT the shared CrudServiceRoleArn role;
               it points to the new dedicated failure-handler role logical id

    3. test_dedicated_failure_handler_role_has_no_stepfunctions_permission
       Action: locate the dedicated role's IAM policy/policies in the template
       Assert: no policy statement Action contains 'states:' (no StartExecution / SendTaskSuccess /
               SendTaskFailure / SendTaskHeartbeat) — these belong only on the shared role

    4. test_dedicated_role_is_least_privilege_on_applications_table
       Assert: the dedicated role grants dynamodb actions (UpdateItem at minimum) scoped to the
               applications table ARN, and does NOT grant the full shared-role table/bucket set

    5. test_shared_role_still_has_stepfunctions_grants
       Assert: the shared CrudServiceRoleArn (used by gap_api_func / CR worker) STILL carries the
               states:StartExecution / SendTask* grants (fix must not remove existing behavior)

    6. test_failure_handler_role_name_follows_convention
       Assert: any new role's RoleName matches careervp-role-{service}-{feature}-{env}
               (or is a generated name accepted by validate_naming.py)

    Run: cd infra && uv run pytest tests/infrastructure/test_artifact_chain_cycle_fix.py -v --tb=short
    All 6 tests must pass.

# =============================================================================
# CATEGORY B: CYCLE FIX — FULL-SUITE REGRESSION (FE-UI-035)
# =============================================================================
cycle_fix_regression:
  prompt: |
    Context: Before FE-UI-035 the full infra suite is RED (9 passed, 19 errors, all the
    dependency-cycle error). After the fix it must be fully green.

    Steps (run in order):
    1. mkdir -p src/backend/.build/lambdas && touch src/backend/.build/lambdas/.placeholder
    2. cd infra && uv sync && npx cdk synth >/tmp/synth.log 2>&1 ; echo "synth exit=$?"
       MUST: exit 0
    3. cd infra && uv run pytest tests/infrastructure -v --tb=short
       MUST: exit 0, ZERO errors (previously 19), and the 9 previously-passing tests still pass
    4. python src/backend/scripts/validate_naming.py --path infra --strict
       MUST: exit 0
    5. uvx checkov -d infra/cdk.out --framework cloudformation --quiet \
         --check CKV_AWS_7 --check CKV_AWS_19 --check CKV_AWS_20 --check CKV_AWS_33 \
         --check CKV_AWS_53 --check CKV_AWS_54 --check CKV_AWS_55 --check CKV_AWS_56 --check CKV_AWS_364
       MUST: Failed checks: 0

    Report any failure with the test id and error message.

# =============================================================================
# CATEGORY C: NESTED-STACK SPLIT — ASSERTIONS (FE-UI-036)
# =============================================================================
nested_split_assertions:
  prompt: |
    Context: FE-UI-036 extracts leaf/outbound subtrees (monitoring first, then artifact-chain)
    into aws_cdk.NestedStack(s). The parent template must drop well below 500 resources and a
    nested-stack resource must appear.

    File to write tests in: infra/tests/infrastructure/test_nested_stack_split.py

    Write tests covering:

    1. test_parent_stack_under_resource_ceiling
       Action: parent_template = Template.from_stack(service_stack)
               count = len(parent_template.to_json()['Resources'])
       Assert: count < 450   # parent must have meaningful headroom under the 500 hard limit

    2. test_parent_has_nested_stack_resource
       Assert: parent_template.resource_count_is('AWS::CloudFormation::Stack', Match.any_value())
               is >= 1 (at least the monitoring nested stack after phase 1)

    3. test_monitoring_alarms_moved_out_of_parent
       CORRECTED 2026-06-13: dashboards STAY in the parent (api_construct builds CrudMonitoring
       with mode="dashboards"); only alarms + metric filters were moved to the nested stack.
       Assert: the parent template has the dashboards (2) + at most 1 alarm, and the BULK of
               alarms (>=15) and the metric filters are NOT in the parent.

    4. test_monitoring_nested_stack_contains_alarms_and_metric_filters
       Action: Template.from_stack(monitoring_nested_stack)
       Assert: has >= 15 AWS::CloudWatch::Alarm and >= 1 AWS::Logs::MetricFilter,
               and NO AWS::CloudWatch::Dashboard (dashboards remain in the parent)

    5. test_artifact_chain_nested_stack_present_after_phase_2  (mark xfail until phase 2 lands)
       Assert: a nested stack exposes the state machine; parent passes state_machine_arn via
               a CfnParameter/Output rather than defining the AWS::StepFunctions::StateMachine inline

    6. test_no_cross_stack_dependency_cycle
       Action: synthesize the whole app (App().synth())
       Assert: no exception — nested-stack references form a DAG

    Run: cd infra && uv run pytest tests/infrastructure/test_nested_stack_split.py -v --tb=short
    Tests 1-4 and 6 must pass; test 5 is xfail until phase 2.

# =============================================================================
# CATEGORY D: NESTED-SPLIT — NO STATEFUL REPLACEMENT GUARD (FE-UI-036)
# =============================================================================
nested_split_no_replacement:
  prompt: |
    Context: Moving resources between (nested) stacks can change logical IDs and trigger REPLACE,
    which is catastrophic for DynamoDB/S3/KMS. FE-UI-036 forbids moving stateful resources.

    This is a command-level gate (run against the deployed dev stack BEFORE deploying the split):

    Steps:
    1. mkdir -p src/backend/.build/lambdas && touch src/backend/.build/lambdas/.placeholder
    2. cd infra && npx cdk diff CareerVpCrudDev > /tmp/cdk-diff.txt 2>&1
    3. Inspect /tmp/cdk-diff.txt:
       MUST NOT contain a destructive change (look for "[-]" removals or "(requires replacement)" /
       "may be replaced") on any of:
         - AWS::DynamoDB::GlobalTable / AWS::DynamoDB::Table
         - AWS::S3::Bucket
         - AWS::KMS::Key
       Stateless resources (Alarm, Dashboard, StateMachine, Lambda, LogGroup, SNS, the
       AWS::CloudFormation::Stack nested-stack resources themselves) MAY appear.

    Optional automated assertion (infra/tests/infrastructure/test_nested_stack_split.py):
    - Parse the two synthesized templates (pre-split git HEAD vs post-split) and assert the
      logical IDs of every DynamoDB table, S3 bucket, and KMS key are UNCHANGED.

    Report any stateful replacement as a BLOCKER — do not deploy.

# =============================================================================
# CATEGORY E: NESTED-SPLIT — FULL REGRESSION (FE-UI-036)
# =============================================================================
nested_split_regression:
  prompt: |
    Context: After each extraction phase the whole infra graph must stay green.

    Steps:
    1. mkdir -p src/backend/.build/lambdas && touch src/backend/.build/lambdas/.placeholder
    2. cd infra && uv sync && npx cdk synth >/tmp/synth.log 2>&1 ; echo "exit=$?"   # MUST be 0
    3. grep -i 'Number of resources' /tmp/synth.log                                  # parent MUST be < 500 (target < 450)
    4. cd infra && uv run pytest tests/infrastructure -v --tb=short                  # MUST be 0 errors
    5. python src/backend/scripts/validate_naming.py --path infra --strict           # MUST exit 0
    6. uvx checkov -d infra/cdk.out --framework cloudformation --quiet \
         --check CKV_AWS_7 --check CKV_AWS_19 --check CKV_AWS_20 --check CKV_AWS_33 \
         --check CKV_AWS_53 --check CKV_AWS_54 --check CKV_AWS_55 --check CKV_AWS_56 --check CKV_AWS_364
       MUST: Failed checks: 0

    Report each phase's parent resource count so the drop is visible (baseline 495).

# =============================================================================
# EXECUTION ORDER + GATE MAPPING
# =============================================================================
execution_order:
  gate_1_before_FE_UI_035_impl:
    run_first:
      - cycle_fix_assertions (Category A)   # author tests first; they are RED until the fix
  after_FE_UI_035_impl:
    run:
      - cycle_fix_regression (Category B)
  gate_2_before_FE_UI_036_impl:
    prerequisite: "FE-UI-035 merged and infra suite green"
    run_first:
      - nested_split_assertions (Category C)
  during_each_FE_UI_036_phase:
    run:
      - nested_split_no_replacement (Category D)   # before every deploy
      - nested_split_regression (Category E)        # after every phase
