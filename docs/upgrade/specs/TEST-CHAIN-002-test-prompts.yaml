title: "Test Prompts — Full Auto-Chain + Dependency Resolver + VPR↔CR Binding + CR Quality"
priority: critical
status: draft
owner: backend
created_at: 2026-06-14
updated_at: 2026-06-14
type: test_prompts
note: >
  Runnable prompts for fresh Claude sessions (or a test-runner agent). Each section is
  self-contained: context, setup, run command, assertions. Covers FE-UI-038 (dependency
  resolver), FE-UI-039 (CL/IP chain legs), FE-UI-040 (VPR↔CR binding), FE-UI-041 (CR quality
  gate). Run backend before infra. Author tests BEFORE implementation for each gate.

context_required: >
  Working directory: /Users/yitzchak/Documents/dev/careervp
  Backend: src/backend/careervp/
  Infra:   infra/careervp/
  Specs:   docs/upgrade/specs/ (FE-UI-038 through FE-UI-041)

