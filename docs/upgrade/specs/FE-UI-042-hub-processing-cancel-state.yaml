spec_id: FE-UI-042
title: "Hub Processing/Cancel button state — ALL artifacts, animated dots, failure recovery"
priority: high
status: draft
owner: frontend
created_at: 2026-06-14
updated_at: 2026-06-14
tier: bugfix

human_approval_gate:
  required: false
  note: "Frontend-only UI/UX change to ModuleCard + hub page + generate hook. No API or schema change."

recommended_model: sonnet
reason_for_model: >
  Component state-machine + hook error propagation in established React/Next codebase with
  existing vitest/testing-library coverage. Pattern-following work, not novel architecture.

depends_on:
  - FE-UI-027   # hub generate UX (existing Processing/Cancel scaffolding)
  - FE-UI-041   # CR 'not_generated' status mapping (so CR card participates uniformly)
  - FE-UI-043   # backend CR cancel endpoint + real chain-stopping cancellation (FE Cancel must actually cancel)
blocks: []

# =============================================================================
# PROBLEM STATEMENT
# =============================================================================
problem_statement:
  current_behavior: >
    The Processing/Cancel UI exists but is partial and fragile:
      1. Animation is wrong: ModuleCard.tsx:214 renders "Processing<span class='animate-pulse'>...</span>"
         — animate-pulse fades the whole ellipsis; it is NOT three sequentially-animated dots.
      2. Company Research is NOT covered: CR regeneration uses a separate isRetryingCompanyResearch
         flag (page.tsx:188-196, 236-243) that does NOT flip the card to Processing/Cancel. So
         "ANY artifact" is not uniformly handled — only the 4 genMap modules
         (vpr, coverLetter, interviewPrep, tailoredCV) get the optimistic processing swap
         (page.tsx:425-446).
      3. Failures are swallowed: useGenerateModule.generate() captures errors into local `error`
         state (useGenerateModule.ts:84-88) but handleGenerate (page.tsx:154-173) never reads it.
         No error is surfaced, and the button is restored only incidentally by polling. The
         requirement ("throw an error on failure and return the button to original state in any
         case") is unmet.
      4. Cancel can be missing during the optimistic window: cancelAction requires a known
         taskId (page.tsx:434-442); before the POST returns, taskId is null so Cancel may not
         render while "Processing..." shows with no way to cancel.
  required_behavior: >
    For EVERY artifact card (VPR, Company Research, CV Tailoring, Cover Letter, Interview Prep,
    Gap Analysis where applicable) — whenever it is generating OR regenerating:
      - The View / Edit / Regenerate (and Generate/Retry) actions are REPLACED by a single
        disabled "Processing" indicator with THREE sequentially-animated dots, plus a Cancel button.
      - The three dots animate in sequence (".", "..", "...") — not a whole-ellipsis fade.
      - On failure (generate POST rejects, or polling returns failed): surface a visible error
        on the card AND restore the original buttons (exit processing) in ALL cases.
      - Cancel is always available while processing; if taskId is not yet known, Cancel aborts
        the in-flight request / clears optimistic processing rather than being hidden.
  user_impact: >
    Consistent, legible feedback while any artifact is being (re)generated; users can always
    cancel; failures are never silent and never leave a card stuck in "Processing...".

# =============================================================================
# EVIDENCE
# =============================================================================
evidence:
  wrong_animation:
    - { file: src/frontend/components/ModuleCard/ModuleCard.tsx, line: "207-224", note: "animate-pulse on whole '...'" }
  cr_not_covered:
