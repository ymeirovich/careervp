    - { file: src/frontend/app/applications/[id]/page.tsx, line: "154-173", symbol: handleGenerate, note: "does not read gen.error" }
  cancel_needs_taskid:
    - { file: src/frontend/app/applications/[id]/page.tsx, line: "434-442", symbol: cancelAction }
