  # Polling bug fix
  - id: AC-017
    module: all
    given: The user clicks Generate on any module
    when: The generate API call responds successfully with a taskId
    then: persistArtifact(jobId, moduleType, taskId) is called immediately so that polling starts without waiting for a hub refetch; the Processing UI is visible before the next hub GET completes
    verification: integration
    blocking_gate: pre_merge

  # Known limitation
  - id: AC-018
    module: all
    category: known_limitation
    description: >
      SQS workers do not check CANCELLED status before writing results. A worker that
      started before the cancel request arrived will overwrite CANCELLED → COMPLETED on
      the next hub load. Worker-side guard is deferred to V2. This limitation must be
      documented in the code via a TODO comment at the cancel handler callsite.
    verification: none
    blocking_gate: none

states:
  - state: idle
    trigger: Page load, no taskId in localStorage
    visual: "Generate" (or "Regenerate") button enabled; no Cancel visible
  - state: processing
    trigger: Generate clicked; taskId persisted to localStorage
    visual: Disabled "Processing..." button with animated dots; Cancel button visible
  - state: error
    trigger: Poll returns 'failed' or 'cancelled'
    visual: Inline error message below card; primary CTA reverts to "Generate"
  - state: completed
    trigger: Poll returns 'completed'
    visual: Primary CTA "Regenerate"; secondary "View" button; no Cancel

