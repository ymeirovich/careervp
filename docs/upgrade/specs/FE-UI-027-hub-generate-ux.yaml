rollback_trigger_matrix:
  - trigger_id: RT-001
    condition: Any blocking AC flips pass→fail post-deploy
    action: Revert frontend files (page.tsx, useGenerateModule.ts, ModuleCard.tsx), re-open spec
  - trigger_id: RT-002
    condition: Cancel endpoint returns unexpected non-200/409 on prod traffic
    action: Block deploy, investigate Lambda logs; cancel endpoints are additive so backend revert is low-risk
  - trigger_id: RT-003
    condition: Completed artifacts stop appearing after generation following this deploy
    action: Check localStorage persistArtifact key; revert useGenerateModule.ts if polling regression confirmed

design_notes:
  - >
    The animated dots on "Processing..." should use a CSS keyframe animation, not a
    JS timer, to avoid interference with React re-renders during polling.
  - >
    Cancel button placement: render inline alongside the disabled Processing button,
    not in a separate row. Confirm exact placement with design if a mockup is produced.
  - >
    generationError state is per-module (one error string per module type), not global.
    Clearing one module's error on a new Generate click must not affect other modules.
  - >
    AC-018 known limitation: add a TODO comment at the cancel handler callsite referencing
    this spec ID (FE-UI-027 / AC-018) so the V2 worker-side guard is traceable.
  - >
    The 'cancelled' → 'notStarted' mapping in mapApplicationDataToHubState.ts means the
    hub will show "Generate" (not "Regenerate") after a cancel, even if a previous
    completed artifact existed. Verify this is the intended UX before implementing.
