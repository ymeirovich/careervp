spec_id: FE-UI-027
title: "Hub Generate UX — processing state, cancel, error, and polling bug fix for all four modules"
priority: high
status: draft
owner: frontend
created_at: 2026-06-03
updated_at: 2026-06-03
route: /applications/[id]
component_file: src/frontend/app/applications/[id]/page.tsx
tier: feature

problem_statement:
  current_behavior: >
    The Generate button on the Job Application Hub has no visual feedback after click.
    useGenerateModule.generate() sets a taskId in state but never calls persistArtifact(),
    so the taskId is never written to localStorage. Because polling reads from localStorage
    to decide whether to start, polling never starts. The Cancel action does not exist.
    If a poll returns 'failed' or 'cancelled', no error is surfaced to the user.
  required_behavior: >
    After Generate is clicked the button is immediately disabled, its label changes to
    "Processing..." with animated dots, and a Cancel button appears alongside it.
    persistArtifact() is called immediately after the generate API responds so that
    polling starts without waiting for a hub refetch. Cancel calls the appropriate
    POST /{module}/{taskId}/cancel endpoint, stops polling, clears localStorage, and
    resets the UI. If polling returns 'failed' or 'cancelled', a friendly inline error
    is shown below the card and the primary CTA reverts to "Generate". If polling
    returns 'completed', the primary CTA becomes "Regenerate" and a secondary "View"
    button navigates to /applications/{jobId}/{module}?id={artifactId}.
  user_impact: >
    Users currently have no confirmation that generation started and no way to cancel.
    The polling bug means the hub never updates after generation completes without a
    manual page refresh. This fix closes all three gaps.

evidence:
  root_cause_file: src/frontend/hooks/useGenerateModule.ts
  root_cause_description: >
    generate() calls setTaskId(data.taskId) but omits the subsequent
    persistArtifact(jobId, moduleType, data.taskId) call. Polling reads localStorage;
    without the persist step the key is absent and polling returns immediately.
  backend_cancel_endpoints:
    - POST /vpr/{vprId}/cancel
    - POST /cover-letter/{coverLetterId}/cancel
    - POST /interview-prep/{interviewPrepId}/cancel
    - POST /cv-tailoring/{cvTailoringId}/cancel
  cancel_response: '200 {"status":"cancelled"} or 409 if already terminal'

architecture:
  primary_files:
    - src/frontend/app/applications/[id]/page.tsx
    - src/frontend/hooks/useGenerateModule.ts
    - src/frontend/hooks/useModuleStatus.ts
    - src/frontend/components/ModuleCard/ModuleCard.tsx
    - src/frontend/api/methods.ts
    - src/frontend/adapters/mapApplicationDataToHubState.ts
    - src/frontend/lib/types.ts
  test_files:
    - src/frontend/tests/unit/module-card.test.tsx
    - src/frontend/tests/integration/hub-generate-ux.test.tsx
    - src/frontend/tests/integration/api-polling.test.ts
  api_dependencies:
    - "POST /vpr (generate)"
    - "POST /cover-letter (generate)"
    - "POST /interview-prep (generate)"
    - "POST /cv-tailoring (generate)"
    - "GET /applications/{id} (hub refetch)"
    - "POST /vpr/{vprId}/cancel"
    - "POST /cover-letter/{coverLetterId}/cancel"
    - "POST /interview-prep/{interviewPrepId}/cancel"
    - "POST /cv-tailoring/{cvTailoringId}/cancel"
  cascade_risk: medium — hub page; ModuleCard is used by all four modules

fix_plan:
  backend_changes:
    summary: >
      Four cancel endpoints added to existing Lambdas (no new Lambda functions).
      Each endpoint returns 200 {"status":"cancelled"} on success or 409 if the
      artifact is already in a terminal state.
      _normalize_status in vpr_status_handler.py updated to pass through 'cancelled'
      so the frontend poll receives it correctly.
    files_changed:
      - file: src/backend/careervp/handlers/vpr_handler.py
        change: adds cancel route handler
      - file: src/backend/careervp/handlers/cover_letter_handler.py
        change: adds cancel route handler
      - file: src/backend/careervp/handlers/interview_prep_handler.py
        change: adds cancel route handler
      - file: src/backend/careervp/handlers/cv_tailoring_handler.py
        change: adds cancel route handler
      - file: src/backend/careervp/handlers/vpr_status_handler.py
        change: _normalize_status passes through 'cancelled'

  frontend_changes:
    - file: lib/types.ts
      change: ArtifactStatus union type adds 'cancelled'
    - file: api/methods.ts
      change: cancelVpr(), cancelCoverLetter(), cancelInterviewPrep(), cancelCvTailoring() methods added
    - file: adapters/mapApplicationDataToHubState.ts
      change: 'cancelled' rawStatus maps to 'notStarted' so hub resets the card
    - file: hooks/useGenerateModule.ts
      change: >
        persistArtifact(jobId, moduleType, taskId) called immediately after setTaskId();
        cancel() function added — calls cancel endpoint, stops polling, clears localStorage
    - file: hooks/useModuleStatus.ts
      change: 'cancelled' added to terminal status check so polling stops
    - file: components/ModuleCard/ModuleCard.tsx
      change: >
        cancelAction prop added; Processing state renders disabled "Processing..." button
        with animated dots and a Cancel button; error slot renders inline error below card
    - file: app/applications/[id]/page.tsx
      change: >
        handleCancel per module wired up; generationError state added per module;
        refetch triggered on completion; error cleared on new generate attempt

  non_goals:
    - Worker-side CANCELLED check before writing results (V2 scope — see AC-018)
    - Changes to the GET /applications/{id} response schema
    - Overwrite confirmation dialog design changes (existing dialog retained)
    - Any module page outside /applications/[id]

  rollback_plan: >
    Revert frontend files to prior versions. Backend cancel endpoints are additive and
    can be left in place; no database schema changes were made.

