spec_id: FE-UI-043
title: "Cancellation lifecycle — stop the chain, CR cancel endpoint, worker CANCELLED-guard, orphan cleanup"
priority: critical
status: draft
owner: backend
created_at: 2026-06-14
updated_at: 2026-06-14
tier: feature

human_approval_gate:
  required: true
  gate_number: 3
  reason: >
    Adds states:StopExecution to a handler role, a new Company Research cancel endpoint
    (public API + route), worker-side CANCELLED guards that change persist behavior, and a
    destructive orphan-cleanup path (deletes partial artifacts in DynamoDB + S3). IAM and
    data-deletion changes are security-sensitive.
  approval_before: "Any states:StopExecution grant, any artifact-deletion logic, or the new /company-research/{jobId}/cancel route"

recommended_model: opus
reason_for_model: >
  Cancellation correctness under the worker race (cancel vs. in-flight persist), Step Functions
  execution stop semantics across a Parallel fan-out, and safe orphan deletion (must never
  delete a sibling user's or a completed artifact) are architecture- and security-sensitive.

depends_on:
  - FE-UI-031   # the chain + execution that must be stoppable
  - FE-UI-038   # resolver uses the persisted execution ARN for its running-chain guard
  - FE-UI-039   # CL/IP legs exist; cancel must reason about the Parallel fan-out
blocks:
  - FE-UI-042   # FE Cancel UX needs a working CR cancel + real backend cancellation

# =============================================================================
# PROBLEM STATEMENT
# =============================================================================
problem_statement:
  current_behavior: >
    Cancellation is cosmetic and leaks orphans:
      - VPR / Cover Letter / Interview Prep / CV Tailoring each expose POST /.../cancel
        (vpr_status_handler.py:363-399, cover_letter_handler.py:1237-1286,
        interview_prep_handler.py:1100-1149, cv_tailoring_handler.py:813-866) but each ONLY
        sets DynamoDB status=CANCELLED. None call Step Functions stop_execution. None delete
        partial outputs.
      - Company Research has NO cancel endpoint at all (no handler, no infra route, no FE method).
      - SQS workers do not check CANCELLED before writing results (known TODO FE-UI-027/AC-018,
        useGenerateModule.ts:96-98). A worker that started before the cancel overwrites
        CANCELLED -> COMPLETED on next persist.
      - The chain execution KEEPS RUNNING after a single-artifact cancel: gap_handler.py:442
        starts the execution with a random name (chain-{job_id}-{uuid4hex}) and DISCARDS the
        returned executionArn (never persisted), so nothing can find or stop it. The chain
        proceeds to generate downstream artifacts the user already cancelled.
    Net effect: clicking Cancel may leave the backend producing VPR/CV/CL/IP, writing S3
    result files and DynamoDB job rows that no longer belong to any active request (orphans),
    and the cancelled artifact may flip back to COMPLETED.
  required_behavior: >
    Cancellation actually stops backend work and leaves no orphans:
      1. The chain execution ARN is persisted on the application record when the chain starts,
         so it can be located, deduped (FE-UI-038), and stopped.
      2. Company Research gets a cancel endpoint symmetric with the other four artifacts.
      3. Cancelling an artifact that is part of a RUNNING chain stops the whole chain execution
         (stop_execution) and marks all still-pending chained artifacts CANCELLED. Cancelling a
         standalone (non-chain) job cancels only that job.
      4. Every SQS worker checks CANCELLED (and chain-stopped) state BEFORE persisting; if
         cancelled it aborts the write, sends task_failure (if task_token), and deletes any
         partial output it already wrote.
      5. An orphan-cleanup reaper removes partial artifacts (DynamoDB job rows + S3 result
         objects) for CANCELLED jobs and reconciles the race where a worker completed AFTER a
         cancel (late-completion is rolled back to CANCELLED + output deleted).
  user_impact: >
    Cancel is trustworthy: no surprise documents appear after cancelling, no charges for work
    the user stopped, and the hub never shows a cancelled artifact silently completing.

# =============================================================================
# EVIDENCE
# =============================================================================
evidence:
  cancel_endpoints_status_only:
    - { file: src/backend/careervp/handlers/vpr_status_handler.py, symbol: _handle_vpr_cancel, line: "363-399" }
    - { file: src/backend/careervp/handlers/cover_letter_handler.py, symbol: _handle_cover_letter_cancel, line: "1237-1286" }
    - { file: src/backend/careervp/handlers/interview_prep_handler.py, symbol: _handle_interview_prep_cancel, line: "1100-1149" }
    - { file: src/backend/careervp/handlers/cv_tailoring_handler.py, symbol: _handle_cv_tailoring_cancel, line: "813-866" }
  cr_has_no_cancel:
    - { note: "grep cancel in company_research_handler.py => 0 matches; no /company-research/{jobId}/cancel route in api_construct.py" }
  execution_arn_discarded:
    - { file: src/backend/careervp/handlers/gap_handler.py, line: "442-455", note: "start_execution return value (executionArn) is never captured/persisted" }
  worker_no_cancelled_guard:
    - { file: src/frontend/hooks/useGenerateModule.ts, line: "96-98", note: "TODO FE-UI-027/AC-018: workers don't check CANCELLED before writing" }
  infra_routes:
