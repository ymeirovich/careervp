# =============================================================================
# ARCHITECTURE
# =============================================================================
architecture:
  cancel_semantics_decision:
    chosen: "Chained cancel stops the whole execution; standalone cancel stops one job."
    rules:
      - "If the artifact's application has a RUNNING chain execution (chain_execution_arn set + status RUNNING): cancel = stop_execution(that ARN) + mark every artifact still in {pending,processing} as CANCELLED + cleanup orphans for those."
      - "If no running chain (manual single-artifact generation): cancel only that job's DynamoDB row + clean its partial output."
    rationale: >
      Downstream chain artifacts depend on upstream; cancelling VPR mid-chain makes CV/CL/IP
      meaningless. Step Functions cannot cancel a single Parallel branch without stopping the
      execution, so a unified 'cancel stops the chain' model is both correct and simplest. The
      hub already shows chain progress (ChainProgressBar), so a single Cancel mapping to the
      whole chain matches the user's mental model.

  chain_execution_tracking:
    change_in: src/backend/careervp/handlers/gap_handler.py
    detail: >
      Capture start_execution(...)['executionArn'] and persist it on the application record:
        application_repo.set_chain_execution(application_id, user_id, execution_arn, status='RUNNING')
      Clear/transition to 'STOPPED'/'SUCCEEDED'/'FAILED' when the chain ends (failure handlers
      + a terminal success step update it).
    new_application_fields:
      - { name: chain_execution_arn, type: "str | null" }
      - { name: chain_execution_status, type: "enum: RUNNING|STOPPED|SUCCEEDED|FAILED|null" }
    consumed_by: "FE-UI-038 resolver running-chain guard (replaces the deterministic-name idea)."

  cr_cancel_endpoint:
    route: "POST /company-research/{jobId}/cancel"
    handler: src/backend/careervp/handlers/company_research_handler.py
    behavior: >
      Mirror _handle_vpr_cancel: ownership check, terminal-status guard (CONFLICT if already
      COMPLETED/FAILED/CANCELLED), set CANCELLED, then run the shared cancel-orchestration
      (stop chain if running). Note: CR is currently sync; if a CR job is in-flight only via
      the chain, the meaningful cancel is the chain stop.
    infra: "Add the route to api_construct.py routes list (line ~2611 block) -> company_research_func."
    frontend: "Add api.cancelCompanyResearch(jobId) in src/frontend/api/methods.ts (FE-UI-042 consumes it)."

  shared_cancel_orchestration:
    new_file: src/backend/careervp/logic/cancellation.py
    function: "cancel_artifact(artifact_type, artifact_id, application_id, user_id, repos, sfn) -> CancelResult"
    steps:
      - "Ownership + terminal-status guard (return CONFLICT/FORBIDDEN as today)."
      - "Set the target job status=CANCELLED (conditional write: only if not terminal)."
      - "If application.chain_execution_status == RUNNING: sfn.stop_execution(chain_execution_arn, cause='user_cancel'); set chain_execution_status=STOPPED; mark all artifact_statuses in {pending,processing} -> 'cancelled'."
      - "Enqueue orphan cleanup for the cancelled artifact(s) (see reaper)."
    idempotent: "Double-cancel is a no-op (already CANCELLED/terminal returns CONFLICT or OK-noop consistently)."

  worker_cancelled_guard:
    applies_to:
      - src/backend/careervp/handlers/vpr_worker_handler.py
      - src/backend/careervp/handlers/cover_letter_submit_handler.py   # worker path
      - src/backend/careervp/handlers/interview_prep_submit_handler.py # worker path
      - src/backend/careervp/handlers/cv_tailoring_handler.py          # worker path
      - src/backend/careervp/handlers/company_research_worker_handler.py
    rule: >
      Immediately BEFORE the final persist (S3 put + DynamoDB COMPLETED write), re-read the job
      status. If status == CANCELLED (or chain_execution_status == STOPPED):
        - Do NOT write COMPLETED, do NOT write the S3 result (or delete it if already written).
        - If task_token present: sfn.send_task_failure(error='Cancelled').
        - Log structured cancelled_before_persist=true and return cleanly (no DLQ).
    note: "This closes the cancel-vs-persist race (FE-UI-027/AC-018). Use a conditional UpdateItem (ConditionExpression: status <> 'CANCELLED') as the atomic guard on the COMPLETED write."

  orphan_cleanup_reaper:
    description: >
      Removes partial artifacts left by cancellation and reconciles late completions.
    triggers:
      - "Inline: cancel_artifact enqueues cleanup for the cancelled artifact ids."
      - "Scheduled (defense-in-depth): an EventBridge-scheduled Lambda sweeps for jobs
        status=CANCELLED with a result_key/S3 object still present, or COMPLETED jobs whose
        application chain_execution_status=STOPPED and completed_at > cancel time (late completion)."
    actions:
      - "Delete the S3 result object (result_key) if present."
      - "Delete or tombstone the DynamoDB job row / artifact record for the cancelled artifact."
      - "Reset artifact_statuses[type] to 'cancelled' (not 'completed') on the application."
      - "NEVER touch artifacts owned by another user or any artifact whose status is COMPLETED for a NON-stopped chain."
    safety:
      - "All deletes are ownership-scoped and status-guarded."
      - "Cleanup is idempotent (missing object / already-deleted row is success)."
      - "Dry-run/log mode toggle via env (CLEANUP_DRY_RUN) for first rollout."

  iam_grants:
    cancel_handlers_role:
      - "states:StopExecution on ArtifactChainStateMachine (scoped to the chain ARN)"
      - "states:DescribeExecution (to read execution status) on the chain ARN"
    reaper_role:
      - "s3:DeleteObject on the vpr/artifact results bucket (prefix-scoped)"
      - "dynamodb:UpdateItem/DeleteItem on jobs + applications tables (scoped)"
    note: "Respect FE-UI-035 invariant — no states:* wildcards; scope to the chain ARN."

# =============================================================================
# IMPLEMENTATION STEPS
# =============================================================================
implementation:
  step_1:
    name: "Persist chain execution ARN + status"
    files: [src/backend/careervp/handlers/gap_handler.py, "src/backend/careervp/dal/<application_repository>.py"]
    change: "Capture executionArn; add set_chain_execution + terminal updates from failure/success handlers."
  step_2:
    name: "Create logic/cancellation.py shared orchestration"
    change: "cancel_artifact() per architecture; pure-ish with injected repos + sfn client."
  step_3:
    name: "Wire cancel_artifact into all 4 existing cancel handlers"
    change: "Replace the status-only update with cancel_artifact()."
  step_4:
    name: "Add CR cancel endpoint + route + FE method"
    files:
      - src/backend/careervp/handlers/company_research_handler.py
      - infra/careervp/api_construct.py
      - src/frontend/api/methods.ts
  step_5:
    name: "Add CANCELLED guard to all workers"
    change: "Conditional COMPLETED write (ConditionExpression status<>CANCELLED) + S3 cleanup on cancel."
  step_6:
    name: "Build orphan-cleanup reaper"
    files:
      - "src/backend/careervp/handlers/<artifact_cleanup_handler>.py"
      - infra/careervp/  # EventBridge schedule + reaper Lambda + IAM (gate)
  step_7:
    name: "Add IAM grants (StopExecution, DescribeExecution, scoped delete)"
    file: infra/careervp/api_construct.py

# =============================================================================
# CONSTRAINTS
# =============================================================================
constraints:
  - "Cancel of a chained artifact stops the WHOLE chain execution; standalone cancel stops one job"
  - "Workers MUST atomically guard the COMPLETED write against a concurrent CANCELLED (conditional write)"
  - "Orphan cleanup is ownership-scoped, status-guarded, and idempotent — never deletes COMPLETED artifacts of a live chain or another user's data"
  - "All Step Functions grants scoped to the chain ARN; no states:* wildcard (FE-UI-035 invariant)"
  - "Cancel endpoints keep existing CONFLICT-on-terminal + FORBIDDEN-on-non-owner behavior"
  - "Defensive: a failure to stop the chain must still mark the artifact CANCELLED and log (no 500 leak)"
  - "mypy --strict; validate_naming --strict; checkov green"

# =============================================================================
# VALIDATION
# =============================================================================
validation:
  commands:
    - "cd src/backend && uv run mypy careervp --strict"
    - "cd src/backend && uv run pytest tests/unit/ -v --tb=short -k 'cancel or cleanup or reaper'"
    - "cd infra && uv sync && npx cdk synth && uv run pytest tests/infrastructure -v --tb=short"
    - "python src/backend/scripts/validate_naming.py --path infra --strict"
    - "cd src/frontend && npm run typecheck && npm run test:unit"
  acceptance_criteria:
    - "POST /company-research/{jobId}/cancel exists, ownership-checked, CONFLICT on terminal"
    - "Cancelling a chained artifact calls sfn.stop_execution and marks pending artifacts cancelled"
    - "Cancelling a standalone job does NOT call stop_execution"
    - "Worker re-reads status and skips COMPLETED write when CANCELLED (race test passes)"
    - "Worker deletes/omits the S3 result when cancelled before persist"
    - "Reaper deletes orphan S3 result + resets artifact_status to cancelled; idempotent on re-run"
    - "Reaper never deletes a COMPLETED artifact of a non-stopped chain or another user's data"
    - "chain_execution_arn persisted on application record when chain starts"
    - "No states:* wildcard; checkov + naming pass; mypy strict passes"

# =============================================================================
# TEST HOOKS
# =============================================================================
test_hooks:
  - "TEST-CANCEL-001 § unit-cancellation: cancel_artifact chain vs standalone"
  - "TEST-CANCEL-001 § unit-worker-guard: CANCELLED race guard"
  - "TEST-CANCEL-001 § unit-cr-cancel: new CR cancel endpoint"
  - "TEST-CANCEL-001 § integration-stop-chain: stop_execution + pending artifacts cancelled"
  - "TEST-CANCEL-001 § integration-reaper: orphan cleanup + late-completion reconcile"
  - "TEST-CANCEL-001 § security-reaper: ownership + completed-artifact safety"
