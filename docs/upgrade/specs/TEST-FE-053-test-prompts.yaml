# =============================================================================
# CATEGORY A: POST ENQUEUES + 202 FAST
# =============================================================================
post_enqueue:
  prompt: |
    Context: FE-UI-053 R1 — _fetch_company_research enqueues SQS, returns 202, no research_company().
    Files: src/backend/tests/unit/test_company_research_handler.py
    Mock: boto3 SQS client (patch careervp.handlers.company_research_handler.boto3).
    1. test_post_sends_one_sqs_message — assert send_message called once; body valid CRWorkerInput. → SC1
    2. test_post_returns_202_no_research_call — assert statusCode=202, research_company NOT called. → SC2
    3. test_post_writes_processing_row — patch write_cr_processing; assert called with correct ids. → SC3
    Run: cd src/backend && uv run pytest tests/unit/test_company_research_handler.py -q -k post
    Pass: all 3 green.

# =============================================================================
# CATEGORY B: GET STATUS ROUTING (4 CASES)
# =============================================================================
get_status:
  prompt: |
    Context: FE-UI-053 R3 — get_company_research routes all 4 status values.
    Files: src/backend/tests/unit/test_company_research_handler.py
    Patch read_cr_artifact for each case:
    1. test_get_processing — returns {status:"processing"} → body {status:"processing",company_research:null}. → SC4
    2. test_get_completed — returns {status:"completed",...data} → data present.
    3. test_get_failed — returns {status:"failed"} → response reflects failed.
    4. test_get_not_generated — returns None → status:"not_generated", not 500. → SC4
    Run: cd src/backend && uv run pytest tests/unit/test_company_research_handler.py -q -k get
    Pass: all 4 green.

# =============================================================================
# CATEGORY C: STORE IDEMPOTENCY
# =============================================================================
store_idempotency:
  prompt: |
    Context: FE-UI-053 R2 — write_cr_processing must not overwrite terminal rows.
    Files: src/backend/tests/unit/test_company_research_store.py
    1. test_write_processing_on_empty — upserts status=processing. → SC5
    2. test_write_processing_on_not_generated — overwrites not_generated row.
    3. test_no_overwrite_completed — existing completed row; assert DynamoDB put NOT called.
    4. test_no_overwrite_failed — existing failed row; same assert.
    Run: cd src/backend && uv run pytest tests/unit/test_company_research_store.py -q
    Pass: all 4 green.

# =============================================================================
