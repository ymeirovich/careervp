infra_synth:
  prompt: |
    Context: FE-UI-053 R4 — handler Lambda needs COMPANY_RESEARCH_QUEUE_URL + scoped SendMessage.
    Files: infra/tests/test_cr_enqueue_infra.py (new). Use aws_cdk.assertions.Template.from_stack.
    1. test_cr_handler_has_queue_url_env — Environment contains COMPANY_RESEARCH_QUEUE_URL. → SC6
    2. test_sqs_send_scoped_to_cr_queue — IAM allows sqs:SendMessage on CR queue ARN only. → SC6
    3. test_no_wildcard_sqs — no sqs:SendMessage on Resource '*'. → SC6
    4. test_synth_no_cycle — Template.from_stack succeeds. → SC7
    Run: cd infra && uv run pytest tests/test_cr_enqueue_infra.py -q && npx cdk synth
    Pass: all 4 tests + synth exit 0.

