spec_id: RECOVERY_001
title: Establish Baseline, Blocking Gates, and Evidence Controls Before Regression Reversal
priority: critical
status: pending
owner: backend-platform
created_at: 2026-03-05
updated_at: 2026-03-05
sequence_step: 1
status_scale: draft|pending|in_progress|implemented|validated|closed

targets_yaml2_specs:
  - COVER_LETTER_002
  - CV_TAILORING_002
  - GAP_GET_002
  - INTERVIEW_PREP_002
  - INTERVIEW_PREP_003
  - TRIAL_002
  - VPR_LIST_METADATA_001

problem_statement:
  exact_failing_behavior: |
    Regressions were accepted into live runs because gates were not enforced as release blockers.
    live-test-results28.log introduced non-2xx responses and generated-artifact empty list/read
    regressions compared to live-test-results27.log.
  expected_behavior: |
    No regression-fix implementation proceeds unless baseline deltas, parity checks, traceability,
    and evidence integrity checks are configured and passing.
  user_business_impact: |
    Without strict gates, code can appear complete but degrade live behavior and force costly rollback cycles.
  reproducibility_notes:
    - Compare careervp/live-test-results27.log to careervp/live-test-results28.log.
    - Identify non-2xx increases, empty-array regressions, and generated-id roundtrip misses.

evidence:
  failing_tests:
    - docs/refactor/live_tests/test_04_vpr.py::TestVPREndpoints::test_list_vprs
    - docs/refactor/live_tests/test_05_gap_analysis.py::TestGapAnalysisEndpoints::test_generate_gap_questions
    - docs/refactor/live_tests/test_06_cv_tailoring.py::TestCVTailoringEndpoints::test_delete_tailored_cv_roundtrip
    - docs/refactor/live_tests/test_07_cover_letter.py::TestCoverLetterEndpoints::test_list_cover_letters
    - docs/refactor/live_tests/test_08_interview_prep.py::TestInterviewPrepEndpoints::test_get_interview_prep_status
    - docs/refactor/live_tests/test_10_api_contract_success.py::TestAPIContractSuccess::test_api_contract_success_for_all_27_endpoints
  endpoint_method_path:
    - method: POST
      path: /jobs/{jobId}/gap-questions
      observed_status_code: 500
    - method: DELETE
      path: /cv-tailoring/{cvTailoringId}
      observed_status_code: 403
    - method: GET
      path: /cover-letters
      observed_status_code: 200
      observed_body_fragment: '{"cover_letters": []}'
    - method: GET
      path: /vprs
      observed_status_code: 200
      observed_body_fragment: generated id missing after polling window
  baseline_artifact: careervp/live-test-results27.log
  regression_artifact: careervp/live-test-results28.log
  environment: dev-live
  timestamp_utc: '2026-03-05T00:00:00Z'

