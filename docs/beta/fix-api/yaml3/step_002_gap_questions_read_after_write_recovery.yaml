spec_id: RECOVERY_002
title: Restore Gap Questions Read-After-Write and Eliminate Table-Resolution Regression
priority: critical
status: pending
owner: backend-platform
created_at: 2026-03-05
updated_at: 2026-03-05
sequence_step: 2

targets_yaml2_specs:
  - GAP_GET_002
  - TRIAL_002

problem_statement:
  exact_failing_behavior: |
    Regression in live-test-results28.log changed gap question generation from 200-with-empty-read
    behavior (seen in 27) to hard 500 DYNAMODB_ERROR on POST /jobs/{jobId}/gap-questions.
    Root issue is table selection drift in gap question DAL resolution.
  expected_behavior: |
    POST /jobs/{jobId}/gap-questions succeeds only when persistence succeeds in the correct users table.
    GET /jobs/{jobId}/gap-questions returns persisted questions for same user/job.
    Contract and live behavior must be >= live-test-results27.log and satisfy GAP_GET_002 fully.
  user_business_impact: |
    Users cannot persist or retrieve generated questions, blocking downstream gap responses and contract runs.
  reproducibility_notes:
    - Run docs/refactor/live_tests/test_05_gap_analysis.py against current deployed API.
    - Observe 500 in live-test-results28.log for POST /jobs/{jobId}/gap-questions.

evidence:
  failing_tests:
    - docs/refactor/live_tests/test_05_gap_analysis.py::TestGapAnalysisEndpoints::test_generate_gap_questions
    - docs/refactor/live_tests/test_05_gap_analysis.py::TestGapAnalysisEndpoints::test_get_gap_questions
    - docs/refactor/live_tests/test_10_api_contract_success.py::TestAPIContractSuccess::test_api_contract_success_for_all_27_endpoints
  endpoint_method_path:
    - method: POST
      path: /jobs/{jobId}/gap-questions
      observed_status_code: 500
      observed_body_fragment: '{"code": "DYNAMODB_ERROR"}'
    - method: GET
      path: /jobs/{jobId}/gap-questions
      observed_status_code: 200
      observed_body_fragment: '{"questions": []}'
  baseline_artifact: careervp/live-test-results27.log
  regression_artifact: careervp/live-test-results28.log
  environment: dev-live
  timestamp_utc: '2026-03-05T00:00:00Z'

architecture_and_ownership_map:
  route_to_lambda:
    - route: POST /jobs/{jobId}/gap-questions
      lambda: gap-api
      handler: src/backend/careervp/handlers/gap_handler.py
    - route: GET /jobs/{jobId}/gap-questions
      lambda: gap-api
      handler: src/backend/careervp/handlers/gap_handler.py
    - route: POST /jobs/{jobId}/gap-responses
      lambda: gap-api
      handler: src/backend/careervp/handlers/gap_handler.py
  handler_file_paths:
    - src/backend/careervp/handlers/gap_handler.py
    - src/backend/careervp/dal/dynamo_dal_handler.py
    - infra/careervp/api_construct.py
  data_store_index_usage:
    - users table pk/sk for gap question artifacts
    - gap_responses table userId/questionId for responses
    - applications table for state transitions
  auth_source_and_identity_key:
    source: requestContext.authorizer claims
    identity_key: user_id
  canonical_sources_of_truth:
    route_surface: infra/careervp/api_construct.py
    storage_schema: infra/careervp/api_db_construct.py

root_cause_analysis:
  hypotheses_ranked:
    - id: H1
      hypothesis: gap handler chooses ARTIFACTS_TABLE_NAME before users table env vars.
      disproof_criteria: explicit GAP_QUESTIONS_TABLE_NAME or USERS_TABLE_NAME priority is enforced and verified.
      status: confirmed
    - id: H2
      hypothesis: persistence gate is missing on POST.
      disproof_criteria: POST returns non-2xx when DAL save fails.
      status: already_partially_fixed
    - id: H3
      hypothesis: GET path masks DAL failures as empty success.
      disproof_criteria: DAL failures return explicit non-2xx, not empty 200.
      status: confirmed
  confirmed_root_causes:
    - Runtime env fallback order drift routed gap writes/reads to wrong table.
    - GET path still tolerates DAL failures as empty data in some failure modes.
  contributing_factors:
    - Shared env injection included ARTIFACTS_TABLE_NAME, creating ambiguous resolution.

fix_plan:
  exact_files_to_modify:
    - path: src/backend/careervp/handlers/gap_handler.py
      change: make table resolution explicit and deterministic for gap question store
    - path: infra/careervp/api_construct.py
      change: add GAP_QUESTIONS_TABLE_NAME env for gap lambda and keep USERS_TABLE_NAME alignment
    - path: src/backend/careervp/dal/dynamo_dal_handler.py
      change: ensure DAL error propagation can be surfaced by handler
    - path: src/backend/tests/integration/test_gap_read_after_write_roundtrip.py
      change: update to verify explicit table selection and no silent empty success on DAL failures
    - path: docs/refactor/live_tests/test_05_gap_analysis.py
      change: assert non-2xx on storage failure and strict read-after-write behavior
  exact_behavior_changes:
    - _get_questions_dal uses GAP_QUESTIONS_TABLE_NAME first, then USERS_TABLE_NAME, then DYNAMODB_TABLE_NAME.
    - GET /jobs/{jobId}/gap-questions returns non-2xx with domain code on DAL failure.
    - POST remains persistence-gated and cannot return 200 if save fails.
  non_goals_out_of_scope:
    - No change to question generation content.
    - No changes to gap_responses storage model.
  rollback_plan:
    - Revert gap handler env resolution and new env var usage if runtime breaks unexpectedly.
    - Keep trial attribution changes intact during rollback.

acceptance_criteria:
  api_level:
    - POST /jobs/{jobId}/gap-questions returns 200 only when persistence succeeds.
    - GET /jobs/{jobId}/gap-questions returns >=1 persisted question for recent successful POST.
    - DAL/storage failures return non-2xx with explicit domain code and no empty 200 fallback.
  data_level:
    - Gap question writes and reads use users table key schema pk/sk.
    - sk suffix matching for job_id is deterministic and case-normalized.
  observability:
    - Logs include resolved table name and table-resolution source.
    - Metrics include persistence failures and empty-read-after-write detections.
  negative_and_edge_case_criteria:
    - Wrong job_id returns empty list with 200 only when DAL is healthy and no matching artifact exists.
    - Cross-user requests do not leak artifacts.
  regression_reversal_criteria:
    - No 500 DYNAMODB_ERROR for gap question generation in live run.
    - Result must be >= baseline: no new blockers compared to live-test-results27.log.

