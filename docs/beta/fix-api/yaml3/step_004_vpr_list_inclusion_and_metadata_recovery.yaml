spec_id: RECOVERY_004
title: Stabilize VPR List Inclusion and Metadata Backfill Without Regressing Status Flow
priority: high
status: pending
owner: backend-platform
created_at: 2026-03-05
updated_at: 2026-03-05
sequence_step: 4

targets_yaml2_specs:
  - VPR_LIST_METADATA_001

problem_statement:
  exact_failing_behavior: |
    In live-test-results28.log, GET /vprs did not include the newly generated VPR ID after 60 seconds,
    even though generation and status polling succeeded. Earlier run 27 included generated ID but had
    metadata gaps. This indicates list retrieval/filter/pagination inconsistency.
  expected_behavior: |
    GET /vprs must include the generated VPR ID within polling window and provide metadata fields when resolvable.
    Behavior must meet or exceed log 27 while closing remaining metadata and inclusion gaps.
  user_business_impact: |
    Users cannot trust generated VPR history; list appears stale or incomplete.
  reproducibility_notes:
    - Run docs/refactor/live_tests/test_04_vpr.py.
    - Observe test_list_vprs failing on missing generated ID.

evidence:
  failing_tests:
    - docs/refactor/live_tests/test_04_vpr.py::TestVPREndpoints::test_list_vprs
  endpoint_method_path:
    - method: GET
      path: /vprs
      observed_status_code: 200
      observed_body_fragment: generated id missing after 60s
  baseline_artifact: careervp/live-test-results27.log
  regression_artifact: careervp/live-test-results28.log
  environment: dev-live
  timestamp_utc: '2026-03-05T00:00:00Z'

architecture_and_ownership_map:
  route_to_lambda:
    - route: GET /vprs
      lambda: vpr-status
      handler: src/backend/careervp/handlers/vpr_status_handler.py
    - route: GET /vpr/{vprId}/status
      lambda: vpr-status
      handler: src/backend/careervp/handlers/vpr_status_handler.py
  handler_file_paths:
    - src/backend/careervp/handlers/vpr_status_handler.py
    - src/backend/careervp/dal/jobs_repository.py
    - src/backend/careervp/handlers/vpr_submit_handler.py
  data_store_index_usage:
    - jobs table user_id-index and job_id lookup
  auth_source_and_identity_key:
    source: requestContext.authorizer claims
    identity_key: user_id
  canonical_sources_of_truth:
    route_surface: infra/careervp/api_construct.py
    jobs_schema: src/backend/careervp/dal/jobs_repository.py

root_cause_analysis:
  hypotheses_ranked:
    - id: H1
      hypothesis: get_vpr_jobs_by_user uses limited single-page query and drops relevant items after filtering.
      disproof_criteria: list method paginates and returns filtered items until limit is satisfied.
      status: confirmed
    - id: H2
      hypothesis: metadata fallback exists but inclusion logic still misses newly generated jobs.
      disproof_criteria: generated vpr id appears consistently in list within polling window.
      status: confirmed
    - id: H3
      hypothesis: submit path stores unresolvable references.
      disproof_criteria: generated records contain resolvable job_id or application_id mapping.
      status: partially_confirmed
  confirmed_root_causes:
    - Single-page query and in-memory filtering can omit recent generated vpr records.
    - Inclusion and metadata concerns were partially fixed independently, causing split behavior.
  contributing_factors:
    - Limit and filter ordering was not validated against live polling expectations.

fix_plan:
  exact_files_to_modify:
    - path: src/backend/careervp/dal/jobs_repository.py
      change: implement paginated accumulation for get_vpr_jobs_by_user before applying final limit
    - path: src/backend/careervp/handlers/vpr_status_handler.py
      change: keep metadata fallback and ensure list item ordering includes newest generated IDs
    - path: src/backend/tests/unit/test_vpr_status_handler.py
      change: add pagination + inclusion tests and fallback metadata tests
    - path: docs/refactor/live_tests/test_04_vpr.py
      change: keep generated-id inclusion assertion and metadata non-empty assertion when resolvable
  exact_behavior_changes:
    - /vprs list returns generated VPR IDs consistently within polling window.
    - metadata fallback from jobs table remains non-breaking and user-scoped.
  non_goals_out_of_scope:
    - No VPR content generation changes.
    - No auth model changes.
  rollback_plan:
    - Revert pagination accumulation changes if query latency/regression appears unexpectedly.

acceptance_criteria:
  api_level:
    - GET /vprs returns generated vpr id within 60s polling window after POST /vpr/generate.
    - GET /vpr/{vprId}/status behavior remains unchanged and successful.
  data_level:
    - jobs repository list query must support pagination and consistent filtering for application_id-backed records.
    - metadata fallback uses jobs table lookup only and does not perform writes.
  observability:
    - list resolution logs include metadata source and pagination stats.
    - fallback usage metric remains emitted.
  negative_and_edge_case_criteria:
    - missing metadata sources may return empty strings, but generated id must still be listed.
    - cross-user records must never appear.
  regression_reversal_criteria:
    - no list_vprs failure for missing generated id in live tests.
    - no regressions to status or async polling endpoints.

