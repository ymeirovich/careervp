rollback_trigger_matrix:
  - trigger_id: RT-FINAL-001
    trigger_condition: any blocking AC in yaml2 closure summary is fail or missing evidence
    detection_source: yaml2 closure checker
    action: block validated or closed transition and reopen failing RECOVERY specs
    owner: release_owner
  - trigger_id: RT-FINAL-002
    trigger_condition: second live full-suite pass fails after first pass succeeds
    detection_source: consecutive live run gate
    action: block release and rollback latest deployment
    owner: release_owner

completion_evidence:
  required_artifacts:
    - docs/evidence/yaml2-closure-summary-<timestamp>.json
    - docs/evidence/live-final-pass-1-and-2-<timestamp>.json
    - docs/evidence/live-final-regression-delta-<timestamp>.json
  known_residual_risks:
    - Third-party outages can cause transient non-deterministic live failures.
  explicit_sign_off_checklist:
    - all seven yaml2 specs validated or closed with fresh evidence
    - full live suite two-pass stability achieved
    - regression delta report clean against baseline

confidence_assessment:
  confidence_score_0_to_100: 95
  implementation_100_percent: true
  confidence_basis:
    - Final closure depends on successful completion of RECOVERY_002..007.
  confidence_update_rule: |
    Set to 100 only when AC-FINAL-301..303 are pass and all yaml2 specs are validated/closed.

dependencies:
  - RECOVERY_001
  - RECOVERY_002
  - RECOVERY_003
  - RECOVERY_004
  - RECOVERY_005
  - RECOVERY_006
  - RECOVERY_007
