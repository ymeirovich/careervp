spec_id: RECOVERY_003
title: Fix Cover Letter Artifact Schema Drift and Restore Submit-Status-List Roundtrip
priority: critical
status: pending
owner: backend-platform
created_at: 2026-03-05
updated_at: 2026-03-05
sequence_step: 3

targets_yaml2_specs:
  - COVER_LETTER_002

problem_statement:
  exact_failing_behavior: |
    live-test-results28.log shows GET /cover-letter/{id}/status returning 404 for generated id,
    and GET /cover-letters returning empty array after generation. This indicates schema/path
    mismatch between submit/worker/status/list operations.
  expected_behavior: |
    request_id returned by POST /cover-letter/generate must be resolvable by status and present in list.
    Unknown IDs must return domain-specific 404. No synthetic success and no silent persistence fallback.
  user_business_impact: |
    Generated cover letters appear lost, breaking UX history and poll/status reliability.
  reproducibility_notes:
    - Run docs/refactor/live_tests/test_07_cover_letter.py.
    - Observe timeout or 404 for status and empty list for generated IDs.

evidence:
  failing_tests:
    - docs/refactor/live_tests/test_07_cover_letter.py::TestCoverLetterEndpoints::test_get_cover_letter_status
    - docs/refactor/live_tests/test_07_cover_letter.py::TestCoverLetterEndpoints::test_list_cover_letters
    - docs/refactor/live_tests/test_07_cover_letter.py::TestCoverLetterEndpoints::test_cover_letter_async_polling
  endpoint_method_path:
    - method: POST
      path: /cover-letter/generate
      observed_status_code: 202
    - method: GET
      path: /cover-letter/{coverLetterId}/status
      observed_status_code: 404
    - method: GET
      path: /cover-letters
      observed_status_code: 200
      observed_body_fragment: '{"cover_letters": []}'
  baseline_artifact: careervp/live-test-results27.log
  regression_artifact: careervp/live-test-results28.log
  environment: dev-live
  timestamp_utc: '2026-03-05T00:00:00Z'

architecture_and_ownership_map:
  route_to_lambda:
    - route: POST /cover-letter/generate
      lambda: cover-letter-api
      handler: src/backend/careervp/handlers/cover_letter_submit_handler.py
    - route: GET /cover-letter/{coverLetterId}/status
      lambda: cover-letter-status
      handler: src/backend/careervp/handlers/cover_letter_handler.py
    - route: GET /cover-letters
      lambda: cover-letter-status
      handler: src/backend/careervp/handlers/cover_letter_handler.py
  handler_file_paths:
    - src/backend/careervp/handlers/cover_letter_submit_handler.py
    - src/backend/careervp/handlers/cover_letter_handler.py
    - src/backend/careervp/dal/dynamo_dal_handler.py
    - infra/careervp/api_construct.py
  data_store_index_usage:
    - artifacts table applicationId/artifactId is canonical
  auth_source_and_identity_key:
    source: requestContext.authorizer claims
    identity_key: user_id
  canonical_sources_of_truth:
    route_surface: infra/careervp/api_construct.py
    storage_schema: infra/careervp/api_db_construct.py artifacts table

root_cause_analysis:
  hypotheses_ranked:
    - id: H1
      hypothesis: status/list still depend on pk/sk-only reads while deployed table is applicationId/artifactId.
      disproof_criteria: status/list successfully read generated records via canonical keys.
      status: confirmed
    - id: H2
      hypothesis: submit or worker writes mixed key fields that are inconsistently read.
      disproof_criteria: submit and worker write canonical key set and readers consume same schema.
      status: confirmed
    - id: H3
      hypothesis: handler returns synthetic success when persistence path fails.
      disproof_criteria: persistence failures surface non-2xx and cannot produce fake completed response.
      status: confirmed
  confirmed_root_causes:
    - Mixed schema usage across submit, worker, and status/list paths.
    - permissive fallback behavior masked data persistence defects.
  contributing_factors:
    - Legacy pk/sk behavior retained without strict canonical read/write enforcement.

fix_plan:
  migration_strategy:
    description: |
      DUAL-READ TRANSITIONAL GUARD required before removing legacy pk/sk read path.
      Phase A (this step): write canonical keys (applicationId/artifactId) AND retain legacy pk/sk
      reads as a silent fallback. This ensures existing records written with pk/sk are still readable.
      Phase B (post-validation): once two consecutive live passes confirm all new writes resolve via
      canonical keys, remove the legacy fallback in a follow-on commit.
    phase_a_writes: canonical applicationId/artifactId keys only (no dual-write to pk/sk)
    phase_a_reads: canonical first, then legacy pk/sk fallback if canonical miss and record predates migration
    phase_b_trigger: AC-CL-MIGRATE-001 confirmed green across two consecutive live passes
    data_scope_query: |
      Before Phase B, run:
        uv run python scripts/spec_quality/check_cover_letter_key_schema.py \
          --table ${ARTIFACTS_TABLE_NAME} \
          --user-sample 20 \
          --out docs/evidence/cover-letter-key-schema-audit-<timestamp>.json
      This identifies records still using only pk/sk and quantifies migration scope.
  exact_files_to_modify:
    - path: src/backend/careervp/handlers/cover_letter_handler.py
      change: enforce canonical artifacts read path (applicationId/artifactId) with silent legacy fallback for pre-migration records; strict not-found semantics remain
    - path: src/backend/careervp/handlers/cover_letter_submit_handler.py
      change: ensure request_id/artifactId mapping writes canonical keys; do not write pk/sk
    - path: src/backend/careervp/dal/dynamo_dal_handler.py
      change: add canonical read/list methods; retain legacy_read as explicitly-flagged fallback path with COVER_LETTER_LEGACY_READ_ENABLED env guard
    - path: src/backend/tests/unit/test_cover_letter_status_storage_keys.py
      change: verify applicationId/artifactId key usage and that legacy fallback is only invoked on canonical miss
    - path: src/backend/tests/unit/test_cover_letter_list_includes_generated_artifact.py
      change: verify generated ID appears in list via canonical path; assert legacy path not invoked for new records
    - path: src/backend/tests/integration/test_cover_letter_roundtrip_persistence.py
      change: verify submit->status->list roundtrip in production-like schema using canonical keys
    - path: docs/refactor/live_tests/test_07_cover_letter.py
      change: verify generated id resolvability and no empty list regressions
    - path: scripts/spec_quality/check_cover_letter_key_schema.py
      change: >
        script created by RECOVERY_001 (per Regression_PLAN.md:153); use here is Phase B gate only —
        run to audit existing records for pk/sk-only schema before removing legacy fallback
  exact_behavior_changes:
    - Status/list resolve generated artifacts through canonical key schema (applicationId/artifactId).
    - Pre-migration records (pk/sk only) remain readable via legacy fallback during Phase A.
    - Unknown ID returns 404 with COVER_LETTER_NOT_FOUND.
    - Persistence failure cannot return synthetic completed success.
    - COVER_LETTER_LEGACY_READ_ENABLED env var controls fallback; defaults to true during Phase A.
  non_goals_out_of_scope:
    - No changes to cover letter content generation prompt.
    - Phase B (legacy fallback removal) is explicitly out of scope for this step.
  rollback_plan:
    - If canonical reads fail for newly generated records: set COVER_LETTER_LEGACY_READ_ENABLED=true (already default in Phase A) and redeploy — no code change required.
    - If canonical reads fail for pre-migration records: legacy fallback covers these automatically in Phase A.
    - "If rollback of this entire step is required: revert commit set; records written in canonical format during the window will be unreadable by reverted code. Remediation: backfill pk/sk keys for records created during Phase A window using the key-schema audit script output as the target record set."

acceptance_criteria:
  api_level:
    - POST /cover-letter/generate returns request_id and artifact_id.
    - GET /cover-letter/{request_id}/status returns 200 for persisted artifact.
    - GET /cover-letters includes generated request_id after completion.
    - GET /cover-letter/{unknown}/status returns 404 with domain-specific code.
  data_level:
    - Reads and writes use artifacts table key schema applicationId/artifactId.
    - artifactId format remains ARTIFACT#COVER_LETTER#{request_id}.
  observability:
    - Not-found metric and key-schema mode logs are emitted.
  negative_and_edge_case_criteria:
    - User A cannot read/list User B cover letters.
    - No synthetic completed payload is returned for missing persistence.
  regression_reversal_criteria:
    - No cover-letter status 404 for newly generated ID in live tests.
    - No empty cover_letters list when generated id exists.

