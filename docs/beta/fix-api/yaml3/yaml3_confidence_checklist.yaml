metadata:
  checklist_id: YAML3_CONFIDENCE_001
  version: 2
  owner: backend-platform
  generated_on_utc: "2026-03-05T00:00:00Z"
  updated_on_utc: "2026-03-05T00:00:00Z"
  change_summary: |
    v2: Added C08 (yaml2 spec ID enumeration coverage), C09 (internal spec consistency).
    Expanded C02 with formal enumerated_requirements sub-lists to make it automatable.
    Strengthened C06 to require RECOVERY_001 ownership of all pre-Phase-2 scripts,
    not just script existence anywhere in specs. Strengthened C07 to verify the
    RECOVERY_002->RECOVERY_007 explicit dependency. Rebalanced weights to accommodate
    two new checks while keeping max_score=100.

scope:
  regression_plan: careervp/docs/beta/fix-api/yaml3/Regression_PLAN.md
  specs_glob: careervp/docs/beta/fix-api/yaml3/step_*.yaml

scoring_model:
  max_score: 100
  require_for_100:
    - total_score_equals_100
    - all_critical_checks_full_points
  bands:
    - name: blocker
      min: 0
      max: 59
    - name: partial
      min: 60
      max: 84
    - name: high
      min: 85
      max: 99
    - name: complete
      min: 100
      max: 100

checks:
  - id: C01
    name: YAML parse integrity
    weight: 10
    critical: true
    pass_condition: all step_*.yaml files parse successfully with no syntax errors
    scoring_rule: 10 if all parse; 7 if exactly one file fails; 0 otherwise

  - id: C02
    name: Regression_PLAN requirement coverage
    weight: 15
    critical: true
    pass_condition: >
      Every item in all four enumerated_requirements sub-lists is explicitly assigned
      to one or more RECOVERY steps with executable scope. This check is only
      automatable when all sub-lists below are treated as the definitive enumeration.
    enumerated_requirements:
      yaml2_spec_regressions:
        - GAP_GET_002: table resolution fix and non-2xx on DAL failure (Regression_PLAN.md:41)
        - COVER_LETTER_002: canonical key schema and dual-read Phase A (Regression_PLAN.md:42)
        - VPR_LIST_METADATA_001: paginated accumulation for get_vpr_jobs_by_user (Regression_PLAN.md:43)
        - CV_TAILORING_002: DELETE route diagnosis-gate before any code change (Regression_PLAN.md:44)
        - TRIAL_002: contract route parity and legacy alias removal (Regression_PLAN.md:45)
        - INTERVIEW_PREP_002: status schema and quality assertion on terminal state only (Regression_PLAN.md:46)
        - INTERVIEW_PREP_003: context resolution and worker completion path stabilization (Regression_PLAN.md:47)
      public_api_interface_changes:
        - GET /jobs/{jobId}/gap-questions returns non-2xx on DAL or storage failure (Regression_PLAN.md:18)
        - GET /cover-letter/{id}/status and GET /cover-letters use artifacts-table canonical keys applicationId/artifactId (Regression_PLAN.md:21)
        - GET /vprs pagination and filtering fix for deterministic generated-ID inclusion (Regression_PLAN.md:26)
        - Interview prep live test quality assertions applied only to completed terminal payload (Regression_PLAN.md:30)
        - GAP_QUESTIONS_TABLE_NAME env var added to remove ambiguous table resolution (Regression_PLAN.md:33)
      pre_phase2_scripts_owned_by_RECOVERY_001:
        - scripts/smoke/run_targeted_smoke.py (Regression_PLAN.md:148)
        - scripts/spec_quality/check_regression_delta.py (Regression_PLAN.md:149)
        - scripts/spec_quality/check_deployed_parity.py (Regression_PLAN.md:150)
        - scripts/spec_quality/check_evidence_integrity.py (Regression_PLAN.md:151)
        - scripts/spec_quality/check_yaml2_closure.py (Regression_PLAN.md:152)
        - scripts/spec_quality/check_cover_letter_key_schema.py (Regression_PLAN.md:153)
      phase5_rollout_protocol:
        - Deploy to dev-live only (Regression_PLAN.md:133)
        - Execute targeted smoke immediately after deploy (Regression_PLAN.md:134)
        - On smoke failure revert only the offending step changeset not the full branch (Regression_PLAN.md:137-138)
        - Run per-step regression delta check before two-pass full suite (Regression_PLAN.md:140-141)
        - Promote only after all Phase 4 gates hold and targeted smoke and delta checks are clean (Regression_PLAN.md:143)
    scoring_rule: >
      Award 15 if all four enumerated_requirements sub-lists are fully covered.
      Deduct 2 points per yaml2_spec_regression not assigned to any RECOVERY step.
      Deduct 2 points per public_api_interface_change not assigned to any RECOVERY step.
      Deduct 2 points per script in pre_phase2_scripts_owned_by_RECOVERY_001 that does
        not appear in RECOVERY_001 fix_plan.exact_files_to_modify.
      Deduct 3 points if phase5_rollout_protocol has no coverage in any RECOVERY step.
      Floor at 0.

  - id: C03
    name: Gate consistency across steps
    weight: 20
    critical: true
    pass_condition: >
      Per-step targeted smoke command AND per-step regression delta command are present
      in the validation_commands section of RECOVERY_002 through RECOVERY_007, not only
      RECOVERY_001. Required by Regression_PLAN.md:66-88.
    scoring_rule: >
      20 if all six steps (002-007) include both per-step smoke and per-step delta commands.
      Deduct 3 points per step missing either command.
      Floor at 0.

  - id: C04
    name: Validation command executability
    weight: 15
    critical: true
    pass_condition: >
      All validation_commands entries are executable, non-placeholder, and target real
      test files or scripts. run_all_tests.py invocations must use --mode full
      --summary-json flags consistent with the invocation established in RECOVERY_001.
    scoring_rule: >
      15 if all commands across all step files are executable and non-placeholder.
      Deduct 3 points per step file containing placeholder commands or wrong invocation flags.

  - id: C05
    name: Path and source alignment
    weight: 10
    critical: true
    pass_condition: >
      All referenced payload directories, source files, and live test paths exist in
      the repository and match the actual paths used by the live test suite.
    scoring_rule: >
      10 if all path references resolve correctly.
      Deduct 2 points per unresolved or mismatched path reference across all step files.

  - id: C06
    name: Required tooling existence and RECOVERY_001 ownership
    weight: 10
    critical: true
    pass_condition: >
      All 6 scripts required before Phase 2 begins (Regression_PLAN.md:145-153) must both
      (a) exist in the repository at their specified paths, AND
      (b) appear in RECOVERY_001 fix_plan.exact_files_to_modify.
      Script existence without RECOVERY_001 ownership violates the plan's sequencing
      requirement: no other RECOVERY step may proceed until all gate scripts are ready.
    scoring_rule: >
      10 if all 6 scripts exist in repo AND all 6 appear in RECOVERY_001 fix_plan.
      5 if all 6 exist in repo but one or more are absent from RECOVERY_001 fix_plan.
      Award 1 point per script that appears in RECOVERY_001 fix_plan (max 6) when scripts
        do not yet exist in repo; apply 0.5 multiplier if ownership is also incomplete.
      0 if fewer than 3 scripts exist in repo and fewer than 3 are in RECOVERY_001 fix_plan.

  - id: C07
    name: Dependency and sequencing integrity
    weight: 5
    critical: false
    pass_condition: >
      RECOVERY dependency graph is acyclic, step ordering is coherent, and the following
      explicit dependencies are present: RECOVERY_007 depends on both RECOVERY_001 and
      RECOVERY_002 (shared gap attribution changes per Regression_PLAN.md:93).
      RECOVERY_008 depends on all of RECOVERY_001 through RECOVERY_007.
    scoring_rule: >
      5 if all conditions hold.
      Deduct 2 points per missing or incorrect explicit dependency.
      0 if graph contains a cycle.

  - id: C08
    name: yaml2 spec ID complete coverage
    weight: 10
    critical: true
    pass_condition: >
      Every yaml2 spec ID required by Regression_PLAN.md appears in the
      targets_yaml2_specs field of at least one step_*.yaml file. Required IDs:
      COVER_LETTER_002, CV_TAILORING_002, GAP_GET_002, INTERVIEW_PREP_002,
      INTERVIEW_PREP_003, TRIAL_002, VPR_LIST_METADATA_001.
      This is a 7/7 enumerated check, directly automatable via grep on targets_yaml2_specs.
    scoring_rule: 10 if all 7 IDs appear in at least one step file; 0 if any ID is absent

  - id: C09
    name: Internal spec consistency
    weight: 5
    critical: false
    pass_condition: >
      No RECOVERY step spec contains a cross-section contradiction. Specifically: a route
      listed in architecture_and_ownership_map.route_to_lambda must not be described as a
      legacy alias or fix target in that same spec's problem_statement, evidence,
      fix_plan, or traceability_matrix. An architecture map that presents a route as
      currently deployed while the spec's own fix_plan treats it as a regression to
      eliminate is a contradiction.
    scoring_rule: 5 if no contradictions found across all step files; 0 if any contradiction present

