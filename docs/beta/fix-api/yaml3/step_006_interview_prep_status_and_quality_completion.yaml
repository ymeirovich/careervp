    - uv run pytest src/backend/tests/unit/test_interview_prep_status.py src/backend/tests/unit/test_interview_prep_context_resolution.py src/backend/tests/unit/test_interview_prep_prompt_context.py src/backend/tests/unit/test_l0_interview_prep_generation.py -q
    - uv run pytest src/backend/tests/integration/test_interview_prep_roundtrip.py src/backend/tests/integration/test_interview_prep_context_sources.py -q
    - uv run pytest docs/refactor/live_tests/test_08_interview_prep.py -q

