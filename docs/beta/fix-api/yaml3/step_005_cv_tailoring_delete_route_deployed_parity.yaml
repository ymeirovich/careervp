spec_id: RECOVERY_005
title: Restore DELETE /cv-tailoring/{cvTailoringId} Runtime Availability and Authorization Parity
priority: high
status: pending
owner: backend-platform
created_at: 2026-03-05
updated_at: 2026-03-05
sequence_step: 5

targets_yaml2_specs:
  - CV_TAILORING_002

problem_statement:
  exact_failing_behavior: |
    Code and infra route map include DELETE /cv-tailoring/{cvTailoringId}, but live-test-results28.log
    shows 403 DEFAULT_4XX for delete roundtrip. This indicates deployed route/auth integration drift.
  expected_behavior: |
    DELETE route must be deployed, authorized correctly, return 200 on successful delete,
    and preserve existing generate/status/list behavior.
  user_business_impact: |
    Users cannot delete tailored CV artifacts; stale data accumulates and API contract is broken.
  reproducibility_notes:
    - Run docs/refactor/live_tests/test_06_cv_tailoring.py.
    - Observe test_delete_tailored_cv_roundtrip returning 403 DEFAULT_4XX.

evidence:
  failing_tests:
    - docs/refactor/live_tests/test_06_cv_tailoring.py::TestCVTailoringEndpoints::test_delete_tailored_cv_roundtrip
  endpoint_method_path:
    - method: DELETE
      path: /cv-tailoring/{cvTailoringId}
      observed_status_code: 403
      observed_body_fragment: '{"error": "DEFAULT_4XX"}'
  baseline_artifact: careervp/live-test-results27.log
  regression_artifact: careervp/live-test-results28.log
  environment: dev-live
  timestamp_utc: '2026-03-05T00:00:00Z'

architecture_and_ownership_map:
  route_to_lambda:
    - route: POST /cv-tailoring/generate
      lambda: cv-tailoring-api
      handler: src/backend/careervp/handlers/cv_tailoring_handler.py
    - route: GET /cv-tailoring/{cvTailoringId}/status
      lambda: cv-tailoring-api
      handler: src/backend/careervp/handlers/cv_tailoring_handler.py
    - route: DELETE /cv-tailoring/{cvTailoringId}
      lambda: cv-tailoring-api
      handler: src/backend/careervp/handlers/cv_tailoring_handler.py
    - route: GET /cv-tailorings
      lambda: cv-tailoring-api
      handler: src/backend/careervp/handlers/cv_tailoring_handler.py
  handler_file_paths:
    - infra/careervp/api_construct.py
    - src/backend/careervp/handlers/cv_tailoring_handler.py
    - src/backend/careervp/dal/dynamo_dal_handler.py
    - src/backend/tests/unit/test_l6_route_surface.py
  data_store_index_usage:
    - users table pk/sk for tailored cv artifact persistence
  auth_source_and_identity_key:
    source: requestContext.authorizer claims
    identity_key: user_id
  canonical_sources_of_truth:
    route_surface: infra/careervp/api_construct.py
    deployed_inventory: api gateway method inventory

root_cause_analysis:
  hypotheses_ranked:
    - id: H1
      hypothesis: Deployed API method for DELETE not attached to intended integration.
      disproof_criteria: deployed method map shows DELETE route integrated with cv-tailoring lambda.
      status: requires_diagnosis
      diagnosis_command: uv run python scripts/spec_quality/check_deployed_parity.py --env dev-live --infra-source infra/careervp/api_construct.py --filter-route "DELETE /cv-tailoring/{cvTailoringId}" --out docs/evidence/cv-tailoring-delete-parity-diagnosis-<timestamp>.json
    - id: H2
      hypothesis: Authorizer/policy mismatch causes DELETE default 4xx.
      disproof_criteria: deployed method auth matches POST/GET path family and tokens are accepted.
      status: requires_diagnosis
      diagnosis_command: uv run python scripts/spec_quality/check_deployed_parity.py --env dev-live --infra-source infra/careervp/api_construct.py --filter-route "DELETE /cv-tailoring/{cvTailoringId}" --check-auth --out docs/evidence/cv-tailoring-delete-auth-diagnosis-<timestamp>.json
    - id: H3
      hypothesis: handler delete branch is unreachable.
      disproof_criteria: local integration invokes delete branch and returns 200/404 correctly.
      status: disproven
  diagnosis_gate:
    description: |
      MANDATORY before writing any fix code: run diagnosis_command for H1 and H2.
      Read the output JSON to determine which hypothesis is confirmed.
      Fix plan execution is conditional on diagnosis result (see conditional_fix_plan below).
    blocking: true
    output_artifact: docs/evidence/cv-tailoring-delete-parity-diagnosis-<timestamp>.json
  conditional_fix_plan:
    if_H1_confirmed:
      - path: infra/careervp/api_construct.py
        change: attach DELETE method integration to cv-tailoring lambda
    if_H2_confirmed:
      - path: infra/careervp/api_construct.py
        change: fix authorizer binding for DELETE method to match cv-tailoring route family auth mode
    if_neither_confirmed:
      - Escalate: inspect raw API Gateway method configuration for the deployed DELETE route manually.
      - Do not proceed to code changes until root cause is confirmed.
  confirmed_root_causes:
    - PENDING diagnosis — update this field after running diagnosis_command for H1 and H2.
  contributing_factors:
    - Route surface tests validated code-level map but not deployed runtime inventory.

fix_plan:
  prerequisite:
    - Step: Run diagnosis_gate commands (H1 and H2) and read output JSON before any code changes.
    - Gate: do not modify infra/careervp/api_construct.py until confirmed_root_causes is updated from diagnosis output.
  exact_files_to_modify:
    - path: infra/careervp/api_construct.py
      change: apply conditional_fix_plan change corresponding to confirmed hypothesis (H1 or H2); do not apply both blindly
    - path: src/backend/tests/unit/test_l6_route_surface.py
      change: include authorizer and method-level parity assertions for DELETE route
    - path: src/backend/tests/integration/test_cv_tailoring_delete_roundtrip.py
      change: verify create->delete->absence behavior
    - path: docs/refactor/live_tests/test_06_cv_tailoring.py
      change: keep delete roundtrip strict assertion and add response diagnostics
  exact_behavior_changes:
    - DELETE endpoint returns 200 on successful delete and 404 for unknown IDs.
    - No DEFAULT_4XX for valid authorized delete requests.
  non_goals_out_of_scope:
    - No CV tailoring generation algorithm changes.
    - Do not modify all cv-tailoring routes speculatively; only apply the confirmed targeted fix.
  rollback_plan:
    - Roll back only the DELETE-method-specific infra change if it breaks existing cv-tailoring methods.
    - Re-run diagnosis_gate commands post-rollback to confirm state returned to pre-fix.

acceptance_criteria:
  api_level:
    - DELETE /cv-tailoring/{id} returns 200 for existing artifact owned by caller.
    - DELETE unknown id returns 404 with domain-specific code.
    - POST/GET status/GET list remain behaviorally unchanged.
  data_level:
    - Deleted artifact does not appear in subsequent /cv-tailorings list.
  observability:
    - Delete success/failure metrics and logs include user_id and cv_tailoring_id.
  negative_and_edge_case_criteria:
    - Cross-user delete attempts return 404/forbidden without disclosing existence.
    - Invalid auth returns 401/403 with correct domain behavior, not DEFAULT_4XX leakage.
  regression_reversal_criteria:
    - No 403 DEFAULT_4XX for valid delete requests in live suite.

baseline_and_regression_budget:
  baseline_artifact:
    path: careervp/live-test-results27.log
    reason: baseline for cv-tailoring endpoints before delete regression
  blocked_regressions:
    - new_non_2xx_on_changed_endpoints
  allowed_deltas: {}

