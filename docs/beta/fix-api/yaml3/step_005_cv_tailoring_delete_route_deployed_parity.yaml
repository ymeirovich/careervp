  runtime_env_resolution_parity:
    source_of_truth: cv-tailoring lambda env
    verification_steps:
      - Confirm lambda receives expected users-table env and delete code path can access artifacts.

execution_sequence:
  - step: S0
    name: run_diagnosis_gate
    outcome: |
      H1/H2 confirmed or disproven from parity JSON output.
      confirmed_root_causes field updated in this spec.
      No code written until this step produces a JSON artifact.
  - step: S1
    name: apply_conditional_fix
    depends_on: S0
