    - uv run python scripts/spec_quality/check_regression_delta.py --baseline careervp/live-test-results27.log --current docs/evidence/targeted-smoke-RECOVERY_005-<timestamp>.json --out docs/evidence/per-step-regression-delta-RECOVERY_005-<timestamp>.json
