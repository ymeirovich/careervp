spec_id: CV_UPLOAD_001
title: CV Upload 529 Overloaded Error - Retry Logic Fix
priority: high
status: pending

description: |
  CV upload endpoint (POST /users/me/cv) fails with 529 error from Anthropic.
  Error code 529 indicates Anthropic's server is overloaded - a transient error that should be retried.

test_evidence:
  - status_code: 500
    result: |
      {
        "success": false,
        "user_cv": null,
        "error": "LLM extraction failed: Error code: 529 - overloaded_error"
      }

current_implementation:
  file: src/backend/careervp/logic/utils/llm_client.py
  code: |
    @retry_on_transient_error(max_retries=3)
    def invoke(self, ...):
  catches:
    - RateLimitError
    - APIError with status_code >= 500

root_cause:
  - Exception type mismatch - 529 error might not have status_code accessible
  - SDK configuration missing - Anthropic SDK needs max_retries, timeout
  - Cold start issues - retry logic might not execute properly

fix_options:
  - option: A
    description: Fix SDK Configuration
    code_change: |
      # In LLMRouter.__init__
      self._client = Anthropic(
          api_key=self._api_key,
          max_retries=3,
          timeout=60.0,
      )

  - option: B
    description: Fix Exception Handling
    code_change: |
      # Improve retry decorator to handle 529
      except APIError as e:
          status_code = getattr(e, 'status_code', None)
          if status_code == 529 or 'overloaded' in str(e).lower():
              delay = base_delay * (2 ** attempt)
              sleep(delay)

  - option: C
    description: Both A and B (recommended)

tests:
  unit:
    - description: Verify retry logic handles 529 errors correctly

  integration:
    - test_file: docs/refactor/live_tests/test_02_users.py
    - description: Add retry logic to test_upload_cv

files_to_modify:
  - path: src/backend/careervp/logic/utils/llm_client.py

dependencies: []
