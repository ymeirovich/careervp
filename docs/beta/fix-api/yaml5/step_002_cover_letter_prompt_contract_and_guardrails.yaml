  residual_risks:
    - Placeholder-context blocking in worker remains open until step_001 resolver implementation is merged.
    - Strict paragraph enforcement can increase regeneration retries for low-quality model outputs.

what_you_were_not_considering_now_captured:
  - Prompt-only constraints are insufficient without logic-side hard validation.
  - Paragraph count must be treated as a contract, not a style preference.
  - One-page rule needs an explicit numeric ceiling to be testable and enforceable.
  - Prompt-context evidence (gap responses) must accept schema variance (dict/model payloads).
  - Placeholder-denylist checks should run before LLM invocation to avoid completed-but-invalid artifacts.
