    owner: release_owner
  - trigger_id: RT-002
    condition: changed cover-letter routes return new DEFAULT_4XX/DEFAULT_5XX
    detection_source: contract suite and live checks
    action: rollback and open incident
    owner: release_owner
  - trigger_id: RT-003
    condition: async terminal success rate for cover letter drops below 95 percent
    detection_source: live polling evidence
    action: rollback or disable related feature flag
    owner: service_owner

