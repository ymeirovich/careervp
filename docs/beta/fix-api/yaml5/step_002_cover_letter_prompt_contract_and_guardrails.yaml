problem_statement:
  exact_failing_behavior: |
    Live cover-letter completions can return non-usable output because prompt context is unresolved
    and output shape constraints are under-enforced. Specifically:
    - Worker has emitted prompts containing synthetic placeholders derived from IDs.
    - Completed result can be structurally valid API-wise but fail business-quality requirements.
    - Prompt did not enforce a deterministic one-page/paragraph contract strongly enough.
  expected_behavior: |
    Before LLM invocation, prompt context is concrete and validated; generated output must satisfy
    strict layout rules: 2 or 3 paragraphs only, and hard max 350 words (never over one page).
    Prompt assembly must include available gap-response evidence and avoid placeholder leakage.
  user_business_impact: |
    Users receive a "completed" artifact that is not deployable for applications, degrading trust
    and introducing regression risk in handoff gates.
  reproducibility_notes:
    command: uv run pytest docs/refactor/live_tests/test_07_cover_letter.py -vv -s
    failing_signal: completed response body asks user to provide company/title/description due placeholder context

evidence:
  failing_tests:
    - docs/refactor/live_tests/test_07_cover_letter.py::TestCoverLetterEndpoints::test_cover_letter_async_polling
  endpoint_contract:
    - method: GET
      path: /cover-letter/{coverLetterId}/status
      observed: "200 completed with placeholder-driven refusal content"
  observed_status_code: 200
  observed_payload_excerpt: |
    "The job posting details are referenced as placeholders rather than actual content"
  environment: dev
  observed_at_utc: "2026-03-06T21:00:00Z"
  request_ids:
    - c289dbb0-2795-4dc1-84ec-7741667616eb

architecture_and_ownership_map:
  routes:
    - route: POST /cover-letter/generate
      lambda: CoverLetterApiLambda
      handler: src/backend/careervp/handlers/cover_letter_submit_handler.py
    - route: GET /cover-letter/{coverLetterId}/status
      lambda: CoverLetterStatusLambda
      handler: src/backend/careervp/handlers/cover_letter_handler.py
    - route: SQS cover-letter job processing
      lambda: CoverLetterWorkerLambda
      handler: src/backend/careervp/handlers/cover_letter_handler.py
  prompt_and_logic:
    - component: prompt builder
      file: src/backend/careervp/logic/prompts/cover_letter_prompt.py
    - component: output parser and validation
      file: src/backend/careervp/logic/cover_letter.py
  data_sources:
    - data: job title/company/description
      source: JOBS_TABLE_NAME via jobs repository
    - data: gap responses
      source: GAP_RESPONSES_TABLE_NAME via DynamoDalHandler.get_gap_responses
    - data: status/result artifacts
      source: ARTIFACTS_TABLE_NAME
  auth_and_scope:
    identity_key: user_id from Cognito authorizer claims
    required_rule: resolved context and status reads are scoped to authenticated user_id

root_cause_analysis:
  ranked_hypotheses:
    - id: H1
      rank: 1
      statement: prompt contract lacks strict, test-enforced paragraph/page constraints
      disproof_criteria: generation path rejects >350 words and paragraph count outside 2-3
      status: confirmed
    - id: H2
      rank: 2
      statement: gap-response evidence is not reliably injected into user prompt context
      disproof_criteria: prompt builder accepts/serializes supplied gap response payloads deterministically
      status: confirmed
    - id: H3
      rank: 3
      statement: context placeholders can bypass quality controls and surface as completed output
      disproof_criteria: placeholder/synthetic values are blocked pre-LLM with explicit failure diagnostics
      status: pending
  confirmed_root_causes:
    - Prompt did not hard-bound one-page requirement in a way paired with logic-side enforcement.
    - Paragraph shape requirements were not guaranteed by parser/validation.
    - Prompt assembly did not consistently pass structured gap-response evidence.
  contributing_factors:
    - Async status contract reports completion independent of semantic quality.
    - Prior behavior favored permissive parsing over deterministic output-shape enforcement.

fix_plan:
  strategy: |
    Harden prompt contract and parser validation in logic layer, then add tests proving deterministic
    compliance (2-3 paragraphs, <=350 words) and robust prompt-context serialization.
  files_to_modify:
    - src/backend/careervp/logic/prompts/cover_letter_prompt.py
    - src/backend/careervp/logic/cover_letter.py
    - src/backend/tests/unit/test_cover_letter_prompt_constraints.py
    - docs/beta/fix-api/yaml5/step_001_cover_letter_context_materialization.yaml
    - docs/beta/fix-api/yaml5/yaml5_execution_index.yaml
    - docs/beta/fix-api/yaml5/step_002_cover_letter_prompt_contract_and_guardrails.yaml
  exact_behavior_changes:
    - System prompt must explicitly require one-page hard cap (350 words max) and 2-3 paragraph output.
    - Logic validation rejects outputs over 350 words with FVS_VALIDATION_FAILED.
    - Parser/normalization guarantees parsed cover letter has 2-3 non-empty paragraphs.
    - Prompt builder accepts gap responses as model objects or dict payloads and serializes deterministically.
    - Step-002 checklist adds pre-LLM placeholder-context blocking as the remaining closure item.
  non_goals:
    - no API route/method changes
    - no request/response shape changes for submit/status/list endpoints
    - no migration of async orchestration model
  rollback_plan:
    - revert prompt/validation deltas if regression appears in adjacent artifact generation flows
    - keep route contracts unchanged so rollback is code-only

acceptance_criteria:
  api_level:
    - id: AC-CL-PROMPT-001
      criterion: GET status payload shape remains unchanged for completed/failed artifacts.
    - id: AC-CL-PROMPT-002
      criterion: completion text no longer exceeds one-page policy (hard max 350 words).
  data_level:
    - id: AC-CL-PROMPT-003
      criterion: prompt context includes serialized gap responses when provided (no dropped evidence section).
    - id: AC-CL-PROMPT-004
      criterion: no synthetic placeholder strings are allowed in materialized required context inputs at invocation boundary.
  observability_level:
    - id: AC-CL-PROMPT-005
      criterion: worker logs include deterministic context-completeness decision fields before generation.
  negative_and_edge_cases:
    - id: AC-CL-PROMPT-006
      criterion: one-paragraph LLM output is normalized into valid 2-paragraph shape or rejected.
    - id: AC-CL-PROMPT-007
      criterion: ">3-paragraph LLM output is truncated/normalized and validated to max 3 paragraphs."
    - id: AC-CL-PROMPT-008
      criterion: outputs >350 words are rejected with FVS_VALIDATION_FAILED and explicit error message.

