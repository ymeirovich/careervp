spec_id: YAML5_COVER_LETTER_CONTEXT_001
title: Materialize ID-based Context Before Cover Letter LLM Invocation
priority: critical
status: draft
owner: backend-platform
created_at: 2026-03-06
updated_at: 2026-03-06
version: 1
default_environment: dev

