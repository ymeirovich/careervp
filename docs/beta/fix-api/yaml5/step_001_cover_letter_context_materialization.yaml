what_you_were_not_considering_now_captured:
  - strict ownership checks for every resolved ID source to prevent cross-user context leakage
  - prompt-injection sanitization for externally sourced job/company text
  - token/cost and latency impact from loading richer context sections
  - deterministic fallback policy (what is mandatory vs optional context) to avoid silent degraded quality
  - schema variance between legacy/new gap response payload fields (answer vs response)
  - VPR materialization source-of-truth drift (jobs result_key vs legacy DAL get_vpr path)
  - observability cardinality and PII safety in new context-resolution logs
  - rollback-safe feature flag to disable materialization without reverting unrelated fixes
  - prompt-output contract hardening (2-3 paragraphs, hard one-page cap) must be enforced in logic, not prompt text only
  - placeholder-pattern denylist must be checked before LLM invocation to prevent silent degraded completions
