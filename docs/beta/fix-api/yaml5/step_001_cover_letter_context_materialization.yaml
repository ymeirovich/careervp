problem_statement:
  exact_failing_behavior: |
    Cover letter generation currently calls LLM with placeholder job/company text derived from job_id,
    causing non-tailored output that explicitly asks for missing job details.
    Live evidence shows completed status can return a cover letter body that says
    "Company for <job_id>", "Role for <job_id>", and "Job description for <job_id>".
  expected_behavior: |
    Before invoking the LLM, worker materializes IDs into real context:
    job posting details, VPR content, gap response answers, and company research context.
    Prompt must contain concrete data rather than synthetic placeholders.
  user_business_impact: |
    Users receive unusable artifacts despite completed status, reducing trust and creating hidden regression risk.
  reproducibility_notes:
    command: uv run pytest docs/refactor/live_tests/test_07_cover_letter.py -vv -s
    failing_signal: completed artifact contains placeholder-derived refusal/non-tailored text

evidence:
  failing_tests:
    - docs/refactor/live_tests/test_07_cover_letter.py::TestCoverLetterEndpoints::test_cover_letter_async_polling
    - docs/refactor/live_tests/test_07_cover_letter.py::TestCoverLetterEndpoints::test_get_cover_letter_status
  endpoint_contract:
    - method: POST
      path: /cover-letter/generate
      observed: "202 accepted with request_id"
    - method: GET
      path: /cover-letter/{coverLetterId}/status
      observed: "200 completed but non-tailored result body"
  observed_payload_excerpt: |
    "The job posting details are referenced as placeholders rather than actual content"
  environment: dev
  observed_at_utc: "2026-03-06T21:00:00Z"
  request_ids:
    - c289dbb0-2795-4dc1-84ec-7741667616eb

architecture_and_ownership_map:
  routes:
    - route: POST /cover-letter/generate
      lambda: CoverLetterApiLambda
      handler: src/backend/careervp/handlers/cover_letter_submit_handler.py
    - route: GET /cover-letter/{coverLetterId}/status
      lambda: CoverLetterStatusLambda
      handler: src/backend/careervp/handlers/cover_letter_handler.py
    - route: GET /cover-letters
      lambda: CoverLetterStatusLambda
      handler: src/backend/careervp/handlers/cover_letter_handler.py
    - route: SQS cover-letter job processing
      lambda: CoverLetterWorkerLambda
      handler: src/backend/careervp/handlers/cover_letter_handler.py
  stores_and_sources:
    - data: cover letter artifacts and request_data
      source: ARTIFACTS_TABLE_NAME
      access_path: DynamoDalHandler + direct boto3 update_item/get_item
    - data: CV canonical content
      source: USERS_TABLE_NAME (primary), CVS_TABLE_NAME (fallback)
      access_path: DynamoDalHandler.get_cv
    - data: job posting details (title/company/description/requirements)
      source: JOBS_TABLE_NAME
      access_path: JobsRepository.get_job
    - data: gap responses
      source: GAP_RESPONSES_TABLE_NAME
      access_path: DynamoDalHandler.get_gap_responses
    - data: company research
      source: ARTIFACTS_TABLE_NAME with ARTIFACT#COMPANY_RESEARCH# prefix
      access_path: query by applicationId/artifactId
    - data: VPR content
      source: VPR_JOBS_TABLE_NAME and result_key payload resolution path
      access_path: jobs repository + existing vpr status enrichment logic
  auth_and_scope:
    identity_key: user_id from Cognito authorizer claims
    required_rule: all resolved IDs must belong to requesting user_id

root_cause_analysis:
  ranked_hypotheses:
    - id: H1
      rank: 1
      statement: cover_letter_handler builds LogicCoverLetterRequest using placeholders instead of resolved job context
      disproof_criteria: logic request fields are populated from persisted job data before LLM call
      status: confirmed
    - id: H2
      rank: 2
      statement: vpr_id, gap_response_ids, company_research_id are not materialized into prompt payload
      disproof_criteria: resolver fetches and injects these artifacts into generation call and prompt
      status: confirmed
    - id: H3
      rank: 3
      statement: DAL cannot supply required context due key/schema mismatch
      disproof_criteria: integration tests show successful roundtrip retrieval with production keys
      status: partially_confirmed
  confirmed_root_causes:
    - Placeholder synthesis in _generate_cover_letter_result for company_name/job_title/job_description.
    - Missing context materialization layer for IDs (job/vpr/gap/company research) prior to generate_cover_letter.
    - generate_cover_letter currently does not pass gap_responses into prompt builder.
  contributing_factors:
    - Async submit path persists only IDs and relies on downstream resolver that was never implemented.
    - Legacy fallback patterns mask missing context until live quality validation.

fix_plan:
  strategy: |
    Introduce a deterministic context-materialization step in cover_letter_handler (worker and sync paths),
    then pass resolved context to logic/prompt layer. Preserve async API contract and endpoint shapes.
  files_to_modify:
    - src/backend/careervp/handlers/cover_letter_handler.py
    - src/backend/careervp/logic/cover_letter.py
    - src/backend/careervp/logic/prompts/cover_letter_prompt.py
    - src/backend/careervp/dal/dynamo_dal_handler.py
    - src/backend/careervp/dal/jobs_repository.py
    - infra/careervp/api_construct.py
    - src/backend/tests/unit/test_cover_letter_context_materialization.py
    - src/backend/tests/integration/test_cover_letter_context_roundtrip.py
    - src/backend/tests/integration/test_cover_letter_roundtrip_persistence.py
    - docs/refactor/live_tests/test_07_cover_letter.py
  exact_behavior_changes:
    - Add _resolve_cover_letter_context(dal, user_id, api_request) that materializes:
      - job fields: company_name, job_title, job_description
      - vpr payload: differentiators/summary data
      - gap responses filtered by request.gap_response_ids
      - company research payload for job/company context
    - Replace placeholder assignment in _generate_cover_letter_result with resolved fields.
    - Pass gap_responses (and optional company_research summary) into build_user_prompt inputs.
    - Add mandatory context completeness check before LLM call (company_name/job_title/job_description cannot be synthetic placeholders).
    - Normalize missing/partial context policy:
      - missing job record -> fail job with explicit diagnostic (no placeholder fallback)
      - missing optional context (company research) -> degrade gracefully with metric/log
    - Preserve status/list payload shape and async submit contract.
    - Ensure worker role has required read permissions for jobs table and any required bucket/table for VPR materialization.
  non_goals:
    - no endpoint path/method changes
    - no auth model changes
    - no conversion of async flow to sync
    - no broad rewrite of VPR architecture
  rollback_plan:
    - keep feature flag COVER_LETTER_CONTEXT_MATERIALIZATION_ENABLED default false until validated
    - deploy with flag true only in dev first
    - if regression triggers, disable flag and revert worker/context resolver commit

acceptance_criteria:
  api_level:
    - id: AC-CL-CONTEXT-001
      criterion: POST /cover-letter/generate remains 202 with request_id/artifact_id/status contract unchanged.
    - id: AC-CL-CONTEXT-002
      criterion: GET /cover-letter/{id}/status completed result includes tailored content derived from real job context, not placeholder text.
    - id: AC-CL-CONTEXT-003
      criterion: GET /cover-letters includes generated artifact for request_id within polling SLA.
  data_level:
    - id: AC-CL-CONTEXT-004
      criterion: job context loaded from JOBS_TABLE_NAME for matching user_id + job_id.
    - id: AC-CL-CONTEXT-005
      criterion: gap responses filtered by gap_response_ids and mapped into prompt context.
    - id: AC-CL-CONTEXT-006
      criterion: company research resolved using ARTIFACT#COMPANY_RESEARCH# key pattern with user scoping.
    - id: AC-CL-CONTEXT-007
      criterion: no placeholder string patterns ('Company for <job_id>', 'Role for <job_id>', 'Job description for <job_id>') appear in completed artifacts.
  observability_level:
    - id: AC-CL-CONTEXT-008
      criterion: logs emit context resolution decisions (job_resolved, vpr_resolved, gap_resolved, company_research_resolved).
    - id: AC-CL-CONTEXT-009
      criterion: failed status includes deterministic error details when mandatory context missing.
  negative_and_edge_cases:
    - id: AC-CL-CONTEXT-010
      criterion: cross-user job_id access must not leak context; returns not found/failed with sanitized error.
    - id: AC-CL-CONTEXT-011
      criterion: missing optional company research does not fail generation when mandatory context exists.
    - id: AC-CL-CONTEXT-012
      criterion: malformed gap response payload entries are skipped or normalized without crashing worker.
    - id: AC-CL-CONTEXT-013
      criterion: if required prompt context fields are empty/synthetic, worker stores failed status with explicit missing_context diagnostics and does not invoke LLM.

