spec_id: RECOVERY_008_YAML4
title: Final YAML2 100 Percent Completion Verification and Release Readiness
priority: critical
status: pending
owner: backend-platform
created_at: 2026-03-06
updated_at: 2026-03-06
sequence_step: 8
default_environment: dev

targets_yaml2_specs:
  - COVER_LETTER_002
  - CV_TAILORING_002
  - GAP_GET_002
  - INTERVIEW_PREP_002
  - INTERVIEW_PREP_003
  - TRIAL_002
  - VPR_LIST_METADATA_001

execution_policy:
  stop_after_step_for_user_deploy: true
  resume_only_after_user_live_evidence: true
  user_must_run_live_tests_in_environment: dev

non_regression_constraints:
  - preserve_async_contracts
  - no_endpoint_shape_changes
  - closure_blocked_if_any_evidence_is_stale_or_placeholder
  - require_two_consecutive_live_passes

problem_statement:
  exact_failing_behavior: |
    Prior closure marked validated while key ACs remained pending and evidence included placeholders.
  expected_behavior: |
    100/100 completion requires fresh AC evidence, two live full-suite passes, and clean regression deltas.
  business_impact: |
    Premature closure allows regressions to ship.

implementation_scope:
  files_to_modify:
    - docs/refactor/live_tests/run_all_tests.py
    - scripts/spec_quality/check_yaml2_closure.py
    - scripts/spec_quality/check_evidence_integrity.py
    - docs/beta/fix-api/yaml2/*.yaml
    - docs/beta/fix-api/yaml3/*.yaml
    - docs/evidence/*
  required_behavior_changes:
    - Add machine-readable summary output support to run_all_tests.py (for closure evidence).
    - Reject placeholder/stale evidence artifacts in closure gate.
    - Prevent validated/closed transitions when ACs are pending.

implementation_checklist:
  - id: S008-01
    task: Add/verify --summary-json support in run_all_tests.py without breaking existing CLI behavior.
  - id: S008-02
    task: Ensure closure checker fails on missing/pending AC evidence.
  - id: S008-03
    task: Ensure evidence integrity checker validates git_sha/deployment_id/environment freshness.
  - id: S008-04
    task: Replace placeholder evidence with fresh real artifacts for each blocking AC.
  - id: S008-05
    task: Transition yaml statuses only after all gates pass.

pre_deploy_validation:
  required_commands:
    - uv run python scripts/spec_quality/check_yaml2_closure.py --yaml2-dir careervp/docs/beta/fix-api/yaml2 --evidence-dir docs/evidence
    - uv run python scripts/spec_quality/check_evidence_integrity.py --evidence-dir docs/evidence
  pass_conditions:
    - both_commands_exit_0
    - no_pending_blocking_ac
    - no_placeholder_or_stale_evidence

handoff_gate:
  stop_now: true
  user_actions:
    - Deploy this step to AWS dev
    - Run full suite twice and store summary JSON outputs
    - Run final closure and regression delta checks
  required_live_commands:
    - uv run python docs/refactor/live_tests/run_all_tests.py --mode full --summary-json docs/evidence/live-final-pass-1-<timestamp>.json
    - uv run python docs/refactor/live_tests/run_all_tests.py --mode full --summary-json docs/evidence/live-final-pass-2-<timestamp>.json
    - uv run python scripts/spec_quality/check_regression_delta.py --baseline careervp/live-test-results27.log --current docs/evidence/live-final-pass-2-<timestamp>.json --out docs/evidence/live-final-regression-delta-<timestamp>.json
  required_evidence_fields:
    - environment=dev
    - deployment_id
    - git_sha
    - pass_1_and_pass_2_results
    - regression_delta_report
    - expected_vs_actual
    - result
  resume_condition:
    - AC-FINAL-301_pass
    - AC-FINAL-302_pass
    - AC-FINAL-303_pass

traceability_matrix:
  - requirement_id: AC-FINAL-301
    requirement: all yaml2 specs have complete AC evidence and pass status
    test_reference: scripts/spec_quality/check_yaml2_closure.py
    result: pending
  - requirement_id: AC-FINAL-302
    requirement: full live suite passes twice consecutively
    test_reference: docs/refactor/live_tests/run_all_tests.py
    result: pending
  - requirement_id: AC-FINAL-303
    requirement: final artifact has no blocked regression deltas vs baseline
    test_reference: scripts/spec_quality/check_regression_delta.py
    result: pending
