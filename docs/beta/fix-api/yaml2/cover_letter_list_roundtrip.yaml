    code_reference: src/backend/careervp/handlers/cover_letter_handler.py
    test_reference: src/backend/tests/unit/test_cover_letter_status_storage_keys.py::test_missing_returns_404
    evidence_reference: docs/evidence/cover-letter-not-found-20260306T082812Z.json
    result: pass

completion_evidence:
  required_artifacts:
    - unit_test_output
    - integration_test_output
    - live_test_output
    - deployed_request_response_samples
  residual_risks:
