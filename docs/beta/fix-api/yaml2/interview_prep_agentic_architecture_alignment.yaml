assumptions_and_defaults:
  - Server enrichment is the canonical strategy; clients are not required to send full architecture context
  - Output schema remains backward-compatible; alignment is achieved through richer input/workflow
  - Default generated question_count is 10 when omitted; explicit lower values are honored
  - Maximum generated question_count is 15
  - INTERVIEW_PREP_002 is a prerequisite baseline and must not regress

