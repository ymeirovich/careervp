    result: pending
  - requirement_id: AC-GAP-002
    requirement: GET returns persisted questions for same job_id
    code_reference: src/backend/careervp/dal/dynamo_dal_handler.py
    test_reference: docs/refactor/live_tests/test_05_gap_analysis.py::TestGapAnalysisEndpoints::test_get_gap_questions
    evidence_reference: docs/evidence/gap-roundtrip-<timestamp>.json
    result: pending

completion_evidence:
