# Deployment Specification
# Source: DEPLOYMENT_OPERATIONS.md
# Used by: Phase 0 (Security), Phase 8 (Knowledge Base)
# Updated: NEW 2026-02-15 - Synced active deployed infra keys + storage contract mapping

spec_version: "1.3"
date_created: "2026-02-12"
date_updated: "2026-02-15"

naming_convention:
  tables: "NamingUtils.table_name(feature) -> careervp-{feature}-table-{env}"
  buckets: "NamingUtils.bucket_name(purpose) -> careervp-{env}-{purpose}-{region_code}-{hash}"
  source: "infra/careervp/naming_utils.py"

lambda:
  runtime: "python3.12"
  memory: "512 MB"
  timeout: "30 seconds"
  powertools: "2.0.0"

dynamodb:
  active_contract:
    source: "infra/careervp/api_db_construct.py"
    tables:
      - name: "careervp-users-table-dev (NamingUtils: table_name('users'))"
        partition_key: "pk"
        sort_key: "sk"
        billing: "PAY_PER_REQUEST"
        gsi:
          - "email-index (PK=email)"
          - "user_id-index (PK=user_id, SK=sk)"

      - name: "careervp-jobs-table-dev (NamingUtils: table_name('jobs'))"
        partition_key: "job_id"
        billing: "PAY_PER_REQUEST"
        ttl_attribute: "ttl"
        gsi:
          - "idempotency-key-index (PK=idempotency_key)"

      - name: "careervp-idempotency-table-dev (NamingUtils: table_name('idempotency'))"
        partition_key: "id"
        billing: "PAY_PER_REQUEST"
        ttl_attribute: "expiration"

  planned_refactor_contract:
    source: "infra/careervp/specs/dynamodb_spec.yaml"
    status: "PLANNED_NOT_WIRED_IN_SERVICE_STACK"
    tables:
      - name: "careervp-cvs-table-dev"
        partition_key: "user_email"
        sort_key: "cv_id"
      - name: "careervp-applications-table-dev"
        partition_key: "user_email"
        sort_key: "application_id"
      - name: "careervp-gap-responses-table-dev"
        partition_key: "user_email"
        sort_key: "application_id"
      - name: "careervp-knowledge-table-dev"
        partition_key: "user_email"
        sort_key: "entity_type"
        gsi:
          - "entity-index (PK=entity_type, SK=entity_id)"

s3:
  active_contract:
    source: "infra/careervp/api_db_construct.py"
    buckets:
      - name: "careervp-dev-cvs-use1-{hash} (NamingUtils: bucket_name('cvs'))"
        purpose: "CV uploads"
        public_access: false
        encryption: "AES256"
        versioning: false

      - name: "careervp-dev-vpr-results-use1-{hash} (NamingUtils: results_bucket_name('vpr-results'))"
        purpose: "Async VPR result artifacts"
        public_access: false
        encryption: "AES256"
        versioning: true

  planned_refactor_contract:
    source: "infra/careervp/specs/s3_spec.yaml"
    status: "PLANNED_NOT_WIRED_IN_SERVICE_STACK"
    buckets:
      - name: "careervp-dev-generated-use1-{hash} (NamingUtils: bucket_name('generated'))"
        purpose: "Generated cover letters and tailored CV artifacts"
        public_access: false
        encryption: "AES256"

storage_contract:
  canonical_spec: "docs/refactor/specs/storage_contract_spec.yaml"
  rule: "OpenAPI logical IDs map to physical keys via DAL adapter; do not require table replacements."
  logical_ids:
    - "cv_id"
    - "job_id"
    - "vpr_id"
    - "gap_response_ids"
    - "company_research_id"

api_gateway:
  cors:
    allow_origins:
      - "https://careervp.com"
      - "http://localhost:3000"
    allow_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
    allow_headers:
      - "Authorization"
      - "Content-Type"

handler_patterns:
  - pattern: "handlers/{feature}_handler.py"
    style: "function_based_powertools"
    entrypoints:
      - "lambda_handler(event, context)"
      - "@app.<method>('/path') for resolver-based handlers"
    note: "Prefer existing codebase patterns; avoid introducing class-based handlers."

api_route_migration:
  strategy: "additive"
  authoritative_contract: "docs/swagger/careervp-api-v1.yaml"
  rules:
    - "Add OpenAPI paths in API Gateway first; keep existing /api/* routes during migration window"
    - "Handler route decorators should omit /v1 prefix; /v1 is API Gateway stage/base path"
    - "Do not remove legacy /api/* routes until staging contract smoke tests pass"
  decommission_gate:
    - "All Phase 10 contract tests pass"
    - "All 27 OpenAPI endpoints pass staging smoke tests"
    - "Migration sign-off complete"

dynamodb_patterns:
  - pattern: "dal/{feature}_repository.py"
    class: "{Feature}Repository"
    methods:
      - "create(data) -> str"
      - "get(id) -> dict"
      - "update(id, data) -> dict"
      - "delete(id) -> bool"
  - pattern: "dal/api_storage_adapter.py"
    class: "ApiStorageAdapter"
    methods:
      - "map_logical_to_physical_keys(resource_type, logical_identifiers) -> dict"
      - "map_physical_to_logical_ids(resource_type, item) -> dict"
