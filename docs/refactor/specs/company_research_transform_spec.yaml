import pytest
from datetime import datetime


class TestCompanyResearchE2E:
    """End-to-end tests for company research feature."""

    @pytest.mark.e2e
    async def test_user_researches_company_and_retrieves(self, api_client, auth_token):
        """
        E2E Test: User researches a company and retrieves it later.

        Flow:
        1. User calls POST /v1/company-research/fetch
        2. System generates research via LLM
        3. System validates with FVS
        4. System transforms and stores in DynamoDB
        5. User calls GET /v1/company-research/{company_name}
        6. System retrieves and returns research
        """
        # Arrange
        company_name = "TestCompany123"
        user_email = "testuser@example.com"

        # Act - Generate research
        response = api_client.post(
            "/v1/company-research/fetch",
            json={
                "company_name": company_name,
                "job_id": "test-job-001"
            },
            headers={"Authorization": f"Bearer {auth_token}"}
        )

        # Assert - Generation successful
        assert response.status_code == 200
        data = response.json()
        assert data["company_name"] == company_name
        assert "research_id" in data

        # Act - Retrieve research
        response = api_client.get(
            f"/v1/company-research/{company_name}",
            headers={"Authorization": f"Bearer {auth_token}"}
        )

        # Assert - Retrieval successful
        assert response.status_code == 200
        data = response.json()
        assert data["company_name"] == company_name

    @pytest.mark.e2e
    async def test_cache_hit_prevents_duplicate_generation(self, api_client, auth_token):
        """
        E2E Test: Second request for same company returns cached result.

        Flow:
        1. User requests company research (generates new)
        2. User requests same company (returns cached)
        """
        company_name = "CachedCompany456"

        # First request - generates new
        response1 = api_client.post(
            "/v1/company-research/fetch",
            json={"company_name": company_name},
            headers={"Authorization": f"Bearer {auth_token}"}
        )
        assert response1.status_code == 200
        assert response1.json()["cached"] is False

        # Second request - should hit cache
        response2 = api_client.post(
            "/v1/company-research/fetch",
            json={"company_name": company_name},
            headers={"Authorization": f"Bearer {auth_token}"}
        )
        assert response2.status_code == 200
        assert response2.json()["cached"] is True

    @pytest.mark.e2e
    async def test_research_expires_after_ttl(self, api_client, auth_token):
        """
        E2E Test: Research older than 30 days triggers regeneration.

        Flow:
        1. Create expired research directly in DynamoDB
        2. User requests company research
        3. System detects expired TTL
        4. System generates new research
        """
        company_name = "ExpiredCompany789"

        # Directly insert expired item in DynamoDB (test setup)
        await _insert_expired_research(company_name, "testuser@example.com")

        # Request research
        response = api_client.post(
            "/v1/company-research/fetch",
            json={"company_name": company_name},
            headers={"Authorization": f"Bearer {auth_token}"}
        )

        # Should generate new (not return expired)
        assert response.status_code == 200
        data = response.json()
        assert data["cached"] is False  # New generation
