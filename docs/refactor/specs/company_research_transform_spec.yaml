## 8. Validation Requirements

### 8.1 Functional Validations

| Validation | Input | Expected | Error |
|-----------|-------|----------|-------|
| company_name required | Missing company_name | Raise ValueError | "company_name is required" |
| research_data required | Missing research_data | Raise ValueError | "research_data is required" |
| Valid JSON blob | research_data | Parseable | "Invalid JSON in research_data" |
| TTL expiration | Expired TTL | Return None | Item expired |
| FVS validation | Content | Score >= threshold | Validation failed |

### 8.2 Data Integrity Validations

| Field | Validation | Rule |
|-------|------------|------|
| `user_email` | Non-empty | Required |
| `entity_type` | Equals "company_research" | Constant |
| `entity_id` | Non-empty | Required |
| `cached_at` | Valid ISO8601 | Required |
| `ttl` | Future Unix timestamp | Calculated |
| `research_data` | Valid JSON | Serialized |

### 8.3 Query Validations

| Query | Expected | Validation |
|-------|----------|------------|
| Query by user_email (PK) | Returns item | Primary key lookup |
| Query by entity_type (GSI) | Returns all company research | GSI partition |
| Query by entity_id (GSI) | Returns specific company | GSI sort key |

