#!/bin/bash
# Live test for Company Research Transformation Layer
# Requires: AWS credentials, deployed infrastructure

set -e

# Configuration
API_URL="${API_URL:-https://api.careervp.com/v1}"
TOKEN="${AUTH_TOKEN:-$(get_token)}"
COMPANY_NAME="LiveTestCompany_$(date +%s)"
PAYLOAD_FILE="docs/refactor/payloads/phase8_company_research_live_test.json"

echo "=== Company Research Live Test ==="
echo "API URL: $API_URL"
echo "Company: $COMPANY_NAME"
echo ""

# Step 1: Generate company research
echo "Step 1: Generating company research..."
curl -X POST "$API_URL/company-research/fetch" \
  -H "Authorization: Bearer $TOKEN" \
  -H "Content-Type: application/json" \
  -d @"$PAYLOAD_FILE" \
  > /tmp/research_response.json

cat /tmp/research_response.json | jq '.'

RESEARCH_ID=$(cat /tmp/research_response.json | jq -r '.research_id // "unknown"')
echo "Research ID: $RESEARCH_ID"
echo ""

# Step 2: Retrieve company research
echo "Step 2: Retrieving company research..."
sleep 2  # Allow for async processing

curl -X GET "$API_URL/company-research/$COMPANY_NAME" \
  -H "Authorization: Bearer $TOKEN" \
  > /tmp/research_retrieve.json

cat /tmp/research_retrieve.json | jq '.'
echo ""

# Step 3: Verify DynamoDB storage
echo "Step 3: Verifying DynamoDB storage..."
aws dynamodb get-item \
  --table-name "careervp-knowledge-table-dev" \
  --key "{\"user_email\": {\"S\": \"test@example.com\"}, \"entity_type\": {\"S\": \"company_research\"}}" \
  --query 'Item' \
  --output json
echo ""

# Step 4: Verify TTL
echo "Step 4: Verifying TTL..."
TTL=$(aws dynamodb get-item \
  --table-name "careervp-knowledge-table-dev" \
  --key "{\"user_email\": {\"S\": \"test@example.com\"}, \"entity_type\": {\"S\": \"company_research\"}}" \
  --query 'Item.ttl.N' \
  --output text)
echo "TTL: $TTL (should be ~30 days from now)"
echo ""

# Step 5: Cache hit test
echo "Step 5: Testing cache hit..."
curl -X POST "$API_URL/company-research/fetch" \
  -H "Authorization: Bearer $TOKEN" \
  -H "Content-Type: application/json" \
  -d @"$PAYLOAD_FILE" \
  > /tmp/cache_test.json

CACHED=$(cat /tmp/cache_test.json | jq -r '.cached')
echo "Second request cached: $CACHED"
echo ""

# Cleanup
echo "Step 6: Cleanup..."
aws dynamodb delete-item \
  --table-name "careervp-knowledge-table-dev" \
  --key "{\"user_email\": {\"S\": \"test@example.com\"}, \"entity_type\": {\"S\": \"company_research\"}}"

echo ""
echo "=== Live Test Complete ==="
```

