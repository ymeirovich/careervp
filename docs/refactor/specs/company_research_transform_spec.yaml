## 1. Overview

### 1.1 Purpose

This spec defines the Company Research Transformation Layer that bridges LLM-generated company research output to DynamoDB storage. The transformation layer handles:

- **Format conversion:** LLM JSON output → DynamoDB item with JSON blob
- **Field injection:** Adding user_email from auth context
- **TTL management:** Setting 30-day expiration
- **GSI support:** Enabling queries by entity_type

### 1.2 Scope

| In Scope | Out of Scope |
|----------|--------------|
| LLM output transformation | LLM prompt generation (separate file) |
| DynamoDB storage | S3 storage |
| GSI queries | Full-text search |
| TTL management | Cache invalidation logic |
| FVS validation | Content generation |

### 1.3 Related Features

- **Uses:** `CompanyResearchResult` model from `src/backend/careervp/models/company.py`
- **Stores:** `careervp-knowledge-table-dev` DynamoDB table
- **Validates:** FVS quality scores from `src/backend/careervp/logic/fvs_validator.py`
- **Referenced by:** VPR Generator, Cover Letter Generator

