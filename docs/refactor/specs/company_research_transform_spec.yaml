## 5. Knowledge Repository Integration

### 5.1 Updated Methods

**File:** `src/backend/careervp/dal/knowledge_repository.py`

```python
from datetime import datetime, timezone, timedelta
from typing import Optional, Dict, Any
from careervp.models.company import CompanyResearchResult


class KnowledgeRepository:
    """Knowledge repository with enhanced company research support."""

    ENTITY_TYPE_COMPANY_RESEARCH = "company_research"

    def __init__(
        self,
        table_name: Optional[str] = None,
        transformer: Optional[CompanyResearchTransformer] = None,
        fvs_validator: Optional[QualityValidator] = None
    ):
        """Initialize repository."""
        self.table_name = table_name or self._get_knowledge_table_name()
        self.transformer = transformer
        self.fvs_validator = fvs_validator

    async def save_company_research(
        self,
        user_email: str,
        company_name: str,
        llm_output: Dict[str, Any]
    ) -> Result:
        """
        Save company research with transformation and validation.

        Args:
            user_email: User identifier (PK)
            company_name: Company name for entity_id
            llm_output: Raw LLM output (CompanyResearchResult as dict)

        Returns:
            Result with entity_id and success status
        """
        # 1. Check cache first
        existing = await self.get_company_research(user_email, company_name)
        if existing is not None:
            return Result(
                success=True,
                data={"cached": True, "entity_id": company_name}
            )

        # 2. Validate with FVS if validator provided
        if self.fvs_validator:
            content_json = json.dumps(llm_output)
            validation_result = self.fvs_validator.validate(content_json)
            if not validation_result.is_valid:
                return Result(
                    success=False,
                    error="FVS validation failed",
                    data={"violations": validation_result.violations}
                )

        # 3. Transform to DynamoDB format
        transformer = CompanyResearchTransformer(user_email)
        item = transformer.to_dynamodb_item(
            llm_output,
            entity_id=company_name
        )

        # 4. Store in DynamoDB
        try:
            self._dynamodb_table.put_item(Item=item.to_dict())
            return Result(
                success=True,
                data={"cached": False, "entity_id": company_name}
            )
        except ClientError as e:
            return Result(
                success=False,
                error=f"DynamoDB error: {e.response['Error']['Message']}"
            )

    async def get_company_research(
        self,
        user_email: str,
        company_name: str
    ) -> Optional[CompanyResearchResult]:
        """
        Retrieve company research for user and company.

        Args:
            user_email: User identifier (PK)
            company_name: Company name to look up

        Returns:
            CompanyResearchResult or None if not found/expired
        """
        try:
            response = self._dynamodb_table.get_item(
                Key={
                    "user_email": user_email,
                    "entity_type": self.ENTITY_TYPE_COMPANY_RESEARCH
                }
            )

            if "Item" not in response:
                return None

            item = response["Item"]

            # Check TTL expiration
            if self._is_expired(item):
                self._delete_expired_item(item)
                return None

            # Parse research_data blob
            research_data = json.loads(item["research_data"])
            return CompanyResearchResult.from_research_dict(research_data)

        except ClientError:
            return None

    def _is_expired(self, item: Dict[str, Any]) -> bool:
        """Check if item is expired based on TTL."""
        ttl = item.get("ttl", 0)
        if ttl == 0:
            return False
        return datetime.now(timezone.utc).timestamp() > ttl

    def _delete_expired_item(self, item: Dict[str, Any]) -> None:
        """Delete expired item from DynamoDB."""
        try:
            self._dynamodb_table.delete_item(
                Key={
                    "user_email": item["user_email"],
                    "entity_type": item["entity_type"]
                }
            )
        except ClientError:
            pass  # Best effort deletion
```

