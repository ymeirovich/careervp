# Company Research Transformation Layer Specification
# YAML format for machine validation

spec_version: "1.0"
date_created: "2026-02-14"
date_updated: "2026-02-14"
status: "READY_FOR_IMPLEMENTATION"
phase: "Company Research (NEW)"
purpose: "Defines Company Research Transformation Layer that bridges LLM-generated company research output to DynamoDB storage"

overview:
  purpose: |
    This spec defines the Company Research Transformation Layer that bridges LLM-generated
    company research output to DynamoDB storage. The transformation layer handles:
    - Format conversion: LLM JSON output → DynamoDB item with JSON blob
    - Field injection: Adding user_email from auth context
    - TTL management: Setting 30-day expiration
    - GSI support: Enabling queries by entity_type
  scope:
    in_scope:
      - "LLM output transformation"
      - "DynamoDB storage"
      - "GSI queries"
      - "TTL management"
      - "FVS validation"
    out_of_scope:
      - "LLM prompt generation"
      - "S3 storage"
      - "Full-text search"
      - "Cache invalidation logic"
      - "Content generation"
  related_features:
    uses: "CompanyResearchResult model from src/backend/careervp/models/company.py"
    stores: "careervp-knowledge-table-dev DynamoDB table"
    validates: "FVS quality scores from src/backend/careervp/logic/fvs_validator.py"
    referenced_by: "VPR Generator, Cover Letter Generator"

architecture:
  data_flow: |
    User (user_email from JWT) → KnowledgeRepository.save_company_research()
    → Cache Check → LLM Service (Claude Haiku 4.5) → FVS Validator
    → CompanyResearchTransformer → DynamoDB (careervp-knowledge-table-dev)
  components:
    - name: "KnowledgeRepository"
      responsibility: "Orchestrates save/get, cache check, FVS validation"
    - name: "CompanyResearchTransformer"
      responsibility: "Transforms LLM output → DynamoDB item"
    - name: "CompanyResearchResult"
      responsibility: "LLM output schema (6 fields)"
    - name: "DynamoDBTable"
      responsibility: "Stores items with TTL"

data_schemas:
  llm_output:
    source: "src/backend/careervp/models/company.py"
    class: "CompanyResearchResult"
    fields:
      - name: "company_name"
        type: "str"
        description: "Name of the company"
      - name: "overview"
        type: "str"
        description: "Brief company overview"
      - name: "values"
        type: "List[str]"
        description: "Company core values"
      - name: "mission"
        type: "str"
        description: "Company mission statement"
      - name: "strategic_priorities"
        type: "List[str]"
        description: "Strategic priorities"
      - name: "recent_news"
        type: "List[NewsItem]"
        description: "Recent news articles"
      - name: "financial_summary"
        type: "Optional[str]"
        description: "Financial status summary"

  dynamodb_item:
    table: "careervp-knowledge-table-dev"
    partition_key:
      name: "user_email"
      type: "String"
      source: "Auth context"
    sort_key:
      name: "entity_type"
      type: "String"
      source: "Constant"
    attributes:
      - name: "entity_id"
        type: "String"
        source: "LLM output"
      - name: "cached_at"
        type: "String"
        source: "Transform"
      - name: "ttl"
        type: "Number"
        source: "Transform"
      - name: "research_data"
        type: "String"
        source: "Transform (JSON blob)"
    gsi:
      name: "entity-index"
      partition_key: "entity_type"
      sort_key: "entity_id"

field_mapping:
  - llm_output: "company_name"
    dynamodb: "entity_id"
    transformation: "Direct map"
    required: true
  - llm_output: "company_name"
    dynamodb: "research_data.company_name"
    transformation: "JSON blob"
    required: true
  - llm_output: "overview"
    dynamodb: "research_data.overview"
    transformation: "JSON blob"
    required: true
  - llm_output: "values"
    dynamodb: "research_data.values"
    transformation: "JSON serialization"
    required: true
  - llm_output: "mission"
    dynamodb: "research_data.mission"
    transformation: "JSON blob"
    required: true
  - llm_output: "*(injected)"
    dynamodb: "user_email"
    transformation: "From auth context"
    required: true
  - llm_output: "*(injected)"
    dynamodb: "entity_type"
    transformation: 'Constant: "company_research"'
    required: true
  - llm_output: "*(generated)"
    dynamodb: "cached_at"
    transformation: "Current UTC ISO8601"
    required: true
  - llm_output: "*(generated)"
    dynamodb: "ttl"
    transformation: "now + 30 days (Unix)"
    required: true

constraints:
  technical:
    - category: "Database"
      constraint: "Must use careervp-knowledge-table-dev"
      source: "dynamodb_spec.yaml"
    - category: "Partition Key"
      constraint: "user_email (from auth)"
      source: "dynamodb_spec.yaml"
    - category: "Sort Key"
      constraint: 'entity_type ("company_research")'
      source: "dynamodb_spec.yaml"
    - category: "GSI"
      constraint: "entity-index: entity_type → entity_id"
      source: "dynamodb_spec.yaml"
    - category: "TTL"
      constraint: "30 days from creation"
      source: "knowledge_base_spec.yaml"
    - category: "Storage Format"
      constraint: "JSON blob for all LLM fields"
      source: "Efficiency"

dependencies:
  infrastructure:
    - name: "careervp-knowledge-table-dev"
      status: "Exists"
      source: "dynamodb_spec.yaml"
    - name: "GSI: entity-index"
      status: "NOT IMPLEMENTED"
      source: "dynamodb_spec.yaml"
    - name: "KNOWLEDGE_TABLE_NAME constant"
      status: "NOT DEFINED"
      source: "constants.py"
  code:
    - name: "CompanyResearchResult"
      location: "src/backend/careervp/models/company.py"
      status: "Exists"
    - name: "QualityValidator"
      location: "src/backend/careervp/logic/fvs_validator.py"
      status: "Exists"
    - name: "DynamoDBTable"
      location: "src/backend/careervp/dal/"
      status: "Exists"

validation_requirements:
  functional:
    - validation: "company_name required"
      input: "Missing company_name"
      expected: "Raise ValueError"
      error: "company_name is required"
    - validation: "research_data required"
      input: "Missing research_data"
      expected: "Raise ValueError"
      error: "research_data is required"
    - validation: "Valid JSON blob"
      input: "research_data"
      expected: "Parseable"
      error: "Invalid JSON in research_data"
    - validation: "TTL expiration"
      input: "Expired TTL"
      expected: "Return None"
      error: "Item expired"
    - validation: "FVS validation"
      input: "Content"
      expected: "Score >= threshold"
      error: "Validation failed"

validation_commands:
  - name: "Unit tests"
    command: "uv run pytest tests/unit/test_company_research_transformer.py -v --tb=short"
  - name: "Integration tests"
    command: "uv run pytest tests/integration/test_company_research_flow.py -v --tb=short"
  - name: "Lint"
    command: "uv run ruff check careervp/logic/company_research_transformer.py"
  - name: "Type check"
    command: "uv run mypy careervp/logic/company_research_transformer.py --strict"
