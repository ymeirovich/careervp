## 4. Transformation Layer

### 4.1 Transformer Class

**File:** `src/backend/careervp/logic/company_research_transformer.py`

```python
from datetime import datetime, timezone, timedelta
from typing import Dict, Any, Optional
from dataclasses import dataclass
import json
import uuid


@dataclass
class DynamoDBItem:
    """DynamoDB item for company research storage."""
    user_email: str
    entity_type: str = "company_research"
    entity_id: str = ""
    cached_at: str = ""
    ttl: int = 0
    research_data: str = ""

    def to_dict(self) -> Dict[str, Any]:
        """Convert to DynamoDB item dict."""
        return {
            "user_email": self.user_email,
            "entity_type": self.entity_type,
            "entity_id": self.entity_id,
            "cached_at": self.cached_at,
            "ttl": self.ttl,
            "research_data": self.research_data,
        }


class CompanyResearchTransformer:
    """Transforms CompanyResearchResult to DynamoDB format."""

    ENTITY_TYPE = "company_research"
    TTL_DAYS = 30

    def __init__(self, user_email: str):
        """
        Initialize transformer with user context.

        Args:
            user_email: User's email from auth context (required for PK)
        """
        self.user_email = user_email

    def to_dynamodb_item(
        self,
        llm_output: Dict[str, Any],
        entity_id: Optional[str] = None
    ) -> DynamoDBItem:
        """
        Transform LLM output to DynamoDB item format.

        Args:
            llm_output: Raw LLM output (CompanyResearchResult as dict)
            entity_id: Optional entity ID (auto-generated if not provided)

        Returns:
            DynamoDBItem ready for storage
        """
        # Extract company_name for entity_id
        company_name = llm_output.get("company_name", "")
        if not company_name:
            raise ValueError("company_name is required in LLM output")

        # Calculate TTL (30 days from now)
        now = datetime.now(timezone.utc)
        ttl_timestamp = int((now + timedelta(days=self.TTL_DAYS)).timestamp())

        # Create research_data JSON blob
        research_blob = json.dumps(llm_output, default=str)

        return DynamoDBItem(
            user_email=self.user_email,
            entity_type=self.ENTITY_TYPE,
            entity_id=entity_id or company_name,
            cached_at=now.isoformat(),
            ttl=ttl_timestamp,
            research_data=research_blob,
        )

    def from_dynamodb_item(self, item: Dict[str, Any]) -> Dict[str, Any]:
        """
        Transform DynamoDB item to structured data.

        Args:
            item: DynamoDB item with research_data blob

        Returns:
            CompanyResearchResult-compatible dict
        """
        if "research_data" not in item:
            raise ValueError("research_data attribute is required")

        return json.loads(item["research_data"])

    def calculate_ttl(self, reference_time: Optional[datetime] = None) -> int:
        """
        Calculate TTL Unix timestamp.

        Args:
            reference_time: Reference timestamp (defaults to now)

        Returns:
            Unix timestamp for TTL (30 days from reference)
        """
        reference = reference_time or datetime.now(timezone.utc)
        expiry = reference + timedelta(days=self.TTL_DAYS)
        return int(expiry.timestamp())
```

### 4.2 Storage Methods (for CompanyResearchResult)

**Add to existing model:** `src/backend/careervp/models/company.py`

```python
class CompanyResearchResult(BaseModel):
    """Company research output from LLM."""
    company_name: str
    overview: str
    values: List[str]
    mission: str
    strategic_priorities: List[str] = Field(default_factory=list)
    recent_news: List[NewsItem] = Field(default_factory=list)
    financial_summary: Optional[str] = None

    def to_research_dict(self) -> Dict[str, Any]:
        """Extract fields for research_data JSON blob."""
        return {
            "company_name": self.company_name,
            "overview": self.overview,
            "values": self.values,
            "mission": self.mission,
            "strategic_priorities": self.strategic_priorities,
            "recent_news": [n.model_dump() for n in self.recent_news],
            "financial_summary": self.financial_summary,
        }

    @classmethod
    def from_research_dict(cls, data: Dict[str, Any]) -> "CompanyResearchResult":
        """Reconstruct from research_data JSON blob."""
        recent_news = [
            NewsItem(**item) for item in data.get("recent_news", [])
        ]
        return cls(
            company_name=data["company_name"],
            overview=data["overview"],
            values=data["values"],
            mission=data["mission"],
            strategic_priorities=data.get("strategic_priorities", []),
            recent_news=recent_news,
            financial_summary=data.get("financial_summary"),
        )
