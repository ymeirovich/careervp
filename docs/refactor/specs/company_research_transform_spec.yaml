from careervp.models.company import CompanyResearchResult


class TestCompanyResearchTransformer:
    """Unit tests for CompanyResearchTransformer."""

    def test_to_dynamodb_item_success(self):
        """Test successful transformation to DynamoDB item."""
        # Arrange
        transformer = CompanyResearchTransformer("user@example.com")
        llm_output = {
            "company_name": "TechCorp",
            "overview": "A tech company",
            "values": ["Innovation", "Customer Focus"],
            "mission": "To innovate",
            "strategic_priorities": ["AI"],
            "recent_news": [],
            "financial_summary": "Profitable",
        }

        # Act
        item = transformer.to_dynamodb_item(llm_output)

        # Assert
        assert isinstance(item, DynamoDBItem)
        assert item.user_email == "user@example.com"
        assert item.entity_type == "company_research"
        assert item.entity_id == "TechCorp"
        assert item.cached_at is not None
        assert item.ttl > datetime.now(timezone.utc).timestamp()
        assert "TechCorp" in item.research_data

    def test_to_dynamodb_item_missing_company_name(self):
        """Test validation rejects missing company_name."""
        transformer = CompanyResearchTransformer("user@example.com")
        llm_output = {"overview": "No company name"}

        with pytest.raises(ValueError, match="company_name is required"):
            transformer.to_dynamodb_item(llm_output)

    def test_to_dynamodb_item_custom_entity_id(self):
        """Test custom entity_id is used."""
        transformer = CompanyResearchTransformer("user@example.com")
        llm_output = {"company_name": "TechCorp", "overview": "Desc", "values": [], "mission": "", "strategic_priorities": [], "recent_news": [], "financial_summary": None}

        item = transformer.to_dynamodb_item(llm_output, entity_id="custom-id")

        assert item.entity_id == "custom-id"

    def test_from_dynamodb_item_success(self):
        """Test successful transformation from DynamoDB item."""
        transformer = CompanyResearchTransformer("user@example.com")
        item = {
            "user_email": "user@example.com",
            "entity_type": "company_research",
            "entity_id": "TechCorp",
            "cached_at": "2026-02-14T10:00:00Z",
            "ttl": 1893456000,
            "research_data": '{"company_name": "TechCorp", "overview": "Desc", "values": [], "mission": "", "strategic_priorities": [], "recent_news": [], "financial_summary": null}',
        }

        result = transformer.from_dynamodb_item(item)

        assert result["company_name"] == "TechCorp"

    def test_from_dynamodb_item_missing_research_data(self):
        """Test validation rejects missing research_data."""
        transformer = CompanyResearchTransformer("user@example.com")
        item = {"user_email": "user@example.com", "entity_type": "company_research"}

        with pytest.raises(ValueError, match="research_data is required"):
            transformer.from_dynamodb_item(item)

    def test_ttl_calculation(self):
        """Test TTL is exactly 30 days from now."""
        transformer = CompanyResearchTransformer("user@example.com")
        now = datetime.now(timezone.utc)
        ttl = transformer.calculate_ttl(now)

        expected_ttl = int((now + timedelta(days=30)).timestamp())
        assert abs(ttl - expected_ttl) < 2  # Allow 1 second tolerance


