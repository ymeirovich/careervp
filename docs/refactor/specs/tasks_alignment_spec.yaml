  phase_3:
    section: "VPR 6-Stage"
    directories: ["03-vpr-generator", "12-vpr-generator"]
    status: "partial"
  phase_4:
    section: "CV Tailoring"
    directories: ["06-cv-tailoring", "09-cv-tailoring"]
