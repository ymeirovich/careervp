# Knowledge Base Specification
# Source: JSA_FEATURE_MAPPING.md Section 10
# Phase: 8
# Updated: NEW 2026-02-15 - Synced logical OpenAPI IDs + adapter-backed physical storage mapping

spec_version: "1.2"
date_created: "2026-02-12"
date_updated: "2026-02-15"

description: |
  Knowledge Base Repository stores and retrieves user-specific data
  including gap responses and company research for continuity.

implementation:
  repository_file: "src/backend/careervp/dal/knowledge_repository.py"
  handler_file: "src/backend/careervp/handlers/knowledge_base_handler.py"
  tests: "tests/unit/test_knowledge_*.py tests/integration/test_knowledge_base_flow.py"

data_types:
  - name: "GapResponse"
    storage: "Logical IDs via storage adapter (OpenAPI: cv_id/job_id/question_id)"
    fields:
      - name: "user_id"
        key_type: "Auth Context"
      - name: "job_id"
        key_type: "Logical Partition"
      - name: "cv_id"
      - name: "response_id"
      - name: "question_id"
      - name: "response_text"
      - name: "created_at"

  - name: "CompanyResearch"
    storage: "Logical IDs via storage adapter (OpenAPI: job_id/company_research_id)"
    fields:
      - name: "job_id"
        key_type: "Logical Partition"
      - name: "company_research_id"
        key_type: "Logical Identifier"
      - name: "company_name"
      - name: "research_data"
      - name: "cached_at"
      - name: "ttl"
        value: "30 days"

storage_modes:
  active_mode:
    source: "infra/careervp/api_db_construct.py"
    mapping:
      - "Users table single-table records (PK=pk, SK=sk) for user artifacts"
      - "Jobs table (PK=job_id) for async status/result tracking"
  refactor_mode:
    source: "infra/careervp/specs/dynamodb_spec.yaml"
    mapping:
      - "careervp-gap-responses-table-dev (PK=user_email, SK=application_id)"
      - "careervp-knowledge-table-dev (PK=user_email, SK=entity_type, GSI entity-index)"
  adapter:
    file: "src/backend/careervp/dal/api_storage_adapter.py"
    rule: "Handlers/services use logical IDs; adapter resolves physical keys."

methods:
  - name: "KnowledgeRepository"
    methods:
      - "save_gap_response(user_id, job_id, cv_id, response) -> Result"
      - "get_gap_responses(user_id, job_id) -> List[GapResponse]"
      - "save_company_research(user_id, job_id, research) -> Result"
      - "get_company_research(user_id, job_id) -> CompanyResearch"

ttl_policies:
  gap_responses: "24 months (user lifetime)"
  company_research: "30 days"
  cv_context: "24 hours"

dependencies:
  - "infra/careervp/specs/dynamodb_spec.yaml (GAP_RESPONSES_TABLE_NAME, KNOWLEDGE_TABLE_NAME)"
  - "docs/refactor/specs/storage_contract_spec.yaml"
  - "DEPLOYMENT_OPERATIONS.md Section 2 (DynamoDB)"
  - "DEPLOYMENT_OPERATIONS.md Section 3 (S3)"

integration_points:
  - name: "Gap Analysis (Phase 5)"
    purpose: "stores/retrieves response artifacts keyed by logical job_id and cv_id"
  - name: "Company Research"
    purpose: "caches research by logical job_id with 30-day TTL"

naming_convention:
  table_pattern: "careervp-{feature}-table-dev"
  source: "infra/careervp/naming_utils.py"
