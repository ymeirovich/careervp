# Storage Contract Specification
# Canonical logical-to-physical mapping for OpenAPI identifiers
# Updated: 2026-02-18

spec_version: "2.0"
date_created: "2026-02-15"
date_updated: "2026-02-18"
purpose: "Canonical mapping from OpenAPI logical IDs to physical AWS storage keys."
status: "READY_FOR_IMPLEMENTATION"

sources:
  openapi_contract: "docs/swagger/careervp-api-v1.yaml"
  infra_storage_construct: "infra/careervp/api_db_construct.py"
  deployment_reference: "docs/refactor/specs/deployment_spec.yaml"

logical_to_physical_mapping:
  cv_id:
    canonical_resource: "S3"
    canonical_location: "cvs/{user_id}/{cv_id}.pdf"
    canonical_key:
      partition: "user_id"
      object_key: "cvs/{user_id}/{cv_id}.pdf"

  job_id:
    canonical_resource: "DynamoDB"
    canonical_table: "JobsTable"
    canonical_key:
      partition_key: "job_id"

  vpr_id:
    canonical_resource: "DynamoDB"
    canonical_table: "VPRTable"
    canonical_key:
      partition_key: "vpr_id"

  gap_response_ids:
    canonical_resource: "DynamoDB"
    canonical_table: "GapResponsesTable"
    canonical_key:
      partition_key: "user_id"
      sort_key: "job_id"

  company_research_id:
    canonical_resource: "DynamoDB"
    canonical_table: "CompanyResearchTable"
    canonical_key:
      partition_key: "job_id"

active_physical_storage:
  dynamodb:
    users_table:
      source_construct_field: "users_table"
      physical_name_pattern: "careervp-users-table-{env}"
      partition_key: "pk"
      sort_key: "sk"
      usage: "User profiles and user-scoped records"

    jobs_table:
      source_construct_field: "jobs_table"
      physical_name_pattern: "careervp-jobs-table-{env}"
      partition_key: "job_id"
      usage: "Job postings and async job status records"

    idempotency_table:
      source_construct_field: "idempotency_db"
      physical_name_pattern: "careervp-idempotency-table-{env}"
      partition_key: "id"
      usage: "Request deduplication"

  s3:
    cvs_bucket:
      source_construct_field: "cv_bucket"
      physical_name_pattern: "careervp-{env}-cvs-{region_code}-{hash}"
      usage: "CV upload binary storage"

    vpr_results_bucket:
      source_construct_field: "vpr_results_bucket"
      physical_name_pattern: "careervp-{env}-vpr-results-{region_code}-{hash}"
      usage: "VPR result artifacts"

adapter_rules:
  note: "Canonical table names/keys are logical contract names. DAL adapters map them to active physical keys when they differ."
  required_behavior:
    - "Map OpenAPI logical IDs to active table keys without replacing existing infrastructure."
    - "Keep API payload identifiers stable during migration."
    - "Support backward-compatible reads for existing items."

constraints:
  no_new_infrastructure_resources: true
  migration_mode: "documentation_and_mapping_only"

validation:
  required_checks:
    - "YAML parses successfully"
    - "All logical IDs are mapped: cv_id, job_id, vpr_id, gap_response_ids, company_research_id"
    - "No infrastructure resources are created/modified by this spec"
