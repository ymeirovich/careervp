      import json,hashlib
      from pathlib import Path
      paths=set()
      import yaml
      manifest=yaml.safe_load(Path('docs/handoff/2026-09-13-ASTRA-findings-manifest.yaml').read_text())
      out={}
      for group in ['defect_claims','good_claims','premise_claims']:
          for claim in manifest[group]:
              rows=[]
              for cite in claim['cited_locations']:
                  if cite.startswith('commit '):
                      rows.append({'citation':cite,'kind':'git object; inspected in history evidence'});continue
                  name,_,span=cite.partition(':')
                  candidates=list(Path('src/backend/careervp').rglob(Path(name).name))+list(Path('infra/careervp').rglob(Path(name).name))
                  candidates=[p for p in candidates if str(p).endswith(name)]
                  if not candidates: raise RuntimeError('BLOCKING ISSUE: '+cite)
                  for p in candidates:
                      text=p.read_text(); lines=text.splitlines(); paths.add(str(p))
                      if span:
                          a,_,b=span.partition('-');start=int(a);end=int(b or a)
                          excerpt='\n'.join(f'{n}: {lines[n-1]}' for n in range(start,min(end,len(lines))+1))
                      else: excerpt='File-level citation; relevant callable bodies recorded in source evidence.'
                      rows.append({'citation':cite,'path':str(p),'excerpt':excerpt})
              out[claim['id']]=rows
      print(json.dumps({'citations':out,'files':[{'path':p,'sha256':hashlib.sha256(Path(p).read_bytes()).hexdigest()} for p in sorted(paths)]}))
      
      PY
