      .venv/bin/python - <<'PY'
      
      import ast,json,collections,pathlib
      root=pathlib.Path('careervp')
      counts=collections.Counter(); sites=[]; perfile=collections.Counter()
      for path in sorted(root.rglob('*.py')):
          tree=ast.parse(path.read_text())
          for node in ast.walk(tree):
              if not isinstance(node,ast.ExceptHandler): continue
              counts['all_handlers']+=1
              broad=isinstance(node.type,ast.Name) and node.type.id=='Exception'
              if broad:
                  counts['except_Exception']+=1
                  if len(node.body)==1 and isinstance(node.body[0],ast.Pass):
                      counts['except_Exception_exact_pass']+=1;perfile[str(path)]+=1;sites.append(str(path)+':'+str(node.lineno))
              if len(node.body)==1 and isinstance(node.body[0],ast.Pass): counts['all_exact_pass']+=1
      print(json.dumps({'counts':counts,'perfile':perfile,'sites':sites},indent=2))
      for src in ['try:\n x()\nexcept Exception:\n pass','try:\n x()\nexcept ValueError:\n pass','try:\n x()\nexcept Exception:\n log()']:
          handlers=[n for n in ast.walk(ast.parse(src)) if isinstance(n,ast.ExceptHandler)]
          count=sum(isinstance(n.type,ast.Name) and n.type.id=='Exception' and len(n.body)==1 and isinstance(n.body[0],ast.Pass) for n in handlers)
          print('AST selector control:',repr(src),count)
      
      PY
