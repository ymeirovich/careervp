# Astra Pass A/1 independent audit. Model interpretations are not authoritative.
# Evidence is anchored once; each finding references its actual commands.
governing_instructions:
  enumerated_repository_instruction_files:
    - "AGENTS.md"
    - ".clauderules"
    - "CLAUDE.md"
  governing:
    - "The user-invoked Astra Pass A/1 procedure, claim/evidence classification, excluded-file boundary, controls, verdict rules, and twenty-ID reconciliation."
    - "Repository preservation and read-only audit scope; Handler/Logic/DAL distinctions used to inspect real paths."
    - "Use moto for AWS tests and mock all LLM/provider calls. Run relevant existing pytest checks using the documented uv command."
    - "Run deployed-state verification because the initial worktree has an infrastructure change; audit the verifier selector and inspect service metadata independently."
    - "No commits, deployment, user-data mutation, or messaging to others. Missing citations are evidence drift, not permission to invent implementation."
  not_applied_or_superseded:
    -
      instruction: "Global Ruff format/check --fix, implement fixes for failing tests, and feature-completion checks."
      reason: "This is an evidence audit, not an implementation task. Global mutation could change the audited source or unrelated user work. No Python, frontend, or CDK code was edited. Expected failing controls were retained rather than fixed."
    -
      instruction: "Update PROGRESS.md and plan.md."
      reason: "User AGENTS.md says only when associated code and tests land. No implementation landed; both already have user modifications."
    -
      instruction: "CLAUDE.md feature descriptions, pricing, historical decisions and model-policy recommendations."
      reason: "Treat as repository claims/context, never as source behavior evidence. The handoff requests Astra/high; the UI model selector and reasoning setting are not introspectable here."
    -
      instruction: "Naming validation/CDK synth and frontend build checks."
      reason: "No CDK or frontend changes made by this audit and no deployment or commit attempted. The pre-existing infrastructure edit was preserved."
