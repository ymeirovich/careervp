- finding_id: S0a
  prior_verdict: CONFIRMED — proven by execution, no deploy required.
  prior_claim_exact_text: GET /jobs/{jobId}/artifacts/vpr/export has no ownership check
  prior_verdict_upheld: UPHELD
  my_independent_verdict: CONFIRMED
  confidence: high
  claim:
    exact_text: GET /jobs/{jobId}/artifacts/vpr/export has no ownership check at all. user_id is authenticated and
      then dropped for the vpr branch; _read_vpr reads results/{job_id}.json from S3 with no scoping, while the
      other three branches are correctly scoped. Any authenticated user can export any other user's VPR to DOCX
      and receive a presigned S3 URL for it.
    conjuncts:
    - VPR branch lacks ownership enforcement
    - moto attacker receives victim DOCX
    - two-user HTTPS exploitation was executed
    conjunct_assessments:
    - conjunct: VPR branch lacks ownership enforcement
      verdict: CONFIRMED
    - conjunct: moto attacker receives victim DOCX
      verdict: CONFIRMED
    - conjunct: two-user HTTPS exploitation was executed
      verdict: UNPROVABLE-WITHOUT-DEPLOY
