      and later consumed as trusted company_context. vpr_generator passes CV text, full job posting, and free-text
      gap_responses with no max_length on JobPosting or GapResponse.answer. gap_analysis and interview_prep concatenate
      system and user prompt into one user-role message — there is no privileged channel at all. cv_tailoring imports
      validate_job_description but applies it on the legacy path only; the OpenAPI async path never calls it.
