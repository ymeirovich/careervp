  - evidence_id: E-013
    kind: command_transcript
    claims_supported: [S0a, PREMISE-P4]
    reproduction_required: true
    note: "The self-closing-test finding. Two sub-records."
    sub_records:
      - command: "uv run pytest tests/integration/test_p05_cross_tenant_idor.py -v"
        material_output: "9 passed  (all 9 registered cross-tenant cases, AS SHIPPED)"
      - command: "the same 9 cases re-run with seeding.authed_event (a real authenticated attacker) instead of seeding.forged_header_event"
        material_output: |
          [jobs.get]                  403  User can only access own jobs
          [gap.questions.get]         200  {"questions": []}            <- 200-empty, no victim data
          [applications.get]          404  Application not found
          [vpr.status.get]            403  User can only access own VPRs
          [cv-tailoring.status.get]   404  CV_NOT_FOUND
          [cover-letter.status.get]   404  COVER_LETTER_NOT_FOUND
          [interview-prep.status.get] 404  INTERVIEW_PREP_NOT_FOUND
          [company-research.get]      200  {"status": "not_generated"}  <- 200-empty, no victim data
          [jobs.export.get]           404  Artifact not found
          no VICTIM_MARKERS leaked on any of the nine
    interpretation_by_p1: >-
      The shipped probe attacks with a forged x-user-id header. Since P-04 removed
      that fallback, all 9 cases now return 401 at the auth gate and never reach
      ownership code. Separately, p05_owner_check_registry.py:109 pins
      moduleType='cv_tailored' -- a scoped branch -- so the vpr branch is never
      exercised. The ratchet is handler-level; the defect is branch-level.
    p1_self_correction: >-
      P1's first scoring of this run marked the two 200-empty rows as failures
      (denial criterion required 401/403/404). Inspecting the bodies showed no
      victim data. That was a P1 instrument error, corrected before reporting.

