repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.11
    hooks:
      - id: ruff
      - id: ruff-format

  # mypy disabled - run manually from src/backend with uv run mypy
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.11.2
  #   hooks:
  #     - id: mypy

  - repo: local
    hooks:
      - id: security-checks
        name: Security pattern checks
        entry: bash -c '! grep -r "AUTHORIZER_DISABLED" src/backend/careervp/handlers/ && ! grep -r "log_event.*True" src/backend/careervp/handlers/'
        language: system
        pass_filenames: false
